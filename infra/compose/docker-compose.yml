# Four services run on the AL2023 arm64 host: Gerrit, review-bot, opcert,
# and MCP. Host nginx terminates TLS and proxies to their published ports.
# fetch-secrets.sh rebuilds the sibling .env from SSM on each boot.
# Persist only Gerrit's stateful site directories on EBS. Mounting all of
# /var/gerrit would hide the image binaries. compose-up.sh seeds config and
# plugins before boot. External volumes survive docker compose down -v.

services:
  # --- Gerrit code-review server -------------------------------------------
  gerrit:
    # Add Python and g2p hooks to the Gerrit image for container-side CI.
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.gerrit
    restart: unless-stopped
    mem_limit: 3072m
    ports:
      # HTTP stays on host loopback behind nginx.
      - "127.0.0.1:8080:8080"
      # SSH is exposed directly on 29418.
      - "29418:29418"
    volumes:
      # External EBS-backed site volumes survive docker compose down -v.
      # Mount only stateful directories so image binaries remain visible.
      - gerrit_git:/var/gerrit/git
      - gerrit_index:/var/gerrit/index
      - gerrit_cache:/var/gerrit/cache
      - gerrit_db:/var/gerrit/db
      - gerrit_etc:/var/gerrit/etc
      - gerrit_logs:/var/gerrit/logs
      - gerrit_plugins:/var/gerrit/plugins
      # Mount the SSM-materialized GitHub deploy key and SSH settings directly.
      # The replication plugin reads them as the Gerrit user's ~/.ssh.
      - /var/gerrit/site/dotssh:/var/gerrit/.ssh
      # g2p reads its SSM-materialized config and GitHub PAT here.
      - /var/gerrit/site/g2p-config:/var/gerrit/.config/gerrit_to_platform
    environment:
      # Match the nginx public origin and seeded canonicalWebUrl.
      CANONICAL_WEB_URL: https://rebar.solutions.navateam.com/
    # Send container output to the host journal.
    logging:
      driver: journald

  # --- rebar review-bot webhook receiver -----------------------------------
  review-bot:
    build:
      # Build from the repository root for the package install.
      context: ../..
      dockerfile: infra/compose/Dockerfile.reviewbot
    restart: unless-stopped
    mem_limit: 2048m
    # Allow an in-flight review and its store write to finish on SIGTERM.
    # The 1320s grace covers the 1200s review drain, 60s lock acquisition,
    # and 45s push reconcile lock, with 15s margin. Lock-held git calls and
    # cancellation have their own bounds. A SIGKILL inside the mkdir lock
    # would leave the next container unable to reclaim it. The review-bot
    # stop-grace test checks this budget relationship.
    stop_grace_period: 1320s
    env_file:
      - .env
    environment:
      # Push each code_review artifact through the persistent tickets clone.
      # The entrypoint obtains its URL-scoped credential from the PAT.
      # Trust the bridge gateway's forwarded scheme for nginx redirects.
      # The port is host-loopback only and nginx overwrites X-Forwarded-Proto,
      # so a client cannot supply the trusted scheme.
      FORWARDED_ALLOW_IPS: "*"
      # Accept Gerrit's canonical X-Origin-Url only from its compose peer.
      # mechanism-ok: env_var GERRIT_CANONICAL_WEB_URL — 073f-b86f-42c6-456f: pins
      # the non-secret origin value the Gerrit webhooks plugin emits for internal deliveries.
      GERRIT_CANONICAL_WEB_URL: "https://rebar.solutions.navateam.com/"
      REBAR_SYNC_PUSH: "always"
      # Use the mounted container path for the SSM-materialized signing key.
      # The host path in .env is not visible inside this container.
      REBAR_IDENTITY_SIGNING_KEY: "/run/secrets/rebar-bot-signing-key"
      # Write ticket events to the persistent pushable clone.
      REBAR_TRACKER_DIR: "/var/gerrit/site/reviewbot-tickets"
      # Trust this uid-1000 volume in root-run Git processes. Git ignores
      # repository-local safe.directory, so inject it into every invocation.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "/var/gerrit/site/reviewbot-tickets"
      # Rebar's region setting selects Bedrock and records provider provenance.
      # Instance credentials resolve through IMDS, but region discovery does not.
      REBAR_LLM_BEDROCK_REGION: "us-east-1"
      # Botocore callers also need their own ambient region setting.
      AWS_DEFAULT_REGION: "us-east-1"
      # Set all 3 model-class slots to Bedrock inference profiles. Removing
      # these settings restores the built-in direct Anthropic defaults.
      # Model classes preserve frontier versus standard gate routing.
      # REBAR_LLM_MODEL is removed and must not be used. Use profile IDs from
      # aws bedrock list-inference-profiles, including their distinct suffixes.
      # The cutover test pins these IDs to the CI provider matrix. Update the
      # ModelId alarm in monitoring_eb6e.tf if any ID changes.
      REBAR_LLM_FRONTIER_MODEL: "bedrock:us.anthropic.claude-opus-4-8"
      REBAR_LLM_STANDARD_MODEL: "bedrock:us.anthropic.claude-sonnet-4-6"
      REBAR_LLM_TRIVIAL_MODEL: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
      # Record each LLM call's provider and tokens on the persistent review-bot
      # volume. This detects stray direct Anthropic calls while retaining its
      # credential for rollback. The JSONL sink has no rotation. Disk-pressure
      # monitoring covers its growth. Add rotation if review volume rises.
      REBAR_USAGE_LOG: "/var/gerrit/site/reviewbot/usage.jsonl"
      # Trigger snapshot-cache reclaim at 20% free on the gate-scratch
      # volume. The janitor reclaims to 25% free. The prior absolute 2 GiB
      # trigger was too late when snapshots lived on the 30 GiB root disk.
      REBAR_GATE_FREE_WATERMARK_PCT: "20"
      # Put both snapshot storage and per-review temporary clones on the
      # gate-scratch EBS volume. The snapshot store reads REBAR_GATE_TMPDIR.
      # tempfile reads TMPDIR. Keep both aligned with Terraform and the
      # gate-scratch volume test.
      REBAR_GATE_TMPDIR: "/var/lib/rebar/gate-scratch"
      TMPDIR: "/var/lib/rebar/gate-scratch"
    ports:
      # Publish host loopback for nginx. Uvicorn listens on container 8000.
      - "127.0.0.1:${REVIEW_BOT_PORT:-8000}:8000"
    volumes:
      # Persist the dedup ledger and reconcile cursor across redeploys.
      # Mount the signing key read-only at the path named above. The secrets
      # fetch creates an empty file for a blank slot to avoid a directory mount.
      - ./rebar-bot-signing-key:/run/secrets/rebar-bot-signing-key:ro
      - gerrit_reviewbot:/var/gerrit/site/reviewbot
      # Persist the tickets clone so artifact writes can auto-push.
      - gerrit_reviewbot_tickets:/var/gerrit/site/reviewbot-tickets
      # Bind the gate-scratch volume's parent. The root-side declaration
      # marker and in-volume proof marker must both remain visible so the
      # admission guard detects an unmounted scratch volume. It is separate
      # from the Gerrit site volumes created by compose-up.sh.
      - /var/lib/rebar:/var/lib/rebar
    # The receiver calls rebar.llm directly, so REBAR_MCP_ALLOW_LLM is unused.
    # Probe the container listener to expose a process that remains up after
    # closing port 8000. Health is reporting only. Autodeploy uses its own
    # /health check and Docker restart does not react to unhealthy status.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: journald

  # The trusted gate sits behind SigV4 API Gateway and nginx's origin guard.
  # It fetches authoritative state and never pushes gate workspace writes.
  opcert:
    build:
      # Build from the repository root for the package install.
      context: ../..
      dockerfile: infra/compose/Dockerfile.opcert
    restart: unless-stopped
    mem_limit: 256m
    # Load the gate credentials and origin guard from the regenerated .env.
    env_file:
      - .env
    environment:
      # Match the trusted-environment env_id. Deploy may override it.
      REBAR_OPCERT_ENV_ID: "${REBAR_OPCERT_ENV_ID:-9f1c8e42-7a3b-4d5e-b6c1-2f0a9d8e7c65}"
      # Mount the SSM-materialized opcert key read-only. The signer copies
      # it to a process-owned directory and does not fetch AWS secrets.
      REBAR_OPCERT_KEY_PATH: "/run/secrets/opcert-ed25519-key"
      # Fetch the review main tip and read-only tickets state independently.
      REBAR_OPCERT_REVIEW_REMOTE_URL: "${REBAR_OPCERT_REVIEW_REMOTE_URL:-https://github.com/navapbc/rebar.git}"
      REBAR_OPCERT_TICKETS_REMOTE_URL: "${REBAR_OPCERT_TICKETS_REMOTE_URL:-https://github.com/navapbc/rebar.git}"
      REBAR_OPCERT_REVIEW_BRANCH: "main"
      # Never push gate workspace writes. Trust the bridge gateway's
      # forwarded scheme for nginx redirects. The port is host-loopback only
      # and nginx overwrites X-Forwarded-Proto, preventing client forgery.
      FORWARDED_ALLOW_IPS: "*"
      REBAR_SYNC_PUSH: "off"
    ports:
      # Publish host loopback for nginx on 8090. Container port is 8080.
      - "127.0.0.1:8090:8080"
    volumes:
      # Mount the SSM-materialized key read-only at REBAR_OPCERT_KEY_PATH.
      # The secrets fetch creates an empty file for a blank slot.
      - ./opcert-ed25519-key:/run/secrets/opcert-ed25519-key:ro
    logging:
      driver: journald

  # MCP serves authenticated Streamable HTTP behind host nginx.
  # Non-loopback container bind requires allowlists and TLS-at-edge acknowledgment.
  # MCP_PATHS is consumed by autodeploy for MCP blue-green redeploys.
  #   MCP_PATHS="src/rebar infra/compose/Dockerfile.mcp infra/scripts/mcp-entrypoint.sh infra/scripts/autodeploy.sh infra/compose/docker-compose.yml uv.lock pyproject.toml"
  mcp:
    build:
      # Build from the repository root for the locked install.
      context: ../..
      dockerfile: infra/compose/Dockerfile.mcp
    restart: always
    mem_limit: 3712m
    # Cover the 1200s certified-op SIGTERM grace with 60s margin.
    # The HTTP transport test checks this relationship.
    stop_grace_period: 1260s
    # Load LLM credentials from the regenerated .env.
    env_file:
      - .env
    environment:
      # Bind container-wide HTTP behind host-loopback nginx.
      REBAR_MCP_TRANSPORT: "http"
      REBAR_MCP_HTTP_HOST: "0.0.0.0"
      REBAR_MCP_HTTP_PORT: "8091"
      # Acknowledge TLS termination at nginx.
      REBAR_MCP_HTTP_TLS_AT_EDGE: "true"
      # Trust the bridge gateway's forwarded scheme for nginx redirects.
      # The port is host-loopback only and nginx overwrites X-Forwarded-Proto,
      # preventing clients from forging the trusted scheme.
      FORWARDED_ALLOW_IPS: "*"
      # Restrict forwarded Host and Origin to the public edge.
      REBAR_MCP_HTTP_ALLOWED_HOSTS: "${REBAR_MCP_HTTP_ALLOWED_HOSTS:-rebar.solutions.navateam.com}"
      REBAR_MCP_HTTP_ALLOWED_ORIGINS: "${REBAR_MCP_HTTP_ALLOWED_ORIGINS:-https://rebar.solutions.navateam.com}"
      # Require static bearer auth on /mcp. /health stays unauthenticated.
      REBAR_MCP_AUTH_ENABLED: "1"
      REBAR_MCP_AUTH_STRATEGIES: "static"
      REBAR_MCP_AUTH_RESOURCE_SERVER_URL: "${REBAR_MCP_AUTH_RESOURCE_SERVER_URL:-https://rebar.solutions.navateam.com/mcp}"
      # Supply the OAuth issuer required by AuthSettings to avoid startup failure.
      REBAR_MCP_AUTH_ISSUER_URL: "${REBAR_MCP_AUTH_ISSUER_URL:-https://rebar.solutions.navateam.com/mcp}"
      # Mount the static bearer digests file read-only.
      REBAR_MCP_AUTH_STATIC_TOKENS_FILE: "/run/secrets/mcp-static-tokens.json"
      # Enable the certified LLM gate tools.
      REBAR_MCP_ALLOW_LLM: "1"
      # Route both gate temp directories to the parent-bound scratch volume.
      # mechanism-ok: env_var REBAR_GATE_FREE_WATERMARK_PCT — ce66-59ef-d6d7-4c7a
      REBAR_GATE_FREE_WATERMARK_PCT: "20"
      # mechanism-ok: env_var REBAR_GATE_TMPDIR — ce66-59ef-d6d7-4c7a
      REBAR_GATE_TMPDIR: "/var/lib/rebar/gate-scratch"
      # mechanism-ok: env_var TMPDIR — ce66-59ef-d6d7-4c7a
      TMPDIR: "/var/lib/rebar/gate-scratch"
      # Sign certified operations with the mounted key and environment ID.
      REBAR_OPCERT_ENV_ID: "${REBAR_OPCERT_ENV_ID:-9f1c8e42-7a3b-4d5e-b6c1-2f0a9d8e7c65}"
      REBAR_IDENTITY_SIGNING_KEY: "/run/secrets/opcert-ed25519-key"
      # Persist the writable tickets clone created by the entrypoint.
      REBAR_TRACKER_DIR: "/var/gerrit/site/mcp-tickets"
      # Resolve attested refs in the entrypoint's persistent blobless main
      # clone. Keep these paths aligned with autodeploy's mcp_run_new.
      MCP_CODE_DIR: "/var/gerrit/site/mcp-code"
      REBAR_ROOT: "/var/gerrit/site/mcp-code"
      # Push ticket events alongside review-bot artifact writes. The
      # event-sourced store merges concurrent writers.
      REBAR_SYNC_PUSH: "always"
      # Rebar's Bedrock region appears in signed provider provenance.
      # Botocore also needs AWS_DEFAULT_REGION. Credentials come from the
      # instance role. Keep both settings aligned with mcp_run_new.
      REBAR_LLM_BEDROCK_REGION: "us-east-1"
      AWS_DEFAULT_REGION: "us-east-1"
      # Pass the SSM-materialized tickets PAT to the URL-scoped Git helper.
      # A blank PAT defers cloning without blocking container startup.
      MCP_TICKETS_PAT: "${MCP_TICKETS_PAT:-}"
      # Load Jira bridge settings from the generated .env. docker run does
      # not interpolate Compose's project .env, so mcp_run_new must pass the
      # env file without empty command-line overrides. Missing Jira credentials
      # make bridge calls return typed missing-input errors while /mcp stays up.
      # Missing bearer digests instead fail closed at startup.
      JIRA_URL: "${JIRA_URL:-}"
      JIRA_USER: "${JIRA_USER:-}"
      # Probe scope reads JIRA_PROJECT from the environment.
      JIRA_PROJECT: "${JIRA_PROJECT:-}"
      JIRA_API_TOKEN: "${JIRA_API_TOKEN:-}"
    ports:
      # Publish host loopback for nginx on 8091.
      - "127.0.0.1:8091:8091"
    volumes:
      # Mount bearer digests and the opcert key read-only. The secrets
      # fetch must create files even for blank slots. Missing bearer digests
      # fail closed rather than serving unauthenticated MCP.
      - ./mcp-static-tokens.json:/run/secrets/mcp-static-tokens.json:ro
      - ./opcert-ed25519-key:/run/secrets/opcert-ed25519-key:ro
      # Persist ticket events in an external site volume.
      - gerrit_mcp_tickets:/var/gerrit/site/mcp-tickets
      # Persist the blobless main clone in an external site volume.
      - gerrit_mcp_code:/var/gerrit/site/mcp-code
      # Bind the scratch parent so both mount markers remain visible.
      - /var/lib/rebar:/var/lib/rebar
    # Probe loopback /health so docker compose ps reports listener health.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: journald

# compose-up.sh creates external EBS-backed site volumes before startup.
# They survive docker compose down -v without shadowing image binaries.
volumes:
  gerrit_git:
    external: true
  gerrit_index:
    external: true
  gerrit_cache:
    external: true
  gerrit_db:
    external: true
  gerrit_etc:
    external: true
  gerrit_logs:
    external: true
  gerrit_plugins:
    external: true
  # Persist review-bot state on the Gerrit site volume.
  gerrit_reviewbot:
    external: true
  # Persist the review-bot tickets clone.
  gerrit_reviewbot_tickets:
    external: true
  # Persist the MCP tickets store.
  gerrit_mcp_tickets:
    external: true
  # Persist the MCP blobless main clone for attested refs.
  gerrit_mcp_code:
    external: true
