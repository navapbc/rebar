# ---------------------------------------------------------------------------
# rebar Gerrit + review-bot compose stack (epic d251 / story S2).
#
# Runs the two containers on the AL2023 arm64 box: Gerrit (the code-review server)
# and the rebar review-bot (the FastAPI webhook receiver). nginx is NOT in this
# stack — it runs as a HOST package (dnf nginx + host certbot) and proxies to the
# published container ports (see infra/nginx/rebar.conf.template and
# infra/scripts/install-certbot-timer.sh, and ADR-0007).
#
# Secrets come from infra/compose/.env, regenerated each boot from SSM by
# infra/scripts/fetch-secrets.sh (ADR-0008). Compose auto-loads a sibling `.env`.
#
# PERSISTENCE MODEL (important): the official `gerritcodereview/gerrit` image runs
# the server from the baked site at `/var/gerrit` (`-d /var/gerrit`) and IGNORES a
# GERRIT_SITE override. Mounting one volume over the whole `/var/gerrit` would hide
# the baked binaries (bin/, lib/, gerrit.war). So we persist only the STATEFUL
# SUBDIRECTORIES by bind-mounting them from the EBS-backed host path
# `/var/gerrit/site/*` into the container's `/var/gerrit/*`. Bind mounts onto the
# persistent EBS mount are inherently safe from `docker compose down -v` (which only
# removes named volumes), satisfying the "data survives down -v" requirement, and
# they ride the EBS data volume's DLM daily snapshots (S7). compose-up.sh seeds
# `site/etc/gerrit.config` (and copies the baked plugins) before first boot.
# ---------------------------------------------------------------------------

services:
  # --- Gerrit code-review server -------------------------------------------
  gerrit:
    # Extends gerritcodereview/gerrit:3.14.1 with Python + gerrit-to-platform so the
    # `hooks` plugin can exec the g2p CI hooks in-container (epic 1fa8 / ADR-0022).
    # The base image still publishes arm64; the added apt/pip layers are arch-neutral.
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.gerrit
    restart: unless-stopped
    ports:
      # 8080: Gerrit HTTP — published to host loopback so the HOST nginx (TLS
      # terminator) proxies to 127.0.0.1:8080; NOT directly internet-exposed.
      - "127.0.0.1:8080:8080"
      # 29418: Gerrit SSH (git-over-SSH) — exposed directly (SG opens 29418).
      - "29418:29418"
    volumes:
      # Persist the stateful site subdirs via EXTERNAL named volumes (declared
      # external: true below; created out-of-band by compose-up.sh as local `bind`
      # volumes onto the EBS-backed host path /var/gerrit/site/*). external:true means
      # `docker compose down -v` will NOT destroy them. Only the STATEFUL subdirs are
      # mounted, so the image's baked binaries (bin, lib, gerrit.war) are NOT shadowed.
      - gerrit_git:/var/gerrit/git
      - gerrit_index:/var/gerrit/index
      - gerrit_cache:/var/gerrit/cache
      - gerrit_db:/var/gerrit/db
      - gerrit_etc:/var/gerrit/etc
      - gerrit_logs:/var/gerrit/logs
      - gerrit_plugins:/var/gerrit/plugins
      # S5 replication: the GitHub deploy key + known_hosts + ssh config live in
      # the gerrit user's ~/.ssh (HOME=/var/gerrit -> /var/gerrit/.ssh). A DIRECT
      # host bind mount (not an external named volume) onto /var/gerrit/site/dotssh,
      # which infra/gerrit/materialize-deploy-key.sh populates (as uid 1000) from
      # SSM BEFORE Gerrit starts. The replication plugin's `git push` reads this
      # dir to authenticate to github.com:navapbc/rebar.
      - /var/gerrit/site/dotssh:/var/gerrit/.ssh
      # epic 1fa8 (S3): gerrit-to-platform config + GitHub PAT, materialised from SSM
      # by infra/gerrit/materialize-g2p-config.sh BEFORE boot (like the deploy key
      # above). g2p (in-container) reads gerrit_to_platform.ini + replication.config here.
      - /var/gerrit/site/g2p-config:/var/gerrit/.config/gerrit_to_platform
    environment:
      # Public HTTPS origin (nginx-terminated). The entrypoint writes this into
      # etc/gerrit.config; it mirrors the canonicalWebUrl we pre-seed there.
      CANONICAL_WEB_URL: https://rebar.solutions.navateam.com/
    # Ship container stdout/stderr to the host journal (journald), per the S2
    # observability AC; `journalctl CONTAINER_NAME=compose-gerrit-1` then works.
    logging:
      driver: journald

  # --- rebar review-bot webhook receiver -----------------------------------
  review-bot:
    build:
      # Build context is the REPO ROOT so `pip install .` sees the whole package.
      context: ../..
      dockerfile: infra/compose/Dockerfile.reviewbot
    restart: unless-stopped
    # Give the graceful shutdown (app.py lifespan) time to finish before Docker escalates
    # SIGTERM → SIGKILL on a redeploy/restart, so acknowledged (202) webhooks are not abandoned
    # AND — the reason this must be generous — an in-flight store write is never killed midway.
    # The drain waits for the running review to finish, and that review ends in
    # emit_code_review_artifact → event_append.stage_and_commit, which holds the store's MKDIR
    # write lock. The fcntl leg is kernel-released on death; the mkdir dir is NOT, and a lock
    # stamped by one container cannot be reclaimed by the next — so a SIGKILL landing inside
    # that region orphans it and the successor container burns its whole lock budget at boot
    # (the 2026-07-31 rebar-autodeploy-errors incident).
    #
    # Sized from the app's own budgets, not from the drain window alone. Since c2ba every term
    # is now a BOUNDED budget, so this is a provable worst case rather than a risk reduction:
    #   1200s  SHUTDOWN_DRAIN_SECONDS  (config.py DEFAULT_SHUTDOWN_DRAIN_SECONDS — sized to the
    #          per-review timeout so an IN-FLIGHT review finishes before the deploy proceeds;
    #          ticket 0347. An empty queue drains instantly, so a no-review deploy pays nothing.)
    #   + 60s  store write-lock acquisition (_store/lock.py _DEFAULT_TIMEOUT 30 x _ATTEMPTS 2)
    #   + 45s  the push reconcile's re-taken lock (push.py _PUSH_MERGE_LOCK_TIMEOUT 15
    #          x _MAX_RETRIES 3)
    #   = 1305s, rounded up to a whole 22 minutes (1320s) for margin.
    # The lock-held git work done under those acquisitions is itself bounded by event_append's
    # _GIT_TIMEOUT (30s/call, matching push.py), and the lifespan's post-drain cancel/await is
    # bounded by SHUTDOWN_CANCEL_SECONDS (10s) — both well inside the total above. Docker's own
    # default would be 10s. Anything not drained in the window still falls to the backfill
    # reconciler.
    #
    # c2ba (melting-resting-serpent) closed the two residues that previously made this constant
    # unprovable — event_append's lock-held git calls now carry _GIT_TIMEOUT, and voter.py runs
    # emit_code_review_artifact OFF the event loop (asyncio.to_thread) so the drain bound can
    # actually fire — so the critical section now has an upper bound by construction.
    # tests/unit/test_review_bot.py::test_reviewbot_stop_grace_period_covers_an_in_flight_store_write
    # asserts the relationship, so raising either budget fails CI until this follows.
    stop_grace_period: 1320s
    env_file:
      - .env
    environment:
      # Data capture (story limestone-unethical-zebrafinch): auto-push every code_review artifact
      # ticket event to origin/tickets as it is written. The push credential is a URL-scoped git
      # credential helper materialized by the entrypoint from REVIEWBOT_TICKETS_PAT (see .env /
      # fetch-secrets.sh); the persistent tickets worktree below is its store.
      REBAR_SYNC_PUSH: "always"
      # Authorship signing key, CONTAINER-side path (bug beb1). fetch-secrets.sh materializes
      # the key on the HOST and exports that HOST path via env_file; that path does not exist
      # in this container's namespace, so rebar silently wrote every event unsigned. Override
      # with the mount target below; keep the two in sync.
      REBAR_IDENTITY_SIGNING_KEY: "/run/secrets/rebar-bot-signing-key"
      # Point rebar's ambient tickets store (config.tracker_dir, read by the reviewbot's
      # create_ticket/link/emit calls that pass repo_root=None) at the PERSISTENT tickets worktree,
      # NOT the container's /app cwd — so artifact writes land in the pushable clone.
      REBAR_TRACKER_DIR: "/var/gerrit/site/reviewbot-tickets"
      # Trust the persistent tickets volume for git. The container runs as root (no USER in
      # Dockerfile.reviewbot) but that named volume is owned uid 1000 (a legacy population that
      # survives rebuilds), so git's dubious-ownership guard (>=2.35.2) refused EVERY op on it —
      # the ensure-tickets convergence AND rebar's runtime `git commit` in emit_code_review_artifact
      # — making 100% of code_review artifact emissions fail (ARTIFACT_EMIT_ERROR). safe.directory
      # is only honored from command-line/system/global config (never repo-local), so inject it via
      # GIT_CONFIG_* — equivalent to `git -c safe.directory=...` (confirmed to resolve the guard on
      # the box), HOME-independent (HOME is unset here), applied to every git process from startup.
      # Keep the path in sync with REBAR_TRACKER_DIR above.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "/var/gerrit/site/reviewbot-tickets"
      # AWS region for the Bedrock provider (ticket a574). MEASURED in this container: no
      # AWS_REGION, no AWS_DEFAULT_REGION, no profile — boto3.session.Session().region_name is
      # None and bedrock-runtime construction raises NoRegionError. Story eb6e's cutover ships
      # with NO cross-provider fallback, so an unset region takes the LLM-Review gate down for
      # every landing rather than degrading it.
      #
      # This is rebar's OWN knob rather than a bare AWS_REGION so the value is visible to rebar's
      # config layer and is recorded in the signed verdict's provider_provenance (ticket 343b);
      # an AWS_REGION set here would authenticate fine but leave no trace of which region
      # produced the verdict.
      #
      # NOTE this is independent of IMDS. IMDS is reachable from this container and the instance
      # role resolves (ticket 9249), yet region_name is still None — credential discovery and
      # region discovery fail, and are fixed, separately.
      REBAR_LLM_BEDROCK_REGION: "us-east-1"
      # ALSO the ambient boto3 var, and the two are NOT interchangeable. MEASURED: with only
      # REBAR_LLM_BEDROCK_REGION set, rebar's own Bedrock path works (it threads the value
      # into BedrockProvider) but a bare boto3 client STILL raises NoRegionError, because
      # boto3 has never heard of rebar's knob. AWS_DEFAULT_REGION is botocore's canonical
      # region var and covers every other caller in the image.
      AWS_DEFAULT_REGION: "us-east-1"
      # THE BEDROCK CUTOVER (story eb6e): fill the three MODEL-CLASS slots with Bedrock
      # inference-profile ids. This is the whole flip — purely ADDITIVE, and the kill switch is
      # purely SUBTRACTIVE (delete these three lines, recreate the container). MEASURED in this
      # container: with the slots absent, rebar resolves the classes to the built-in defaults
      # anthropic:claude-opus-4-8 / -sonnet-4-6 / -haiku-4-5, so removing them restores the
      # direct-Anthropic path by construction, with no other edit and no rebuild.
      #
      # WHY CLASSES AND NOT `REBAR_LLM_MODEL`: the gates name model CLASSES, not model ids
      # (code-review.yaml's base is `frontier` and its verify/coach are `standard`;
      # plan-review.yaml's Pass-1 ladder is `[frontier]`). Filling the slots therefore re-points
      # every pass in one act while PRESERVING that split. `REBAR_LLM_MODEL` would have
      # destroyed it: it fanned ONE value out to ALL THREE classes — sonnet-everywhere silently
      # downgrades the Pass-1 finder, opus-everywhere loses the Pass-2 cost downgrade AND renders
      # code-review.yaml's `temperature: 0` greedy pin inoperative, because Bedrock opus accepts
      # only the default temperature. Both are wrong, in opposite directions. The variable has
      # since been REMOVED and tombstoned: setting it now fails loud, so it must not be added.
      #
      # ONLY INFERENCE-PROFILE ids are invokable: a bare on-demand `anthropic.claude-*` id
      # returns `ValidationException: … on-demand throughput isn't supported`. The suffixes are
      # NOT uniform (sonnet and haiku differ), so take any new id VERBATIM from
      # `aws bedrock list-inference-profiles`. These three values are pinned byte-for-byte to
      # `.github/llm-providers/bedrock.toml` by
      # tests/unit/test_reviewbot_bedrock_cutover.py, so editing either side alone fails CI —
      # that test is what keeps this block and the CI provider matrix single-sourced.
      #
      # If these ids change, infra/terraform/monitoring_eb6e.tf must change too: its
      # client-error alarm is dimensioned by ModelId and would otherwise watch ids that no
      # longer receive traffic and report healthy forever.
      REBAR_LLM_FRONTIER_MODEL: "bedrock:us.anthropic.claude-opus-4-8"
      REBAR_LLM_STANDARD_MODEL: "bedrock:us.anthropic.claude-sonnet-4-6"
      REBAR_LLM_TRIVIAL_MODEL: "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0"
      # Per-call token/provider sink (src/rebar/llm/usage_log.py). Recording is OPT-IN — with
      # this var unset, `record()` is a no-op, which is why this container has produced no
      # usage evidence until now. It is set HERE because it is the only oracle that proves the
      # property this cutover actually cares about: that every call went to a Bedrock
      # inference profile and ZERO went to direct Anthropic. The verdict's provider_provenance
      # names the provider for the RUN; this names it PER CALL, so a single stray
      # direct-Anthropic call cannot hide inside an otherwise-Bedrock review. ANTHROPIC_API_KEY
      # stays in the container by design (the kill switch needs a working credential), so
      # "unused" is a claim that has to be MEASURED rather than inferred from the key's
      # absence — this is what measures it.
      #
      # ON THE PERSISTENT VOLUME on purpose. Auto-deploy recreates this container on every
      # deploy, so a path inside the container image would lose the evidence at exactly the
      # moment it is wanted; /var/gerrit/site/reviewbot is the bind-backed volume that already
      # carries voted.db and reconcile_cursor across recreation.
      #
      # GROWTH, stated rather than waved at: the sink is append-only JSONL with NO rotation and
      # no cap — it was built for ephemeral CI jobs, not a long-lived service. The RATE is what
      # makes it acceptable here, not the design: a few hundred bytes per LLM call and tens of
      # calls per review put it on the order of 100-200 MB/year at a busy review rate. MEASURED
      # headroom: /var/gerrit is 50G with 44G free and the whole reviewbot volume is under 300K,
      # and rebar-gerrit-data-disk-high already alarms on that filesystem. If the review rate
      # ever grows by orders of magnitude, add rotation rather than removing the sink.
      REBAR_USAGE_LOG: "/var/gerrit/site/reviewbot/usage.jsonl"
      # Volume-RELATIVE headroom for the snapshot-cache janitor (bug 3a52). The janitor is the
      # ONLY thing that bounds this store (app.py's lifespan starts it), and its stock trigger is
      # an ABSOLUTE 2 GiB free — disk-size-blind. The snapshot store lives on the container's
      # WRITABLE LAYER on the box's 30-GiB ROOT volume: no volume mount above covers /tmp and
      # REBAR_GATE_TMPDIR is unset, so /tmp/rebar-gate-snapshots is root-disk storage. On 30 GiB,
      # 2 GiB free is 93.3% used — ABOVE the 85% at which infra/terraform/monitoring_autodeploy.tf's
      # rebar-root-disk-pressure alarm pages, so the janitor could only ever engage after the alarm
      # had already breached, inverting the ordering infra/runbooks/review-bot-ops.md documents
      # (janitor reclaims; alarm is the backstop). 20% headroom trips reclaim at 80% used, below
      # the alarm floor, and matches infra/scripts/autodeploy.sh's DISK_PRESSURE_PCT=80 — chosen
      # there for the same reason, so the two reclaimers share one pressure threshold. The janitor
      # then runs on to 25% free (its fixed internal RECLAIM_TARGET_MARGIN_PCT) rather than
      # stopping on the trigger, so a pass does not re-fire every interval.
      REBAR_GATE_FREE_WATERMARK_PCT: "20"
    ports:
      # Publish on host loopback for the HOST nginx /review/ proxy. Host port is
      # single-sourced from .env (REVIEW_BOT_PORT, default 8000); container port
      # is fixed at 8000 (uvicorn --port in the Dockerfile).
      - "127.0.0.1:${REVIEW_BOT_PORT:-8000}:8000"
    volumes:
      # Persist the dedup ledger + reconcile cursor across container recreation. Auto-deploy
      # rebuilds this container on every deploy; without a volume the reconcile cursor resets
      # to empty each time, forcing a full events-log re-scan on every deploy (the bug c943
      # amplifier). Bind onto the EBS host path like the gerrit_* site volumes; the external
      # volume is created by compose-up.sh (and pre-provisioned on the host). The review-bot
      # image runs as root, so the root-owned host dir is writable.
      # The authorship signing key materialized by fetch-secrets.sh next to this compose file
      # (bug beb1). Read-only; the path MUST match REBAR_IDENTITY_SIGNING_KEY above.
      # fetch-secrets.sh always creates this file (empty when the SSM slot is blank) because a
      # missing bind-mount source would make docker create a DIRECTORY here and break start-up.
      - ./rebar-bot-signing-key:/run/secrets/rebar-bot-signing-key:ro
      - gerrit_reviewbot:/var/gerrit/site/reviewbot
      # Persistent tickets worktree (story limestone-unethical-zebrafinch): a durable clone of the
      # `tickets` branch that survives container recreation, so the reviewbot's code_review artifact
      # writes accumulate + auto-push (REBAR_SYNC_PUSH=always) instead of living in an ephemeral
      # /tmp dir. Materialized once by the entrypoint (see Dockerfile.reviewbot).
      - gerrit_reviewbot_tickets:/var/gerrit/site/reviewbot-tickets
    # REBAR_MCP_ALLOW_LLM deliberately NOT set (gates only the stdio MCP server;
    # the receiver calls the rebar.llm library directly — S4b).
    logging:
      driver: journald

  # --- trusted op-cert gate service (story 76d2) ---------------------------
  # The FastAPI gate service (infra/compose/Dockerfile.opcert / rebar.opcert_service.app).
  # Reached ONLY through the SigV4-authenticated API Gateway -> HOST nginx /opcert/ (which
  # enforces the X-Opcert-Guard origin guard) -> this container's loopback-published port.
  # It fetches authoritative state itself and NEVER pushes (REBAR_SYNC_PUSH=off), so a gate's
  # SIGNATURE append lands only in the discarded per-job workspace.
  opcert:
    build:
      # Build context is the REPO ROOT so `pip install .` sees the whole package.
      context: ../..
      dockerfile: infra/compose/Dockerfile.opcert
    restart: unless-stopped
    # ANTHROPIC_API_KEY (the gate's LLM ops) + REBAR_OPCERT_GUARD (appended by
    # infra/scripts/materialize-opcert-guard.sh, the SSM-materialized origin guard) come
    # from the regenerated .env.
    env_file:
      - .env
    environment:
      # The environment's identity (the DSSE principal / SSHSIG key id). MUST equal the
      # env_id pinned in .rebar/trusted_environments.yaml. Operator overrides at deploy.
      REBAR_OPCERT_ENV_ID: "${REBAR_OPCERT_ENV_ID:-9f1c8e42-7a3b-4d5e-b6c1-2f0a9d8e7c65}"
      # The op-cert Ed25519 PRIVATE key, materialized OUTSIDE the app before start (story 6f14):
      # fetch-secrets.sh writes the SSM value to a 0600 FILE next to .env and this service
      # bind-mounts it read-only at the fixed container target below. compose_signer validates it
      # at startup and copies it into a process-owned 0700 dir — the app never touches SSM/boto3.
      REBAR_OPCERT_KEY_PATH: "/run/secrets/opcert-ed25519-key"
      # Authoritative-state sources the worker fetches ITSELF (never trusts the client): the
      # review remote's `main` tip becomes the signed merged_log_commit; the tickets branch is
      # mounted read-only as a rebar tracker worktree.
      REBAR_OPCERT_REVIEW_REMOTE_URL: "${REBAR_OPCERT_REVIEW_REMOTE_URL:-https://github.com/navapbc/rebar.git}"
      REBAR_OPCERT_TICKETS_REMOTE_URL: "${REBAR_OPCERT_TICKETS_REMOTE_URL:-https://github.com/navapbc/rebar.git}"
      REBAR_OPCERT_REVIEW_BRANCH: "main"
      # STORE-READ-ONLY: never push a gate write to the shared tickets branch.
      REBAR_SYNC_PUSH: "off"
    ports:
      # Publish on host loopback for the HOST nginx /opcert/ proxy. Host port 8090 (Gerrit
      # owns 8080, review-bot owns REVIEW_BOT_PORT); container port is fixed 8080 (uvicorn).
      - "127.0.0.1:8090:8080"
    volumes:
      # The op-cert Ed25519 signing key materialized by fetch-secrets.sh next to this compose
      # file (story 6f14; the rebar-bot-signing-key precedent). Read-only; the path MUST match
      # REBAR_OPCERT_KEY_PATH above. fetch-secrets.sh ALWAYS creates this file (empty when the
      # SSM slot is blank, bug beb1) because a missing bind-mount source would make docker create
      # a DIRECTORY here and break start-up.
      - ./opcert-ed25519-key:/run/secrets/opcert-ed25519-key:ro
    logging:
      driver: journald

# External named volumes for the stateful Gerrit site subdirs. Declared external:true
# so `docker compose down -v` does NOT destroy them. compose-up.sh creates each one
# (idempotently) as a local `bind` volume onto /var/gerrit/site/<subdir> on the EBS
# data volume BEFORE `docker compose up`. (Per-subdir, not one volume over the whole
# /var/gerrit, so the image's baked binaries are not shadowed.)
volumes:
  gerrit_git:
    external: true
  gerrit_index:
    external: true
  gerrit_cache:
    external: true
  gerrit_db:
    external: true
  gerrit_etc:
    external: true
  gerrit_logs:
    external: true
  gerrit_plugins:
    external: true
  # rebar review-bot state (dedup ledger + reconcile cursor) — bind onto
  # /var/gerrit/site/reviewbot; created by compose-up.sh alongside the gerrit_* volumes.
  gerrit_reviewbot:
    external: true
  # /var/gerrit/site/reviewbot-tickets — the persistent tickets worktree for code_review artifacts
  # (story limestone-unethical-zebrafinch); created by compose-up.sh alongside the others.
  gerrit_reviewbot_tickets:
    external: true
