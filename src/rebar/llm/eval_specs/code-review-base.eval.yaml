# Standing eval spec for the code-review BASE reviewer (Pass-1) — story f93a.
# Recall (seeded-defect) + no-fire families for the four-pass code-review gate, seeded
# from the DSO code-review incidents. The base reviewer runs over the WHOLE diff and emits
# grounded evidence findings; it is scored on FINDINGS presence (not a FAIL/BLOCK verdict).
# Validate offline: `rebar prompt eval code-review-base`. The live model run needs the
# [agents] extra + credentials (the eval CI). The gold_set is the human-adjudicated subset the
# llm-judge would be aligned to (seed labels pending adjudication).
prompt: code-review-base
model: anthropic:claude-opus-4-8
epochs: 3
gate: at_least(2)
coverage_threshold: 0.8

scorers:
  # Deterministic scorers GATE the build.
  - type: deterministic
    name: code_review_emits_valid_findings
    description: The base output is a dict carrying a `findings` list (native Pass-1 shape).
  - type: deterministic
    name: code_review_recall
    description: A diff with a seeded defect produces at least one finding.
  - type: deterministic
    name: code_review_no_fire
    description: A clean / linter-owned diff produces no finding (false-fire guard).

# `expect: finding` = the base reviewer SHOULD fire (recall); `expect: pass` = a GOOD diff it
# must NOT fire on (no-fire). Each case's `diff` is the unified-diff text under review.
dataset:
  # ── recall: seeded defects (bad diff → finding) ──────────────────────────────
  - id: R-dangling-deletion
    corpus: dso
    expect: finding
    mode: dangling-deletion
    diff: |
      --- a/rebar/store.py
      +++ b/rebar/store.py
      @@ -10,7 +10,3 @@
      -def compact_events(path):
      -    """Rewrite the event log, dropping tombstoned records."""
      -    ...
      @@ -40,2 +36,2 @@ def maintenance():
           run_fsck(path)
      -    compact_events(path)
      +    compact_events(path)  # still called; definition was removed above
  - id: R-asymmetric-signature
    corpus: dso
    expect: finding
    mode: asymmetric-signature-change
    diff: |
      --- a/rebar/reducer.py
      +++ b/rebar/reducer.py
      @@ -3,2 +3,2 @@
      -def apply_event(state, event):
      +def apply_event(state, event, *, clock):
           return _reduce(state, event)
      --- a/rebar/replay.py
      +++ b/rebar/replay.py
      @@ -8 +8 @@ def replay(events):
      -        state = apply_event(state, e)
      +        state = apply_event(state, e)   # not updated for the new required `clock` arg
  - id: R-vcs-conflict-marker
    corpus: dso
    expect: finding
    mode: unresolved-conflict-marker
    diff: |
      --- a/rebar/config.py
      +++ b/rebar/config.py
      @@ -12,3 +12,7 @@
      +<<<<<<< HEAD
      +DEFAULT_TIMEOUT = 30
      +=======
      +DEFAULT_TIMEOUT = 60
      +>>>>>>> feature/tune-timeout
  - id: R-ticket-scope-drift
    corpus: dso
    expect: finding
    mode: ticket-scope-drift
    diff: |
      --- a/rebar/cli.py
      +++ b/rebar/cli.py
      @@ -5,3 +5,4 @@ def main():
           parse_args()
      +    # ticket is "fix claim exit code"; this rewrites an UNRELATED formatting module
      +    reformat_report_module()
      --- a/rebar/report.py
      +++ b/rebar/report.py
      @@ -1,40 +1,80 @@
      -# (40 lines of the existing report formatter, wholesale rewritten below)
      +# (80 lines of an unrelated rewrite with no bearing on the claim exit code)
  # ── no-fire: GOOD diffs the base reviewer must NOT flag (seeded from DSO false-fires) ──
  - id: FP-sourced-bash
    corpus: dso
    expect: pass
    mode: sourced-bash-function
    diff: |
      --- a/scripts/lib.sh
      +++ b/scripts/lib.sh
      @@ -1,2 +1,5 @@
      +log() { printf '%s\n' "$*" >&2; }
      --- a/scripts/deploy.sh
      +++ b/scripts/deploy.sh
      @@ -1,2 +1,3 @@
      +source "$(dirname "$0")/lib.sh"   # `log` IS defined — sourced, not dangling
       log "deploying"
  - id: FP-subdir-scripts
    corpus: dso
    expect: pass
    mode: moved-to-subdirectory
    diff: |
      --- a/build.sh
      +++ /dev/null
      @@ -1,3 +0,0 @@
      -#!/bin/sh
      -echo build
      --- /dev/null
      +++ b/scripts/build.sh
      @@ -0,0 +1,3 @@
      +#!/bin/sh
      +echo build
      --- a/Makefile
      +++ b/Makefile
      @@ -2 +2 @@
      -	./build.sh
      +	./scripts/build.sh   # caller updated for the moved path
  - id: FP-list-form-subprocess
    corpus: dso
    expect: pass
    mode: list-form-subprocess
    diff: |
      --- a/rebar/git.py
      +++ b/rebar/git.py
      @@ -4,2 +4,3 @@
      -    subprocess.run(f"git -C {d} add -A", shell=True)
      +    # list form, no shell — not a shell-injection surface
      +    subprocess.run(["git", "-C", d, "add", "-A"], check=True)
  - id: FP-moved-code-rename
    corpus: dso
    expect: pass
    mode: rename-callers-updated
    diff: |
      --- a/rebar/util.py
      +++ b/rebar/util.py
      @@ -1 +1 @@
      -def slugify(s): return s.lower()
      +def to_slug(s): return s.lower()
      --- a/rebar/create.py
      +++ b/rebar/create.py
      @@ -7 +7 @@
      -    alias = slugify(title)
      +    alias = to_slug(title)   # sole caller updated with the rename
  - id: FP-public-config-read
    corpus: dso
    expect: pass
    mode: already-public-config-read
    diff: |
      --- a/rebar/mcp_server.py
      +++ b/rebar/mcp_server.py
      @@ -3,2 +3,3 @@
      +# reading an already-public, non-secret config value (documented default)
      +timeout = config.get("REBAR_TIMEOUT", 30)
  - id: FP-nit-only-style
    corpus: dso
    expect: pass
    mode: nit-only-style
    note: >
      NIT-FRAMING experiment (story f93a) — a diff whose ONLY changes are style/format/import
      nits that the linter already enforces (import reorder, whitespace, trailing comma). The
      base reviewer must NOT fire: nits are linter-owned, not review findings. Committed as the
      baseline the gate is held to.
    diff: |
      --- a/rebar/reads.py
      +++ b/rebar/reads.py
      @@ -1,4 +1,4 @@
      -import os, sys
      -import json
      +import json
      +import os
      +import sys
      @@ -10,3 +10,3 @@ def show(tid):
      -    return {'id':tid,'status':status}
      +    return {"id": tid, "status": status}
  # ── fail-open check calibration corpus (story 3fce-cccf-d38b-4072) ───────────
  # The five shipped-code instances from the nine-instance fail-open session
  # (2026-08-20/21), hosted by the error-handling base dimension: each as its
  # recorded PRE-FIX state (must fire) paired with its POST-FIX state (must stay
  # silent). Pre-fix diffs are MINIMAL — the fail-open defect is the only defect.
  - id: R-failopen-unchecked-returncode
    corpus: dso
    expect: finding
    mode: failopen-unchecked-returncode
    note: >-
      Instance 5 (obvious-saline-gerbil pre-fix): live-DC pass health never checks the
      child's returncode — a crashed checker emits nothing, and "no ERROR lines" reads
      as healthy.
    diff: |
      --- a/rebar/dc_health.py
      +++ b/rebar/dc_health.py
      @@ -3,3 +3,7 @@
      +def dc_pass_health(host):
      +    proc = subprocess.run(["dc-check", host], capture_output=True, text=True)
      +    # returncode never read: a checker that crashed (or never ran) emits
      +    # nothing, and an empty stdout has no "ERROR" in it — health by silence
      +    return "ERROR" not in proc.stdout
  - id: FP-failopen-returncode-checked
    corpus: dso
    expect: pass
    mode: failopen-unchecked-returncode-fixed
    note: >-
      Instance 5 post-fix: exit status checked AND a positive health-report presence required before the absence is trusted; a dead or silent checker is now an error. Must NOT fire.
    diff: |
      --- a/rebar/dc_health.py
      +++ b/rebar/dc_health.py
      @@ -3,3 +3,10 @@
      +def dc_pass_health(host):
      +    proc = subprocess.run(["dc-check", host], capture_output=True, text=True)
      +    if proc.returncode != 0:
      +        raise HealthCheckError(f"dc-check {host} exited {proc.returncode}")
      +    if "HEALTH REPORT" not in proc.stdout:
      +        raise HealthCheckError(f"dc-check {host} emitted no health report")
      +    return "ERROR" not in proc.stdout
  - id: R-failopen-silent-lookup-miss
    corpus: dso
    expect: finding
    mode: failopen-silent-lookup-miss
    note: >-
      Instance 6 (defiable-distortive-pinniped pre-fix): gen_env_registry fails OPEN on a
      helper missing from KNOWN_ENV_HELPERS — absent is not an error, it is INVISIBLE, so
      operator-settable vars go undocumented while --check stays green.
    diff: |
      --- a/scripts/gen_env_registry.py
      +++ b/scripts/gen_env_registry.py
      @@ -20,3 +20,7 @@ def render_rows(discovered_vars):
      +    for var in sorted(discovered_vars):
      +        helper = KNOWN_ENV_HELPERS.get(var)
      +        if helper is None:
      +            continue  # unknown helper silently skipped — the miss is invisible
      +        rows.append(render_row(var, helper))
  - id: FP-failopen-lookup-miss-fails-closed
    corpus: dso
    expect: pass
    mode: failopen-silent-lookup-miss-fixed
    note: >-
      Instance 6 post-fix: an unknown helper is now a hard error naming the var — the miss
      path is closed. Must NOT fire.
    diff: |
      --- a/scripts/gen_env_registry.py
      +++ b/scripts/gen_env_registry.py
      @@ -20,3 +20,8 @@ def render_rows(discovered_vars):
      +    for var in sorted(discovered_vars):
      +        helper = KNOWN_ENV_HELPERS.get(var)
      +        if helper is None:
      +            raise RegistryError(f"{var} read via an unregistered helper — add it "
      +                                "to KNOWN_ENV_HELPERS so it is documented")
      +        rows.append(render_row(var, helper))
  - id: R-failopen-environ-scan-skip
    corpus: dso
    expect: finding
    mode: failopen-environ-scan
    note: >-
      Instance 7 (blocky-matricidal-squid pre-fix): the os.environ half of the same
      generator, same posture — an undocumented operator var is skipped, not reported.
    diff: |
      --- a/scripts/gen_env_registry.py
      +++ b/scripts/gen_env_registry.py
      @@ -40,3 +40,6 @@ def render_environ_rows(tree):
      +    for name, source in scan_os_environ_reads(tree):
      +        if name not in KNOWN_ENV_HELPERS:
      +            continue  # direct os.environ read of an unknown var: silently dropped
      +        rows.append(render_row(name, KNOWN_ENV_HELPERS[name]))
  - id: FP-failopen-environ-scan-fails-closed
    corpus: dso
    expect: pass
    mode: failopen-environ-scan-fixed
    note: >-
      Instance 7 post-fix: unknown os.environ reads are collected and reported as a hard
      failure listing every offender. Must NOT fire.
    diff: |
      --- a/scripts/gen_env_registry.py
      +++ b/scripts/gen_env_registry.py
      @@ -40,3 +40,9 @@ def render_environ_rows(tree):
      +    unknown = []
      +    for name, source in scan_os_environ_reads(tree):
      +        if name not in KNOWN_ENV_HELPERS:
      +            unknown.append(f"{name} ({source})")
      +            continue
      +        rows.append(render_row(name, KNOWN_ENV_HELPERS[name]))
      +    if unknown:
      +        raise RegistryError("undocumented os.environ reads: " + ", ".join(unknown))
  - id: R-failopen-pgrep-self-match-monitor
    corpus: dso
    expect: finding
    mode: failopen-pgrep-self-match
    note: >-
      Instance 8 pre-fix: a pgrep -f "make test" monitor matches its OWN shell, whose
      command line contains the pattern — the loop waits for itself until timeout
      regardless of the suite's outcome.
    diff: |
      --- a/scripts/notify_when_tests_done.py
      +++ b/scripts/notify_when_tests_done.py
      @@ -1,3 +1,8 @@
      +def wait_for_suite():
      +    # invoked as `python notify_when_tests_done.py "make test"`: this process's
      +    # OWN argv contains the pattern, so pgrep -f matches ourselves and the loop
      +    # spins until timeout whether or not the suite is still running
      +    while subprocess.run(["pgrep", "-f", sys.argv[1]],
      +                         capture_output=True).returncode == 0:
      +        time.sleep(10)
  - id: FP-failopen-waits-on-recorded-pid
    corpus: dso
    expect: pass
    mode: failopen-pgrep-self-match-fixed
    note: >-
      Instance 8 post-fix: the monitor holds the suite's OWN Popen handle and waits on it with a bounded timeout — no pattern match, no pid reuse, self-match impossible. Must NOT fire.
    diff: |
      --- a/scripts/notify_when_tests_done.py
      +++ b/scripts/notify_when_tests_done.py
      @@ -1,3 +1,10 @@
      +import subprocess
      +
      +def wait_for_suite(proc: subprocess.Popen, timeout: float = 3600.0) -> int:
      +    # wait on the suite's OWN process handle: no pattern match, no pid reuse;
      +    # a timeout is a definite, loud result — never silence
      +    try:
      +        proc.wait(timeout=timeout)
      +    except subprocess.TimeoutExpired as exc:
      +        raise TimeoutError(f"suite still running after {timeout}s") from exc
      +    return proc.returncode
  - id: R-failopen-pgrep-self-match-waiter
    corpus: dso
    expect: finding
    mode: failopen-pgrep-waiter
    note: >-
      Instance 9 pre-fix: a pgrep -f "review-plan <alias>" waiter matches its own process,
      making a FINISHED operation look like a live hang.
    diff: |
      --- a/scripts/wait_review.sh
      +++ b/scripts/wait_review.sh
      @@ -1,2 +1,6 @@
      +# usage: bash wait_review.sh "review-plan my-alias"
      +# pgrep -f "$1" also matches THIS shell, whose command line contains the
      +# pattern — a finished review still reports "running" until timeout
      +while pgrep -f "$1" >/dev/null; do sleep 5; done
      +echo "review finished"
  - id: FP-failopen-waiter-excludes-self
    corpus: dso
    expect: pass
    mode: failopen-pgrep-waiter-fixed
    note: >-
      Instance 9 post-fix: the waiter launches the review as its OWN child and waits on the shell's job handle — no pattern match, no pidfile, no PID reuse; a failed review fails the waiter. Must NOT fire.
    diff: |
      --- a/scripts/wait_review.sh
      +++ b/scripts/wait_review.sh
      @@ -1,2 +1,7 @@
      +#!/usr/bin/env bash
      +set -euo pipefail
      +# run the review as OUR OWN child and wait on the shell's job handle:
      +# no pattern match, no pidfile, no PID reuse
      +rebar review-plan "$1" &
      +wait $!
      +echo "review finished"

# Frozen human-gold subset (kappa alignment for a future llm-judge). SEED labels.
gold_set:
  - input: "A deleted function still called by a surviving caller (dangling deletion)."
    label: useful
  - input: "A required-arg signature change with a call site left unupdated."
    label: useful
  - input: "A sourced-bash function flagged as 'undefined' though `source` defines it (FP)."
    label: not_useful
  - input: "An import reorder + quote-style change flagged as a finding though the linter owns it."
    label: not_useful
