# Standing eval spec for the code-review TEST-SUFFICIENCY overlay (Pass-1) — story f93a.
# Recall (seeded test-defect) + no-fire families, seeded from the DSO code-review incidents.
# The tests overlay reviews the change along the test-sufficiency dimension and emits kernel
# evidence findings; it is scored on FINDINGS presence, not a FAIL/BLOCK verdict.
# Validate offline: `rebar prompt eval code-review-tests`.
prompt: code-review-tests
model: anthropic:claude-opus-4-8
epochs: 3
gate: at_least(2)
coverage_threshold: 0.8

scorers:
  - type: deterministic
    name: code_review_emits_valid_findings
    description: The overlay output is a dict carrying a `findings` list (native Pass-1 shape).
  - type: deterministic
    name: code_review_recall
    description: A diff with an insufficient / tautological test produces a finding.
  - type: deterministic
    name: code_review_no_fire
    description: A diff with a valid observable-postcondition test produces no finding.

dataset:
  # ── recall: seeded test defects (bad diff → finding) ─────────────────────────
  - id: R-tautological-test
    corpus: dso
    expect: finding
    mode: tautological-test
    diff: |
      --- a/tests/test_reducer.py
      +++ b/tests/test_reducer.py
      @@ -1,3 +1,6 @@
      +def test_apply_event(monkeypatch):
      +    m = Mock(return_value=42)
      +    # asserts the mock's OWN configured return — proves nothing about the code
      +    assert m() == 42
  - id: R-missing-regression-test
    corpus: dso
    expect: finding
    mode: bugfix-without-regression-test
    diff: |
      --- a/rebar/claim.py
      +++ b/rebar/claim.py
      @@ -8,3 +8,4 @@ def claim(tid, assignee):
           if held_by_other(tid):
      -        return 0            # BUG: swallowed a concurrency conflict
      +        raise ConcurrencyError(tid)   # fix — but NO test added exercising this path
  # ── no-fire: GOOD test diffs the tests overlay must NOT flag ─────────────────
  - id: FP-valid-observable-test
    corpus: dso
    expect: pass
    mode: observable-postcondition-test
    diff: |
      --- a/tests/test_claim.py
      +++ b/tests/test_claim.py
      @@ -1,3 +1,7 @@
      +def test_claim_conflict_raises(store):
      +    store.claim("t1", "a")
      +    with pytest.raises(ConcurrencyError):
      +        store.claim("t1", "b")   # asserts a REAL observable postcondition
  - id: FP-nit-only-style
    corpus: dso
    expect: pass
    mode: nit-only-style
    note: >
      NIT-FRAMING experiment (story f93a) — a test-file diff whose ONLY changes are
      style/format/import nits the linter enforces. The tests overlay must NOT fire (nits are
      linter-owned). Committed as the baseline the overlay is held to.
    diff: |
      --- a/tests/test_util.py
      +++ b/tests/test_util.py
      @@ -1,4 +1,4 @@
      -import pytest,os
      +import os
      +
      +import pytest
      @@ -9,2 +9,2 @@ def test_slug():
      -    assert to_slug('A B')=='a b'
      +    assert to_slug("A B") == "a b"
  - id: FP-rule5-structural-grep
    corpus: dso
    expect: pass
    mode: rule5-structural-grep
    note: >
      Rule-5 structural-artifact exception (story f93a) — a test that greps SOURCE to assert a
      STRUCTURAL invariant (here: every reviewer prompt declares canonical front-matter). Grepping
      source IS the correct tool for a structural-artifact assertion, so the tests overlay must NOT
      flag it as the source-grepping antipattern (which applies to grepping for BEHAVIOR).
    diff: |
      --- a/tests/unit/test_prompt_frontmatter.py
      +++ b/tests/unit/test_prompt_frontmatter.py
      @@ -1,3 +1,9 @@
      +def test_all_reviewer_prompts_declare_category(reviewers_dir):
      +    # structural invariant over source text — Rule-5 exception, not a behavior grep
      +    for md in reviewers_dir.glob("code-review-*.md"):
      +        front = md.read_text().split("---", 2)[1]
      +        assert "category: code-review-pass" in front, md.name
  # ── recall: additional seeded antipatterns (story 0f8f) ──────────────────────
  - id: R-change-detector-internal-state
    corpus: dso
    expect: finding
    mode: change-detector
    diff: |
      --- a/tests/test_formatter.py
      +++ b/tests/test_formatter.py
      @@ -1,3 +1,6 @@
      +def test_indent_tracking():
      +    f = Formatter("  x")
      +    f.format()
      +    # asserts INTERNAL state — breaks on any refactor of how indent is tracked
      +    assert f._indent_level == 2
  - id: R-over-mocking-internal-helper
    corpus: dso
    expect: finding
    mode: over-mocking
    diff: |
      --- a/tests/test_parser.py
      +++ b/tests/test_parser.py
      @@ -1,3 +1,7 @@
      +def test_parse(monkeypatch):
      +    # mocks a helper INTERNAL to the unit under test — asserts structure, not behavior
      +    monkeypatch.setattr("parser._tokenize", lambda s: ["fake"])
      +    assert parse("x") is not None
  - id: R-source-grepping
    corpus: dso
    expect: finding
    mode: source-grepping
    diff: |
      --- a/tests/test_claim.py
      +++ b/tests/test_claim.py
      @@ -1,3 +1,6 @@
      +def test_claim_raises_on_conflict():
      +    # greps the SOURCE UNDER TEST for a line — tests text, not behavior
      +    src = pathlib.Path("rebar/claim.py").read_text()
      +    assert "raise ConcurrencyError" in src
  - id: R-existence-only
    corpus: dso
    expect: finding
    mode: existence-only
    diff: |
      --- a/tests/test_skill.sh
      +++ b/tests/test_skill.sh
      @@ -1,2 +1,4 @@
      +test_skill_file_present() {
      +  # existence-only: a standalone -f check with no structural contract — a change-detector
      +  test -f "skills/sprint/SKILL.md"
      +}
  # ── no-fire: valid patterns the FP-guards must protect (story 0f8f) ──────────
  - id: FP-four-criterion-philosophy
    corpus: dso
    expect: pass
    mode: four-criterion-philosophy-disagreement
    note: >
      Four-Criterion Test — the assertion targets an OBSERVABLE output (the argument the bridge
      passes to its dependency), exercises real code, survives refactoring, and has no isolation
      issue. No defect criterion holds, so it is a philosophy disagreement, NOT a defect — the
      overlay must NOT flag it as implementation-coupled / change-detector.
    diff: |
      --- a/tests/test_bridge.py
      +++ b/tests/test_bridge.py
      @@ -1,3 +1,7 @@
      +def test_bridge_passes_parent(fake_jira):
      +    bridge.sync(ticket, parent="DSO-9999")
      +    # asserts the observable arg passed to the external dep — an output contract
      +    assert fake_jira.create.call_args.kwargs["parent"] == "DSO-9999"
  - id: FP-table-driven-exact-value
    corpus: dso
    expect: pass
    mode: table-driven-pure-function
    note: >
      Table-driven / classifier test — exact-value assertions on a PURE function's output that
      "look tautological" are valid (VALID-patterns-not-to-flag). The overlay must NOT call it
      tautological or a change-detector.
    diff: |
      --- a/tests/test_slug.py
      +++ b/tests/test_slug.py
      @@ -1,3 +1,8 @@
      +@pytest.mark.parametrize("raw,expected", [("A B", "a-b"), ("X_Y", "x-y")])
      +def test_to_slug(raw, expected):
      +    # exact-value assertion on a pure function's observable output — valid
      +    assert to_slug(raw) == expected
  - id: FP-boundary-mock
    corpus: dso
    expect: pass
    mode: external-boundary-mock
    note: >
      Mocks at the EXTERNAL boundary (an HTTP client) to isolate the unit — correct per Rule 3.
      The overlay must NOT flag it as "tests the mock, not the logic".
    diff: |
      --- a/tests/test_fetch.py
      +++ b/tests/test_fetch.py
      @@ -1,3 +1,8 @@
      +def test_fetch_retries(monkeypatch):
      +    # mock the EXTERNAL http boundary, then assert observable retry behavior
      +    client = Mock(side_effect=[Timeout(), Response(200)])
      +    monkeypatch.setattr(fetch, "_http", client)
      +    assert fetch("/x").status == 200 and client.call_count == 2

  # ── non-gating / fault-realism antipatterns (task e8d3) ──────────────────────
  - id: R-non-gating-skip
    corpus: dso
    expect: finding
    mode: non-gating-test
    note: >-
      Unconditional suppression — a bare skip on a new test. Flaggable from the diff
      alone (no CI context needed); the test never runs where it gates.
    diff: |
      --- a/tests/test_compact.py
      +++ b/tests/test_compact.py
      @@ -1,3 +1,7 @@
      +@pytest.mark.skip(reason="flaky")
      +def test_compact_retires_sources():
      +    result = compact(store, "t1")
      +    assert result.retired == 3
  - id: R-sleep-only-race
    corpus: dso
    expect: finding
    mode: unrealistic-fault-injection
    note: >-
      Concurrency test whose only synchronization is a timing sleep — the race window
      is timing-dependent, so the test is flaky by construction.
    diff: |
      --- a/tests/test_lock.py
      +++ b/tests/test_lock.py
      @@ -1,3 +1,9 @@
      +def test_concurrent_claims_conflict():
      +    t = threading.Thread(target=lambda: store.claim("t1", "a"))
      +    t.start()
      +    time.sleep(0.5)  # hope the thread got there first
      +    with pytest.raises(ConcurrencyError):
      +        store.claim("t1", "b")
  - id: R-fault-wrong-seam
    corpus: dso
    expect: finding
    mode: unrealistic-fault-injection
    note: >-
      Rollback contract "tested" by making the top-level command raise before any rename
      runs — the rollback loop never executes, so the test proves nothing about recovery.
    diff: |
      --- a/tests/test_compact_rollback.py
      +++ b/tests/test_compact_rollback.py
      @@ -1,3 +1,8 @@
      +def test_compact_rolls_back_on_failure(monkeypatch):
      +    monkeypatch.setattr(compactor, "run", _raise_oserror)
      +    with pytest.raises(OSError):
      +        compact(store, "t1")
      +    # asserts only the exception; rollback loop never ran
  # ── no-fire: suppression/fault-injection guards (task e8d3) ──────────────────
  - id: FP-strict-xfail-with-reason
    corpus: dso
    expect: pass
    mode: strict-xfail-valid
    note: >-
      Strict xfail with a reason naming a concrete removal condition — a documented,
      self-expiring expectation, NOT a silent suppression. The overlay must NOT flag it.
    diff: |
      --- a/tests/test_bridge_probe.py
      +++ b/tests/test_bridge_probe.py
      @@ -1,3 +1,7 @@
      +@pytest.mark.xfail(strict=True, reason="remove when JIRA-412 label API ships")
      +def test_probe_reports_label_capability():
      +    caps = bridge_probe(fake_jira)
      +    assert caps.labels is True
  - id: FP-sleep-as-secondary
    corpus: dso
    expect: pass
    mode: sleep-secondary-valid
    note: >-
      Race test synchronized by a deterministic marker file; the short sleep is only a
      settling wait after the primary mechanism fires. The overlay must NOT flag it.
    diff: |
      --- a/tests/test_push_race.py
      +++ b/tests/test_push_race.py
      @@ -1,3 +1,10 @@
      +def test_detached_push_survives_parent_exit(tmp_path):
      +    marker = tmp_path / "child-entered-push"
      +    child = spawn_pusher(marker)
      +    wait_for_file(marker, timeout=10)  # deterministic barrier
      +    parent_exit()
      +    time.sleep(0.1)  # settle fs buffers after the barrier fired
      +    assert commit_reachable(remote, sha)
  # ── recall + guard: contract-contradicting assertion (ticket 7f9f) ───────────
  - id: R-contract-contradicting-assertion
    corpus: dso
    expect: finding
    mode: contract-contradicting-assertion
    note: >-
      The SAME diff's docstring declares an empty assignee allowed ("assignee may be
      omitted"), yet the added test asserts claim() REJECTS an empty assignee — the test
      forbids a state the contract allows. Both halves are in the diff; the overlay must fire.
    diff: |
      --- a/rebar/claim.py
      +++ b/rebar/claim.py
      @@ -1,4 +1,6 @@
       def claim(tid, assignee=None):
      -    """Claim a ticket."""
      +    """Claim a ticket. assignee may be omitted — an empty assignee is allowed and
      +    falls back to ticket.default_assignee."""
           return _store.claim(tid, assignee)
      --- a/tests/test_claim.py
      +++ b/tests/test_claim.py
      @@ -1,3 +1,6 @@
      +def test_claim_rejects_empty_assignee(store):
      +    # contract ALLOWS an omitted assignee, but this forbids it — contradicts the contract
      +    with pytest.raises(ValueError):
      +        claim("t1", "")
  - id: FP-deliberate-tightening
    corpus: dso
    expect: pass
    mode: deliberate-tightening
    note: >-
      The diff STATES it is intentionally narrowing the contract (empty assignee is no longer
      allowed), and the test asserts the new, tightened behavior. A stated deliberate tightening
      is NOT a contract-contradicting assertion — the overlay must NOT fire.
    diff: |
      --- a/rebar/claim.py
      +++ b/rebar/claim.py
      @@ -1,4 +1,6 @@
       def claim(tid, assignee):
      -    """Claim a ticket. assignee may be omitted."""
      +    """Claim a ticket. assignee is now REQUIRED — deliberately tightened: an empty
      +    assignee is rejected (was previously allowed)."""
      +    if not assignee:
      +        raise ValueError("assignee is required")
           return _store.claim(tid, assignee)
      --- a/tests/test_claim.py
      +++ b/tests/test_claim.py
      @@ -1,3 +1,6 @@
      +def test_claim_requires_assignee(store):
      +    # asserts the deliberately tightened contract — a valid narrowing, not a contradiction
      +    with pytest.raises(ValueError):
      +        claim("t1", "")
  # ── fail-open oracle calibration corpus (story 3fce-cccf-d38b-4072) ──────────
  # The four test-oracle instances from the nine-instance fail-open session
  # (2026-08-20/21), each as its recorded PRE-FIX state (must fire) paired with
  # its POST-FIX state (must stay silent). The pre-fix diffs are MINIMAL — the
  # fail-open defect is the only defect seeded — so a finding is attributable.
  - id: R-failopen-absence-from-child-output
    corpus: dso
    expect: finding
    mode: failopen-absence-oracle
    note: >-
      Instance 1 (sound-bumpkinly-thrush pre-fix): asserts a string is ABSENT from a child
      process's output with NO liveness check on the producer. A signal-killed child writes
      nothing, so the string is trivially absent and a run that never executed reports GREEN.
    diff: |
      --- a/tests/test_worker_output.py
      +++ b/tests/test_worker_output.py
      @@ -1,3 +1,7 @@
      +def test_worker_emits_no_deprecation_warning():
      +    proc = subprocess.run([sys.executable, "-m", "rebar.worker"],
      +                          capture_output=True, text=True)
      +    # absence-only oracle: a signal-killed child writes NOTHING, so this
      +    # passes identically when the worker never ran at all
      +    assert "DeprecationWarning" not in proc.stderr
  - id: FP-failopen-absence-with-liveness-anchor
    corpus: dso
    expect: pass
    mode: failopen-absence-oracle-fixed
    note: >-
      Instance 1 post-fix: the SAME absence assertion anchored by producer liveness — the
      returncode is checked and a PRESENCE from the same capture is asserted first. The
      fixed form must NOT be flagged (it is exactly the remediation).
    diff: |
      --- a/tests/test_worker_output.py
      +++ b/tests/test_worker_output.py
      @@ -1,3 +1,9 @@
      +def test_worker_emits_no_deprecation_warning():
      +    proc = subprocess.run([sys.executable, "-m", "rebar.worker"],
      +                          capture_output=True, text=True)
      +    # producer liveness first: the worker RAN and produced its banner
      +    assert proc.returncode == 0
      +    assert "worker started" in proc.stdout
      +    assert "DeprecationWarning" not in proc.stderr
  - id: R-failopen-rederived-convergence
    corpus: dso
    expect: finding
    mode: failopen-rederived-oracle
    note: >-
      Instance 2 (abusive-pebbly-sakimonkey pre-fix): the "convergence" test RE-DERIVES the
      send path's dedup key with copied logic instead of DRIVING the send path, so it stays
      green while live convergence is broken (paid for in 836 duplicate Jira comments).
    diff: |
      --- a/tests/test_comment_dedup.py
      +++ b/tests/test_comment_dedup.py
      @@ -1,3 +1,7 @@
      +def test_comment_dedup_converges():
      +    body = "sync note"
      +    # re-derives the key with the same formula copied from the send path —
      +    # never drives the real send, so a broken live path keeps this green
      +    expected = hashlib.sha1(("marker:" + body).encode()).hexdigest()
      +    assert dedup_key(body) == expected
  - id: FP-failopen-drives-real-send-path
    corpus: dso
    expect: pass
    mode: failopen-rederived-oracle-fixed
    note: >-
      Instance 2 post-fix: the convergence test DRIVES the real send path twice and asserts
      the observable outcome (the duplicate was suppressed at the boundary). Must NOT fire.
    diff: |
      --- a/tests/test_comment_dedup.py
      +++ b/tests/test_comment_dedup.py
      @@ -1,3 +1,7 @@
      +def test_comment_dedup_converges(fake_jira):
      +    send_comment(fake_jira, "sync note")
      +    send_comment(fake_jira, "sync note")
      +    # drives the REAL send path twice; asserts the observable convergence
      +    assert fake_jira.comment_count == 1
  - id: R-failopen-colorized-grep-oracle
    corpus: dso
    expect: finding
    mode: failopen-grep-oracle
    note: >-
      Instance 3 pre-fix: the kill-matrix harness greps "^FAILED" against COLORIZED pytest
      output. ANSI prefixes mean it never matches, so it reports "0 failed" whether or not
      anything failed — all five seeded mutations reported SURVIVING.
    diff: |
      --- a/tests/harness/run_kill_matrix.sh
      +++ b/tests/harness/run_kill_matrix.sh
      @@ -1,2 +1,6 @@
      +pytest tests/ > out.log 2>&1
      +# grep-over-output oracle: colorized pytest lines start with ANSI escapes, so
      +# "^FAILED" never matches and this counts 0 regardless of the real outcome
      +failures=$(grep -c "^FAILED" out.log || true)
      +echo "surviving mutations: $failures"
  - id: FP-failopen-grep-with-liveness-sentinel
    corpus: dso
    expect: pass
    mode: failopen-grep-oracle-fixed
    note: >-
      Instance 3 post-fix: liveness sentinel established before the grep — at least one test
      actually EXECUTED (a zero-collection run fails loudly too), `-rf` and `--color=no` make
      the `^FAILED` summary lines actually matchable, and the result GATES the exit status.
      Must NOT fire.
    diff: |
      --- a/tests/harness/run_kill_matrix.sh
      +++ b/tests/harness/run_kill_matrix.sh
      @@ -1,2 +1,9 @@
      +set -euo pipefail
      +pytest -rfE --color=no tests/ > out.log 2>&1 || true
      +# producer liveness FIRST: at least one test actually ran (zero-collection fails too)
      +grep -qE "[1-9][0-9]* (passed|failed|error)" out.log || { echo "pytest ran no tests" >&2; exit 2; }
      +failures=$(grep -cE "^(FAILED|ERROR)" out.log || true)
      +echo "surviving mutations: $failures"
      +[ "$failures" -eq 0 ] || exit 1
  - id: R-failopen-truncated-log-grep
    corpus: dso
    expect: finding
    mode: failopen-truncated-log
    note: >-
      Instance 4 pre-fix: a sweep launched in a manual background subshell died at ~5%; a
      truncated log and a clean log produce the SAME empty grep, so "sweep finished" and
      "sweep was killed" are indistinguishable.
    diff: |
      --- a/tests/harness/check_sweep.sh
      +++ b/tests/harness/check_sweep.sh
      @@ -1,2 +1,5 @@
      +nohup ./run_sweep.sh > sweep.log 2>&1 &
      +# an orphaned/killed sweep leaves a truncated log; the empty grep below reads
      +# identically for "no failures" and "sweep never finished"
      +if ! grep -q "FAIL" sweep.log; then echo "sweep passed"; fi
  - id: FP-failopen-completion-sentinel-first
    corpus: dso
    expect: pass
    mode: failopen-truncated-log-fixed
    note: >-
      Instance 4 post-fix: completion sentinel asserted before the absence grep, and a FAIL line now fails the check loudly. Must NOT fire.
    diff: |
      --- a/tests/harness/check_sweep.sh
      +++ b/tests/harness/check_sweep.sh
      @@ -1,2 +1,7 @@
      +set -euo pipefail
      +./run_sweep.sh > sweep.log 2>&1
      +# liveness sentinel first: the sweep RAN to completion
      +grep -q "SWEEP COMPLETE" sweep.log || { echo "sweep did not finish" >&2; exit 2; }
      +if grep -q "FAIL" sweep.log; then echo "sweep FAILED" >&2; exit 1; fi
      +echo "sweep passed"

gold_set:
  - input: "A test that asserts a mock's own configured return value (tautological)."
    label: useful
  - input: "A bug fix that changes control flow with no regression test added."
    label: useful
  - input: "A test asserting a real observable postcondition (raises on conflict)."
    label: not_useful
  - input: "A test-file diff that only reorders imports and normalizes quotes (linter-owned)."
    label: not_useful
  - input: "A test forbidding an empty assignee while the same diff's docstring allows it."
    label: useful
  - input: "A test asserting a deliberately-tightened contract the same diff states it narrows."
    label: not_useful
