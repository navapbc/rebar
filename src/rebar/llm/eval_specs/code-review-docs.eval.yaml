# Standing eval specification for the code-review documentation overlay.
# Repository fixtures provide the second source required by the evidence contract.
prompt: code-review-docs
model: anthropic:claude-opus-4-8
epochs: 3
gate: at_least(2)
coverage_threshold: 0.8

scorers:
  - type: deterministic
    name: code_review_emits_valid_findings
    description: The overlay output contains a findings list.
  - type: deterministic
    name: code_review_recall
    description: A proven documentation omission or role violation produces a finding.
  - type: deterministic
    name: code_review_no_fire
    description: A change outside the evidence boundary produces no finding.

dataset:
  - id: R-generated-cli-reference-omission
    corpus: documentation-policy
    expect: finding
    mode: generated-owner-omission
    note: >
      The change adds a client option. The generated artifact catalog identifies the CLI
      reference as its maintained projection and names the regeneration path. A bounded
      inspection shows that the generated reference lacks the option.
    diff: |
      --- a/src/rebar/_cli/report.py
      +++ b/src/rebar/_cli/report.py
      @@ -10,3 +10,8 @@ def configure(parser):
       parser.add_argument("ticket")
      +parser.add_argument(
      +    "--format",
      +    choices=("text", "json"),
      +    default="text",
      +    help="Select the report output format.",
      +)
      --- a/README.md
      +++ b/README.md
      @@ -20,2 +20,3 @@ Generate a report
       `rebar report TICKET`
      +Use `rebar report TICKET --format json` for JSON output.
    files:
      src/rebar/_cli/report.py: |
        def configure(parser):
            parser.add_argument("ticket")
            parser.add_argument(
                "--format",
                choices=("text", "json"),
                default="text",
                help="Select the report output format.",
            )
      README.md: |
        # Rebar

        ## Generate a report

        `rebar report TICKET`

        Use `rebar report TICKET --format json` for JSON output.
      docs/documentation-policy.md: |
        # Documentation policy

        External documentation teaches clients how to use supported behavior.

        Generated artifacts are corrected through their declared source and regeneration path.
      docs/generated-artifacts.md: |
        # Generated artifacts

        | File | Derived from | Regenerate with |
        |---|---|---|
        | `docs/cli-reference.md` | `src/rebar/_cli/report.py` command definitions | `python scripts/gen_cli_reference.py` |
      docs/cli-reference.md: |
        <!-- Generated by scripts/gen_cli_reference.py. Do not edit directly. -->
        # CLI reference

        ## report

        `rebar report TICKET`

        Generate a ticket report in text format.

  - id: R-external-guide-role-violation
    corpus: documentation-policy
    expect: finding
    mode: external-role-violation
    note: >
      The changed client guide adds contributor implementation procedure. The documentation
      index and policy establish the page audience and exclude that material from this role.
    diff: |
      --- a/docs/user-guide.md
      +++ b/docs/user-guide.md
      @@ -12,2 +12,6 @@ Create a report
       Run `rebar report TICKET`.
      +
      +To change report output, edit `src/rebar/_cli/report.py`, update its parser factory,
      +run `make lint`, and inspect the internal route registry before committing.
    files:
      docs/README.md: |
        # Documentation

        The [user guide](user-guide.md) provides client instructions for supported rebar workflows.
      docs/documentation-policy.md: |
        # Documentation policy

        External documentation teaches clients how to use supported rebar behavior. It excludes implementation history and contributor procedure.

        Internal documentation explains current development processes, architecture, and code to contributors, operators, and agents.
      docs/user-guide.md: |
        # User guide

        ## Create a report

        Run `rebar report TICKET`.

        To change report output, edit `src/rebar/_cli/report.py`, update its parser factory, run `make lint`, and inspect the internal route registry before committing.

  - id: FP-internal-doc-for-private-refactor
    corpus: documentation-policy
    expect: pass
    mode: internal-only-change
    note: >
      A private helper rename changes no client contract. The architecture page accurately
      describes the renamed internal seam in the role that owns codebase structure.
    diff: |
      --- a/src/rebar/store/projection.py
      +++ b/src/rebar/store/projection.py
      @@ -8,3 +8,3 @@
      -def _fold_event(state, event):
      +def _apply_event(state, event):
           return event.apply(state)
      --- a/docs/architecture.md
      +++ b/docs/architecture.md
      @@ -30,2 +30,2 @@ Projection internals
      -The private `_fold_event` helper applies one event to projection state.
      +The private `_apply_event` helper applies one event to projection state.
    files:
      docs/documentation-policy.md: |
        # Documentation policy

        Internal documentation explains current architecture and code to contributors and agents.

        External documentation teaches clients how to use supported behavior.
      docs/architecture.md: |
        # Architecture

        ## Projection internals

        The private `_apply_event` helper applies one event to projection state.
      src/rebar/store/projection.py: |
        def _apply_event(state, event):
            return event.apply(state)

  - id: FP-ambiguous-document-owner
    corpus: documentation-policy
    expect: pass
    mode: ambiguous-owner
    note: >
      The README documents the option accurately. Two other pages could contain more detail,
      but the repository assigns neither page ownership of per-command output options.
    diff: |
      --- a/src/rebar/_cli/list.py
      +++ b/src/rebar/_cli/list.py
      @@ -4,2 +4,3 @@ def configure(parser):
       parser.add_argument("--status")
      +parser.add_argument("--compact", action="store_true", help="Use one line per ticket.")
      --- a/README.md
      +++ b/README.md
      @@ -18,2 +18,3 @@ List tickets
       `rebar list --status open`
      +Add `--compact` to print one line per ticket.
    files:
      README.md: |
        # Rebar

        ## List tickets

        `rebar list --status open`

        Add `--compact` to print one line per ticket.
      docs/README.md: |
        # Documentation

        [Commands](commands.md) contains selected command examples.

        [Output formats](output-formats.md) explains machine-readable formats.
      docs/commands.md: |
        # Commands

        Use `rebar show TICKET` to inspect one ticket.
      docs/output-formats.md: |
        # Output formats

        JSON output is available through commands that declare `--output json`.
      docs/documentation-policy.md: |
        # Documentation policy

        External documentation teaches clients how to use supported behavior.

  - id: FP-protected-cli-capture
    corpus: documentation-policy
    expect: pass
    mode: protected-evidence
    note: >
      The changed file records captured output from an earlier release. Adjacent provenance
      and the policy classify it as protected evidence, so current command behavior does not
      authorize rewriting the capture.
    diff: |
      --- /dev/null
      +++ b/docs/evidence/report-2024.md
      @@ -0,0 +1,5 @@
      +# Report command capture
      +
      +Captured on 2024-06-18 from rebar 0.4.0.
      +
      +Usage includes `rebar report --legacy`.
    files:
      docs/documentation-policy.md: |
        # Documentation policy

        Protected evidence preserves captured material and provenance. Add corrections beside the evidence without altering the capture.
      docs/evidence/report-2024.md: |
        # Report command capture

        Captured on 2024-06-18 from rebar 0.4.0.

        Usage includes `rebar report --legacy`.
      docs/evidence/report-2024.provenance.md: |
        # Provenance

        `report-2024.md` is an immutable command-output capture from rebar 0.4.0.
      src/rebar/_cli/report.py: |
        def configure(parser):
            parser.add_argument("ticket")

  - id: FP-unrelated-stale-client-page
    corpus: documentation-policy
    expect: pass
    mode: unrelated-unchanged-doc
    note: >
      The change updates a cache implementation and its internal documentation. An unchanged
      client page has a separate stale statement. That defect is unrelated to the change.
    diff: |
      --- a/src/rebar/cache.py
      +++ b/src/rebar/cache.py
      @@ -2,3 +2,3 @@
      -CACHE_BUCKETS = 16
      +CACHE_BUCKETS = 32
      --- a/docs/cache-internals.md
      +++ b/docs/cache-internals.md
      @@ -8,2 +8,2 @@ Cache layout
      -The cache partitions keys across 16 buckets.
      +The cache partitions keys across 32 buckets.
    files:
      docs/documentation-policy.md: |
        # Documentation policy

        Internal documentation explains current architecture and code. External documentation teaches clients how to use supported behavior.
      docs/cache-internals.md: |
        # Cache internals

        The cache partitions keys across 32 buckets.
      docs/user-guide.md: |
        # User guide

        Reports use XML output unless an option selects another format.
      src/rebar/cache.py: |
        CACHE_BUCKETS = 32
      src/rebar/_cli/report.py: |
        DEFAULT_FORMAT = "json"

  - id: FP-public-change-without-proven-owner
    corpus: documentation-policy
    expect: pass
    mode: no-owned-location
    note: >
      The change adds a public option and documents the internal encoder seam. The fixture
      contains no index, catalog, help source, or maintained client page that owns export
      options. Search absence alone cannot establish a correction location.
    diff: |
      --- a/src/rebar/_cli/export.py
      +++ b/src/rebar/_cli/export.py
      @@ -5,2 +5,3 @@ def configure(parser):
       parser.add_argument("ticket")
      +parser.add_argument("--csv", action="store_true", help="Write CSV output.")
      --- a/docs/architecture.md
      +++ b/docs/architecture.md
      @@ -40,2 +40,3 @@ Export boundary
       The export adapter owns serialization.
      +Its CSV encoder is selected by the CLI route before adapter dispatch.
    files:
      docs/documentation-policy.md: |
        # Documentation policy

        Internal documentation explains current architecture and code. External documentation teaches clients how to use supported behavior.
      docs/architecture.md: |
        # Architecture

        ## Export boundary

        The export adapter owns serialization.

        Its CSV encoder is selected by the CLI route before adapter dispatch.
      src/rebar/_cli/export.py: |
        def configure(parser):
            parser.add_argument("ticket")
            parser.add_argument("--csv", action="store_true", help="Write CSV output.")

gold_set:
  - input: "A changed client option is absent from a generated reference whose catalog entry proves ownership and regeneration."
    label: useful
  - input: "A changed client guide contains contributor implementation procedure that its declared role excludes."
    label: useful
  - input: "A private helper rename needs a new client guide section even though no client contract changed."
    label: not_useful
  - input: "A captured command transcript must be rewritten because the current command no longer supports its recorded option."
    label: not_useful
  - input: "An unrelated stale claim in unchanged documentation should be reported during this change."
    label: not_useful
  - input: "A repository-wide search with no declared owner proves which client page must receive an update."
    label: not_useful
