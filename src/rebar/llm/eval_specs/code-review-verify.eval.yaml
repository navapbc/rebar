# Standing eval spec for the code-review Pass-2 VERIFIER — story f93a.
# The verifier re-grounds each Pass-1 finding against the diff and emits coarse severity
# attributes + a typed binary sub-answer set — one `verifications` entry per finding. Per the
# T8-advisory contract it is scored on PRESENCE of verifications, NOT a FAIL/BLOCK verdict.
# The dataset carries both a should-fire (real-defect) and a good (clean) diff so it stays
# balanced; either way the verifier must emit a graded answer set. Validate offline:
# `rebar prompt eval code-review-verify`.
prompt: code-review-verify
model: anthropic:claude-opus-4-8
epochs: 3
gate: at_least(2)
coverage_threshold: 0.8

scorers:
  - type: deterministic
    name: code_review_verify_emits_verifications
    description: >
      The verifier emits a non-empty `verifications` list (one per finding it re-grounds) —
      the T8-advisory presence contract, scored independently of any FAIL/BLOCK polarity.

dataset:
  # `expect` keeps the dataset balanced (finding = a real-defect diff, pass = a clean diff);
  # the gating scorer is presence-based, so the verifier must emit verifications for both.
  - id: V-real-defect
    corpus: dso
    expect: finding
    mode: verify-real-defect
    diff: |
      --- a/rebar/reducer.py
      +++ b/rebar/reducer.py
      @@ -3,2 +3,2 @@
      -def apply_event(state, event):
      +def apply_event(state, event, *, clock):
           return _reduce(state, event)
      --- a/rebar/replay.py
      +++ b/rebar/replay.py
      @@ -8 +8 @@ def replay(events):
      -        state = apply_event(state, e)
      +        state = apply_event(state, e)   # missing the new required `clock` arg
  - id: V-clean-rename
    corpus: dso
    expect: pass
    mode: verify-clean-diff
    diff: |
      --- a/rebar/util.py
      +++ b/rebar/util.py
      @@ -1 +1 @@
      -def slugify(s): return s.lower()
      +def to_slug(s): return s.lower()
      --- a/rebar/create.py
      +++ b/rebar/create.py
      @@ -7 +7 @@
      -    alias = slugify(title)
      +    alias = to_slug(title)   # sole caller updated — a benign rename
  # ── forbids_contract_allowed_state emission (ticket 7f9f) ────────────────────
  - id: V-forbids-contract-allowed-state
    corpus: dso
    expect: finding
    mode: verify-forbids-contract-allowed-state
    note: >-
      A contract-contradicting assertion the verifier should re-ground with the NEW
      forbids_contract_allowed_state (serious) binary set — prod_impact re-scoped to the
      guarded path's user-facing reach (medium, not none), not "test-only".
    diff: |
      --- a/rebar/claim.py
      +++ b/rebar/claim.py
      @@ -1,4 +1,5 @@
       def claim(tid, assignee=None):
      -    """Claim a ticket. assignee may be omitted — empty falls back to default_assignee."""
      +    """Claim a ticket. assignee may be omitted — empty falls back to default_assignee."""
           return _store.claim(tid, assignee)
      --- a/tests/test_claim.py
      +++ b/tests/test_claim.py
      @@ -1,3 +1,6 @@
      +def test_claim_rejects_empty_assignee(store):
      +    # contract ALLOWS an omitted assignee; this forbids it — contract-contradicting
      +    with pytest.raises(ValueError):
      +        claim("t1", "")
  - id: V-tightening-no-fire
    corpus: dso
    expect: pass
    mode: verify-deliberate-tightening
    note: >-
      A stated deliberate tightening — the diff narrows the contract on purpose and the test
      asserts the new behavior. forbids_contract_allowed_state must be FALSE; the verifier
      still emits a graded set (presence contract).
    diff: |
      --- a/rebar/claim.py
      +++ b/rebar/claim.py
      @@ -1,4 +1,6 @@
       def claim(tid, assignee):
      -    """Claim a ticket. assignee may be omitted."""
      +    """Claim a ticket. assignee is now REQUIRED — deliberately tightened."""
      +    if not assignee:
      +        raise ValueError("assignee is required")
           return _store.claim(tid, assignee)
      --- a/tests/test_claim.py
      +++ b/tests/test_claim.py
      @@ -1,3 +1,6 @@
      +def test_claim_requires_assignee(store):
      +    # asserts the deliberately tightened contract — a valid narrowing
      +    with pytest.raises(ValueError):
      +        claim("t1", "")

  # ── removed-public-symbol sub-question (ticket 5452-3077-b34a-4157) ──────────
  - id: V-unmanaged-public-removal
    corpus: dso
    expect: finding
    mode: verify-unmanaged-public-removal
    note: >-
      An UNMANAGED removal of a publicly exported symbol — in __all__, no deprecation cycle,
      no major bump, no CHANGELOG breaking-change entry. The verifier should answer the
      removed-public-symbol sub-question keyed on the EXPORT (removed_public_symbol TRUE,
      version_signal_present FALSE) even though no internal caller remains.
    diff: |
      --- a/rebar/llm/__init__.py
      +++ b/rebar/llm/__init__.py
      @@ -1,6 +1,4 @@
      -__all__ = ["review_ticket", "run_gate"]
      +__all__ = ["run_gate"]

      -def review_ticket(tid):
      -    """Public API: run the single-pass review for a ticket."""
      -    return _review(tid)
       def run_gate(tid):
           return _gate(tid)
  - id: V-managed-public-removal-no-fire
    corpus: dso
    expect: pass
    mode: verify-managed-public-removal
    note: >-
      A MANAGED removal — the same public export removed WITH a version/deprecation signal
      (CHANGELOG breaking-change entry + major version bump in the same diff).
      version_signal_present must be TRUE, so neither unversioned_published_contract_break nor
      the removed-public-symbol boost trips; the verifier still emits a graded set.
    diff: |
      --- a/CHANGELOG.md
      +++ b/CHANGELOG.md
      @@ -1,2 +1,5 @@
      +## 2.0.0 — BREAKING CHANGES
      +- `review_ticket` removed after its 1.x deprecation cycle; use `run_gate`.
      +
       ## 1.9.0
      --- a/pyproject.toml
      +++ b/pyproject.toml
      @@ -3 +3 @@
      -version = "1.9.0"
      +version = "2.0.0"
      --- a/rebar/llm/__init__.py
      +++ b/rebar/llm/__init__.py
      @@ -1,6 +1,4 @@
      -__all__ = ["review_ticket", "run_gate"]
      +__all__ = ["run_gate"]

      -def review_ticket(tid):
      -    """DEPRECATED since 1.7: use run_gate (removal scheduled for 2.0)."""
      -    return _review(tid)
       def run_gate(tid):
           return _gate(tid)

gold_set:
  - input: "A verification set that flags the unupdated call site of a required-arg change."
    label: useful
  - input: "A verification set that confirms a benign rename with its caller updated."
    label: useful
  - input: "A verification emitting forbids_contract_allowed_state for a test forbidding an allowed state."
    label: useful
  - input: "A verification finding a stated deliberate tightening does not contradict the contract."
    label: useful
  - input: "A verification keying removed_public_symbol on the export for an unmanaged public removal."
    label: useful
  - input: "A verification recognizing a managed removal (version signal present) as a no-fire."
    label: useful
