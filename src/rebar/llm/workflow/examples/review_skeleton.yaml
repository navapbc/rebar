# yaml-language-server: $schema=https://github.com/navapbc/rebar/schemas/workflow.v3.schema.json
#
# Retained offline visual-editing sample for the v3 four-pass review shape: precompute
# overlays, batch prompt-backed criteria, aggregate verification, then deterministic
# decision. Real gates live under workflow/gates/.
schema_version: "3"
name: review_skeleton
description: Retained 4-pass review sample proving overlay + batch + verify + decide on the v3 engine.

inputs:
  plan:
    type: string
    required: true

steps:
  # 1. Overlay precompute: turn input signals into boolean triggers an `if:`/`when` reads.
  - id: triggers
    uses: overlay_triggers
    with:
      text: ${{ inputs.plan }}
      keyword_triggers:
        security: [secret, password, token, credential]

  # 2. Run prompt-backed Pass-1 criteria in budgeted batches; include `security` only
  #    when its overlay trigger is true.
  - id: finders
    needs: [triggers]
    batch:
      prompt: code-quality
      criteria:
        - prompt: ticket-quality
        - prompt: security
          when: ${{ steps.triggers.outputs.security }}
        - prompt: tests
      usd_budget: 2.0
      # Use model classes: literal `claude-*` ids infer Anthropic and would pin the
      # example to the wrong provider.
      model_ladder: [trivial, standard, frontier]

  # 3. Pass-2 verify: ONE aggregate verifier call over the Pass-1 findings.
  - id: verify
    prompt: completion-verifier
    needs: [finders]
    mode: findings
    with:
      findings: ${{ steps.finders.outputs.findings }}

  # 4. Pass-3 decide: deterministic gate over the verified findings (no tokens).
  - id: decide
    uses: gate
    needs: [verify]
    with:
      findings: ${{ steps.verify.outputs.findings }}
      policy: default
