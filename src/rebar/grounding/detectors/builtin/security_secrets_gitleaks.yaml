# Missing gitleaks abstains here, while secret-detection verdict assembly
# fails closed. The security ID prefix identifies this detector.
id: rebar.builtin.security.secrets-gitleaks
metadata:
  rebar_envelope:
    tier: T1
    job: smell
    namespace: builtin
    dimension: smell_generic
    backend: sarif
