# Generic OpenGrep conflict-marker rule scans every file type. The advisory
# criterion filters matches to changed files by location, not added lines;
# an unavailable engine does not block. Only line-start <<<<<<<, >>>>>>>,
# and diff3 ||||||| delimiters match. Bare ======= is excluded because
# Markdown and comments use it legitimately.
rules:
  - id: rebar.builtin.smell.conflict-markers.git-merge-conflict
    languages: [generic]
    severity: ERROR
    message: >-
      Leftover VCS merge-conflict marker (<<<<<<<, >>>>>>>, or the diff3 base |||||||) in committed
      source. Resolve the conflict and remove the marker before merging.
    metadata:
      rebar_envelope:
        tier: T1
        job: smell
        namespace: builtin
        dimension: smell_generic
    pattern-regex: '(?m)^(<<<<<<<|>>>>>>>|\|\|\|\|\|\|\|)(\s|$)'
