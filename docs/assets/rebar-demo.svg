<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" role="img" aria-label="Terminal session showing one ready ticket, an atomic claim, a close, and the newly unblocked ticket.">
  <rect x="0" y="0" width="760" height="380" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="760" height="32" rx="10" fill="#161b22"/>
  <rect x="0" y="16" width="760" height="16" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <text x="380" y="21" fill="#8b949e" text-anchor="middle" font-size="12">rebar core loop</text>
  <g>
    <text x="20" y="64" fill="#58a6ff">$ <tspan fill="#c9d1d9">rebar ready</tspan></text>
    <text x="20" y="88" fill="#7ee787">4a1c-7d2e-a693-4fb2</text>

    <text x="20" y="136" fill="#58a6ff">$ <tspan fill="#c9d1d9">rebar claim 4a1c-7d2e --quiet</tspan></text>

    <text x="20" y="184" fill="#58a6ff">$ <tspan fill="#c9d1d9">rebar transition 4a1c-7d2e in_progress closed --quiet</tspan></text>

    <text x="20" y="232" fill="#58a6ff">$ <tspan fill="#c9d1d9">rebar ready</tspan></text>
    <text x="20" y="256" fill="#7ee787">b93f-6c81-e245-47aa</text>

    <text x="20" y="304" fill="#58a6ff">$ <tspan fill="#8b949e">▍</tspan></text>
  </g>
</svg>
