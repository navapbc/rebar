- input: "# Cache redundant whole-tree AST parsing across test scanners\n\n## Context\
    \ / Problem\nMany regression-oracle tests independently walk a source tree (tests/\
    \ or src/rebar), read every\n*.py, and ast.parse it. Measured: one full parse\
    \ of tests/ (~1653 files) costs ~2.3s idle\n(~7.6s under load) and src/rebar (~597\
    \ files) ~0.8s; dozens of test files each repeat such a\nwalk. The redundant PARSE\
    \ is ~75-80% of each scan's cost (parse+read vs ast.walk). Under `--cov`\non the\
    \ coverage cell these scanners are the top `--durations` entries (18.7-29.93s\
    \ each). After\nthe macOS cell is reduced (sibling story omphacite-desertlike-coney,\
    \ 3ba8-49d5-fee5-445d), the\nUbuntu coverage cell becomes the gate's long pole,\
    \ so cutting this redundancy directly cuts the\ngate.\n\n## Approach\nAdd a shared,\
    \ process-global memoised parse \u2014 tests/_tree_scan.py exposing\n`parsed_python_files(root)`\
    \ returning parsed modules, cached via functools.cache with the root\n`.resolve()`d\
    \ so different spellings share one cache entry. Migrate the whole-tree AST scanners\n\
    to it so the FIRST scanner per xdist worker parses a given root and every other\
    \ scanner reuses it\nfor free. This is behaviour-preserving: identical file set,\
    \ identical ASTs; only the walk/read/\nparse mechanics are shared. Cross-file\
    \ proof (prototype, already validated): after migrating the\nthree heaviest tests-tree\
    \ scanners the 2nd/3rd scanner dropped 6.64s->2.89s and 5.07s->1.91s with\nidentical\
    \ pass/fail. This fits the goal \u2014 pure redundancy removal, no test weakened.\n\
    \n## Scope\n- tests/_tree_scan.py (NEW) \u2014 the cached `parsed_python_files(root)`\
    \ helper and a `ParsedModule`\n  value (path / relative / source / tree).\n- Whole-tree\
    \ `.py` AST scanners under tests/unit/, tests/unit/store/, tests/unit/commands/,\n\
    \  tests/unit/rebar_reconciler/, and tests/interfaces/contracts/ \u2014 migrate\
    \ each scanner that does\n  `for p in ROOT.rglob(\"*.py\"): ast.parse(p.read_text())`\
    \ to the shared helper, preserving every\n  per-file filter and the exact `relative_to(BASE)`\
    \ base. Non-`.py` globs (`rglob(\"*\")`, `*.sh`,\n  `*.json`) and filename-only\
    \ collections are left unchanged.\n\n## Testing\n- Each migrated file's tests\
    \ pass unchanged (same selection, same assertions) via\n  `pytest <file> -p no:xdist`.\n\
    - The full unit tier passes (the scanners' home tier): `pytest tests/unit -m \"\
    not integration\n  and not external\"`.\n- Aggregate: the migrated scanner set\
    \ shows reduced call-time when run in one process (cache\n  shared) with identical\
    \ pass/fail \u2014 the redundancy-removal proof.\n\n## Acceptance Criteria\n-\
    \ [ ] tests/_tree_scan.py provides `parsed_python_files(root)` returning parsed\
    \ modules, memoised\n      per process (verified by a same-object second-call\
    \ check and by the migrated tests passing).\n- [ ] The whole-tree AST scanners\
    \ in Scope call the shared helper; each migrated file passes\n      `pytest <file>\
    \ -p no:xdist` unchanged.\n- [ ] No behaviour change: `pytest tests/unit -m \"\
    not integration and not external\"` yields the\n      same pass/fail as before\
    \ (verified locally green).\n- [ ] Running the migrated scanner set in a single\
    \ process parses each root once \u2014 a 2nd+\n      same-root scanner is materially\
    \ faster than a cold parse (verified by a timed probe).\n- [ ] ruff check + ruff\
    \ format are clean on all changed files and the complexity baseline check\n  \
    \    passes."
