  input: "## Context / Problem\n\nEvery change to the plan-review gate \u2014 a Pass-1\
    \ criterion prompt, a Pass-2 impact/validity question, a Pass-3 formula or threshold\
    \ \u2014 lands on a handful of live dogfood reviews. No standing instrument answers\
    \ \"did this change make the gate better or worse?\" before it ships; the prior\
    \ calibration epic (`pastoral-aquatic-viper`, 6982) rejected live A/B batches\
    \ on cost and parked the human gold set. The work is scattered across six epics\
    \ and several orphan stories (`jira-reb-529`, `jira-reb-1589`, `fort-wisp-wren`,\
    \ `spin-cub-usher`, `ridiculous-expert-mouse`, `auspicious-torrid-curlew`). This\
    \ epic unifies them behind one harness.\n\nThe instrument already mostly exists\
    \ as data. The live rebar store holds ~4,300 `plan_review_result_v2` sidecars\
    \ on ~1,280 tickets (2026-06-27 \u2192 now; ~2,000 older ones pruned from the\
    \ tree but recoverable from `origin/tickets` history) and `~/legacy-modernization-navigator`\
    \ holds 74 more. Each v2 sidecar retains the raw Pass-1 findings (prose + evidence\
    \ + scenarios + criteria), the complete Pass-2 answer vector (graded binaries\
    \ + severity attributes), and the Pass-3 outputs (validity, impact, priority,\
    \ the exact `block_threshold`, decision). The reviewed plan text is not stored\
    \ but is reconstructable from ticket `EDIT`/`SNAPSHOT` history and verifiable\
    \ byte-exactly against the stored `material_fingerprint`. The store also carries\
    \ free outcome labels: 2,483 revise\u2192re-review pairs (finding survival via\
    \ `norm_id`), 208 verdict flips on byte-identical material (the reviewer-noise\
    \ floor), 84 `plan_defect` bug closes, 89 `caused_by` links, 199 plan-PASS\u2192\
    completion-FAIL tickets, 18 reopens.\n\n## Approach\n\nThree eval tiers, ordered\
    \ by cost, each measuring one pass in isolation while holding the others fixed:\n\
    \n- **Tier 0 \u2014 Pass-3 replay (zero LLM).** Re-run `review_kernel.decide.pass3_decide`\
    \ (and the post-verdict floors) over the whole corpus with a candidate formula/threshold/routing\
    \ overlay; diff against stored decisions. Generalises `docs/calibration/plan_v5_rescore.py`\
    \ and `docs/experiments/calibrate_plan_review_thresholds.py`. Runs on every proposal,\
    \ unlimited.\n- **Tier 1 \u2014 Pass-2 replay (Sonnet, ~$0.5/review uncached).**\
    \ Re-run the verifier with candidate questions/prompt on the *stored* Pass-1 findings\
    \ plus reconstructed plan text via the `verify_findings(run_chunk=\u2026)` seam;\
    \ score per-question agreement against stored answers, then feed Tier 0.\n- **Tier\
    \ 2 \u2014 Pass-1 replay (Opus, ~$3.4/review uncached, plus a Tier-1 run on the\
    \ new findings).** Re-run finders with candidate criteria on a fixed stratified\
    \ sample (~20 tickets); compare finding sets by `norm_id`/criterion; single-criterion\
    \ mode (~$0.17/call) for per-criterion edits.\n\nNon-negotiable invariants, enforced\
    \ by the harness rather than by convention:\n\n1. **Hard budget.** A committed\
    \ ledger tracks every eval call priced via `genai-prices`; every run pre-flights\
    \ a cost estimate and refuses to start if projected spend would exceed the remaining\
    \ allocation. Epic-wide cap is **$200** total with a $30 reserve; commissioning\
    \ spend is planned at \u2264$120 (one Tier-1 reproduction run to measure verifier\
    \ noise, one Tier-2 baseline sample). Per-proposal costs are published.\n2. **Model\
    \ parity.** Every LLM re-run uses the exact production model class for that pass\
    \ (frontier Opus for Pass 1, standard Sonnet for Pass 2) through **Bedrock only**,\
    \ on a homogeneous provider chain (the mixed Bedrock+Anthropic fallback silently\
    \ disables prompt caching and roughly doubles cost). The harness records the per-pass\
    \ model id in every result, refuses to diff runs whose per-pass model ids differ,\
    \ and refuses to start when the configured model differs from the corpus baseline's\
    \ `provider_provenance.ran_model`. Substituting a cheaper model to save budget\
    \ is forbidden: it confounds the measurement.\n3. **Offline first.** Tier 0 and\
    \ all label joins are pure functions of the frozen corpus; no proposal may be\
    \ assessed on a live-only signal. Consistent with ADR 0054 (the field corpus is\
    \ the instrument) and with 6982's rejection of live A/B.\n4. **Noise-aware acceptance.**\
    \ A change is reported as regressing/improving only when its label-proxy deltas\
    \ exceed the noise band measured from identical-material flips and the Tier-1\
    \ reproduction run; otherwise \"indistinguishable\".\n\n## Scope\n\nNew package\
    \ `src/rebar/llm/evals/plan_replay/` (corpus, labels, tier runners, ledger, report)\
    \ with a `python -m rebar.llm.evals.plan_replay` entry; frozen corpus manifest\
    \ + ledger + reports under `docs/experiments/plan-review-gate/replay/`; an ADR\
    \ and a contributor guide section; fixes to `usage_log` ticket attribution. No\
    \ CI provider dependency \u2014 everything runs locally.\n\n## Acceptance Criteria\n\
    \n- [ ] A frozen, versioned replay corpus exists covering both stores (tree +\
    \ git-recovered sidecars), with at-review plan text reconstructed and fingerprint-verified\
    \ for \u226595% of v2 sidecars; verified by the corpus manifest's coverage counts.\n\
    - [ ] Outcome labels and a reviewer-noise floor are computed from the corpus with\
    \ no LLM calls and joined to every review/finding; verified by a labels report\
    \ listing counts per label source.\n- [ ] A Pass-3 change (formula, threshold,\
    \ routing overlay) can be assessed over the entire corpus with zero LLM calls,\
    \ producing a diff report (verdict flips, per-criterion deltas, label-proxy precision/recall,\
    \ friction rate); verified by replaying current code against itself with zero\
    \ diffs and replaying a known historical threshold change reproducing its documented\
    \ effect.\n- [ ] A Pass-2 change can be assessed on a stratified sample using\
    \ stored Pass-1 findings, with per-question agreement vs stored answers and downstream\
    \ Tier-0 metrics; verified by a reproduction run (unchanged questions) whose agreement\
    \ establishes the noise floor.\n- [ ] A Pass-1 change can be assessed on a fixed\
    \ stratified sample with finding-set comparison by `norm_id`/criterion and downstream\
    \ Tier-1/Tier-0 metrics; verified by one baseline sample run.\n- [ ] Every LLM\
    \ eval call is priced and written to a committed ledger; a run whose pre-flight\
    \ estimate exceeds remaining allocation is refused; total ledger spend at epic\
    \ close is \u2264 $200; verified by the ledger file and a test of the refusal\
    \ path.\n- [ ] Every eval result records the per-pass model id; the harness refuses\
    \ to diff results with differing model ids and refuses to run a pass on a model\
    \ other than its production class via Bedrock; verified by unit tests and by the\
    \ ledger showing only Bedrock Opus/Sonnet ids.\n- [ ] Prompt caching is confirmed\
    \ active for eval runs (cache_read_tokens > 0 on the second call of a run); verified\
    \ from the usage log.\n- [ ] A contributor-facing protocol (ADR + docs) states\
    \ which tier a proposal needs, the required report artifact, and the noise-band\
    \ acceptance rule; verified by the docs landing and being referenced from `docs/plan-review-gate.md`.\n\
    \n## Child decomposition\n\nCorpus builder (criterion 1) \u2192 outcome labels\
    \ + noise floor (2) \u2192 Tier-0 harness (3) \u2192 Tier-1 harness (4) \u2192\
    \ Tier-2 harness (5) \u2192 budget ledger + model-parity guard + homogeneous Bedrock\
    \ chain (6, 7, 8; includes the usage-log ticket-attribution bug) \u2192 change\
    \ protocol ADR + docs (9). Folded-in existing work: `ridiculous-expert-mouse`\
    \ (per-criterion fixture eval, a Tier-2 single-criterion consumer), `auspicious-torrid-curlew`\
    \ (deterministic-floor candidates mined via Tier-0 replay), `brutal-idiocratic-rodent`\
    \ (optional human-adjudicated gold subset, deferred enrichment). `jira-reb-529`\
    \ is superseded: its recorded-LLM-response mocking is infeasible because prompts/responses\
    \ are never persisted; the sidecar-replay tiers deliver its intent. `jira-reb-1589`\
    \ and `fort-wisp-wren` are consumers that depend on this harness; `spin-cub-usher`\
    \ and `yip-gem-teak` are related but out of scope.\n\n## Non-goals\n\nChanging\
    \ any production criterion, question, or threshold (this epic builds the instrument);\
    \ a full human-adjudicated gold set; live A/B in the production gate."
