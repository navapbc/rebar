    \ (`:401` \u2014 where the workflow inputs\n  are built; `finalize.py` holds the\
    \ same ids, so both share ONE rule via a new\n  `sidecar.memory_key`; `session:<id>`\
    \ local / `change:<id>` Gerrit, no CI trigger), pass\n  as a new optional `standing_findings`\
    \ workflow input, and\n  `merge_findings` appends those whose `norm_id` fresh\
