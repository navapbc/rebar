    \ and\nvanished on PS3-PS4, which merged `LLM-Review+1` with zero findings; the\
    \ defect then broke macOS CI\non 1869 (bug `9bb7-4430-1202-4d93`). Recall is non-deterministic\
    \ per run. Existing memory only\nNARROWS: `apply_region_gated_floor` (`workflow_ops.py:641`)\
    \ reads `latest_code_review_result`\n(`sidecar.py:354`) to drop findings, never\
    \ to re-raise one.\n\n## Approach\n\nMirror plan-review's recall backstop (`plan_review/sidecar.py:414`,\
    \ injected at `pass1.py:489`) \u2014 no\nsecond mechanism. Paths omit `src/rebar/`.\n\
    \n- **Where state is computed.** New leaf `llm/code_review/carry_forward.py`.\
    \ `standing_items(key, *,\n  repo_root, coverage=None)` reads the prior payload\
    \ via `latest_code_review_result` (extended to\n  also return `revision`, the\
    \ origin patchset) and classifies each item with\n  `region_gate.region_for_finding(f,\
    \ prior_deps, repo_root=\u2026)` (`region_gate.py:31`) against that\n  payload's\
    \ `deps` hash map. Classification lives HERE, not in `merge_findings`\n  (`workflow_ops.py:237`),\
    \ which sees only finding lists and no deps; merge gets resolved items as data.\n\
    - **Eligibility.** Surfaced-only \u2014 the reader unions `blocking` + `advisory`\
    \ only;\n  widening it would let a permanently dropped finding back in (bug `old-frilly-plankton`).\
    \ Grounded-only \u2014 empty `evidence` is ineligible: the verifier\n  would be\
    \ confirming a bare assertion (bug `deceitful-flannel-jerboa`). Highest `priority`\
    \ first, capped at\n  `STANDING_CAP = 12` (plan-review's `RECALL_CAP`).\n- **State\
    \ \u2014 one rule per value**, on a new additive `standing` object `{origin_revision,\n\
    \  origin_decision, state}` (no `disposition` field today). `origin_decision`\
    \ comes from the reader,\n  which now stamps each surfaced item with the BUCKET\
    \ it came from (`blocking`->`block`,\n  `advisory`->`advisory`; the union erases\
    \ that boundary), falling back to the item's own\n  `decision`, then `advisory`\
    \ \u2014 the clamp never invents a blocking posture:\n  - `still-present` \u2014\
    \ cited file's hash == the prior review's (`REGION_UNCHANGED`), or the signal\n\
    \    is unresolvable (`REGION_UNKNOWN`: multi-file, absent path, error). CARRIED;\
    \ UNKNOWN defaults\n    here deliberately, since the clamp means carrying can\
    \ only lower a posture.\n  - `addressed` \u2014 cited file's content differs (`REGION_CHANGED`):\
    \ the edit is evidence it was\n    acted on, so the fresh finder's silence rules.\
    \ NOT carried.\n  - `withdrawn` \u2014 the item ITSELF carries a `standing` object:\
    \ already carried once. NOT carried.\n  Example: PS2 raises `security` at `a.py:40`;\
    \ PS3 leaves `a.py` byte-identical and does not\n  re-emit it \u2192 `still-present`,\
    \ injected into PS3. PS4 edits `a.py` \u2192 `addressed`; had PS4 left it\n  untouched\
    \ and still missed it, PS3's carried item is `withdrawn`.\n- **Termination (anti-ratchet).**\
    \ plan-review suppresses recall wholesale on changed material\n  (`_material_changed`,\
