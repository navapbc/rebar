    \ stored Pass-1 findings, with per-question agreement vs stored answers and downstream\
    \ Tier-0 metrics; verified by a reproduction run (unchanged questions) whose agreement\
    \ establishes the noise floor.\n- [ ] A Pass-1 change can be assessed on a fixed\
    \ stratified sample with finding-set comparison by `norm_id`/criterion and downstream\
    \ Tier-1/Tier-0 metrics; verified by one baseline sample run.\n- [ ] Every LLM\
    \ eval call is priced and written to a committed ledger; a run whose pre-flight\
    \ estimate exceeds remaining allocation is refused; total ledger spend at epic\
