  input: "## Context / Problem\n\nA sidecar payload is keyed by `(change_id, revision)`\
    \ and Gerrit emits one `code_review` artifact\nper revision (`review_bot/artifact_emit.py:84`),\
    \ so a finding raised on one patchset and not re-emitted on the\nnext reaches\
    \ no consumer. On change 1867 the `assert elapsed < 10` advisory ran on PS1-PS2\
    \ and\nvanished on PS3-PS4, which merged `LLM-Review+1` with zero findings; the\
    \ defect then broke macOS CI\non 1869 (bug `9bb7-4430-1202-4d93`). Recall is non-deterministic\
    \ per run. Existing memory only\nNARROWS: `apply_region_gated_floor` (`workflow_ops.py:641`)\
    \ reads `latest_code_review_result`\n(`sidecar.py:354`) to drop findings, never\
    \ to re-raise one.\n\n## Approach\n\nMirror plan-review's recall backstop (`plan_review/sidecar.py:414`,\
    \ injected at `pass1.py:489`) \u2014 no\nsecond mechanism. Paths omit `src/rebar/`.\n\
    \n- **Where state is computed.** New leaf `llm/code_review/carry_forward.py`.\
    \ `standing_items(key, *,\n  repo_root, coverage=None)` reads the prior payload\
    \ via `latest_code_review_result` (extended to\n  also return `revision`, the\
    \ origin patchset) and classifies each item with\n  `region_gate.region_for_finding(f,\
    \ prior_deps, repo_root=\u2026)` (`region_gate.py:31`) against that\n  payload's\
    \ `deps` hash map. Classification lives HERE, not in `merge_findings`\n  (`workflow_ops.py:237`),\
    \ which sees only finding lists and no deps; merge gets resolved items as data.\n\
    - **Eligibility.** Surfaced-only \u2014 the reader unions `blocking` + `advisory`\
    \ only;\n  widening it would let a permanently dropped finding back in (bug `old-frilly-plankton`).\
    \ Grounded-only \u2014 empty `evidence` is ineligible: the verifier\n  would be\
    \ confirming a bare assertion (bug `deceitful-flannel-jerboa`). Highest `priority`\
    \ first, capped at\n  `STANDING_CAP = 12` (plan-review's `RECALL_CAP`).\n- **State\
    \ \u2014 one rule per value**, on a new additive `standing` object `{origin_revision,\n\
    \  origin_decision, state}` (no `disposition` field today). `origin_decision`\
    \ comes from the reader,\n  which now stamps each surfaced item with the BUCKET\
    \ it came from (`blocking`->`block`,\n  `advisory`->`advisory`; the union erases\
    \ that boundary), falling back to the item's own\n  `decision`, then `advisory`\
    \ \u2014 the clamp never invents a blocking posture:\n  - `still-present` \u2014\
    \ cited file's hash == the prior review's (`REGION_UNCHANGED`), or the signal\n\
    \    is unresolvable (`REGION_UNKNOWN`: multi-file, absent path, error). CARRIED;\
    \ UNKNOWN defaults\n    here deliberately, since the clamp means carrying can\
    \ only lower a posture.\n  - `addressed` \u2014 cited file's content differs (`REGION_CHANGED`):\
    \ the edit is evidence it was\n    acted on, so the fresh finder's silence rules.\
    \ NOT carried.\n  - `withdrawn` \u2014 the item ITSELF carries a `standing` object:\
    \ already carried once. NOT carried.\n  Example: PS2 raises `security` at `a.py:40`;\
    \ PS3 leaves `a.py` byte-identical and does not\n  re-emit it \u2192 `still-present`,\
    \ injected into PS3. PS4 edits `a.py` \u2192 `addressed`; had PS4 left it\n  untouched\
    \ and still missed it, PS3's carried item is `withdrawn`.\n- **Termination (anti-ratchet).**\
    \ plan-review suppresses recall wholesale on changed material\n  (`_material_changed`,\
    \ `sidecar.py:396`); `addressed` is the per-finding analogue and `withdrawn`\n\
    \  bounds the rest \u2014 an item is carried AT MOST ONCE, so the chain ends after\
    \ one patchset. Per-state counts go to the caller's optional sink, not the signed\
    \ `coverage`.\n- **Injection.** Post-Pass-1, NOT `finalize.py` (its docstring\
    \ `:1-9`: post-verdict only).\n  Items resolve in `gate_dispatch._assemble_code_review_run`\
    \ (`:401` \u2014 where the workflow inputs\n  are built; `finalize.py` holds the\
    \ same ids, so both share ONE rule via a new\n  `sidecar.memory_key`; `session:<id>`\
    \ local / `change:<id>` Gerrit, no CI trigger), pass\n  as a new optional `standing_findings`\
    \ workflow input, and\n  `merge_findings` appends those whose `norm_id` fresh\
    \ Pass-1 did not produce. They reach\n  `code_review_verify_inputs` (`workflow_ops.py:270`);\
    \ finders never see them.\n- **Shared kernel: no behaviour change.** `verify_instructions`\
    \ (`verify.py:114`) builds the\n  listing and **plan-review also calls it** (`plan_review/passes.py:66`),\
    \ so standing wording is\n  appended code-review-locally in `code_review_verify_inputs`\
    \ and in `code-review-verify.md`;\n  `verify.py` changes only `prior_findings_block`'s\
    \ now-wrong docstring claim (`:435`).\n- **Posture clamp.** `pass3_decide` RECOMPUTES\
    \ `decision` every run as \"BLOCK\n  iff blocking_enabled AND priority >= block_threshold\"\
    \ (`decide.py:631`), threshold resolved per\n  criterion (`registry.py:535`),\
    \ and on 1867 the defect changed criterion between patchsets \u2014 so\n  `code_review_decide`\
    \ clamps a `standing` finding to at most `standing.origin_decision`. The floor\n\
    \  is unaffected: a standing item matches a prior finding, so `rising_floor_drop`\
    \ (`decide.py:105`) sees low\n  novelty and cannot drop it.\n\n\n## Scope\n\n\
    New: `llm/code_review/carry_forward.py` (home for `STANDING_CAP`, the states,\
    \ `standing_items()`,\nthe wrapper text and the clamp \u2014 `workflow_ops.py`\
    \ is 758 LOC against the 800 cap) and\n`tests/unit/test_code_review_carry_forward.py`.\n\
    \nEdited as above: `llm/code_review/sidecar.py` (reader + `memory_key`), `.../workflow_ops.py`,\n\
    `.../finalize.py` (adopts `memory_key`), `llm/workflow/gates/code-review.yaml`,\n\
    `llm/workflow/gate_dispatch.py`, `llm/reviewers/code-review-verify.md`,\n`llm/review_kernel/verify.py`\
    \ (docstring only), `review_bot/adapter.py` (`_translate_findings`\n`:122` drops\
    \ keys outside `{severity, dimension, detail, location}` \u2014 carry `standing`)\
    \ and\n`review_bot/finding_publish.py` (`:126`/`:147` render \"since patchset\
    \ k\" \u2014 the Gerrit text is\ncomposed there, not in `adapter.py`).\n\n`test_code_review_region_gate.py`\
    \ / `test_code_review_gate_session.py` stub the reader **by\nstring** \u2014 update\
    \ those stubs too.\n\n## Acceptance Criteria\n\nEach runs from the repo root and\
    \ exits 0, after `CF=tests/unit/test_code_review_carry_forward.py`.\n\n- [ ] `standing_items`/`STANDING_CAP`\
    \ import from `rebar.llm.code_review.carry_forward`, and ineligible prior items\
    \ yield nothing (`dropped` bucket, empty `evidence`, no prior review): `pytest\
    \ $CF -k ineligible -q`.\n- [ ] Each state's rule is pinned (incl. the unresolvable-region\
    \ default) and carry is one-shot \u2014 an already-carried item classifies `withdrawn`,\
    \ uncarried: `pytest $CF -k \"state_classification or withdrawn\" -q`.\n- [ ]\
    \ A `still-present` item absent from fresh Pass-1 is injected carrying `standing.state`\
    \ + `standing.origin_revision`: `pytest $CF -k merge_injects_standing -q`.\n-\
    \ [ ] `standing.origin_decision` is taken from the prior surfaced bucket and defaults\
    \ to advisory: `pytest $CF -k origin_decision -q`.\n- [ ] Carry-forward never\
    \ raises a posture, incl. over a `blocking_enabled` criterion past its `block_threshold`:\
    \ `pytest $CF -k posture_clamp -q`.\n- [ ] The reader exposes `revision` and the\
    \ per-item origin bucket: `pytest tests/unit/test_code_review_artifact.py -k latest_code_review_result\
    \ -q`, with both assertions added.\n- [ ] The dispatcher threads carried items\
    \ into the workflow finder-blind, and convergence is not regressed: `pytest tests/unit/test_code_review_gate_session.py\
    \ tests/unit/test_code_review_region_gate.py -q`.\n- [ ] The shared kernel is\
    \ untouched beyond a docstring: `git diff origin/main -- src/rebar/llm/review_kernel/verify.py`\
    \ shows docstring lines only; `pytest tests/unit/test_review_kernel.py -q`.\n\
    - [ ] Gerrit marks carried findings and the prompt names them: `grep -Eci \"standing\
    \ finding|carried from an earlier patchset\" src/rebar/llm/reviewers/code-review-verify.md`\
    \ and `grep -c \"since patchset\" src/rebar/review_bot/finding_publish.py` each\
    \ return >= 1; `pytest tests/unit/test_review_bot.py -q`.\n- [ ] Repo gates hold:\
    \ `make lint` (which runs `check_complexity_baseline.py --check`: no `new`/`increased`);\
    \ every touched `src/rebar` file is within `.github/module-size-limit.txt`."
epochs: 3
gate: at_least(2)
