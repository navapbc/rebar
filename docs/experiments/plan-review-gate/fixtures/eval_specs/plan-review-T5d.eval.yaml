dataset:
- corpus: rebar
  criterion: T5d
  expect: finding
  id: plan-review-T5d-fire-0
  input: '## Context / Problem

    The workflow editor currently presents authored YAML/BPMN configuration without
    a trustworthy view of the effective criteria policy derived from built-ins plus
    project overlays. RP-06 adds an immutable derived policy and an explicit project
    applicability rule; exposing derived state as if it were editable topology would
    create a second policy authority and make misconfiguration difficult to diagnose.


    ## Approach

    Extend the workflow-editor server to obtain the S1 `CriteriaSnapshot` for the
    selected repository and expose a narrow, read-only Effective Policy view. Keep
    Authored Workflow as the only editable YAML/BPMN topology. The effective view
    shows snapshot digest/source, criterion id, gate, execution tier, effective posture/threshold,
    applicability summary, enabled/disabled state, and a concise derived reason. It
    never serializes edits back into workflow or project routing.


    At authoring/save validation, a new `project.*` code-review LLM criterion must
    have a non-empty list of non-empty repository-relative `applies_to` globs. The
    editor rejects an empty/missing selector with the exact `["**"]` repository-wide
    remedy. Built-in entries, project DET criteria, and plan-review criteria retain
    their distinct trigger authoring controls and are not forced through this field.


    Keep stored execution trace and per-call debugging detail out of the editor response.
    The Effective Policy panel is configuration provenance, not a review-result/status
    viewer. Repository or validation errors fail the save or mark the effective view
    unavailable with a located, actionable message; they do not silently display packaged
    defaults as effective policy.


    ## Rationale and Compatibility

    A read-only projection makes the centralized pattern visible while preserving
    one authored source of topology. Older workflow files remain readable. The UI
    and server add fields without rewriting saved YAML/BPMN, and rollback removes
    the panel/endpoint while leaving authored artifacts unchanged.


    ## Testing

    Use server contract tests with real overlay/snapshot compilation and focused editor
    DOM/state tests. The oracle is the serialized authored document remaining byte-equivalent
    while the read-only view changes with project policy. Negative controls cover
    built-in empty trigger semantics, project DET, and plan review. Error fixtures
    prove unavailable policy is explicit and save validation is fail-loud.


    ## Acceptance Criteria

    - [ ] The editor renders distinct Authored Workflow and read-only Effective Policy
    sections, and no action in the effective section mutates or serializes YAML/BPMN.

    - [ ] Effective Policy data comes from the repository-bound `CriteriaSnapshot`
    and displays digest/source plus concise criterion gate, tier, posture, applicability,
    and enabled/disabled provenance.

    - [ ] Creating or saving a project code-review LLM criterion with missing, empty,
    non-list, or blank globs is refused with the criterion location and `use ["**"]
    for repository-wide` remedy.

    - [ ] Built-in secondary triggers, project DET selector controls, and plan-review
    `applies_at`/`trigger` authoring remain valid negative controls and are not subjected
    to the project-LLM glob rule.

    - [ ] A snapshot load/validation failure marks Effective Policy unavailable with
    an actionable located error and never substitutes packaged defaults or permits
    an invalid save.

    - [ ] Server and editor tests prove policy changes update only the derived view
    while authored workflow round-trips byte-equivalently.

    - [ ] Editor payloads contain no per-unit discovery trace, raw prompt/context
    body, provider response, or secret.'
