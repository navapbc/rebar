- input: '## Context / Problem


    `review_plan_start(ticket)` returns a `job_id`; callers poll `gate_status(job_id)`
    and then read retained `REVIEW_RESULT` findings. The bug is that a terminal plan-review
    poll (`status:"passed"`, `verdict:"BLOCK"`) did not prove that the readable `REVIEW_RESULT`
    belonged to that same run. A caller reading "latest findings" could silently consume
    a prior run''s findings.


    Observed 2026-09-01 on ticket `549b-9cc5-940e-46c3`: job `1788326596882647223-94573cf0d90d404e87c74855306c16f2`
    reported terminal BLOCK while the newest readable sidecar was prior-run file `1788325963941841589-...-REVIEW_RESULT.json`;
    the current sidecar `1788327281362056852-...-REVIEW_RESULT.json` appeared later.


    ## Root cause / actual layer


    `review_plan()` already calls `sidecar.emit()` before `_spawn_gate_daemon()` records
    the terminal `.rebar/gate_runs/<job_id>` entry. The defect is not a simple in-process
    order inversion; it is missing per-run sidecar identity:


    - `sidecar.emit()` was best-effort and returned only a bool.

    - `_spawn_gate_daemon()` discarded sidecar outcome/identity when writing the terminal
    run index.

    - `gate_run_status()` reported terminal status plus attestation currency only.
    For BLOCK, the attestation is unsigned by definition, so `durable` cannot prove
    findings readiness.

    - `sidecar.latest_review_result(ticket)` is newest-by-ticket, not job-scoped.


    Thus a terminal run without an exact sidecar receipt cannot distinguish current
    findings from stale latest findings, an unreadable tracker view, a legacy index,
    or permanent sidecar failure.


    ## Fix plan


    Add an exact receipt while preserving existing contracts.


    1. `_commands._seam.append_event()` returns the event-envelope timestamp as an
    additive receipt; existing callers may ignore it.

    2. `plan_review.sidecar.emit()` still returns bool, and also stamps `verdict["sidecar_reviewed_at"]`
    with the timestamp returned by `append_event()`.

    3. `plan_review.__init__` keeps `verdict["sidecar_emitted"]` boolean semantics
    unchanged while carrying that stamped receipt on the verdict.

    4. Reuse short-circuits that return current stored findings (`reuse.idempotent_reuse`
    and `reuse.verdict_reuse`) set `sidecar_reviewed_at` from the reused sidecar''s
    filename timestamp while keeping `sidecar_emitted=false` because they did not
    write a new sidecar. Drift refresh/cancellation remain no-new-findings paths.

    5. `_mcp_llm._spawn_gate_daemon()` copies `sidecar_emitted` and any exact `sidecar_reviewed_at`
    from the completed review result into the terminal run index.

    6. `gate_status(job_id)` adds `findings` for plan-review jobs: `sidecar_type`,
    `readable`, `reason`, `reviewed_at`, `latest_reviewed_at`, and legacy diagnostic
    `job_started_at`.

    7. `findings.readable=true` only when a file with the exact `sidecar_reviewed_at`
    prefix exists and parses as a supported `plan_review_result_v1/v2` payload. It
    never infers freshness from newest timestamp or job start time.


    Disposition: no `findings` block is attached when the job is `unknown` because
    there is no indexed ticket/gate type. For indexed plan-review jobs, `findings.sidecar_type`
    is always `REVIEW_RESULT`. `current-review-result-sidecar` is readable. `sidecar-not-emitted`
    is a new record with `sidecar_emitted=false` and no receipt; `review-result-generation-unknown`
    is a legacy terminal record with no receipt fields; `run-failed` is a terminal
    gate failure with no review result; `run-stale-running` is a crashed-leader unavailable
    state. `review-result-sidecar-missing` covers absent, unreadable, corrupt, or
    unsupported exact-prefix files; callers may keep polling only under their normal
    bounded wait policy and must not read latest findings while false. `run-running`
    and `run-attaching` mean keep polling.


    ## Scope / file impact


    - `src/rebar/_commands/_seam.py`: additive timestamp return from `append_event()`.

    - `src/rebar/llm/plan_review/sidecar.py`: stamp `sidecar_reviewed_at` while preserving
    bool return; reuse reads exact payload timestamps from existing `all_review_results()`.

    - `src/rebar/llm/plan_review/__init__.py`: verified call site; bool `sidecar_emitted`
    remains unchanged.

    - `src/rebar/llm/plan_review/reuse.py`: carry reused current sidecar receipts
    on no-new-sidecar paths.

    - `src/rebar/_mcp_llm.py`: store the exact completed-review receipt in the terminal
    async run index.

    - `src/rebar/llm/gate_runs.py`: compute the plan-review `findings` readability
    block.

    - `src/rebar/_mcp_reads.py`, `src/rebar/_mcp_models.py`, `src/rebar/schemas/plan_review_verdict.schema.json`:
    document/model additive fields.

    - `tests/unit/test_mcp_gate_async.py` and `tests/interfaces/store/test_sidecar_reader.py`:
    regression and receipt tests.

    - `AGENTS.md`, `docs/plan-review-gate.md`, `docs/mcp-reference.md`: document waiting
    for `findings.readable` before reading findings.


    ## Acceptance Criteria


    - [x] Seed an old `REVIEW_RESULT`, record a terminal newer run with expected `sidecar_reviewed_at`,
    omit that sidecar, and assert `gate_status` is terminal with `findings.readable=false`,
    `reason="review-result-sidecar-missing"`.

    - [x] Write the expected current sidecar and assert the same job reports `findings.readable=true`
    with `reason="current-review-result-sidecar"`.

    - [x] Drive two successive runs and assert poll-then-read returns no findings
    for the newer job until that job''s exact sidecar is readable.

    - [x] Assert terminal `sidecar_emitted=false` without a receipt reports `findings.readable=false`
    and `reason="sidecar-not-emitted"`.

    - [x] Assert terminal `sidecar_emitted=false` with a reused `sidecar_reviewed_at`
    reports `findings.readable=true` for that exact sidecar.

    - [x] Assert exact-prefix corrupt or unsupported sidecar files report `findings.readable=false`
    with `reason="review-result-sidecar-missing"`.

    - [x] Assert `findings.latest_reviewed_at` reflects the newest-by-ticket sidecar
    timestamp for diagnostics only and is not used to infer readability.

    - [x] Assert an unknown job has no `findings` block.

    - [x] Assert `findings.sidecar_type` is `REVIEW_RESULT`.

    - [x] Assert the daemon records the exact receipt returned by `review_plan()`
    even when a newer same-ticket sidecar is already readable.

    - [x] Assert legacy terminal records without a receipt report `findings.readable=false`,
    `reason="review-result-generation-unknown"`, with `job_started_at` diagnostic
    only.

    - [x] Assert non-terminal plan-review runs report `findings.readable=false`, `reason="run-<status>"`,
    and `reviewed_at=null`.

    - [x] Assert terminal failed plan-review runs without a review result report `findings.readable=false`
    and `reason="run-failed"`.

    - [x] [non-codebase] Validate with targeted pytest, MCP schema coverage, `make
    lint`, `make typecheck`, and `make test`.


    ## Non-goals


    - Changing verdict computation or whether a BLOCK is a completed (`passed`) gate
    run.

    - Making `REVIEW_RESULT` sidecars required for the verdict; they remain best-effort
    observability.

    - Changing `plan_review_status` or signed-attestation currency.'
