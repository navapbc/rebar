  id: plan-review-T5e-fire-0
  input: "## Context / Problem\n\nPass 2 (`src/rebar/llm/review_kernel/verify.py`,\
    \ questions in `verify_models.py`, prompts `reviewers/plan_review_verifier*.md`,\
    \ `temperature: 0`, standard class = Sonnet on Bedrock) is the cheapest LLM pass.\
    \ A question/prompt change can be measured by re-verifying the *stored* Pass-1\
    \ findings and comparing to the stored answers.\n\n**Production input, byte-identical\
    \ \u2014 exact seam call.** `verify.finding_listing(batch)` (verify.py:101-108)\
    \ renders ONLY `claim`/`criteria`/`evidence`/`impact` per finding \u2014 NOT `location`.\
    \ The real signature (verify.py:345) is `verify_findings(findings, *, context,\
    \ run_chunk, window_tokens, est_tokens, headroom=DEFAULT_VERIFY_WINDOW_HEADROOM)`.\
    \ Production's plan-review wrapper (`sizing.verify_request_chunks`, sizing.py:187-206)\
    \ supplies `window_tokens=sizing.largest_window_tokens(model)` and `est_tokens=det_floor.est_tokens`.\
    \ The replay calls `verify_findings(stored_findings, context=plan_context, run_chunk=<candidate\
    \ runner>, window_tokens=sizing.largest_window_tokens(standard_class_model), est_tokens=det_floor.est_tokens)`\
    \ via `RunRequest.for_structured(..., bounds=RunRequest.INHERIT_POLICY)` (the\
    \ repo-wide ratchet for single-turn structured calls).\n\n**Missing-answer handling.**\
    \ `verify_findings` returns `{\"verifications\": {index: {severity_attributes,\
    \ binary}}, \"omitted\": [...]}`; a chunk whose `run_chunk` raises contributes\
    \ NO verifications. Excluded from \u03BA/agreement with a reported \"no-answer\"\
    \ count per question, per binary sub-question AND per severity attribute independently\
    \ (a question that is no-answer for every finding still appears in the report\
    \ with `n=0`, not silently dropped).\n\n**Ledger \u2014 flat per-sample, not token-derived.**\
    \ `ledger.estimate(tier, sample_n)` returns `PER_SAMPLE_ESTIMATE_USD[tier] * sample_n`.\
    \ Pre-flight is `ledger.reserve(ledger.estimate(\"tier1\", n))` before any call;\
    \ an empty sampling pool raises `ValueError` immediately (before any ledger interaction)\
    \ rather than silently producing a `sample_n: 0` report.\n\n**Tier1's candidate\
    \ is a NEW concept, not Pass-3's `Candidate`/`CANDIDATES`.** `VerifierCandidate`\
    \ in `src/rebar/llm/evals/plan_replay/verifier_candidates.py`: `prompt_path: str\
    \ | None = None` (`None` = production's shipped prompt/questions) plus `load_verifier_candidate(path_or_none)`.\n\
    \n**Distribution shift, defined \u2014 categorical vs continuous axes.** `decide.validity(binary)`\
    \ and `priority = validity * impact` are CONTINUOUS [0,1] scalars binned into\
    \ 10 FIXED equal-width buckets; impact's underlying categorical severity-attribute/binary\
    \ answers use their own closed vocabulary directly as bins. Per-bucket COUNT DELTA\
    \ + TOTAL VARIATION DISTANCE for every axis.\n\n## Approach\n\nBuilt `src/rebar/llm/evals/plan_replay/tier1.py`,\
    \ `sampling.py`, `verifier_candidates.py`; `__main__.py`'s `tier1` subparser;\
    \ `eval_solver.py`'s verifier `run_case` arm mirroring the novelty arm.\n\n##\
    \ Scope\n\n- `src/rebar/llm/evals/plan_replay/tier1.py`, `sampling.py`, `verifier_candidates.py`\
    \ (new)\n- `src/rebar/llm/evals/plan_replay/__main__.py` (edited)\n- `src/rebar/llm/evals/eval_solver.py`\
    \ (edited)\n- `tests/unit/test_subcall_class_selection.py` (edited \u2014 registered\
    \ the two new RunRequest sites)\n- `docs/experiments/plan-review-gate/replay/tier1-current-ddc8fb442281.md`\
    \ (generated, committed)\n- `docs/experiments/plan-review-gate/replay/ledger.jsonl`\
    \ (real commissioning-run row, committed)\n- `tests/unit/evals/test_plan_replay_tier1.py`\
    \ (new, 24 tests)\n\n## Testing\n\n24 unit tests, mutation-tested (no-answer exclusion,\
    \ distribution-shift bucketing, ledger pre-flight-before-any-call ordering, run_id\
    \ path-sanitization, the per-question-agreement fully-no-answer surfacing fix).\
    \ Landed via Gerrit changes 2433 (main harness, 5 patchsets \u2014 CI's `RunRequest.for_structured`\
    \ ratchet + a real per-question-agreement bug caught by LLM-Review, both fixed)\
    \ and 2440 (real commissioning report + ledger.jsonl + a report-filename cosmetic\
    \ fix). Live commissioning run: N=60, seed=0, reproduction candidate (`VerifierCandidate(prompt_path=None)`).\n\
    \n## Acceptance Criteria\n\n- [x] `python -m rebar.llm.evals.plan_replay tier1\
    \ --n 60` over the real corpus produced per-question agreement (with no-answer\
    \ counts) and distribution shift for a stratified sample of 60/60 requested; checked\
    \ by `docs/experiments/plan-review-gate/replay/tier1-current-ddc8fb442281.md`.\n\
    - [x] The reproduction run (`VerifierCandidate(prompt_path=None)`) is recorded\
    \ with its per-question agreement as the Pass-2 noise floor; checked by the same\
    \ report (e.g. `absence_confirmed_in_context`: raw=0.735 kappa=0.582 n=328 no_answer=20).\n\
    - [x] Every call was priced via `ledger.estimate(\"tier1\", n)`/`ledger.reserve`\
    \ and used the Bedrock standard-class model id; checked by the ledger.jsonl row:\
    \ `{\"run_id\": \"tier1-current-ddc8fb442281\", \"tier\": \"tier1\", \"sample_n\"\
    : 60, \"models\": {\"pass2\": \"bedrock:us.anthropic.claude-sonnet-4-6\"}, \"\
    usd\": 6.72}`.\n- [x] Commissioning spend for this ticket \u2264 $40; actual real\
    \ spend $6.72 (622413 input / 265196 output / 356518 cache-write tokens), well\
    \ under the cap; checked by the ledger.jsonl row above.\n- [x] Unit tests pass\
