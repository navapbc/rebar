  id: plan-review-COH-fire-1
  input: '## Context and confirmed RCA


    Gerrit Verify run 31874837464 completed in 29m11s with macOS at 27m38s. The macOS
    default suite spent 20.88s in test_hook_falls_back_to_git_when_env_unset, 16.38s
    setting up build-provenance artifacts, 10.69s rebuilding from sdist, plus 8.98s
    in one blank-env build. Ubuntu repeats these builds in three Python cells. Local
    profiling showed the fallback exports the entire 3,019-file / 42.4MB checkout
    although hatch_build.py only resolves one SHA plus writes src/rebar/_build_info.py:
    git add costs 1.37-1.53s; python -m build costs 3.85-4.32s of a 6.04-6.38s test.
    A same-hook minimal package preserved the exact fallback SHA while reducing initial
    paired totals from 6.30/9.26s to 2.66/5.43s.


    The exact -n 3 --dist worksteal selector proved that built_artifacts initializes
    separately on three workers: each consumer paid 6.60-6.74s setup, launching three
    full builds. This is a bounded contributor, not the cause of multi-minute host
    variation.


    Live run logs also prove a correctness prerequisite. The artifact job received
    GERRIT_PATCHSET_REVISION=9aecb53e then checked out that revision, but built with
    GITHUB_SHA=7d908fbb from trusted main. Its probes accepted any non-null COMMIT.
    Exact source identity is required by ducal-statuelike-ladybird.


    ## Ticket and OSS research


    No prior rejection exists. ducal-statuelike-ladybird requires real sdist/wheel
    plus exact provenance behavior. square-tragic-llama explicitly accepted a self-contained
    minimal Git fixture while retaining the exact fallback SHA plus shallow-source
    control. despotic-dorsal-greatdane approved immutable artifact reuse but stopped
    at per-worker scope. cryptic-damp-panda identified repeated package builds as
    coverage-neutral residual work.


    Four popular active projects use this placement: pytest 68308aa has one Ubuntu
    package job before its broad matrix; pip f399c371 has dedicated packaging jobs
    outside Unix/Python tests; Poetry 92b74dc has one Ubuntu build/install smoke job
    outside its OS/Python matrix; Pydantic 02c5c975 has a dedicated Ubuntu distribution
    build outside its broad matrix. This is 4/4 consensus for one full-package integration
    job plus lighter behavioral probes in the broad matrix. Rebar remains stricter
    by retaining real isolated PEP 517 sdist-to-wheel execution through the production
    hook in every cell.


    ## Plan


    1. Freeze RED workflow plus build-hook contracts. The workflow oracle rejects
    GITHUB_SHA as artifact provenance, requires git rev-parse --short HEAD after the
    final checkout, then requires exact equality from installed wheel plus sdist.
    Build-hook oracles retain env SHA, preserved sdist SHA, git fallback SHA, blank-env
    failure.

    2. Create one shared fixture around the checkout current hatch_build.py plus src/rebar/_build_info.py
    boundary. It supersedes _clean_tree in test_build_provenance.py plus _self_contained_checkout
    in test_attestation_signing.py at every build-semantics call site. The shallow-source
    control drives this same fixture from a shallow source. No third checkout materializer
    survives.

    3. The fixture creates a tiny temporary Hatch package, initializes Git, then commits
    only that tiny tree. It keeps default PEP 517 isolation. It never mocks Hatchling,
    Git, archive creation, or wheel inspection.

    4. Convert repeated semantics tests in test_attestation_signing.py plus test_build_provenance.py
    to that fixture. Retain every named assertion, the no-git helper branch, the direct
    full-Rebar WheelBuilder package-content test, plus the shallow-source control.

    5. Keep the existing full-Rebar replay in the shared _artifact-probe.yml workflow.
    This workflow serves both test.yml branch-head checkout plus gerrit-verify.yaml
    patchset checkout. In both lanes, compute REBAR_EXPECTED_COMMIT with git rev-parse
    --short HEAD after the applicable final checkout. Build with that short value.
    Assert exact equality for installed wheel plus install-from-sdist. Preserve every
    import, CLI, schema, packaging, plus vote-gating probe.

    6. Seed the exact wrong-SHA defect plus one precedence defect. Require the respective
    oracle to return RED before restoration. Compare focused serial plus exact-xdist
    timings. Timing remains evidence only.

    7. Run focused tests, workflow consumers, make lint, typecheck, plus full default/integration
    selectors. Push the necessary implementation immediately through Gerrit without
    a control-only run. Record hosted macOS plus Ubuntu durations from that treatment.


    ## Test contract card


    authoritative_contract: ducal-statuelike-ladybird requires real sdist-to-wheel
    provenance, exact env/git fallback behavior, blank-env failure, sdist preservation,
    plus exact source identity; both workflow consumers require artifact-probe to
    build their final checkout.

    trigger_preconditions: each matrix cell runs the real production hook through
    isolated PEP 517 on the minimal package; artifact-probe has completed its branch-head
    or patchset checkout.

    production_path: hatch_build.py resolves then writes COMMIT during sdist plus
    wheel builds; artifact-probe builds then installs full distributions.

    test_tier: minimal real-build probes across every current OS/Python cell plus
    one full-project artifact integration job per workflow lane.

    observable_postcondition: existing semantics remain; full artifacts equal the
    short SHA of their final checkout.

    negative_control: wrong nonempty SHA fails; blank env fails; no-git/no-bake remains
    None; shallow source remains supported.

    collateral_invariants: no selector, assertion, isolation mode, worker, platform,
    Python cell, coverage, mutation, probe, runner, or vote dependency is removed.

    ci_gate: focused serial/xdist tests, workflow contracts, make lint, make typecheck,
    Gerrit Verified, LLM-Review.


    ## Acceptance Criteria


    - [ ] Every current OS/Python cell executes a real isolated sdist-to-wheel build
    through production hatch_build.py on the minimal fixture package.

    - [ ] The env-override probe requires the exact supplied SHA.

    - [ ] The install-from-sdist probe requires the exact preserved SHA.

    - [ ] The git-fallback probe requires the exact committed fixture SHA.

    - [ ] The blank-env probe requires a nonzero real-build exit.

    - [ ] The shared fixture replaces both prior full-tree materializers at build-semantics
    call sites.

    - [ ] Hook-semantics fixtures never archive the full Rebar checkout.

    - [ ] Both artifact workflow lanes derive the short expected SHA after their final
    checkout.

    - [ ] The installed full-Rebar wheel must equal the expected short SHA.

    - [ ] The installed full-Rebar sdist must equal the expected short SHA.

    - [ ] A wrong nonempty full-artifact SHA fails the workflow oracle.

    - [ ] The direct full-Rebar WheelBuilder content test remains enabled.

    - [ ] The shallow-source negative control remains enabled.

    - [ ] The OS/Python matrix remains unchanged.

    - [ ] The pytest selectors, xdist workers, coverage gate, plus mutation gate remain
    unchanged.

    - [ ] The artifact import, CLI, schema, plus vote-gating probes remain unchanged.

    - [ ] A precedence mutation returns the build-hook oracle to RED.

    - [ ] Focused serial plus exact-xdist evidence shows lower elapsed runner work.

    - [ ] The first hosted treatment records macOS plus all Ubuntu job/test durations.

    - [ ] Gerrit records LLM-Review +1 before merge.

    - [ ] Gerrit records Verified +1 before merge.

    - [ ] Gerrit records zero unresolved comments before merge.'
