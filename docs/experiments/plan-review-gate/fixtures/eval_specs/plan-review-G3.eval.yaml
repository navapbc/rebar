    7. Desired summary observed after timeout means recovered success. Conclusive
    old state may replay within the remaining budget. Failed, rate-limited, or inconclusive
    observation returns non-replaying `commit_unknown`. An authoritative delay that
    cannot fit returns `retry_not_before` without sleeping. Auth, TLS, permission,
    invalid request, and permanent failures do not retry; eligible network, 429, and
    retryable 5xx failures use the shared schedule.

    8. Preserve the `update_one` / `apply_handlers.handle_update` boundary while S1
    is test-only. `dispatch_one` maps success/recovered success to the legacy result
    and fills `_fields_synced` only after conclusive success; `_comment_errors` and
    `_subop` keep their shapes. `commit_unknown`/`retry_not_before` map to a tagged
    internal result. `handle_update` records exactly one redacted per-mutation error/disposition
    message capped at 512 Unicode code points, leaves `_fields_synced` empty, advances
    no baseline or set-field provenance, persists no deferral in S1, and lets the
    batch continue. S3 maps terminal dispositions to pass/fuse control and durable
    deferral, then retires the bridge.

    9. Emit exactly one redacted completion log for every terminal/exhausted outcome
    or cleanup failure. It contains only logical id, disposition, invocation count,
    request count, cleanup status, `retry_not_before`, and one redacted message capped
    at 512 Unicode code points; the complete serialized log is capped at 1,024 Unicode
    code points.

    10. ADR 0100 records the retry owner, Jira idempotency limit, observe-before-replay,
    budget, lifecycle owners, rollback, and deltas from ADR 0084/0087 and desired-state
    ADRs 0004/0026/0029. The 15-second cumulative limit supersedes ADR 0084 only on
    selected routes.


    ## Scope

    - Core: `operation_outcome.py`, `retry_budget.py`, `dispatch_one.py`, `dispatch_apply_phases.py`,
    `apply_handlers.py`.

    - Cloud: `acli.py`, `acli_subprocess.py`, `acli_rest.py`, backend; preserve unrelated
    REST retry defaults.

    - DC: `transport.py`, `retry.py`, `_issues.py`, backend; dedicated executor client
    and per-call policy preserve legacy defaults.

    - ADR 0100; budget/outcome, handler, historical ACLI, cleanup, and DC request
    tests.


    ## Testing

    Fake-clock/stateful tests cover schedules, deadlines, request order, ambiguity,
    recovery, failure classes, and no real sleep. Poison tests reject hidden retry
    or extra ACLI processes; neighbor tests preserve unselected behavior. Handler
    tests prevent false state advance. Historical triples pin decoding, real processes
    pin cleanup, and output tests pin bounds/redaction. S3 owns venue-gated evidence;
    S5 owns final live confirmation.


    ## Compatibility / Rollback

    Production stays on legacy through the internal selector. Rollback selects legacy
    before a call; there is no config/env surface or dual-send. S3 changes the default
    after validation. Selected routes use the new budget, long-delay deferral, fail-loud
    unknown ACLI shapes, and non-replaying inconclusive recovery; other callers retain
    current behavior.


    ## Acceptance Criteria

    - [ ] Cloud and DC summary routes produce one provider-neutral outcome schema;
    tests assert every field.

    - [ ] Repeated invocations preserve one logical id.

    - [ ] No selected operation exceeds three invocations or 15 seconds cumulative
    sleep.

    - [ ] Each selected DC write invocation is exactly GET/PUT/GET with no hidden
    repeats.

    - [ ] Cloud recovery performs one primary-store REST request with no sleep; neighbor
    tests preserve existing REST retry.

    - [ ] Executor-selected exact `{"summary"}` bypasses generic `_call_with_retry`.

    - [ ] The constructor selector defaults to legacy, adds no config/env key, and
    tests explicitly enable it.

    - [ ] Mixed fields stay one unsplit legacy call.

    - [ ] Confirmed outcomes preserve legacy result, `_fields_synced`, `_comment_errors`,
    and `_subop` shapes.

    - [ ] Every terminal outcome records exactly one redacted per-mutation message
    capped at 512 Unicode code points, with no baseline/provenance advance or S1 deferral.

    - [ ] ADR and contract name S3 as sole cutover, fuse/deferral consumer, and bridge-retirement
    owner.

    - [ ] The Jira 3.10.5 executor passes `max_retries=0` and fails fast unless `_session.max_retries
    == 0`; legacy SDK retry is unchanged.

    - [ ] Selected DC wrapper calls are one-attempt/no-sleep; legacy wrapper behavior
    is unchanged.

    - [ ] Fallback sleeps remain [2s,3s), then [4s,5s).

    - [ ] Over-budget provider delay returns `retry_not_before` without sleep.

    - [ ] Permanent failures use one invocation; eligible transient failures use the
    schedule.

    - [ ] Satisfied observation returns recovered success without another write.

    - [ ] Conclusive old state permits only remaining-budget replay.

    - [ ] Failed/inconclusive observation returns non-replaying `commit_unknown`.

    - [ ] ACLI cleanup passes for POSIX groups and non-POSIX children.

    - [ ] Historical ACLI triples decode deterministically; unknown triples do not
    retry.

    - [ ] Operation outcomes hold at most eight diagnostics, with each redacted message
    capped at 512 Unicode code points.

    - [ ] Every terminal/exhausted outcome or cleanup failure emits exactly one completion
    log containing only logical id, disposition, invocation/request counts, cleanup
    status, `retry_not_before`, and one redacted message capped at 512 Unicode code
    points; the whole log is at most 1,024 Unicode code points.

    - [ ] ADR 0100 records contract, ownership, compatibility deltas, rollback, and
    prior art; index checks pass.'
