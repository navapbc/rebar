  corpus: rebar
  criterion: G3
  expect: pass
  id: plan-review-G3-no_fire-0
  input: "## Context / Problem\n\nOperators who run rebar's gate operations through\
    \ an OpenAI-compatible gateway (set via\n`llm.base_url`) have that gateway reporting\
    \ to an observability backend such as Langfuse.\nrebar sends no request metadata,\
    \ so every gate call arrives anonymous: it cannot be\nattributed to rebar, grouped\
    \ into one trace per gate run, or tied back to the ticket and\nsigned verdict\
    \ that produced it.\n\nrebar already reserved the field for this. `src/rebar/schemas/review_result.schema.json`\
    \ and\n`src/rebar/schemas/completion_verdict.schema.json` each declare `trace_id`\
    \ as\n`[\"string\",\"null\"]`, described as \"Langfuse trace id when tracing is\
    \ enabled; null\notherwise\", while `src/rebar/llm/runner.py:259` and `:719` pass\
    \ `trace_id=None`\nunconditionally. The correlation identity was specified and\
    \ never implemented.\n\nThe existing OTLP path (`src/rebar/llm/tracing.py:196`,\
    \ `setup_tracing`) is a different\nmechanism and is unchanged by this epic: it\
    \ exports rebar's own spans directly to Langfuse.\nThis epic serves the deployment\
    \ where the gateway, not rebar, feeds the backend.\n\n## Approach\n\nAdd one generic,\
    \ operator-configured request-header surface on `LLMConfig`, delivered\nthrough\
    \ pydantic-ai's `ModelSettings.extra_headers`, whose values may interpolate\n\
    environment variables (`${env:VAR}`) and rebar-supplied per-run values (`${run:trace_id}`,\n\
    `${run:ticket_id}`, `${run:operation}`).\n\nRationale for this shape:\n\n- **One\
    \ generic dict beats named per-vendor knobs.** A dedicated \"trace header name\"\
    \ field\n  would force rebar to ship a vendor default, hard-coding one gateway's\
    \ dialect. A generic\n  dict with substitution carries LiteLLM's `x-litellm-trace-id`,\
    \ Helicone's\n  `Helicone-Session-Id`, or an internal gateway's own names equally\
    \ well. rebar ships no\n  vendor header name in code or defaults; vendor names\
    \ appear only as documentation\n  examples, keeping the feature portable across\
    \ supported client shapes.\n- **`ModelSettings.extra_headers` beats patching httpx\
    \ clients.** It is upstream-supported\n  (`pydantic_ai/settings.py`, documented\
    \ for OpenAI, Anthropic, Bedrock, Google and others)\n  and rebar already has\
    \ a pure assembly seam at `src/rebar/llm/structured_run.py:338`\n  (`build_model_settings`)\
    \ feeding `src/rebar/llm/runner.py:567`. Patching transport instead\n  would require\
    \ touching two separate httpx constructions\n  (`src/rebar/llm/providers.py:295`\
    \ and `src/rebar/llm/anthropic_model.py:155`) and would\n  still miss non-httpx\
    \ providers.\n- **Static and per-run headers are one feature, not two.** A constant\
    \ header is a dict entry\n  without a placeholder; per-run correlation is a dict\
    \ entry with one. One code path, one\n  test surface.\n\nHeader values are a credential-bearing\
    \ surface: both vendor SDKs merge caller headers last,\nso a caller-supplied `Authorization`\
    \ silently displaces the real key. Validation and\nredaction are therefore delivered\
    \ scope, not follow-on work.\n\n## Out of scope\n\nNo rebar-owned root span, no\
    \ unification of rebar's own OTLP spans with the gateway's\nrecords, and no W3C\
    \ `traceparent` injection. The 32-hex lowercase id format is chosen so\nlater\
    \ work can carry a real OTel trace id without a schema or format migration.\n\n\
    ## Acceptance Criteria\n\n- [ ] An operator can configure arbitrary request headers\
    \ for gate LLM calls without editing\n      rebar source, and no gateway vendor's\
    \ header name appears in rebar's shipped code or\n      defaults; checked by a\
    \ test asserting the shipped default is empty and by a test\n      asserting no\
    \ vendor header-name constant exists under `src/rebar/llm/`.\n- [ ] A header value\
    \ can reference an environment variable so a gateway credential is never\n   \
    \   required in a committed config file; checked by a test resolving `${env:VAR}`\
    \ from a\n      monkeypatched environment.\n- [ ] All LLM calls within one gate\
    \ run carry the same correlation value, and two runs carry\n      different ones;\
    \ checked by a test capturing headers across the calls of one simulated\n    \
    \  run.\n- [ ] A produced gate verdict names the correlation value in its existing\
    \ `trace_id` field\n      instead of `null`, on both gate surfaces; checked by\
    \ asserting `trace_id` on a produced\n      plan-review verdict validated against\
    \ `review_result.schema.json` and on a produced\n      completion verdict validated\
    \ against `completion_verdict.schema.json`.\n- [ ] A configured header value never\
    \ appears in logs, diagnostics, or the\n      `provider_provenance` record written\
    \ into verdicts and sidecars; checked by a test\n      asserting a sentinel value\
    \ is absent from captured log output and from the serialized\n      provenance\
    \ record.\n- [ ] Header names and values that could forge authentication or inject\
    \ protocol bytes are\n      rejected at config resolution with a named error;\
    \ checked by parametrized tests over\n      the rejected set.\n\n## Child decomposition\n\
    \n- A **configuration** child owns the `headers` field, its resolution across\
    \ the CLI, env and\n  file layers, `${env:...}` interpolation, and the name/value\
    \ validation that rejects\n  authentication and protocol-injection headers. It\
    \ delivers criteria 1, 2 and 6.\n- A **run-correlation** child owns minting the\
    \ per-run identity at the gate run boundaries\n  and populating the verdict `trace_id`\
    \ field. It delivers criterion 4.\n- A **delivery** child owns `${run:...}` interpolation\
    \ and placing resolved headers on the\n  wire through `extra_headers`, gated on\
    \ a configured `base_url`, together with the\n  redaction guarantee at every emission\
    \ point. It delivers criteria 3 and 5, and depends on\n  both children above.\n\
    - A **documentation** child records the operator-facing recipe and security guidance,\
    \ and\n  depends on the delivery child."
epochs: 3
