  expect: finding
  id: plan-review-G3-fire-2
  input: "Add plan-review criterion T15 \"overlay-derisk\" so plans prove risky runtime\
    \ mechanisms via a fast out-of-loop experiment BEFORE committing them into a slow,\
    \ codified delivery loop (CI/CD, IaC apply, provisioning pipeline). Motivation:\
    \ on infra epics, basic failures (a service that won't boot, a credential that\
    \ doesn't authorize, a dependency that won't connect, a readiness check that never\
    \ passes) are discovered only at the END of a long delivery cycle. No existing\
    \ criterion rewards front-loading those checks into a cheap local run or a manual\
    \ probe against the real target. This is a CORE built-in change (not project-specific),\
    \ stack-agnostic (no hardcoded Terraform/docker), routed by the self-gating Pass-1\
    \ finder like the other Txx overlays.\n\n## The finalized T15 rubric (design of\
    \ record)\n\nOVERLAY \u2014 apply only when ALL of the following hold; else PASS\
    \ not-applicable.\n- S1 Codified loop? the mechanism is delivered/validated by\
    \ pushing through an automated pipeline or an environment/infrastructure apply,\
    \ not by running or unit-testing code directly.\n- S2 Slow or costly pass? one\
    \ pass through that loop is slow (minutes-to-hours) or otherwise costly to run.\n\
    - S3 Runtime-only correctness? the change introduces behavior whose correctness\
    \ only resolves when it actually runs in a realistic environment (boots, authenticates,\
    \ connects, is authorized, passes readiness) \u2014 unreachable by static/unit\
    \ checks.\n\nWhen applicable, report a finding for each check not satisfied:\n\
    - (a) RISK NAMED \u2014 the plan identifies the specific mechanism(s) confirmable\
    \ only by completing the full loop.\n- (b) FAST OUT-OF-LOOP PROOF \u2014 for each\
    \ named risk, the plan commits to proving it via the fastest feedback path available\
    \ for that mechanism, outside the slow loop: running the unit locally/emulated\
    \ where feasible, OR a manual experiment directly against the real target (an\
    \ interactive call, a one-off CLI/console action, a probe script, a throwaway\
    \ resource) where local reproduction isn't possible. The experiment is concrete\
    \ and returns a verdict in minutes, not a delivery cycle. An unnamed \"we'll verify\"\
    \ / \"we'll check after deploy\" does not satisfy it.\n- (c) PROVE-THEN-CODIFY\
    \ \u2014 the cheap experiment comes before committing the mechanism into the slow\
    \ loop, so the loop validates an already-proven mechanism.\n- (d) SCOPED CLEANUP\
    \ \u2014 throwaway experiments are cleaned up afterward, with teardown that removes\
    \ ONLY the artifacts the experiment itself created (the records a probe inserted,\
    \ the scratch resource it spun up) and touches nothing pre-existing, shared, or\
    \ persistent; a cleanup step that could delete, reset, or truncate a resource\
    \ the experiment did not create (e.g. dropping an existing table or wiping a bucket\
    \ to \"reset\" it) fails this check.\n\nANTI-FP: a manual experiment against the\
    \ real target is a fully valid proof \u2014 never penalize choosing it over local\
    \ reproduction; many stacks cannot be reproduced locally. A mechanism already\
    \ proven elsewhere in the codebase needn't be re-proven.\n\nFacet ~ empirical\
    \ / approach-soundness; exec AGENT (it ground-checks that the named mechanism\
    \ and named experiment are real/plausible against the codebase). Posture (advisory\
    \ vs blocking) and block_threshold are NOT decided here \u2014 set by the normal\
    \ registry/review process.\n\n## Required companion change: T10 boundary partition\n\
    The de-risk (transient experiment) phase and T10's production-hardening phase\
    \ must not overlap; there is no runtime cross-criterion suppression by design.\
    \ Fix by partitioning in T10's own rubric text \u2014 add a scope clause: \"This\
    \ overlay evaluates the DURABLE infrastructure \u2014 the IaC/config that persists.\
    \ Transient, throwaway experiments used to de-risk a mechanism before committing\
    \ it \u2014 their creation, isolation, and teardown \u2014 are out of scope here.\"\
    \ (T10 does NOT name T15 or any other overlay.)\n\n## Acceptance Criteria\n\n\
    - [x] all child tickets are closed\n- [x] `rebar explain T15` renders the criterion\
    \ with its descriptive name (not the bare id), and\n      `python -m rebar.llm.plan_review.registry\
    \ regenerate-criteria-guide` regenerates\n      `docs/plan-review-criteria-guide.md`\
    \ with a T15 section, with the criteria-guide and registry\n      validators passing\n\
    - [x] the writing-a-passing-plan guide instructs authors to de-risk out-of-loop\
    \ before slow delivery loops,\n      evidenced by the T15 guidance appearing in\
    \ `src/rebar/_guides/writing-a-passing-plan.md`\n- [x] the coach-move decision\
    \ (add or reject the proposed out-of-loop-proof move) is recorded on this epic\n\
    \      as a comment naming the decision and its rationale"
