  id: plan-review-G4-no_fire-0
  input: "## Problem\nA misleading error code is a significant failure mode: it causes\
    \ LLM/agent consumers to make erroneous assumptions and act on a wrong diagnosis\
    \ (e.g. \"the AI provider is down\" when the real fault is bad input or a missing\
    \ asset). Recent bugs are all instances of ONE systemic pattern: the blanket `LLMError\
    \ -> llm_unavailable` fallthrough in the `error_code_for` classifier mislabels\
    \ non-availability failures.\n\n## Goal\nSystematically audit EVERY error-code\
    \ / classification surface so each returned code accurately and specifically describes\
    \ the actual condition, and no failure degrades to a misleading catch-all.\n\n\
    ## Reconciled taxonomy (RESOLVED \u2014 supersedes the pre-dbca brief)\nEpic dbca-97ac-ad96-4d6d\
    \ has since LANDED (closed; commits ae4f6c1a, f854924b) and already reclassified\
    \ the workflow caller-input family with FINER, more descriptive codes than a broad\
    \ `command_failed`. Per the operator descriptiveness bar a finer accurate code\
    \ is strictly better, so dbca's answer is preserved, not competed with. The authoritative\
    \ target for this epic is therefore:\n- `LLMUnavailableError` / `LLMConfigError`\
    \ -> `llm_unavailable` (genuine availability faults only).\n- `LLMRunnerError`\
    \ subtree (`LLMBudgetExhaustedError`, `ContextWindowExceededError`, `LLMInputRejectedError`,\
    \ `RunawayToolLoopError`, `StructuredOutputError`/`UnretryableOutputError`/`CompletionRecoveryError`)\
    \ -> `command_failed` (the residual mislabel this epic fixes).\n- dbca workflow\
    \ caller-input subtree (`WorkflowNotFoundError` -> `not_found`; `WorkflowParseError`/`WorkflowValidationError`/`WorkflowVersionError`/`WorkflowUnknownStepError`\
    \ -> `invalid_input`) -> PRESERVED UNTOUCHED.\n- bare `WorkflowError` base + bare\
    \ `LLMError` -> `llm_unavailable` (dbca's pinned catch-all; the still-open escalated\
    \ ticket 551b owns any future change to the bare-base editor/missing-bundle code\
    \ \u2014 this epic does NOT pre-decide it).\nDiscriminate by exception TYPE, not\
    \ by phase. Do NOT revert dbca. Do NOT invent new fine-grained error codes beyond\
    \ what a consumer demonstrably needs.\n\n## Acceptance Criteria\n- [ ] `error_code_for`\
    \ (src/rebar/_errors.py) routes the `LLMRunnerError` subtree to `command_failed`\
    \ while keeping `LLMUnavailableError`/`LLMConfigError` -> `llm_unavailable`, and\
    \ leaves dbca's workflow caller-input taxonomy (`not_found`/`invalid_input`) and\
    \ the bare `WorkflowError`/`LLMError` catch-all (`llm_unavailable`) untouched\
    \ (child f75f-5509-10c0-4430).\n- [ ] `_structured_llm_failure` (src/rebar/_mcp_llm.py)\
    \ derives its top-level `error` field via `error_code_for(exc)` instead of hardcoding\
    \ `llm_unavailable`, across all 4 MCP gate tools, so both dbca's finer codes and\
    \ the LLMRunnerError routing apply uniformly (child fbc0-ee15-9d69-49ae).\n- [\
    \ ] The `render_workflow` MCP tool surfaces the `WorkflowError` caller-input family\
    \ as `not_found`/`invalid_input` (NOT `llm_unavailable`) \u2014 already proven\
    \ observably by the landed dbca contract tests (tests/interfaces/contracts/test_workflow_error_codes_dbca.py).\
    \ 7d47-2131-42bd-4832 is therefore closed as SUPERSEDED by dbca; no `command_failed`\
    \ is re-asserted for that family.\n- [ ] `pinned_ticket_read_failed` is registered\
    \ in `KNOWN_ERROR_CODES` (child 0aee-a70d-045b-48a1).\n- [ ] The gate-degrade\
    \ `coverage.llm_unavailable` boolean is True only for genuine `LLMUnavailableError`\
    \ outages; `LLMInputRejectedError` instead sets a distinct `input_rejected` signal\
    \ (via a shared `failure.degrade_cause_flags` helper applied in BOTH degrade builders\
    \ \u2014 `gate_dispatch.py` and `plan_review_recovery.py`), and the three readers\
    \ (`plan_review/drift_floor.py`, `plan_review/orchestrator.py`, `review_bot/adapter.py`)\
    \ are updated to read it. No broad `degraded` category (child 5f96-25aa-af9d-4f57).\n\
    - [ ] A prevention guardrail lands: an exhaustive `exception -> code` contract\
    \ test over the `LLMError` subclass tree asserting the RECONCILED taxonomy above\
    \ (availability -> `llm_unavailable`; `LLMRunnerError` subtree -> `command_failed`;\
    \ dbca workflow subtree -> `not_found`/`invalid_input`; bare bases -> `llm_unavailable`),\
    \ plus a vocabulary-closure test asserting every code any producer can emit is\
    \ in `KNOWN_ERROR_CODES` (pins 0aee).\n- [ ] [non-codebase] Every change lands\
    \ via Gerrit with `Verified +1` and `LLM-Review +1`, carries a `rebar-ticket`\
    \ trailer + DCO sign-off, and children are closed bottom-up.\n\n## Scope (surfaces\
    \ enumerated by the audit)\n- `error_code_for` mapping (`src/rebar/_errors.py`)\
    \ \u2014 the residual blanket `LLMError -> llm_unavailable` branch 7 (branch 6\
    \ workflow classification already handled by dbca).\n- `_structured_llm_failure`\
    \ (`src/rebar/_mcp_llm.py`) across the 4 MCP gate tools.\n- The gate-degrade `coverage.llm_unavailable`\
    \ boolean (`gate_dispatch.py` + `plan_review_recovery.py`) and its three readers.\n\
    - Top-level `_errors.py` `KNOWN_ERROR_CODES` vocabulary contract.\n\n## Constraints\n\
    Remediation lands via Gerrit per AGENTS.md. No --force. Gates run unbounded. dbca\
    \ (landed) is preserved, not reverted. 551b remains OPEN and owns the bare-`WorkflowError`-base\
    \ editor/missing-bundle decision \u2014 this epic explicitly does not resolve\
    \ it."
