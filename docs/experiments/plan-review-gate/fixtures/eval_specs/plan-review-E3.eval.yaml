- input: "## Context / Problem\nThe 7\u201321 Aug 2026 defect review (221 bug tickets,\
    \ 196 real, 56 git-dated to changes inside the window) found that every hotspot\
    \ is the same decision written in two to seven places: a fix lands in one copy\
    \ and its twin stays broken, so families arrive as three-ticket instalments (sidecar\
    \ keying \xD73, git_adapter by-path loads \xD73, nested-pytest --basetemp \xD7\
    3, comment key/send fit \xD75, compaction \xD76). The spawner consolidation (`c98d976199`)\
    \ and its static guard `tests/unit/test_spawn_detached.py::test_the_detached_spawn_signature_appears_only_in_proc`\
    \ showed the durable shape: one implementation plus a test that a second copy\
    \ cannot merge (`7213e082b5` was caught by it two days later).\n\n## Approach\n\
    Each child collapses one duplicated computation into one shared module, keeps\
    \ every current behaviour pinned by the tests named in the child, and lands with\
    \ a construct-uniqueness guard that asserts on the construct's distinctive atoms\
    \ (not on internals), with an explicit `# <construct>-ok: <reason>` escape marker\
    \ as `scripts/check_raw_git_writes.py` uses. Children are independent; order by\
    \ blast radius (store paths and stamped lock first, merge recovery last).\n\n\
    ## Guard-test construction rule (applies to every child; approved 2026-08-21)\n\
    A construct-uniqueness guard pins how MANY implementations exist, never how the\
    \ one implementation works. Build it as `tests/unit/test_spawn_detached.py::test_the_detached_spawn_signature_appears_only_in_proc`\
    \ is built:\n1. Scan every file under `src/rebar` EXCEPT the owner module; refactoring\
    \ inside the owner cannot fail the guard.\n2. Match on the conjunction of atoms\
    \ that constitute the construct (for example `os.O_EXCL` together with `stamped_file_is_stale`),\
    \ or on an AST shape (call target plus argument position) as `scripts/check_raw_git_writes.py`\
    \ does \u2014 never on a single common token such as `os.open` or `.lock`.\n3.\
    \ Provide a line marker with a mandatory reason (`# <construct>-ok: <why>`) for\
    \ a legitimate second use, so the exception is visible in review instead of silently\
    \ absent.\n4. Where the construct has no distinctive atoms, assert the definition\
    \ count of the named symbol instead (exactly one `def <name>` under `src/rebar`).\n\
    5. The guard proves uniqueness only. Behaviour preservation is proven by the pinning\
    \ tests each child names, which must pass with no assertion edits.\n\n## Scope\n\
    `src/rebar/_store/`, `src/rebar/_commands/` (transition/close/compaction), `src/rebar/_engine/rebar_reconciler/`\
    \ (outbound comments), `src/rebar/llm/` (runtime, failure, gate dispatch), `src/rebar/_mcp_*.py`,\
    \ `tests/` helpers and guards, `.github/workflows/` (predates-gate guard).\n\n\
    ## Acceptance Criteria\n\nThis epic carries **two child classes with different\
    \ guarantees**, and the criteria below are\nscoped accordingly. The **consolidation\
    \ children** \u2014 the fourteen named under \"Child\nresponsibilities\" \u2014\
    \ collapse duplicated logic and are held to no-behaviour-change plus\nnet-negative\
    \ lines. The **hardening children** (`dormant-fibre-pterosaurs`,\n`tireless-ruinable-prairiedog`,\
    \ `bold-abeyant-indri`, `amenable-befuddling-phoenix`,\n`nitro-zombie-mealworm`,\
    \ `diabetic-inorganic-equine`, `emulsible-beneficent-caiman`,\n`compliable-evaluable-mamba`,\
    \ `tectonic-toxophilic-limpet`) close the process gaps the same\ndefect review\
    \ found: they deliberately ADD behaviour and lines, so the two consolidation\n\
    guarantees do not apply to them and they are governed by their own recorded criteria.\n\
    \n- [ ] Every duplicated computation inventoried in the review has exactly one\
    \ implementation on `main`, each delivered by one consolidation child; checked\
    \ by that child's construct-uniqueness test passing in the default `Verified`\
    \ tier.\n- [ ] No **consolidation** child changes a PINNED observable behaviour:\
    \ the pinning tests each such child names pass unchanged (no edits to their assertions);\
    \ checked by `git diff --stat origin/main -- tests/` of each landed change showing\
    \ only additions. Where collapsing copies also converges a latent divergence \u2014\
    \ a copy that lacked a fix its twins already carried \u2014 the child records\
    \ that convergence explicitly in its own description and covers it with a new\
    \ test; the guarantee is that no PINNED behaviour changes silently.\n- [ ] The\
    \ net non-test line count across the **consolidation** children's landed changes\
    \ is negative; checked by summing `git show --numstat` over those children's trailer\
    \ commits.\n- [ ] Each **hardening** child meets its own recorded acceptance criteria;\
    \ checked by that child's own close gate (completion verification + execution-phase\
    \ plan review)."
