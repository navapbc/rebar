- input: "## Summary\n\nThe mcp blue-green deploy block documents itself as INDEPENDENT\
    \ of the review-bot block above\nit, but it sits AFTER that block's `exit 0`.\
    \ When the review-bot is busy, the deferral path\nterminates the whole script,\
    \ so the mcp deploy never runs. The documented independence is false\nin the only\
    \ case where it matters \u2014 a shared `src/rebar` change, which triggers BOTH\
    \ triggers.\n\n## The coupling, in the code\n\nThe mcp blue-green block documents\
    \ itself as \"INDEPENDENT of the review-bot block above\", but\nit sits AFTER\
    \ that block's `exit 0`. When a review is in flight the drain gate defers and\
    \ exits\nthe whole PROCESS, so the mcp block is never reached. Both trigger lists\
    \ start with `src/rebar`,\nso any library change matches BOTH \u2014 and the bot\
    \ drains with a single worker, making\n`in_flight > 0` its normal state.\n\n##\
    \ Observed impact (2026-08-26)\n\nThe review-bot drains its queue with a single\
    \ worker, so `in_flight > 0` is its normal steady\nstate under any pipelining\
    \ \u2014 in practice ~every tick deferred. Two commits merged at 06:47Z were\n\
    still not running forty minutes later, with `deploy_deferrals` at 2-3 per five-minute\
    \ bucket,\nunbroken. One of those commits was the mcp secrets-refresh fix, so\
    \ the deploy path could not\nrepair itself.\n\n## Why the alarm did not catch\
    \ it\n\n`deploy_deferrals` counts deferrals, and deferring is the CORRECT behaviour\
    \ for the bot \u2014 the\nalarm fires on failures, and nothing failed. The mcp\
    \ deploy simply never ran.\n\n## Proposed fix\n\nScope the deferral to the bot\
    \ block instead of terminating the script. `autodeploy.sh` is a\nlinear oneshot\
    \ with no enclosing loop, so `continue` is not available: HOIST the bot block\
    \ into\na new function `deploy_review_bot`, and have the deferral set `bot_deferred=1`\
    \ and `return 0`\nfrom it. Control then reaches the mcp block. The mcp path is\
    \ a pointer-swap that never kills an\nin-flight op, so it has no reason to wait\
    \ on the bot's drain. The function wrapper also keeps\nindentation unchanged,\
    \ so the diff stays a few hunks instead of re-indenting fifty lines.\n\n**The\
    \ tick still stops before the footer.** Letting control past the old `exit 0`\
    \ must not turn\na deferred tick into a completed one, so a guard placed AFTER\
    \ the mcp block and BEFORE the\nfooter exits when the bot deferred (or when either\
    \ component was skipped with a delta still\npending). Everything the footer does\
    \ is therefore skipped exactly as the `exit 0` skipped it:\n`deployed-sha` and\
    \ both component markers stay unadvanced, and `rm -f \"$DEFER_FILE\"` does not\n\
    run \u2014 the deferral EPISODE carries forward, which is what keeps `DEPLOY_DEFER_MAX`\
    \ reachable.\nClearing it on a deferred tick would reset the bound every tick\
    \ and the gate would defer\nforever instead of eventually recreating the container.\
    \ The ONLY behavioural difference from\nthe pre-fix path is that the mcp block\
    \ above already ran.\n\nTake care that the deferral episode bookkeeping (`DEFER_FILE`,\
    \ `:538`) and the\n`record_backoff_failure` semantics stay unchanged for the bot\
    \ path, and that a bot deferral\nstill results in the same exit status the timer\
    \ expects when the mcp block also does nothing.\n\n## Test gap that let this through\n\
    \n`test_shared_src_change_triggers_both_targets` already drives a shared `src/rebar`\
    \ change and\nasserts both targets build \u2014 but with the bot IDLE, so it never\
    \ reaches the deferral path. The\nuncovered case is a shared change while the\
    \ bot is BUSY, the state that made the mcp deploy\nunreachable. The mcp fixture's\
    \ stub also answered only `Dockerfile.mcp`; it now answers the\npath list it is\
    \ asked about.\n\n## Acceptance Criteria\n\n- [ ] A tick where the review-bot\
    \ block DEFERS still reaches the mcp blue-green block, so a\n      shared `src/rebar`\
    \ change deploys the mcp service without waiting on the bot's drain.\n- [ ] The\
    \ bot path's deferral bookkeeping (episode file, bound, markers) and backoff semantics\n\
    \      are unchanged.\n- [ ] Regression coverage drives a tick with BOTH triggers\
    \ matching and the bot busy, asserting\n      the mcp container is still deployed\
    \ \u2014 the case the current stub makes unreachable.\n- [ ] The stub in `test_autodeploy_mcp_bluegreen.py`\
    \ no longer forces bot-block-false, or a new\n      test supplies a git stub reporting\
    \ a shared `src/rebar` change.\n\n## Verification\n\n    .venv/bin/python -m pytest\
    \ tests/scripts/test_autodeploy_mcp_bluegreen.py tests/scripts/test_autodeploy_review_drain.py\
    \ -q -p no:randomly\n    bash -n infra/scripts/autodeploy.sh && shellcheck -S\
    \ error infra/scripts/autodeploy.sh\n\nThe new coverage has teeth when: with the\
    \ `exit 0` restored in the deferral path, the new\nboth-triggers test FAILS (no\
    \ mcp deploy), and with the scoped `return` fix it PASSES.\n## Scope growth across\
    \ review rounds\n\nFour review rounds each found the same shape, each fix exposing\
    \ the next: ONE piece of global\nstate standing in for TWO independently-deploying\
    \ components.\n\n**Completion.** `deployed-sha` is written once, at the footer,\
    \ so any early exit loses the\ncompletion of whichever component DID deploy and\
    \ the next tick redeploys it \u2014 and a bot redeploy\nstop-and-drains, killing\
    \ an in-flight review (bug 34cd). Each component now records its own\nmarker the\
    \ moment it completes, and \u2014 the half that makes the marker do anything \u2014\
    \ each\ncomponent's delta gate is RE-POINTED to diff from that marker instead\
    \ of the global `$DEPLOYED`\nbaseline (`changed_range \"$bot_deployed\" \u2026\
    `, `changed_range \"$mcp_deployed\" \u2026`), so a component\nalready at $TARGET\
    \ computes no delta and is skipped. An absent or unparseable marker falls back\n\
    to `$DEPLOYED`, so the first tick after upgrade decides exactly as it does today.\n\
    \n**Failure.** `record_backoff_failure` wrote one `deploy-backoff` keyed on the\
    \ global `$TARGET`\nand the top-level gate exited the whole script on it \u2014\
    \ so an mcp failure throttled the BOT and a\nbot failure suppressed mcp. Today\
    \ `record_backoff_failure` is called from BOTH blocks (~5 sites\nin the bot block,\
    \ ~10 in the mcp block). This change re-points the mcp block's sites to a new\n\
    mcp-scoped recorder, AFTER WHICH the existing file records bot failures only \u2014\
    \ which is what\nmakes it safe to move its gate from the top of the script into\
    \ the bot block.\n\n**Incompleteness.** A component skipped by its own backoff\
    \ window has not deployed, but nothing\nsaid so, so the footer stamped `$TARGET`\
    \ into its marker for a deploy that never ran \u2014 after\nwhich the next tick\
    \ computed no delta and dropped the change PERMANENTLY. `bot_incomplete` /\n`mcp_incomplete`\
    \ mark it and the footer guard honours both. Each gate tests the DELTA before\
    \ the\nwindow, keeping \"nothing to do\" distinct from \"skipped with work pending\"\
    .\n\n\n\n## Additional acceptance criteria\n\n- [ ] A DEFERRED-bot tick deploys\
    \ mcp but records NOTHING as complete: deployed-sha and\n      bot-deployed-sha\
    \ unadvanced, and the deferral-episode file preserved.\n      Proof: `test_bot_deferral_still_reaches_the_mcp_blue_green_deploy`\n\
    - [ ] An mcp failure does not write the SHARED backoff.\n      Proof: `test_mcp_failure_on_a_deferred_tick_does_not_backoff_the_bot`\n\
    - [ ] An mcp failure does not cause the bot to redeploy on later ticks.\n    \
    \  Proof: `test_a_failed_mcp_deploy_does_not_redeploy_the_bot_every_tick`\n- [\
    \ ] A bot skipped by its backoff window is not recorded as deployed.\n      Proof:\
    \ `test_bot_backoff_tick_does_not_record_the_bot_as_deployed`\n- [ ] An mcp skipped\
    \ by its backoff window is not recorded as deployed.\n      Proof: `test_mcp_backoff_tick_does_not_record_mcp_as_deployed`\n\
    - [ ] An open backoff window with NO pending delta is not reported as a skip.\n\
    \      Proof: `test_an_open_bot_backoff_with_no_pending_delta_is_not_reported_as_a_skip`\n\
    - [ ] The mcp backoff window skips mcp without stopping the tick.\n      Proof:\
    \ `test_mcp_backoff_window_skips_the_mcp_deploy_without_stopping_the_tick`\n-\
    \ [ ] mcp failures still emit `deploy_failed`, tagged `component=mcp`.\n     \
    \ Proof: `test_mcp_failure_keeps_the_deploy_failed_metric_and_names_the_component`"
