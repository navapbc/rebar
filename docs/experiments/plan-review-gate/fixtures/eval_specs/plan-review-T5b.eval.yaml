- input: "## Context / Problem\n\nEvery operator-seeded SSM `SecureString` secret\
    \ managed by `infra/terraform` persists its\nCLEARTEXT value in the remote terraform\
    \ state (S3 `rebar-tfstate-896586841071`, key\n`rebar/prod/terraform.tfstate`,\
    \ SSE-S3 not a CMK). The `value = \"CHANGEME\"` +\n`lifecycle { ignore_changes\
    \ = [value] }` pattern stops terraform WRITING the secret from git, but\nterraform\
    \ still READS the live value into `attributes.value` on every refresh/import,\
    \ so the\nplaintext lands in state. This collapses the secret tier to the state-bucket\
    \ ACL (`terraform state\npull` renders 23 secrets in cleartext to any state-bucket\
    \ reader), and versioning retains the tail\nacross rotation. Root cause is proven;\
    \ see the evidence comments below.\n\n## Decision (operator-approved \u2014 Option\
    \ 1)\n\nMigrate every operator-seeded SSM `SecureString` SECRET from the `value\
    \ = \"CHANGEME\"` +\n`ignore_changes = [value]` pattern to terraform WRITE-ONLY\
    \ arguments `value_wo` + `value_wo_version`.\nWrite-only arguments are, by design,\
    \ NEVER persisted to state \u2014 the structural fix. Non-secret\n`String` config\
    \ params (`jira-url`, `jira-user`, `jira-project`) and the terraform-GENERATED\n\
    `SecureString` `opcert_origin_guard` (its value is `random_password.opcert_guard.result`,\
    \ already in\nstate via the random resource + the API-Gateway header, so `value_wo`\
    \ gives no net benefit) are OUT\nof scope and stay as-is.\n\n## Approach\n\nThree\
    \ resources carry the seeded-secret antipattern and migrate to `value_wo`/`value_wo_version`\n\
    (drop `value` and the `lifecycle { ignore_changes = [value] }`):\n- `aws_ssm_parameter.rebar_secrets`\
    \ (for_each, 18 params) \u2014 `infra/terraform/ssm.tf:90`\n- `aws_ssm_parameter.opcert_ed25519_key`\
    \ \u2014 `infra/terraform/opcert.tf:52`\n- `aws_ssm_parameter.cookie_signing_secret`\
    \ \u2014 `infra/terraform/auth_sso.tf:39`\n\n`value_wo = \"CHANGEME\"` + `value_wo_version\
    \ = 1` preserves the create-placeholder + operator-seed +\nno-revert contract\
    \ (write-only value is only (re)sent when `value_wo_version` changes, and is never\n\
    compared/stored, so the operator's out-of-band value is never clobbered and `user_data.sh`'s\n\
    `CHANGEME` fail-fast still fires on an unseeded slot). Raise the `versions.tf`\
    \ floors, which today\nsit below the write-only floors: terraform `required_version`\
    \ `>= 1.10` \u2192 `>= 1.11` (write-only args\nneed 1.11; host is 1.15.8) and\
    \ AWS provider `~> 5.0` \u2192 `~> 5.79` (`value_wo` on `aws_ssm_parameter`\n\
    needs 5.79; host/lock is 5.100.0). Rationale: write-only args are the provider-native\
    \ mechanism\npurpose-built for exactly this (keep a secret out of state) \u2014\
    \ no new dependency, no secrets-manager,\nno KMS CMK, minimal blast radius.\n\n\
    ## Scope\n\n- `infra/terraform/ssm.tf`, `infra/terraform/opcert.tf`, `infra/terraform/auth_sso.tf`\
    \ \u2014 migrate the\n  three secret resources to `value_wo`/`value_wo_version`.\n\
    - `infra/terraform/versions.tf` \u2014 raise the terraform + AWS-provider floors.\n\
    - `scripts/check_ssm_secret_state.py` (NEW) \u2014 hermetic structural guard (no\
    \ live AWS) that parses\n  `infra/terraform/*.tf`, and for every `aws_ssm_parameter`\
    \ with `type = \"SecureString\"` flags the\n  persisted-secret antipattern (a\
    \ quoted string-literal `value` and/or `ignore_changes = [value]`)\n  and requires\
    \ `value_wo` be paired with `value_wo_version`. Allows the generated-value case\n\
    \  (`value` = an expression, no `ignore_changes`). Modeled on `scripts/check_templatefile_escapes.py`.\n\
    - `Makefile` \u2014 wire the new guard into `make lint` (alongside `check_templatefile_escapes.py`\
    \ at\n  `Makefile:302`).\n- `tests/unit/test_check_ssm_secret_state.py` (NEW)\
    \ \u2014 pins RED\u2192GREEN + mutation teeth + committed\n  tree clean + make-lint\
    \ wiring, mirroring `tests/unit/test_check_templatefile_escapes.py`.\n- `docs/adr/0105-ssm-secrets-never-in-terraform-state.md`\
    \ (+ `docs/adr/.numbers/0105`, regenerated\n  `docs/adr/README.md`) \u2014 record\
    \ the decision, extending ADR 0008 and relating to ADR 0046.\n- `infra/runbooks/ssm-secret-write-only.md`\
    \ (NEW) \u2014 declare/seed/rotate via write-only args, and the\n  operator REMEDIATION\
    \ procedure (state scrub + crown-jewel rotation).\n\n## Testing\n\n- RED first:\
    \ the new guard/test fail against the CURRENT tree for the right reason (three\n\
    \  SecureString secrets persist a `value` literal + `ignore_changes = [value]`);\
    \ proven before the\n  fix.\n- GREEN after: guard + test pass once the three resources\
    \ use `value_wo`/`value_wo_version`.\n- Mutation teeth: reverting any one param\
    \ to `value = \"\u2026\" + ignore_changes = [value]` returns the\n  guard to RED\
    \ (asserted by `tests/unit/test_check_ssm_secret_state.py`).\n- `terraform validate`\
    \ in `infra/terraform` passes (static; no plan/apply against the real backend\
    \ \u2014\n  that prod mutation is the deferred operator ticket, linked `discovered_from`).\n\
    - `make lint` passes (ruff + the new guard + siblings).\n\nNo secret VALUE is\
    \ printed, logged, or committed by the fix or its verification \u2014 the guard\
    \ digests\nstructure only, never values.\n\n## Acceptance Criteria\n\n- [ ] All\
    \ three seeded-secret `SecureString` resources (`rebar_secrets`, `opcert_ed25519_key`,\n\
    \      `cookie_signing_secret`) use `value_wo` + `value_wo_version` and carry\
    \ no `value`/`ignore_changes\n      = [value]`; verified by `scripts/check_ssm_secret_state.py`\
    \ exiting 0 and by reading the diff.\n- [ ] `scripts/check_ssm_secret_state.py`\
    \ is RED on the pre-fix tree and GREEN on the post-fix tree,\n      and a one-param\
    \ mutation returns it to RED; verified by `tests/unit/test_check_ssm_secret_state.py`.\n\
    - [ ] The guard is wired into `make lint`; verified by a wiring test and by `make\
    \ lint` exit 0.\n- [ ] `versions.tf` floors are terraform `>= 1.11` and AWS provider\
    \ `~> 5.79`; verified by reading the file.\n- [ ] `terraform validate` in `infra/terraform`\
    \ succeeds; verified by its exit 0.\n- [ ] ADR 0105 exists with marker `docs/adr/.numbers/0105`,\
    \ the index is regenerated, and\n      `scripts/check_adr_numbers.py` + `python\
    \ scripts/gen_adr_index.py --check` pass.\n- [ ] `infra/runbooks/ssm-secret-write-only.md`\
    \ covers declare/seed/rotate + the exposure-remediation\n      procedure and cross-links\
    \ ADR 0105; verified by reading it.\n- [ ] A deferred OPERATOR `task` ticket for\
    \ the prod remediation (apply \u2192 verify no SecureString value\n      in `terraform\
    \ state pull` \u2192 rotate crown-jewels) exists and is linked `discovered_from`\
    \ this\n      ticket; verified by `show_ticket`. [non-codebase] evidence: the\
    \ new ticket id recorded in a comment.\n- [ ] No credential value is printed,\
    \ logged, or committed by the fix or its verification."
