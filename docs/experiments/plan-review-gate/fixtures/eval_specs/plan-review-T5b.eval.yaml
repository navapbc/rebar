  id: plan-review-T5b-fire-3
  input: "## Context\nConstruction-time or preview-time repair would violate read-only\
    \ commands. Retirement completion is safe only after provider preflight and exclusive\
    \ pass ownership succeed and under-lock staleness validation passes, and it must\
    \ precede any remote observation so the pass cannot interleave fresh liveness\
    \ evidence with completion.\n\n## Outcome\nInvoke the S3 recovery operation once\
    \ at the validated write-bearing reconcile boundary before remote observation;\
    \ every read-only or filtered path stays zero-write for this operation.\n\n##\
    \ Verified invocation site (corrected from this task's original impact set)\n\
    The original plan named `run_differs.py`. That is wrong, and the ordering it asked\
    \ for is unreachable there. Verified by reading the spine:\n\n- `reconcile._load_snapshots`\
    \ is called at `reconcile.py:222`; inside it the binding store is constructed\
    \ (`:280`), the under-lock staleness gate runs (`:281-282`), `scoped_ids` is computed\
    \ (`:287`), and the FIRST remote issue fetch happens (`:328-333`).\n- `bind_operation_runtime`\
    \ (the immutable operation/config snapshot) is composed at `:227`, after `_load_snapshots`\
    \ returns and therefore after that fetch.\n- `run_differs()` is invoked at `:231`,\
    \ also after the fetch; the existing `recover_pending_bindings` call at `run_differs.py:418`\
    \ already runs post-fetch.\n\nSo the invocation goes in `reconcile.py`, after\
    \ the staleness gate and the `scoped_ids` computation and before the fetch. `run_differs.py`\
    \ is NOT edited by this task. The real size constraint is `reconcile.py` at 794\
    \ of the 800-line cap \u2014 SIX lines of headroom, and RP-04 S7.3.a is editing\
    \ the same file \u2014 so the spine gets ONE call line plus a short comment, and\
    \ no new import.\n\n## Plan\n1. Add `BindingRecovery.repair_at_write_boundary(*,\
    \ persist, scoped)` owning the guard: it returns an empty outcome without any\
    \ classification or write unless the pass is write-bearing (`persist`) and unscoped\
    \ (`not scoped`). Expose it through the facade so the spine needs no new import.\
    \ The unguarded `complete_interrupted_retirements()` from T1 keeps its semantics\
    \ and stays the direct-test entry point.\n2. Call it from `reconcile.py` on one\
    \ line, positioned after the under-lock staleness validation and before the first\
    \ remote issue fetch, binding walk, differ, or lifecycle mutation.\n3. Treat a\
    \ durable tombstone as authoritative until explicit `unretire`; an automatic 200,\
    \ `clear_absent`, or same-key confirmation cannot revoke it.\n4. On completion\
    \ failure, preserve the overlap for retry. Because the call precedes the fetch,\
    \ a failure structurally cannot have made a remote call.\n\n## Testing\n- Order\
    \ tests pin the call between the staleness gate and the first fetch, and assert\
    \ zero provider calls when completion aborts.\n- A read-only table drives construction,\
    \ load, reconcile-check, dry-run, preview, selection, and filtered paths and asserts\
    \ zero repository writes attributable to this operation.\n- Guard tests exercise\
    \ `repair_at_write_boundary` directly across the persist/scoped matrix and prove\
    \ the non-write-bearing cases do no classification at all.\n\n## Acceptance Criteria\n\
    - [ ] A live write-bearing unscoped pass completes exact recovery after the under-lock\
    \ staleness gate.\n- [ ] That completion happens before the pass's first remote\
    \ issue observation.\n- [ ] Construction, load, reconcile-check, dry-run, preview,\
    \ selection, and filtered paths perform zero writes from this operation.\n- [\
    \ ] A completion failure performs zero remote calls and preserves the overlap\
    \ as recoverable evidence.\n- [ ] An automatic success, absence reset, or same-key\
    \ confirmation does not override the tombstone.\n- [ ] Explicit `unretire` removes\
    \ the tombstone and therefore removes the completion candidate.\n- [ ] `run_differs.py`\
    \ is unmodified and the pre-existing create-recovery gate is unchanged.\n\n##\
    \ Out of scope\nRich-emission caller cutover, ADR finalization, and any change\
    \ to the pre-existing create-recovery gate (its no-write-pass remote-write defect\
    \ is filed separately as `easygoing-tremendous-frogmouth`)."
