  input: "## Context / Problem\nGerrit change 1757 (merged as 065af7c163, ticket small-delicious-loris)\
    \ taught rebar._store.sync._union_merge to recover ONE merge-abort class: untracked\
    \ files origin wants to create (\"untracked working tree files would be overwritten\
    \ by merge\") \u2014 quarantine the named paths, retry once. The second proven\
    \ abort class, variant (b), remains unhandled: tracked files with local working-tree\
    \ changes \u2014 in practice deletions of tracked per-ticket artifacts left by\
    \ an interrupted compaction fold \u2014 make `git merge origin/tickets` abort\
    \ with \"Your local changes to the following files would be overwritten by merge\"\
    . The abort leaves reconverge unable to advance and strands local ticket commits\
    \ off origin (live recurrence recorded on e72e-259d-5ee7-4e73: 119 tracked `.archived`\
    \ deletions wedged the store). Sibling story untrack-runtime-markers removes the\
    \ marker sub-class at its source, but an interrupted fold can still leave tracked\
    \ EVENT-file deletions (compact_txn renames sources to `*.retired` \u2014 a rename\
    \ of a tracked file is a tracked deletion + an untracked creation), so reconverge\
    \ must self-heal this class regardless.\n\n## Approach\nExtend the recovery seam\
    \ 1757 added in src/rebar/_store/sync.py: on merge failure, additionally detect\
    \ the \"Your local changes to the following files would be overwritten by merge\"\
    \ signature and parse the paths git names (same parsing pattern as the merged\
    \ `_untracked_overwrite_paths`). For each named path, act by its status: a working-tree\
    \ DELETION of a tracked file (`git status --porcelain` reports ` D`) is restored\
    \ non-destructively via `git checkout -- <path>` (content already at HEAD \u2014\
    \ nothing can be lost); a working-tree MODIFICATION is first copied into the same\
    \ quarantine directory 1757 established (`<git-common-dir>/reconverge-quarantine/<utc-ts>/`)\
    \ and then restored via `git checkout -- <path>` (the local bytes are preserved\
    \ in quarantine, the HEAD bytes unblock the merge). Then retry the merge once.\
    \ Any other failure \u2014 including a genuine index/content conflict \u2014 keeps\
    \ today's behavior exactly: `git merge --abort`, keep local, hint `rebar fsck-recover`.\
    \ Positive rationale: this reuses the exact recovery shape already reviewed and\
    \ merged for variant (a) (parse-what-git-names, move-never-delete, single retry,\
    \ fall back to abort), extending one proven seam rather than adding a second recovery\
    \ mechanism.\n\n## Scope\n- src/rebar/_store/sync.py \u2014 detect + parse the\
    \ local-changes abort; restore/quarantine the named paths; single retry.\n- tests/unit/test_store_sync_reconverge.py\
    \ \u2014 extend the 1757 test module with RED-first coverage for variant (b):\
    \ tracked-deletion fixture and tracked-modification fixture.\n\n## Testing\n-\
    \ RED first: fixture tracker where HEAD tracks a file, the worktree deletes it,\
    \ and origin/tickets modifies it; assert the union merge currently aborts and\
    \ HEAD is un-merged, for the local-changes reason specifically.\n- GREEN: same\
    \ fixture after the fix \u2014 merge completes with both parents, the local-only\
    \ commit stays reachable, the deleted file is back at its merged content.\n- Modification\
    \ path: worktree-modified tracked file named by the abort \u2014 quarantine copy\
    \ exists with the local bytes, merge completes.\n- Guard: a genuine content conflict\
    \ (both sides commit different content) still aborts and keeps local (unchanged\
    \ behavior); `.tmp-event-*` and paths git does not name are untouched.\n- Mutation\
    \ check: skipping the restore step returns the RED assertion.\n\n## Acceptance\
    \ Criteria\n- [ ] A reconverge whose union merge aborts only on local changes\
    \ to tracked store-artifact paths now completes keeping both parents, with no\
    \ local commit orphaned; checked by the new RED-to-GREEN tests.\n- [ ] A worktree\
    \ modification named by the abort is preserved byte-for-byte in the quarantine\
    \ directory before restore; checked by test comparing quarantined bytes.\n- [\
    \ ] A genuine merge conflict still aborts, keeps local, and hints fsck-recover;\
    \ checked by the guard test.\n- [ ] `make lint` and `make typecheck` clean; lands\
    \ via Gerrit (LLM-Review +1 AND Verified +1) before close."
