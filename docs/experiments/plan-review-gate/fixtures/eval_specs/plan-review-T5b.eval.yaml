  input: '## Why

    Pass-4 coaching (move registry + deterministically rendered notes + guide_url
    deep-links into docs/plan-review-criteria-guide.md) currently runs only over SURVIVING
    ADVISORY findings. Blocking findings - the ones an agent MUST remediate before
    claim - get no coaching note and no guide_url. Field data: the E6/F1 oracle-strictness
    finding family recurred 3-5 consecutive rounds on tickets fde0/0ee8/76d2 because
    agents reworded ACs instead of adding the demanded executable oracle; a guide
    link plus a move-shaped nudge on the block itself is the cheapest one-round-remediation
    lever. The reviewer/writer separation must be preserved exactly as-is: moves come
    from the locked registry, prose is rendered deterministically, the C1 subject
    validator still rejects code/imperatives/solutions.


    ## What

    Coaching over blocking findings must be widened at BOTH execution seams, plus
    the prompt and renderer:

    - Bespoke (non-workflow) path: widen the Pass-4 coach invocation in src/rebar/llm/plan_review/passes.py
    from advisory-only to advisory+blocking, tagging each coaching entry with the
    source finding''s decision ("block" | "advisory").

    - Workflow path (the v3 engine, authoritative in production): in src/rebar/llm/workflow/gates/plan-review.yaml,
    widen the coach_inputs binding (currently `surviving: ${{ steps.decide.outputs.surfaced
    }}`) to the union of blocking + surfaced advisory findings, and update the coach_gate
    branch `when:` condition so the coach step fires when EITHER blocking or advisory
    findings survive. In src/rebar/llm/workflow/workflow_ops.py, widen `plan_review_coach_inputs`
    (reads ctx.inputs "surfaced") and `plan_review_coach` (reads ctx.inputs "surviving")
    to carry the widened set.

    - Prompt + listing header: src/rebar/llm/reviewers/plan_review_coach.md currently
    frames the task as "SURVIVING advisory findings" and src/rebar/llm/review_kernel/coach.py
    hardcodes the listing header `## Surviving advisory findings (by id)`. Reword
    both to decision-neutral "surviving findings" (parameterize the header label),
    so the prompt never contradicts its input.

    - guide_url: attach to blocking findings'' coaching notes exactly as for advisories
    today (src/rebar/llm/plan_review/orchestrator.py:515-530 passthrough-additive
    field).

    - CLI: `rebar review-plan` renders the coaching line + guide link for blocking
    findings the same way it does for advisories (src/rebar/_cli/_llm_commands.py,
    the existing `-> <coaching> [<link>]` renderer).

    - Sidecar: coaching entries for blocking findings flow through the existing coaching[]
    persistence unchanged (additive; the decision tag is a new optional field on coaching
    entries, not a schema break).


    ## Scope

    IN: pass-4 finding-set widening on both seams (passes.py + plan-review.yaml/workflow_ops.py),
    decision tag, prompt/header rewording, guide_url attach, CLI rendering, unit tests.
    OUT: any change to the move registry contents, the subject validator, blocking/advisory
    decisions, thresholds, or the sidecar schema beyond the optional decision tag.
    OUT: conflict-detection between findings (parked epic grumpy-gland-rose).


    ## Acceptance Criteria

    - [ ] A plan review whose verdict contains blocking findings emits a coaching
    entry (move_id + rendered note + guide_url) for each blocking finding. Oracle:
    new unit test asserting a synthetic verdict with 1 block + 1 advisory yields 2
    coaching entries, where the block''s entry carries decision="block" and guide_url
    and the advisory''s carries decision="advisory" and guide_url; `python -m pytest
    tests/unit -k "coach" -x` green.

    - [ ] The workflow path produces the same widening: a workflow-executed plan review
    over a verdict with blocking findings passes the union to the coach op. Oracle:
    unit test over `plan_review_coach_inputs`/`plan_review_coach` (tests/unit/workflow/)
