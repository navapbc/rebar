- input: "## Context / Problem\nDiscovery (`examples/agent-skills/rebar-janitor/phases/discovery.md`)\
    \ covers tests only as\nsmelly/missing tests (#7 `:51-52`; an `rg` count of files\
    \ with <2 assertions,\n`references/patterns.md:116-118`) and change-detector/duplication/dead-path\
    \ health (#11 `:119-132`).\nNeither asks: **can this assertion fail when the contract\
    \ is violated?** No concern covers oracle\nstrength or contract-coverage gaps\
    \ (a documented promise no test fails on). And\n`phases/verification.md:115` anchors\
    \ `prod_impact = none` at \"docs/test-only\", so a weak-test\nfinding sits below\
    \ the impact floor and is dropped however critical the contract it fails to guard.\n\
    Six weak-oracle bugs escaped 7-21 Aug 2026 (e.g. `0e1d-c698-c38d-4c3e`,\n`9bb7-4430-1202-4d93`);\
    \ no pre-bug janitor run would have surfaced any.\n\nThe rubric naming these classes\
    \ ALREADY exists at `src/rebar/llm/reviewers/code-review-tests.md`\n(`fail-open\
    \ oracle` `:56-70`, `unrealistic fault injection` `:45-49`, ten false-positive\
    \ guards\n`:71-106`) but runs **only on a diff**, never on the resting tree: the\
    \ gap is reach, not vocabulary.\nApproved 2026-08-21. Testing philosophy: behavioural/contractual,\
    \ not coverage.\n\n## Approach\nAdd concern **#12 \"Oracle strength and contract\
    \ coverage\"** to `phases/discovery.md`, sharded by\ntest-tree region as #11 is\
    \ (`:131-132`) and cross-referenced from #11.\n\n- **Brief.** Per test, name the\
    \ contract under test (docstring, ADR, `--help` text, schema\n  statement) and\
    \ the oracle (its assertion set). Finding = the oracle cannot fail on a violation\
    \ of\n  that contract, proven by a concrete `escape_input` (a state the oracle\
    \ accepts but the contract\n  forbids). Same proof shape for contract-coverage\
    \ gaps.\n- **Cite `code-review-tests.md`; never restate it** \u2014 where it exists\
    \ (a rebar checkout) it is the\n  single source of truth. **Portable fallback\
    \ (required \u2014 janitor also runs on repos lacking it):**\n  `references/patterns.md`\
    \ carries a portable core: the oracle-strength question, the `escape_input`\n\
    \  requirement, the false-positive floor.\n- **Already covered; #12 must NOT re-declare\
    \ as new:** absent-string / empty-capture assertions with\n  no producer-liveness\
    \ check -> `fail-open oracle` `:56-70`; a race test whose primary\n  synchronization\
    \ is a timing sleep -> `:49`; every do-not-flag guard -> (ii)-(x) `:71-106`.\n\
    - **Do not flag:** apply guards (ii)-(x) (`code-review-tests.md:71-106`) by reference\
    \ \u2014 mocks at\n  external boundaries, exact-value asserts on pure functions,\
    \ output greps with established producer\n  liveness, Rule-5 structural greps,\
    \ strict `xfail` with a named removal condition, secondary\n  settling sleeps,\
    \ bare \"no test for X\" with no violating input.\n- **Additional instances**\
    \ (verified absent from the rubric), named by #12: a fixture mutating\n  state\
    \ it did not create; an equivalence test whose two sides use different hardening\
    \ helpers; an\n  oracle encoding a policy preference the contract does not state.\n\
    - **Evidence shape.** New schema fields: `contract` (quote + `path:line`), `oracle`\
    \ (quote +\n  `path:line`), `escape_input`, `antipattern_id` (from `code-review-tests.md`\
    \ where one applies,\n  else the portable-core id), `scope` (sibling-site count).\
    \ `discovery.md:152` \u2014 the schema handed\n  to every discovery subagent \u2014\
    \ hardcodes \"eleven concerns\" -> \"twelve\".\n- **Verification.** Amend `phases/verification.md:115`\
    \ so a test-only finding takes `prod_impact`\n  from the **production contract\
    \ it fails to guard**, not from the file being under `tests/`.\n  `harm_reachable`\
    \ needs a tree-state demonstration (run against a deliberately broken stub, or\n\
    \  reason the `escape_input` through the assertion); else the existing reclassification\
    \ at\n  `verification.md:49-50` applies \u2014 `HARDENING`, not `DEFECT`.\n- **Feedback\
    \ loop.** A #12 finding whose class the diff rubric lacks becomes a Phase-5 ticket\n\
    \  adding it to `code-review-tests.md`.\n- **Frontmatter constraint.** `SKILL.md`'s\
    \ `description` enumerates the concerns and is **980 chars\n  against the 1024\
    \ cap** (`scripts/check_skill_frontmatter.py`) \u2014 an oracle-strength mention\
    \ must\n  fit the 44 chars of headroom or displace wording.\n\n## Scope\nUnder\
    \ `examples/agent-skills/rebar-janitor/`: `phases/discovery.md` (#12, the #11\
    \ cross-reference,\nschema fields, \"eleven\"->\"twelve\" at `:152`); `phases/verification.md`\
