    \ list (verified by\n`grep -rln \"janitor\" docs/`). `tests/unit/test_check_skill_frontmatter.py`\
    \ (the real skill-lint\ntest; `tests/unit/test_skill_frontmatter.py` does not\
    \ exist) needs no edit \u2014 it tests the script,\nnot skill bodies. `tests/unit/test_skill_shared_sync.py:16-17`\
    \ excludes rebar-janitor, so no\nshared-copy sync applies.\n\n## Testing\nDocumentation-only;\
