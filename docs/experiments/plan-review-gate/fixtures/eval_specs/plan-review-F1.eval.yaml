    \ 0.\n- [ ] `verification.md` requires a tree-state demonstration before a #12\
    \ finding can be `DEFECT`: `grep -qi \"tree-state demonstration\" $J/phases/verification.md`\
    \ exits 0.\n- [ ] Frontmatter still lints: `python scripts/check_skill_frontmatter.py`\
    \ exits 0 and reports `PASS: 4 SKILL.md file(s)`.\n- [ ] No collateral edits:\
    \ `git diff --name-only origin/main` lists only files named in Scope.\n- [ ] Gates\
    \ pass: `pytest tests/unit/test_check_skill_frontmatter.py tests/unit/test_skill_shared_sync.py\
    \ -q` and `make lint` exit 0.\n- [ ] [operator-attested] Dry run on `git checkout\
    \ 6fb4d801c9^` (`obvious-saline-gerbil` pre-fix tree) reports the fail-open absent-string\
    \ oracle with a concrete `escape_input`; transcript posted as a comment. Non-gating:\
    \ stochastic output, recorded for calibration."
