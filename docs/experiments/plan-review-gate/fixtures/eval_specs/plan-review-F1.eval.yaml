  input: '## Context / Problem


    `docs/plan-review-gate.md:795` makes a blanket claim-denial statement, contradicting
    the bug exemption in `src/rebar/_commands/gates.py:45` and the guide''s own exception
    at lines 474 and 1477. The approved clarification is sequence-sensitive.


    ## Approach


    Correct the maintained guide directly. State that a bug may be claimed without
    plan review to perform root-cause analysis; after RCA, a complex bug with an implementation
    plan and file impact must receive LLM plan review before remediation begins. Preserve
    behavioral code/tests as authority.


    ## Scope


    - `docs/plan-review-gate.md`

    - `src/rebar/_commands/gates.py` and `tests/unit/test_bug_review_tier.py` as behavior
    evidence/checks


    ## Testing


    Run focused bug-review tier tests and add/update a documentation assertion that
    distinguishes claim-time exemption from implementation-time review.


    ## Acceptance Criteria


    - [ ] The guide says bugs are exempt from plan review at claim time so RCA can
    establish remediation shape.

    - [ ] The guide says complex bugs require plan review after RCA, once implementation
    plan and file impact exist, before implementation.

    - [ ] The guide does not imply every bug needs review before claim or that complex
    bug remediation is permanently exempt.

    - [ ] Focused bug-review tier tests and the documentation check pass.'
