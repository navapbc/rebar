  input: '## Context


    The project has audience guidance distributed across AGENTS.md, CONTRIBUTING.md,
    docs/README.md, and individual documents. It lacks one current-state policy that
    distinguishes durable records, maintained documentation, shipped help, comments,
    generated artifacts, and protected evidence. The audit ticket minimum-rainy-fawn
    approved F01 and rejected broad prose cleanup and general prose validation.


    ## Current enforcement and history


    Ticket forworn-zanyish-narwhale added generated markers, two contributor tables
    in docs/README.md, and tests/unit/test_generated_surface_markers.py after repeated
    changes edited derived outputs instead of their sources. The test owns the GENERATED
    and GATED_HAND_AUTHORED collections and parses the tables from docs/README.md.
    CONTRIBUTING.md points to the existing landing-page anchor. This change preserves
    both collections, every catalog row, and all marker checks. It relocates the catalog
    so the landing page can remain a navigation surface.


    ## Plan


    Add docs/documentation-policy.md as the current policy for tickets, ADRs, internal
    documentation, external documentation, shipped help, comments, generated artifacts,
    and protected evidence. Define the audience, purpose, lifecycle, canonical source,
    use of citations, correction method, exclusions, and examples for each category.
    Include the approved punctuation, paragraph-shape, diction, and formal-voice rules
    for new or edited maintained text. State that ticket events remain append-only
    and that ADR decision substance is preserved through annotations, errata, supersession,
    or replacement ADRs.


    Add docs/generated-artifacts.md as the contributor inventory. Move the existing
    generated and parity-gated tables from docs/README.md without changing their rows.
    Update the existing marker test to parse the new inventory while preserving GENERATED
    and GATED_HAND_AUTHORED. Replace the old CONTRIBUTING.md anchor and add concise
    policy pointers in AGENTS.md, CONTRIBUTING.md, and docs/README.md.


    ## Exclusions


    - No edits to generated outputs, ADR decision substance, ticket events, historical
    evidence, protected evidence, or commit history.

    - No repository-wide prose rewrite.

    - No prose or comment validator.

    - No F05 ownership descriptor, generated catalog generator, or new ADR.


    ## Acceptance Criteria


    - [ ] docs/documentation-policy.md defines all eight documentation categories
    and gives each category an audience, purpose, lifecycle, canonical source, citation
    rule, correction method, exclusions, and at least one example.

    - [ ] The policy states the approved punctuation, paragraph-shape, diction, and
    formal-voice rules for new or edited maintained text.

    - [ ] The policy requires append-only ticket correction and substance-preserving
    ADR correction through annotations, errata, supersession, or a replacement ADR.

    - [ ] docs/generated-artifacts.md contains the same generated and parity-gated
    table row sets that docs/README.md contained before this change.

    - [ ] tests/unit/test_generated_surface_markers.py retains the existing GENERATED
    and GATED_HAND_AUTHORED values and passes while reading docs/generated-artifacts.md.

    - [ ] AGENTS.md, CONTRIBUTING.md, and docs/README.md each link to docs/documentation-policy.md.

    - [ ] CONTRIBUTING.md links to docs/generated-artifacts.md and no longer points
    to the removed docs/README.md generated-artifacts anchor.

    - [ ] The targeted marker test, make lint, make typecheck, and the project test
    gate pass.'
