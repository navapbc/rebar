  input: "Add an `mcp` autodeploy target to `infra/scripts/autodeploy.sh` implementing\
    \ the ADR 0079\namendment's blue-green pointer-swap, so on-box `rebar-mcp` tracks\
    \ `origin/main` without killing an\nin-flight certified op. Scope: MCP deploy\
    \ path only (service/edge = esok, secrets = avians); no\nnew timer (`rebar-autodeploy.timer`\u2192\
    `.service` runs `autodeploy.sh`).\n\n## Approach (blue-green, ADR deft-evolutive-mosasaur\
    \ / 0079 amendment)\nModel on the LOCAL `origin/main` updater (`sticky-genetic-narwhal`):\
    \ immutable release + atomic\npointer swap + retire-when-idle, NOT stop-and-drain.\
    \ On an MCP source change:\n1. Build + tag immutable `compose-mcp:<target-sha>`\
    \ (`docker compose build mcp`).\n2. **Memory pre-check BEFORE the 2x overlap**\
    \ (t4g.large 8 GiB): read `MemAvailable`\n   (`/proc/meminfo`, MB); `< MCP_MEM_MIN_MB`\
    \ (default 1024) ABORTS \u2014 `AUTODEPLOY_MCP_MEM_ABORT`,\n   backoff, start\
    \ NO second container. Unreadable fails OPEN; `MCP_MEM_AVAILABLE_MB` overrides.\n\
    3. Start a NEW container alongside old via **`docker run -d`** (see Run mechanism)\
    \ on the OTHER A/B\n   host port; one-in/one-out, never N.\n4. Health-check the\
    \ NEW `/health` 200 within `MCP_HEALTH_TIMEOUT` (default 120). On failure:\n \
    \  `docker rm -f` new, leave OLD include UNCHANGED, `AUTODEPLOY_ERROR` `mcp-unhealthy`,\
    \ backoff,\n   exit 1 \u2192 next tick retries.\n5. **Atomically flip the nginx\
    \ `/mcp/` upstream**: back up the include, write\n   `server 127.0.0.1:<newport>;`\
    \ to a dotfile temp NOT matching the `mcp-upstream*.conf` glob in\n   the same\
    \ dir, `mv` (atomic rename) over `/etc/nginx/mcp-upstream.conf`, `nginx -t`,\n\
    \   `nginx -s reload`. On failure: RESTORE the backup, `docker rm -f` new, backoff,\
    \ exit 1. Deploy\n   is DONE at a successful reload; never waited on/killed an\
    \ op.\n6. **Retire the OLD container off the critical path**, gated by a \"still\
    \ serving?\" check on its\n   `/health` `in_flight` gauge. Retain newest `MCP_RELEASES_KEEP`\
    \ (default 1); remove older ones\n   ONLY when idle; NEVER kill `in_flight>0`.\
    \ If the managed count exceeds `MCP_RELEASES_CAP`\n   (default 3) because busy\
    \ containers can't be reclaimed, emit `AUTODEPLOY_MCP_RETIRE_CAP`\n   instead\
    \ of killing a live one or growing unbounded. Because `autodeploy.sh` exits early\
    \ when\nup-to-date, also run `mcp_retire_sweep` on the no-op tick (like `reclaim_under_pressure`)\
    \ so\nretirement re-triggers once an old container goes idle.\n\nWhy: eliminates\
    \ bug 7b4a (never-idle shared MCP can't satisfy a gauge-gated drain bound);\n\
    decoupling retire from deploy means it never blocks/kills, and a killed op is\
    \ idempotent so\nretire is safe.\n\n## Run mechanism + the original compose container\
    \ (bootstrap)\n`docker compose up mcp` pins `8091` and would recreate/collide,\
    \ so it CANNOT run the parallel\ncontainer. The NEW container starts via **`docker\
    \ run -d`** from `compose-mcp:<sha>` (helper\n`mcp_run_new`) reproducing the compose\
    \ `mcp:` service on a blue-green HOST port\n`-p 127.0.0.1:<newport>:8091` (container\
    \ port stays 8091; blue-green alternates\n`MCP_PORT_A=8092`\u2194`MCP_PORT_B=8093`,\
    \ RESERVING 8091 for the compose-original so no boot collision):\n`--env-file\
    \ \"$COMPOSE_DIR/.env\"`, and every `REBAR_MCP_*` + `REBAR_OPCERT_*` var with\
    \ the SAME\nliteral defaults compose's `${VAR:-default}` interpolates (`docker\
    \ run` does not interpolate), the\ntwo `:ro` secret bind-mounts, `--restart always`,\
    \ `--stop-timeout 1260` \u2014 a comment marks these MIRRORING compose `mcp:`.\
    \ The live port is read from the include; the new takes the\nother blue-green\
    \ port (or A if the include still points at 8091).\n\nAt boot `compose-up.sh`\
    \ `docker compose up -d`s the whole stack, so the ORIGINAL container is\n`compose-mcp-1`\
    \ on 8091 (seed include\u21928091). The managed MCP set the sweep/cap count over\
    \ = names\nmatching `MCP_CONTAINER_PREFIX` (`rebar-mcp`) OR `MCP_COMPOSE_CONTAINER`\
    \ (default `compose-mcp-1`).\nSo the first deploy's OLD backend is `compose-mcp-1`,\
    \ adopted into retire-when-idle by the same\nliveness gate (autodeploy never runs\
    \ `docker compose up mcp`); cap counts the union. Since\nblue-green never binds\
    \ 8091, on reboot compose recreates `compose-mcp-1` with NO collision and the\n\
    sweep reclaims it when idle. The sweep discovers each old port via `docker port\
    \ <name> 8091/tcp`;\nan unreadable OLD `/health` read is treated as still-serving\
    \ (fail-safe: never kill on unknown).\n\n## Change detection + blast radius\n\
    `MCP_PATHS='src/rebar infra/compose/Dockerfile.mcp infra/compose/docker-compose.yml\
    \ uv.lock pyproject.toml'`\n\u2014 the canonical set esok committed in the `mcp:`\
    \ compose comment. Diffed `deployed..target` it\ntriggers ONLY `mcp`. Since `src/rebar`\
    \ and `docker-compose.yml` are shared with `BOT_PATHS`, a\nshared change triggers\
    \ BOTH targets, each in its own independent `if changed` block. `gerrit` is\n\
    never touched (before/after gerrit-id assert). `flock` still serializes.\n\n##\
    \ Failure interaction with deployed-sha + backoff\nThe `mcp` branch failure is\
    \ FATAL like `review-bot` (`record_backoff_failure` + `exit 1`), so the\nfooter\
    \ advancing `deployed-sha` is not reached. For a shared change review-bot runs\
    \ first; if it\nsucceeds but mcp fails, `deployed-sha` does not advance and BOTH\
    \ retry next tick (review-bot\nrebuild is idempotent) \u2014 a failed mcp deploy\
    \ is always retried.\n\n## Alerting (marker \u2192 observability \u2192 CloudWatch\
    \ \u2192 SNS; NO direct SNS publish)\nautodeploy.sh has no `sns:Publish` path\
    \ and must not gain one. Like every existing autodeploy\nalert: a countable `marker\
    \ AUTODEPLOY_MCP_* {json}` \u2192 `observability.sh`\n`publish_autodeploy_marker_delta`\
    \ greps the journal into a dimensionless `rebar/host` metric \u2192 a\nterraform\
    \ `aws_cloudwatch_metric_alarm` routes it to `aws_sns_topic.alerts.arn`. Adds\
    \ tokens\n`AUTODEPLOY_MCP_RETIRE_CAP` + `AUTODEPLOY_MCP_MEM_ABORT`; two marker-delta\
    \ calls (+ offset files)\npublishing `rebar/host:mcp_retire_cap` + `rebar/host:mcp_mem_abort`;\
    \ two alarms mirroring\n`monitoring_autodeploy.tf`'s dimensionless 900s/2-of-4/Sum>0/notBreaching\
    \ shape. Both tokens are\ndistinct from `AUTODEPLOY_ERROR`.\n\n## Portability\
    \ (`project.portability`)\nTrigger is the on-box systemd/launchd timer polling\
    \ the git mirror \u2014 operation-linked, not CI;\ndrain/flip/retire run in-process;\
    \ works with any/no CI.\n\n## Acceptance Criteria\n- [ ] Tier: **real subprocess/bash\
    \ integration, temp git repos + fake docker/nginx**. Tests stub\n  the box binaries\
    \ onto PATH and run the REAL `autodeploy.sh`, in `tests/scripts/`. Oracles:\n\
    \  - Change detection (REAL temp git repo, two commits): an MCP-only change (touch\n\
    \    `Dockerfile.mcp`) triggers `mcp` and NO review-bot/gerrit rebuild; a review-bot-only\
    \ change\n    (`Dockerfile.reviewbot`) does the inverse; a shared `src/rebar`\
    \ change triggers BOTH\n    independently \u2014 via the docker call log.\n  -\
    \ Cutover order start-new \u2192 health \u2192 flip \u2192 retire (recorded docker/nginx/curl\
    \ log); the deploy\n    returns success WITHOUT waiting on `in_flight` (with `in_flight>0`\
    \ on OLD it still flips and\n    exits 0).\n  - Retire honors liveness: an OLD\
    \ `in_flight>0` container is NOT killed (no `docker rm` of it);\n    over `MCP_RELEASES_CAP`\
    \ the `AUTODEPLOY_MCP_RETIRE_CAP` marker is emitted, no live container\n    deleted.\n\
    \  - Memory pre-check: `MCP_MEM_AVAILABLE_MB < MCP_MEM_MIN_MB` ABORTS \u2014 no\
    \ second container started,\n    `AUTODEPLOY_MCP_MEM_ABORT` emitted, backoff recorded,\
    \ include unchanged.\n  - Health-check OR nginx reload failure leaves the OLD\
    \ include byte-identical\n    (`AUTODEPLOY_ERROR`, backoff, `deployed-sha` not\
    \ advanced); a retry next healthy tick flips it.\n  - `gerrit` container id UNCHANGED\
    \ across an mcp deploy (blast radius).\n- [ ] observability.sh publishes `rebar/host:mcp_retire_cap`\
    \ + `rebar/host:mcp_mem_abort`; two\n  terraform CloudWatch alarms route them\
    \ to `aws_sns_topic.alerts.arn` (mirror\n  `monitoring_autodeploy.tf`).\n\n##\
    \ Compat / rollback\nAdditive (new `if changed \"$MCP_PATHS\"` block + no-op sweep);\
    \ other targets unchanged (existing\nautodeploy tests stay green). ADRs 0079/0104\
    \ document it. Rollback = revert the additions.\n\nDepends on: deft-evolutive-mosasaur,\
    \ cibophobic-holohedral-esok."
- corpus: rebar
