  id: plan-review-T2-no_fire-0
  input: "# Enforce release-source authorization + version lockstep before publication\n\
    \nRe-anchor the release to the proven OSS pattern (uv model): a single\n`workflow_dispatch`-from-`main`\
    \ workflow that asserts version-lockstep + ancestry,\nthen **builds and publishes\
    \ directly** via PyPA Trusted Publishing (OIDC \u2014 no\nlong-lived secret, no\
    \ tag relay), gated on a required-reviewers `pypi` environment\nre-keyed from\
    \ \"v* tags only\" to \"`main` via dispatch\". The source is reviewed-and-\nlanded\
    \ `main` **by construction**. (Readiness Finding 1 \u2014 verified VALID against\n\
    `release.yml:17-21`, `infra/terraform-github/main.tf:23-101`, `docs/releasing.md`.)\n\
    \n## Why\n\n`main` is constrained to the Gerrit replication deploy key, but `refs/tags/v*`\
    \ was\ndeliberately left open (`infra/terraform-github/main.tf:23-28`) so a human\
    \ can push\na `v*` tag to drive PyPI + MCP-registry + GitHub-Release publication\n\
    (`release.yml:17-21`, jobs `build`/`publish`/`github_release`/`mcp_registry`).\
    \ The\nonly gate anywhere is `if: github.event_name == 'push' && startsWith(github.ref,\n\
    'refs/tags/v')` (release.yml:53/81/116) \u2014 nothing checks that the tagged\
    \ SHA is an\nancestor of (or equal to) reviewed `main`, verifies any Gerrit/CI\
    \ result for that\nexact SHA, or asserts version consistency. A PEP 740\nattestation\
    \ would correctly name this repo's workflow but cannot distinguish a tag\non reviewed\
    \ `main` from a tag on any other commit. Separately, the three version\nvalues\
    \ (`pyproject.toml:10`, `server.json` top-level and `packages[].version`) are\n\
    kept in lockstep only by a manual runbook (`docs/releasing.md`), so a future\n\
    mismatch would publish disagreeing versions across the PyPI / GitHub-Release /\
    \ MCP\nchannels with no machine check.\n\n## What\n\nAdopt uv's proven release\
    \ process and pydantic's pre-build version check, in this\norder of control strength:\n\
    \n- **Primary control \u2014 initiate from `main` via `workflow_dispatch` (source\
    \ reviewed\n  by construction).** Make `workflow_dispatch` the sanctioned release\
    \ trigger, run\n  from the `main` ref. Because the GitHub mirror's `main` is exactly\
    \ the\n  Gerrit-reviewed-and-landed history, releasing from `main` guarantees\
    \ the source is\n  reviewed **by construction** \u2014 the same guarantee the\
    \ wider OSS world gets from\n  \"release only from the protected branch.\" This\
    \ replaces \"accept whatever commit an\n  arbitrary pushed tag points at,\" which\
    \ was the actual divergence from consensus.\n- **Version-lockstep, before build\
    \ (pydantic pattern).** A first job parses the\n  intended version and every manifest\
    \ and asserts exact equality **before build**:\n  `version_input == project.version\
    \ == server.json.version ==\n  each server.json.packages[].version`; mismatch\
    \ fails before build.\n- **Ancestry assertion (belt-and-suspenders).** In the\
    \ same dispatch job, assert the\n  checked-out `main` HEAD is reachable from `origin/main`\
    \ via\n  `git merge-base --is-ancestor \"$GITHUB_SHA\" origin/main` (checkout\
    \ with\n  `fetch-depth: 0` + `git fetch origin main`, since a shallow clone defeats\
    \ ancestry \u2014\n  the repo documents this at `reconcile-bridge.yml:83-88` and\
    \ `verify-identity.yaml`\n  already uses `fetch-depth: 0`). With dispatch-from-`main`\
    \ this is redundant with the\n  ref guard, kept as defense-in-depth.\n- **Build,\
    \ then publish DIRECTLY via PyPA Trusted Publishing \u2014 no tag relay.** The\n\
    \  same workflow builds and then publishes using OIDC (`id-token: write`, the\
    \ existing\n  `pypa/gh-action-pypi-publish` trusted-publishing flow). There is\
    \ **no** intermediate\n  tag push: a tag pushed by the built-in `GITHUB_TOKEN`\
    \ would not trigger a downstream\n  workflow anyway (GitHub's anti-recursion rule),\
    \ so a two-phase relay is avoided\n  entirely, and no PAT / GitHub App secret\
    \ is introduced.\n- **Compose with \u2014 do not regress \u2014 F3 and F4 (this\
    \ story lands last).** Per the\n  dependency chain (F4 \u2192 F3 \u2192 F1), this\
    \ story edits `release.yml` on top of F4's and\n  F3's changes. The dispatch trigger\
    \ must **retain** F3's build-once \u2192 test-wheel /\n  test-sdist \u2192 hash-gated-`publish`\
    \ job graph and F4's `mcp_verify`/`mcp_registry`\n  split + evidence-consolidation\
    \ job \u2014 the trigger change swaps only *how the run\n  starts and is authorized*,\
    \ not the internal job structure. Concretely, **re-key\n  every downstream version\
    \ source and job guard from `github.ref_name` / the\n  tag-context `if:` to the\
    \ `workflow_dispatch` input** (the `github_release` and\n  `mcp_registry` jobs\
    \ derive their version from the input, and their\n  `if: github.event_name ==\
    \ 'push' && startsWith(github.ref, 'refs/tags/v')` guards \u2014\n  which go always-false\
    \ once the tag trigger is removed \u2014 are updated to the dispatch\n  condition).\n\
    - **Human authorization \u2014 re-key the `pypi` environment + a fail-closed preflight\n\
    \  (uv release-gate + PyPA Trusted Publishing).** The `publish` job runs in the\
    \ `pypi`\n  deployment environment with **required reviewers**, so publication\
    \ needs a second\n  human's approval. Because the job now runs in the dispatch\
    \ (`refs/heads/main`)\n  context rather than a tag context, the environment's\
    \ deployment-ref policy is\n  **re-keyed from \"v* tags only\" to \"`main` via\
    \ `workflow_dispatch`\"** with required\n  reviewers \u2014 **no new secret**.\
    \ This is the single most security-critical gate\n  (anyone with `actions:write`\
    \ can start a dispatch; only the environment's reviewers +\n  branch policy enforce\
    \ \"a second human approves each publish\"), so it must not live\n  as an un-versioned\
    \ console setting that could be silently cleared. Rather than couple\n  to the\
    \ AWS-authed `terraform-drift.yml` (a different provider/auth model), enforce\
    \ it\n  **at release time**: a **preflight step queries the GitHub REST API\n\
    \  (`GET /repos/{owner}/{repo}/environments/pypi`) and FAILS the release closed**\
    \ if the\n  environment lacks required reviewers or its deployment-branch policy\
    \ is not\n  `main`-only. This detects drift exactly when it matters (it blocks\
    \ the actual\n  publish, stronger than a periodic plan), is codebase-verifiable\
    \ (the step exists in\n  `release.yml`), and needs only the workflow's own read\
    \ token. Net effect: \"only `v*`\n  tags may publish\" becomes the stronger, self-enforced\
    \ \"only a dispatch-from-`main`,\n  reviewer-approved run may publish \u2014 and\
    \ a release aborts if that protection is\n  missing\".\n- **Tag + GitHub Release\
    \ created AFTER a successful publish (record only).** Once\n  publish succeeds,\
    \ the workflow creates the `v*` tag and the GitHub Release for the\n  record/mirror;\
    \ the tag is an **output**, never a trigger. Concretely, the `github_release`\n\
    \  job (which holds `contents: write`) **drops `--verify-tag`** and calls\n  `gh\
    \ release create \"v<version>\" --target \"$GITHUB_SHA\" --generate-notes --latest\
    \ dist/*`,\n  which **creates the lightweight tag at the release SHA** when it\
    \ does not pre-exist \u2014 so no\n  intermediate tag push / PAT is needed, and\
    \ the version comes from the dispatch input, not a\n  pre-pushed tag. (An existing-release\
    \ run stays idempotent via the `gh release view` path.) The MCP job derives the\n\
    \  version from the dispatch input (not from a tag).\n- **No raw-tag publish path.**\
    \ With the environment keyed to dispatch-from-`main`, a\n  hand-pushed `v*` tag\
    \ cannot reach the `pypi` environment and therefore cannot\n  publish \u2014 this\
    \ eliminates the \"arbitrary pushed tag publishes\" surface that was the\n  original\
    \ finding, rather than merely gating it.\n- **OIDC subject stays environment-scoped\
    \ \u2014 the PyPI trusted-publisher entry is\n  unaffected by the trigger change.**\
    \ The `publish` job keeps running in the `pypi`\n  deployment environment, so\
    \ the OIDC token's `sub` claim stays\n  `repo:navapbc/rebar:environment:pypi`\
    \ \u2014 **environment-scoped and ref-independent**.\n  PyPA Trusted Publishing\
    \ matches on owner/repo + **workflow filename (`release.yml`)\n  + environment\
    \ name (`pypi`)** and does **not** constrain on the git ref/tag, so the\n  tag\u2192\
    dispatch trigger change alters none of the matched fields and the existing\n \
    \ trusted-publisher entry continues to accept the dispatch-context token with\
    \ no\n  reconfiguration. (Were the entry ever ref-constrained, the mismatch would\
    \ fail\n  **loudly** at the `pypa/gh-action-pypi-publish` step on the first dispatch\
    \ run \u2014\n  never silently \u2014 surfacing rather than corrupting a release.)\n\
    - **Verify the guard LOGIC with unit tests (no live staging needed).** Extract\
    \ the\n  three guards into small testable units \u2014 the version-lockstep comparison,\
    \ the\n  ancestry check, and the env-preflight response parsing \u2014 and unit-test\
    \ them with\n  fixtures (matching/mismatching versions; ancestor/non-ancestor\
    \ SHAs; env-protection\n  present/absent JSON). This makes the negative paths\
    \ codebase-verifiable without any\n  live publish. The guard *steps existing*\
    \ in `release.yml` is likewise\n  codebase-verifiable.\n- **Guard-firing is verified\
    \ AUTONOMOUSLY on the real workflow \u2014 no staging fork.** The\n  three abort\
    \ guards precede every publishing job, so they can be demonstrated to fire\n \
    \ WITHOUT any real publish: after this story lands, the agent triggers `release.yml`\
    \ via\n  `gh workflow run` with a non-`main` ref and a mismatched version input,\
    \ and confirms via\n  `gh run view --log` that each run aborts at its guard step\
    \ before build/publish. This\n  needs only the environment's `workflow` scope\
    \ (present) and produces no PyPI/registry\n  side effect. A staging fork + a TestPyPI\
    \ trusted-publisher would only be needed to\n  exercise the *positive* real-publish\
    \ path, which is deliberately NOT part of verifying\n  this story (publishing\
    \ a real release is not a story deliverable); that positive path is\n  covered\
    \ by the unit-tested guard helpers + the codebase-verifiable dispatch-from-`main`\n\
    \  wiring. **Live `pypi` environment config is also autonomous:** the agent reads\
    \ and, if\n  drifted, configures the environment's required reviewers + `main`-only\
    \ branch policy via\n  the admin GitHub API (the environment holds a `repo`-scoped\
    \ admin token), then confirms\n  \u2014 escalating to request access only if the\
    \ API write is denied.\n- **`main.tf` / tag-push restriction stays OUT of scope\
    \ (unchanged, deliberate).**\n  `main.tf:23-28` documents the `tag_lock` was removed\
    \ (no viable GitHub tag bypass\n  actor in this mirror topology) and the contract\
    \ test\n  `tests/unit/test_mirror_lock_terraform.py::test_module_is_main_only_no_tag_lock`\n\
    \  codifies \"no tag lock\". We do not restrict *who* can push a tag; publication\
    \ safety\n  now comes entirely from dispatch-from-`main` + the re-keyed reviewer-gated\
    \ environment.\n- Record the approved SHA, version, manifest versions, and artifact\
    \ hashes in release\n  evidence.\n\n## Scope\n\n- `.github/workflows/release.yml`\
    \ \u2014 switch the trigger to `workflow_dispatch` (version\n  input, run from\
    \ `main`); enforce `github.ref == 'refs/heads/main'`; add the\n  version-lockstep\
    \ + ancestry checks before build; build then publish directly via the\n  OIDC\
    \ trusted-publishing flow gated on the re-keyed `pypi` environment; create the\n\
    \  `v*` tag + GitHub Release after a successful publish (record only). Remove\
    \ the\n  `push: tags: v*` publish trigger (it can no longer reach the re-keyed\
    \ environment).\n- **Autonomous post-landing verification (no operator fork):**\
    \ after this story lands,\n  the agent (a) triggers `release.yml` via `gh workflow\
    \ run` with invalid inputs and\n  confirms via `gh run view` that each guard aborts\
    \ before publish (needs only the\n  `workflow` scope), and (b) reads/configures/verifies\
    \ the live `pypi` environment's\n  required reviewers + `main`-only branch policy\
    \ via the admin GitHub API (`repo` scope).\n  Both record their evidence as comments\
    \ on this ticket. No staging fork or TestPyPI\n  publisher is required; escalation\
    \ is a fallback only if the needed GitHub scope is\n  denied.\n- Unit tests for\
    \ the extracted guard helpers (version-lockstep, ancestry, env-preflight\n  parsing)\
    \ \u2014 the codebase-verifiable proof the guards behave correctly.\n- `tests/unit/test_release_workflow_pins.py`\
    \ \u2014 **extend** with fd84's structural checks\n  (dispatch-only trigger with\
    \ a `version` input; the `authorize` job's four guards precede\n  build via `needs`;\
    \ no stale tag-context `if:`/`github.ref_name` remains; the\n  `github_release`\
    \ job needs `publish`). The existing 08a8/6168 invariants are\n  **preserved unbroken**\
    \ by this story's edits: the `authorize` job holds only\n  `contents: read` (no\
    \ `id-token: write`), so `test_single_annotated_zizmor_suppression`\n  (exactly\
    \ one suppression) still holds; the publish job's hash-gate/no-rebuild body\n\
    \  (`test_g_publish_hash_gated_no_rebuild`) and the mcp_verify/mcp_registry split\n\
    \  (`test_mcp_verify_registry_split`) are untouched except for the tag\u2192dispatch\
    \ `if:` re-key,\n  which those tests do not assert on \u2014 so they stay green\
    \ (re-run the full module to confirm).\n- `.github/workflows/release.yml` \u2014\
    \ a **preflight step** in the dispatch flow that\n  calls `GET /repos/{owner}/{repo}/environments/pypi`\
    \ and fails the release if the\n  environment lacks required reviewers or a `main`-only\
    \ deployment-branch policy\n  (fail-closed drift detection at release time). **Preflight\
    \ schema (the exact\n  field paths the fail-closed parser inspects and the unit-test\
    \ fixtures replicate):**\n  from `GET .../environments/pypi`, require `protection_rules[]`\
    \ to contain an entry with\n  `type == \"required_reviewers\"` **and** a non-empty\
    \ `reviewers` list; and require\n  `deployment_branch_policy` to be non-null with\
    \ `custom_branch_policies == true`. From\n  `GET .../environments/pypi/deployment-branch-policies`,\
    \ require `branch_policies[].name`\n  to be **exactly** `{\"main\"}` (any other/extra\
    \ branch fails). These live in\n  `scripts/release_guards.py::check_env_protection`.\
    \ No `infra/terraform-github/`,\n  `terraform-drift.yml`, or terraform-contract-test\
    \ changes (the GitHub provider's\n  AWS-vs-GitHub auth split made drift-workflow\
    \ coupling disproportionate; the\n  preflight is the stronger, self-contained\
    \ control). `infra/terraform-github/main.tf`\n  and its no-tag-lock contract test\
    \ remain **unchanged**.\n- `docs/releasing.md` \u2014 document the dispatch-from-`main`\
    \ process, the version-lockstep\n  invariant, and the required environment reviewers.\
    \ **Section ownership:** this story\n  owns the \"Release-source authorization\"\
    \ section **and rewrites the now-obsolete\n  existing sections it invalidates**\
    \ \u2014 the \"Tag \u2192 PyPI publishes automatically\"\n  procedure (replaced\
    \ by dispatch-from-`main`) and the \"Hard rules\" manual-lockstep\n  framing (now\
    \ machine-enforced). (Finding 3 owns \"Build-once\" + rewriting the\n  \"Post-release\
    \ smoke test\" section; Finding 4 owns \"Pinning\" \u2014 so the three concurrent\n\
    \  release stories do not overlap-edit the same headings.)\n- Out of scope: the\
    \ build-once / pinning work (Findings 3 and 4 \u2014 separate stories\n  that\
    \ also touch `release.yml`; coordinate ordering per the epic).\n\n## Acceptance\
    \ Criteria\n\n- [ ] **AC 0 (dependency gate \u2014 verify before starting).**\
    \ This story composes on top of\n  F3 (build-once) and F4 (pinning), which land\
    \ first per the epic chain (F4 \u2192 F3 \u2192 F1).\n  Before implementation,\
    \ confirm by grep that `release.yml` on the working base already\n  contains F3's\
    \ `wheel_test` / `sdist_test` jobs and its hash-gated `publish` (no rebuild),\n\
