# OpenAI arm of the external suite's provider matrix (story f124).
#
# OpenAI is rebar's BEST-EFFORT provider tier (the OpenAI-compatible builder in
# `rebar.llm.providers`), not a first-class one like Anthropic and Bedrock. It is covered here
# because the repository DOES hold an `OPENAI_API_KEY` secret, so leaving it uncovered would be a
# blind spot we are paying for anyway.
#
# Model ids VERIFIED (not guessed) against this repository's own OPENAI_API_KEY on 2026-08-03 by a
# read-only `GET https://api.openai.com/v1/models`: `gpt-5.4`, `gpt-5.4-mini` and `gpt-5.4-nano`
# are all present on that account.
#
# Credential: OPENAI_API_KEY.

# `[llm] model` is set as well as the classes, and it is LOAD-BEARING rather than redundant.
# `cfg.model` is a SECOND resolution path the class table cannot reach: config.py:575 reads it
# from `REBAR_LLM_MODEL`/`model` falling back to DEFAULT_MODEL, which is the bare literal
# "claude-opus-4-8" and so infers provider `anthropic`. Any op that resolves `cfg.model` instead
# of naming a class — and several do — would call direct Anthropic on EVERY arm, which is exactly
# the "ambient default" this overlay exists to remove. MEASURED on a live matrix run
# [rebar:f124-f14a-fd62-4973]: three such
# tests called `model=anthropic:claude-opus-4-8` on the bedrock and openai arms and failed with
# "Could not resolve authentication method", because those arms deliberately blank
# ANTHROPIC_API_KEY.
[llm]
model = "openai-responses:gpt-5.4"

[llm.model_classes]
frontier = { model = "openai-responses:gpt-5.4" }
standard = { model = "openai-responses:gpt-5.4-mini" }
trivial  = { model = "openai-responses:gpt-5.4-nano" }
