# AWS Bedrock arm of the external provider matrix. It uses the Anthropic arm's Claude families,
# so differences between those arms isolate the provider rather than the model.
#
# Only inference-profile IDs (`us.` or `global.`) are invokable, and their suffixes are not
# uniform. Copy new IDs verbatim from `aws bedrock list-inference-profiles --region <region>`.
# Credential: the ambient AWS chain (OIDC in CI; profiles or environment keys locally).
# Region is not expressible here, so workflows set both `AWS_DEFAULT_REGION` and
# `REBAR_LLM_BEDROCK_REGION`.

# Keep the provider-qualified scalar model and every class slot explicit because some callers
# resolve `cfg.model` outside the class table. The provider matrix blanks `ANTHROPIC_API_KEY` for
# this arm so direct Anthropic cannot masquerade as Bedrock; that isolation is matrix-specific,
# while ordinary operation may retain the approved direct-Anthropic fallback.
[llm]
model = "bedrock:us.anthropic.claude-opus-4-8"

[llm.model_classes]
frontier = { model = "bedrock:us.anthropic.claude-opus-4-8" }
standard = { model = "bedrock:us.anthropic.claude-sonnet-4-6" }
trivial  = { model = "bedrock:us.anthropic.claude-haiku-4-5-20251001-v1:0" }
