# Direct-Anthropic arm of the external provider matrix. CI selects even this default-matching
# arm through `REBAR_LLM_CONFIG_FILE`, so every arm exercises the same overlay path.
# Credential: `ANTHROPIC_API_KEY`.

# Keep the provider-qualified scalar model and all three class slots explicit. Some callers
# resolve `cfg.model`, which the class table cannot override; without the scalar, its bare default
# infers Anthropic and could leak direct-Anthropic selection into another provider arm.
[llm]
model = "anthropic:claude-opus-4-8"

[llm.model_classes]
frontier = { model = "anthropic:claude-opus-4-8" }
standard = { model = "anthropic:claude-sonnet-4-6" }
trivial  = { model = "anthropic:claude-haiku-4-5" }
