# Dependabot opens advisory PRs for monthly GitHub Actions and weekly uv updates.
# `main` advances through Gerrit, so maintainers reproduce accepted bumps there and close
# the GitHub PRs. The lockdown workflow exempts `dependabot[bot]` from auto-closure.
#
# The uv entry updates the committed `uv.lock` used by `make install`, CI, and the
# reviewbot and opcert images. Published metadata retains unpinned minimums, so a pip entry
# would change nothing. The `cooldown` key remains omitted because the disputed schema
# feature offers little value at this cadence. Security alerts remain enabled independently
# of version-update PRs.
#
# Ignore mcp major versions until `bared-nickel-insect` lands. Patch and security updates
# remain enabled. User-facing follow-up is `rhyolite-saddening-aidi`.
#
# Ignore pydantic-ai-slim major versions until the 2.x migration (`halfalive-smoky-mara`) lands:
# every extra pins `<2`, so each weekly run retried the unresolvable 2.x bump and recorded
# dependency_file_not_resolvable (eagleeyed-lexical-midge).
#
# The uv scan also treats requirements-shaped files anywhere under the directory as pip
# manifests. It recompiled .github/release-requirements.txt (the hand-regenerated release
# build lock) into the uv-lock group, and Dependabot's API refused the group pull request with
# 400 "invalid or unauthorized changes" (sublinear-capitate-gavial); other projects report that
# 400 for non-actions changes under .github/. Exclude .github from the uv scan; the release lock
# is regenerated by hand per its own header.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      uv-lock:
        patterns:
          - "*"
    exclude-paths:
      - ".github/**"
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # Dependabot names each extras variant separately ("pydantic-ai-slim[bedrock]", ...), so
      # the bare name matches none of them; the trailing * matches every variant.
      - dependency-name: "pydantic-ai-slim*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
