name: Mirror Guard

# Check Gerrit-to-GitHub main replication every 15 minutes and on dispatch.
# Compare main SHAs and recent merged-revision reachability across repeated
# samples so ordinary propagation lag does not alert. Public reads and the
# default token suffice. Exit 1 means sustained divergence. Exit 2 means the
# check could not complete. Admin-only ruleset drift is checked elsewhere.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (default-branch version only)
  workflow_dispatch: {}

permissions:
  contents: read # read the GitHub main SHA (public read; token only lifts rate limits)

concurrency:
  group: mirror-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install rebar (core, stdlib-only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: mirror-guard — replication health (Gerrit vs GitHub main SHA)
        env:
          # Default token only — passed to lift GitHub API rate limits on the public
          # main-SHA read; no elevated scope needed for the replication check.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python -m rebar.mirror_guard --replication --merged-reachability
          code=$?
          set -e

          case "$code" in
            0)
              echo "mirror-guard: replication in sync" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "::error title=Mirror Guard invariant failure::Gerrit/GitHub main diverged or Gerrit MERGED revisions are not reachable from main."
              echo "mirror-guard: FAILED — replication diverged or a MERGED revision is unreachable from main." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            2)
              echo "::error title=Mirror Guard unreachable::Could not reach Gerrit/GitHub; mirror state was not checked, not a divergence."
              echo "mirror-guard: UNREACHABLE — could not check mirror state; not a divergence." >> "$GITHUB_STEP_SUMMARY"
              exit 2
              ;;
            *)
              echo "::error title=Mirror Guard unexpected exit::mirror_guard exited with unexpected code ${code}."
              exit "$code"
              ;;
          esac
