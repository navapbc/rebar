# Optional out-of-band ticket compaction on a disposable runner.
# Fold tickets above compact.threshold into snapshots and push once. A fresh
# full-history clone avoids local writer locks. Concurrent new events merge with
# retired-source snapshots as a union. Failed local commits are discarded with
# the runner. Six-hour scheduling and single flight bound housekeeping load.

name: Compaction Sweep

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be folded, fold nothing'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Stop after this many tickets (0 = no limit)'
        required: false
        default: '0'
        type: string

concurrency:
  group: compact-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: Fold over-threshold tickets
    runs-on: ubuntu-latest
    # Stop the optional sweep after 60 minutes instead of GitHub's six-hour
    # default. A truncated sweep is harmless because the next run resumes work.
    timeout-minutes: 60
    permissions:
      contents: write # push the folded SNAPSHOTs back to the tickets orphan branch
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: true # the mounted worktree reuses these creds to push
          filter: blob:none
          # Fetch full ticket history. Shallow grafts break merge-base and can resurrect
          # retired events during compaction. Reconcile by merge, never rebase.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .github/python-version.txt

      - name: Install rebar
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Mount tickets branch as a worktree
        # Mount the writable store on the tickets branch so tracker.branch matches
        # and store fsck does not report a detached or mismatched checkout.
        run: |
          set -euo pipefail
          git fetch origin '+tickets:refs/remotes/origin/tickets'
          rm -rf .tickets-tracker
          git worktree add -B tickets .tickets-tracker origin/tickets

      - name: Configure tickets merge driver
        # .bridge_state/* uses merge=ours; define that custom driver before the push-retry
        # loop can merge origin/tickets into the mounted worktree.
        run: git config merge.ours.driver true

      - name: Configure git identity for the sweep bot
        # Set Git identity for both the checkout and mounted ticket worktree.
        # The bot email also resolves the optional snapshot signing identity.
        env:
          SWEEP_BOT_NAME: ${{ vars.BRIDGE_BOT_NAME || 'rebar-bridge[bot]' }}
          SWEEP_BOT_EMAIL: ${{ vars.BRIDGE_BOT_EMAIL || 'joeoakhart+bot@navapbc.com' }}
        run: |
          set -euo pipefail
          git config --global user.name "${SWEEP_BOT_NAME}"
          git config --global user.email "${SWEEP_BOT_EMAIL}"

      - name: Materialize the Rebar Bot signing key
        # Materialize an optional signing key in a 0600 runner-temp file. Without it,
        # snapshots remain unsigned. The mounted store carries its own .env-id.
        env:
          REBAR_BOT_SIGNING_KEY: ${{ secrets.REBAR_BOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REBAR_BOT_SIGNING_KEY:-}" ]; then
            echo "REBAR_BOT_SIGNING_KEY unset — swept SNAPSHOTs will be unsigned (advisory)"
            exit 0
          fi
          echo "::add-mask::${REBAR_BOT_SIGNING_KEY}"
          KEYFILE="${RUNNER_TEMP}/rebar-bot-signing-key"
          install -m 600 /dev/null "${KEYFILE}"
          printf '%s\n' "${REBAR_BOT_SIGNING_KEY}" > "${KEYFILE}"
          echo "REBAR_IDENTITY_SIGNING_KEY=${KEYFILE}" >> "${GITHUB_ENV}"
          echo "Materialized bot signing key to ${KEYFILE} (0600)"

      - name: Run the sweep
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${LIMIT}" != "0" ]; then ARGS+=("--limit=${LIMIT}"); fi
          # Exit 2 reports partial sweep errors as a warning. Exit 1 fails the job.
          # Capture output without a pipe so a tee failure cannot hide rebar's exit code.
          rebar store compact --all "${ARGS[@]}" >"${RUNNER_TEMP}/sweep.out" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/sweep.out"
          if [ "${rc:-0}" = "2" ]; then
            echo "::warning::some tickets failed to compact; they stay live and the next sweep retries them"
          elif [ "${rc:-0}" != "0" ]; then
            exit "${rc}"
          fi

      - name: Report what the sweep did
        # Publish fold counts every run so stalled or empty sweeps are visible.
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Compaction sweep"
            echo ""
            if [ -s "${RUNNER_TEMP}/sweep.out" ]; then
              echo '```'
              tail -n 12 "${RUNNER_TEMP}/sweep.out"
              echo '```'
            else
              echo "_No sweep output captured._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on sweep failure
        # Mirrors reconcile-bridge.yml's failure step. Compaction is optional housekeeping, so
        # a failed sweep is not an emergency — but it must not be SILENT, because the next
        # signal would otherwise be a store that has grown for months.
        if: failure()
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Bound through env rather than expanded into the script: a `${{ }}` inside a run
          # block is substituted before the shell sees it, so it is a code-injection surface
          # even for these tame values. zizmor flags it, correctly.
          GH_WORKFLOW: ${{ github.workflow }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## :rotating_light: Compaction Sweep run FAILED"
            echo ""
            echo "- **Workflow:** \`${GH_WORKFLOW}\`"
            echo "- **Run:** $GH_RUN_URL"
            echo "- **Triggered by:** \`${GH_EVENT_NAME}\`"
            echo ""
            echo "Events stay live and valid — the next sweep re-folds whatever is pending."
            echo "A store with no CI still compacts via the operation-linked trigger"
            echo "(\`compact.trigger\`), so this failure degrades cadence, not correctness."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Compaction Sweep failed::See run summary — $GH_RUN_URL"
