name: Live External Integration

# Manually-triggered EXTERNAL-integration suite (tests/external/): tests that hit
# third-party services and make REAL, billable LLM calls, so they are deliberately
# NOT part of the automatic `test` workflow. Trigger from the Actions tab.
#
# Jobs:
#   * external-llm    — the live-LLM lane, run ONCE PER PROVIDER as a matrix
#                       (`-m "external and llm_live"`). See the provider-matrix
#                       notes on that job.
#   * external        — the remaining live-service lane (live Jira Cloud, deps,
#                       link-sync): `-m "external and not llm_live"`, run once.
#   * langfuse-trace  — stands up an EPHEMERAL self-hosted Langfuse stack
#                       (docker-compose.langfuse.yml, headless-init) and asserts a
#                       review run emits a trace fetchable via the Langfuse API.
#   * jira-dc-harness — the Jira Data Center harness smoke lane.
#   * jira-cloud-s3-rehearsal — read-only many-to-many bridge rehearsal against real
#                            Jira Cloud (REB + DIG) over the S3 store backend; gated on
#                            an S3-capable OIDC role (vars.AWS_S3_REHEARSAL_ROLE_ARN).
#   * pandoc-corpus-replay — complete real-Pandoc corpus + settling replay on
#                            Linux and macOS; routine Verify uses static outputs.
#
# THE LLM LANE IS A PROVIDER MATRIX, NOT AN AMBIENT DEFAULT (story f124). It previously
# ran on whichever provider happened to hold a key, which in practice meant Anthropic
# only — so a Bedrock-only regression (a `cachePoint` envelope change, an
# inference-profile id that stops resolving, a throttling shape) was undetectable by CI
# and could only ever be found by a human running the gates by hand. The `external-llm`
# job below therefore carries one arm per provider we hold a credential for, selects the
# provider through a `REBAR_LLM_CONFIG_FILE` overlay (.github/llm-providers/), and fails
# any arm whose credential is absent rather than letting it skip to green.
#
# `external` + `langfuse-trace` require the `ANTHROPIC_API_KEY` (or `OPENAI_API_KEY`)
# repository secret. langfuse-trace needs NO Langfuse secret — the stack is ephemeral
# with deterministic headless-init keys baked into the compose file.

on:
  workflow_dispatch: {}
  # Scheduled weekly live-Jira integration canary (Mondays 06:00 UTC). The external
  # job's fail-on-all-skip guard (tests/external/conftest.py) turns a run in which
  # every Jira live test silently skipped into a failure, so a broken auth step or
  # missing creds surfaces instead of a green no-op.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # ── the live-LLM lane: one arm per credentialed provider ───────────────────────────────
  #
  # PROVIDER SELECTION goes through `REBAR_LLM_CONFIG_FILE` — the layered config-file
  # pointer — never the deprecated bare `REBAR_LLM_MODEL` (which cannot express a per-class
  # model, so it could not repoint all three classes). Each arm's overlay
  # (.github/llm-providers/<provider>.toml) sets ONLY `[llm.model_classes]` and DEEP-MERGES
  # over the discovered config, so an arm overrides the provider and the models and nothing
  # else. A side benefit that is really the point: CI now dogfoods the same override path a
  # developer uses locally (docs/local-dev-env.md), so the pointer itself gets live coverage
  # on every run instead of being exercised only by hand.
  #
  # AN ARM WITH NO CREDENTIAL FAILS; IT DOES NOT SKIP. "Skip loudly, and never read as green"
  # has exactly one unambiguous rendering in GitHub Actions, and it is a red job: a skipped
  # job renders grey/neutral, which is trivially misread as fine, and `secrets` is not even
  # available in a job-level `if:` so a genuine per-arm skip is not expressible anyway. The
  # preflight step below therefore emits `::error::` and exits non-zero, matching the
  # long-standing idiom in the `external` job. The second line of defence is the
  # `llm-live-canary` (tests/external/conftest.py): if the credential is present but wrong
  # for the arm's provider, every `llm_live` test skips and the canary flips the session to a
  # failure — so "the arm called no model" can never report success either.
  #
  # COST + CADENCE (measured; full workings in docs/ci-provider-matrix.md). Real usage logs
  # from three consecutive runs of the pre-split job (artifacts of runs 30772461871 /
  # 30784592232 / 30792766156: 29 LLM calls, ~0.49–0.55M input tokens, ~33–36k output) price
  # at $1.95 / $2.04 / $2.15 on direct Anthropic. Bedrock's `us.` (regional) inference
  # profiles list 10% above Anthropic list, so the Bedrock arm adds ~$2.14–$2.36. DECISION:
  # every credentialed provider runs on EVERY trigger, including the weekly schedule. The
  # incremental spend is ~$2/arm/trigger — about $9/month at the weekly cadence — while a
  # reduced cadence would leave a Bedrock-only regression undetected for up to a month, and
  # the whole reason this job exists is to shorten that window. Revisit if manual dispatch
  # volume makes the spend material (a `workflow_dispatch` input narrowing the matrix is the
  # obvious next step, deliberately not built yet).
  external-llm:
    name: external LLM (live ${{ matrix.provider }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC AssumeRoleWithWebIdentity on the Bedrock arm. GitHub has no
      # per-matrix-arm `permissions:` block, so it is granted job-wide; the token is only
      # ever exchanged by the `if: matrix.provider == 'bedrock'` step below, and an ID token
      # confers nothing without a role whose trust policy accepts it.
      id-token: write
    strategy:
      # One provider's outage or regression must not cancel the others — the whole point is
      # to see each provider's result independently.
      fail-fast: false
      matrix:
        include:
          - provider: anthropic
            config_file: .github/llm-providers/anthropic.toml
          - provider: bedrock
            config_file: .github/llm-providers/bedrock.toml
          # OpenAI is rebar's BEST-EFFORT provider tier, covered because the repository does
          # hold an OPENAI_API_KEY secret — leaving it uncovered would be a blind spot we
          # are already paying for.
          - provider: openai
            config_file: .github/llm-providers/openai.toml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Each arm receives ONLY its own provider's credential: every key expression is guarded
      # on `matrix.provider`, so the Bedrock arm cannot see ANTHROPIC_API_KEY and therefore
      # cannot fall back to direct Anthropic on any path that reads a key rather than the
      # resolved model string. A non-matching guard evaluates to the empty string, which
      # rebar and this preflight both treat as absent.
      - name: Require this arm's credential (loud failure, never a silent skip)
        env:
          PROVIDER: ${{ matrix.provider }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          # Bedrock authenticates from the AMBIENT AWS chain, so there is no key to check.
          # What must exist instead is the OIDC role to assume and the region to assume it
          # in — both repository VARIABLES (a role ARN and a region are not secrets).
          BEDROCK_ROLE_ARN: ${{ vars.AWS_BEDROCK_CI_ROLE_ARN }}
          BEDROCK_REGION: ${{ vars.AWS_BEDROCK_CI_REGION }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            anthropic)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "::error title=anthropic arm has no credential::Set the ANTHROPIC_API_KEY repository secret. This arm is FAILED rather than skipped so a missing secret can never read as a green live run."
                exit 1
              fi
              ;;
            openai)
              if [ -z "$OPENAI_API_KEY" ]; then
                echo "::error title=openai arm has no credential::Set the OPENAI_API_KEY repository secret, or remove the openai arm from the matrix and record the decision in docs/ci-provider-matrix.md."
                exit 1
              fi
              ;;
            bedrock)
              missing=""
              [ -n "$BEDROCK_ROLE_ARN" ] || missing="AWS_BEDROCK_CI_ROLE_ARN"
              [ -n "$BEDROCK_REGION" ] || missing="${missing:+$missing, }AWS_BEDROCK_CI_REGION"
              if [ -n "$missing" ]; then
                echo "::error title=bedrock arm is not configured::Missing repository variable(s): ${missing}. The role must be created first — its exact name, trust policy and permission policy are in infra/runbooks/bedrock-ci-oidc.md. A region is NOT optional and NOT discoverable: boto3 resolves none from IMDS (measured, ticket a574)."
                exit 1
              fi
              ;;
            *)
              echo "::error title=unknown provider arm::'$PROVIDER' has no credential rule; add one rather than letting the arm run uncredentialed."
              exit 1
              ;;
          esac
          echo "credential preflight OK for provider '$PROVIDER'"

      # The S7 review-bot's Bedrock access rides an EC2 INSTANCE ROLE reached over IMDS from
      # inside its container. That path DOES NOT EXIST on a GitHub-hosted runner — there is no
      # instance role and no IMDS route to that host — so this arm needs its own mechanism:
      # OIDC federation to a dedicated, repo-scoped role that reuses S7's POLICY shape
      # (bedrock:InvokeModel + InvokeModelWithResponseStream on anthropic.claude-* only). The
      # rejected alternative is a long-lived AWS access key in a secret, i.e. a durable
      # credential in CI to save a one-time role setup. Role definition + verification:
      # infra/runbooks/bedrock-ci-oidc.md.
      - name: Configure AWS credentials (OIDC → the scoped Bedrock CI role)
        if: matrix.provider == 'bedrock'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_BEDROCK_CI_REGION }}

      # `[dev]` already pulls pydantic-ai-slim's [bedrock] and [openai] groups, so one sync
      # covers every arm — no per-provider install branch.
      - name: Install rebar + the full agents stack
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main

      - name: Run the live-LLM suite on ${{ matrix.provider }}
        env:
          # See the preflight step: guarded per arm so no arm holds a foreign credential.
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          # THE provider switch: a layered overlay setting only [llm.model_classes].
          REBAR_LLM_CONFIG_FILE: ${{ github.workspace }}/${{ matrix.config_file }}
          # Lets tests inside the arm assert the arm ran the provider it claims
          # (tests/external/test_provider_matrix_live.py).
          REBAR_EXPECTED_LLM_PROVIDER: ${{ matrix.provider }}
          # BOTH region variables, on purpose. Ticket a574 established by MEASUREMENT that
          # IMDS supplies NO region (so a working credential chain does not imply a resolvable
          # region — they fail and are fixed independently) AND that rebar's own
          # REBAR_LLM_BEDROCK_REGION alone was insufficient: AWS_DEFAULT_REGION was also
          # required. rebar's knob additionally puts the region into the verdict's
          # provider_provenance, which a bare AWS_* var does not. With neither resolving,
          # provider construction raises a typed LLMConfigError naming the knob — never a
          # silent skip and never green.
          # Set on EVERY arm, not just the bedrock one (bug 79d6). A region is a repository
          # VARIABLE, not a credential, so guarding it on `matrix.provider` bought no
          # credential isolation — while live-LLM modules may pin a `bedrock:` model
          # irrespective of the arm that runs them (e.g.
          # tests/external/test_completion_banking_behavior_0707.py pins
          # `bedrock:us.anthropic.claude-sonnet-4-6`). Guarded, those cells reached
          # build_bedrock_provider with an empty region on the anthropic and openai arms and
          # failed identically on region resolution (run 31587452003). us-east-1 is the
          # fallback only when the repository variable is unset; it is the region rebar
          # documents for Bedrock (docs/llm-framework.md).
          AWS_DEFAULT_REGION: ${{ vars.AWS_BEDROCK_CI_REGION || 'us-east-1' }}
          REBAR_LLM_BEDROCK_REGION: ${{ vars.AWS_BEDROCK_CI_REGION || 'us-east-1' }}
          # The external tier is inert unless this opt-in is set (a safety guard against
          # accidental billable calls); the preflight above already required a credential.
          REBAR_RUN_EXTERNAL: "1"
          # Durable per-arm token-usage record — this is the instrument the cadence decision
          # above is measured with, so it must be per-provider. Step-level so
          # ${{ runner.temp }} is in scope: a JOB-level env entry using runner.* is a
          # parse-time startup failure (bug 8002; tests/unit/test_ci_actionlint_scope.py).
          REBAR_USAGE_LOG: ${{ runner.temp }}/usage-${{ matrix.provider }}.jsonl
        # `-m "external and llm_live"` selects exactly the live-LLM modules — those carrying a
        # `_live_llm_ready` sentinel, auto-marked in tests/external/conftest.py. The `external`
        # job below runs the complement, so the union is the same set that ran before the
        # split; and a NEW live-LLM module is picked up automatically instead of needing a
        # path added here (tests/unit/test_ci_provider_matrix.py fails if a module uses the
        # shared live-LLM gate without the sentinel).
        # --timeout is the per-test HANG GUARD (ticket d835-1846-95d1-4d84). This job declares
        # no timeout-minutes, so without it one deadlocked test hides behind the last -q dot
        # until GitHub's 360-minute default, with no traceback naming the culprit.
        # 900s is calibrated to THIS lane, not copied: the step ran 138-870s over 15-16 tests
        # across recent green runs (the bedrock arm alone swung 347->870s), so 900s exceeds the
        # worst observed whole-step time and is ~16x the worst arm's mean per test — a live-LLM
        # call with retries can be legitimately slow, and this must not clip one.
        # --timeout-method=thread is load-bearing: the default `signal` method arms SIGALRM in
        # the main thread and cannot fire while blocked in a C-level socket/subprocess call.
        run: >-
          pytest -m "external and llm_live" tests/external -q
          --ignore=tests/external/live_jira_dc
          --ignore=tests/external/live_jira_cloud_s3 --timeout=900 --timeout-method=thread
          -p no:cacheprovider --basetemp="${{ runner.temp }}/rebar-basetemp"

      - name: Summarize LLM token usage → job summary
        if: ${{ always() }}
        env:
          REBAR_USAGE_LOG: ${{ runner.temp }}/usage-${{ matrix.provider }}.jsonl
        run: |
          echo "### ${{ matrix.provider }}" >> "$GITHUB_STEP_SUMMARY"
          python -m rebar.llm.usage_log summarize "$REBAR_USAGE_LOG" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LLM token-usage log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          # Per-arm name: artifact names must be unique across a matrix.
          name: external-usage-log-${{ matrix.provider }}
          path: ${{ runner.temp }}/usage-${{ matrix.provider }}.jsonl
          if-no-files-found: ignore

  external:
    name: external integration (live services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Fail loudly if no key is configured — otherwise the LLM tests would simply
      # skip and the job would go green without validating anything.
      - name: Require an LLM API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY (or OPENAI_API_KEY) repository secret to run the external suite."
            exit 1
          fi

      # jq is a general JSON-inspection utility for ad-hoc steps in this lane.
      # (The golden-path probe is now Python — scripts/probe_rebar.py — and no
      # longer needs jq itself.)
      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq && jq --version

      - name: Install rebar + the full agents stack
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main

      - name: Cache acli binary
        id: cache-acli
        uses: actions/cache@v6
        with:
          path: ~/.acli
          key: acli-${{ runner.os }}-${{ vars.ACLI_VERSION || 'unset' }}

      - name: Download + verify + install acli
        if: steps.cache-acli.outputs.cache-hit != 'true'
        env:
          ACLI_VERSION: ${{ vars.ACLI_VERSION }}
          ACLI_SHA256: ${{ vars.ACLI_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ACLI_VERSION:-}" ] || [ "$ACLI_VERSION" = "latest" ]; then
            echo "::error::ACLI_VERSION repo variable is unset or 'latest'. Pin a specific version (e.g. 1.3.14-stable) and set ACLI_SHA256 to its digest."
            exit 1
          fi
          mkdir -p ~/.acli
          curl -sSL "https://acli.atlassian.com/linux/${ACLI_VERSION}/acli_${ACLI_VERSION}_linux_amd64.tar.gz" -o ~/.acli/acli.tar.gz
          if [ -n "${ACLI_SHA256:-}" ]; then
            echo "${ACLI_SHA256}  $HOME/.acli/acli.tar.gz" | sha256sum -c --strict
          else
            echo "::warning::ACLI_SHA256 unset — proceeding without checksum verification. Set it to: $(sha256sum ~/.acli/acli.tar.gz | awk '{print $1}')"
          fi
          tar xzf ~/.acli/acli.tar.gz -C ~/.acli/ --strip-components=1
          chmod +x ~/.acli/acli
          rm -f ~/.acli/acli.tar.gz
          if [ ! -s "$HOME/.acli/acli" ] || [ ! -x "$HOME/.acli/acli" ]; then
            echo "::error::Extracted acli binary missing, empty, or not executable"
            ls -la ~/.acli/ || true
            exit 1
          fi
          if ! "$HOME/.acli/acli" --version >/dev/null 2>&1; then
            echo "::error::Extracted acli binary failed --version smoke check"
            exit 1
          fi

      - name: Add acli to PATH and authenticate
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          sudo ln -sf "$HOME/.acli/acli" /usr/local/bin/acli
          echo "$JIRA_API_TOKEN" | acli jira auth login \
            --site "$JIRA_URL" \
            --email "$JIRA_USER" \
            --token

      - name: Run the external-integration suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Live-Jira canary creds (repo variables + secret), mirroring reconcile-bridge.
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # The external tier is inert unless this opt-in is set (a safety guard
          # against accidental billable calls); the job above already required a key.
          REBAR_RUN_EXTERNAL: "1"
          # Durable token-usage record for this billable job (rebar.llm.usage_log). The
          # runner appends one JSONL line per LLM call; the steps below summarize it into
          # the job summary and upload the raw file. Step-level so ${{ runner.temp }} is
          # in scope — a JOB-level env entry using runner.* is a parse-time startup
          # failure (Bug 8002; see tests/unit/test_ci_actionlint_scope.py).
          REBAR_USAGE_LOG: ${{ runner.temp }}/usage.jsonl
        # -p no:cacheprovider + a runner-temp basetemp mirror the main workflow.
        # The Langfuse trace test skips here (no LANGFUSE_HOST) — see langfuse-trace.
        # --ignore=tests/external/live_jira_dc: this job has no Docker/Jira DC harness, so
        # those 4 tests would collect and all-skip here too. The jira_live canary counts
        # collected/executed GLOBALLY per session (tests/external/conftest.py), and this
        # job's live-Cloud Jira tests DO execute — so without this ignore, the DC tests'
        # all-skip would be silently MASKED by the Cloud tests executing, and the canary
        # would lose the ability to detect "every DC test skipped" (measured: with the DC
        # tests included and no harness, the canary stays silent; the two tiers must stay
        # independent so each job's canary means what it says). The dedicated jira-dc-harness
        # job below covers tests/external/live_jira_dc/ with its own canary.
        # --ignore=tests/external/live_jira_cloud_s3: same reasoning — that suite needs an
        # S3 store backend this job cannot provision, so its jira_live tests would all-skip
        # and be masked by the Cloud tests executing here; the dedicated jira-cloud-s3-rehearsal
        # job covers it with its own canary.
        # `and not llm_live`: the live-LLM modules moved to the `external-llm` provider matrix
        # above (story f124), which runs them once per provider. Running them here too would
        # bill a fourth, provider-ambiguous copy — and, worse, this job's Jira all-skip canary
        # counts collected-vs-executed GLOBALLY per session, so LLM tests executing here would
        # MASK an all-skip of the Jira tests. The two lanes must stay independent for each
        # job's canary to mean what it says, exactly as the --ignore below reasons about the
        # Data Center tier.
        # Per-test hang guard (ticket d835-1846-95d1-4d84); see the live-LLM lane above for why
        # timeout-minutes is not a substitute and why the method must be `thread`.
        # 600s is this lane's own budget: the step ran 85-120s over ~19 live-Jira-Cloud tests
        # across recent green runs, so 600s is 5x the worst observed WHOLE step and ~100x the
        # observed mean per test — ample room for a slow Jira Cloud round trip.
        run: >-
          pytest -m "external and not llm_live" tests/external -q
          --ignore=tests/external/live_jira_dc
          --ignore=tests/external/live_jira_cloud_s3 --timeout=600 --timeout-method=thread
          -p no:cacheprovider --basetemp="${{ runner.temp }}/rebar-basetemp"

      - name: Summarize LLM token usage → job summary
        if: ${{ always() }}
        env:
          REBAR_USAGE_LOG: ${{ runner.temp }}/usage.jsonl
        run: |
          python -m rebar.llm.usage_log summarize "$REBAR_USAGE_LOG" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LLM token-usage log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: external-usage-log
          path: ${{ runner.temp }}/usage.jsonl
          if-no-files-found: ignore

  langfuse-trace:
    name: langfuse tracing round-trip (ephemeral self-hosted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Require an LLM API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY (or OPENAI_API_KEY) repository secret to run the tracing round-trip."
            exit 1
          fi

      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq && jq --version

      - name: Install rebar + the full agents stack
        run: |
          # [tracing] pulls the OpenTelemetry SDK + OTLP exporter so setup_tracing()
          # actually exports spans to Langfuse (rebar emits traces via OTLP, NOT the
          # Langfuse SDK — see src/rebar/llm/tracing.py). Without it this job would run
          # tracing as a silent no-op and validate nothing.
          uv sync --locked --extra dev --extra tracing
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main

      # The deterministic headless-init keys live in docker-compose.langfuse.yml.
      - name: Bring up the ephemeral Langfuse stack
        run: docker compose -f docker-compose.langfuse.yml up -d

      - name: Wait for Langfuse to be ready
        run: |
          # 1) HTTP liveness — the web container answers /api/public/health.
          ok=
          for i in $(seq 1 60); do
            if curl -fsS --head http://localhost:3000/api/public/health >/dev/null 2>&1; then
              echo "health OK after ${i} tries"; ok=1; break
            fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "::error::Langfuse web never became healthy"; docker compose -f docker-compose.langfuse.yml logs --tail=80 langfuse-web; exit 1; }
          # 2) Auth/readiness — the server reports healthy BEFORE headless-init +
          #    ClickHouse/MinIO migrations finish, so confirm the project resolves.
          #    Probe the PUBLIC REST API with the baked headless-init keys (Basic
          #    auth pk:sk) — NOT the langfuse Python SDK, which is intentionally not a
          #    rebar dependency (tracing is write-only OTLP; see src/rebar/llm/tracing.py).
          #    stderr is NOT suppressed: a probe failure must surface, never masquerade
          #    as a timeout (a swallowed ModuleNotFoundError is exactly the bug this
          #    replaces — see rebar-ticket 416d-c02a-5be4-46ad).
          for i in $(seq 1 24); do
            if curl -fsS -u pk-lf-1234567890:sk-lf-1234567890 \
                 http://localhost:3000/api/public/projects >/dev/null; then
              echo "langfuse project API OK after ${i} tries"; exit 0
            fi
            sleep 5
          done
          echo "::error::Langfuse project did not initialize in time"
          docker compose -f docker-compose.langfuse.yml logs --tail=80
          exit 1

      - name: Run the Langfuse trace round-trip test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Point rebar at the ephemeral stack with its baked-in headless-init keys.
          LANGFUSE_HOST: http://localhost:3000
          LANGFUSE_PUBLIC_KEY: pk-lf-1234567890
          LANGFUSE_SECRET_KEY: sk-lf-1234567890
          REBAR_RUN_EXTERNAL: "1"
        # Per-test hang guard (ticket d835-1846-95d1-4d84); see the live-LLM lane above for the
        # rationale and why --timeout-method=thread is the load-bearing half.
        # 300s for this lane: it is a SINGLE test that ran 24-29s across recent green runs, so
        # 300s is ~10x the worst observation. It is also the floor this project uses for any
        # pytest lane, and a round trip against the local ephemeral Langfuse stack has no
        # reason to approach it.
        run: >-
          pytest -m external tests/external/test_llm_trace.py -q
          --timeout=300 --timeout-method=thread
          -p no:cacheprovider --basetemp="${{ runner.temp }}/rebar-basetemp"

      - name: Langfuse logs on failure
        if: failure()
        run: docker compose -f docker-compose.langfuse.yml logs --tail=120

      - name: Tear down the Langfuse stack
        if: always()
        run: docker compose -f docker-compose.langfuse.yml down -v

  jira-dc-harness:
    name: jira DC harness smoke (real Jira Data Center, ephemeral)
    # Native amd64 is a HARD requirement: the harness's base image is linux/amd64, and on an
    # emulated arm64 host Jira does not finish booting within an hour even with the Cargo
    # start-timeout override lifted (measured; see tests/external/live_jira_dc/README.md).
    # ubuntu-latest is native x86_64, which is the whole reason this job can produce
    # acceptance evidence that an Apple-Silicon workstation cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # `[jira-datacenter]` is NOT implied by `[dev]` (which self-references only
      # `[agents,metrics]`), and it is what supplies `pycontribs/jira` — the library
      # the DC transport is built on. Without it EVERY test in
      # tests/external/live_jira_dc/test_transport.py skips on its `_skip_no_extra`
      # guard while test_harness_smoke.py's tests still execute, so the all-skip
      # canary (which counts collected-vs-executed GLOBALLY per session) stays
      # silent and the job goes green having validated no transport code at all.
      # That is precisely the "silently-all-skipped run reads as green" failure the
      # external tier is built to prevent, so the extra is installed here and
      # test_transport.py additionally HARD-FAILS if it is ever missing while the
      # harness is reachable.
      - name: Install rebar (test-only; this harness needs no LLM API key)
        run: |
          uv sync --locked --extra dev --extra jira-datacenter
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Builds ./Dockerfile locally (never references pycontribs/jira-test-image, which is
      # NOT published to any registry — see the Dockerfile's own header). platform:
      # linux/amd64 in docker-compose.yml is a no-op restatement of this runner's own arch.
      - name: Build and start the Jira DC harness
        working-directory: tests/external/live_jira_dc
        run: docker compose up -d --build

      # atlas-run downloads Jira 8.17.1 (~917 Maven artifacts) from maven.atlassian.com on
      # first start, so readiness is dominated by that download, not JVM boot — the budget
      # here is generous (~20 minutes) and mirrors conftest.py's own default.
      - name: Wait for Jira DC to become ready
        run: |
          ok=
          for i in $(seq 1 240); do
            if curl -fsS http://localhost:2990/jira/rest/api/2/serverInfo >/dev/null 2>&1; then
              echo "Jira DC ready after ${i} tries"; ok=1; break
            fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Jira DC harness never became ready (see tests/external/live_jira_dc/README.md)"
            (cd tests/external/live_jira_dc && docker compose logs --tail=200)
            exit 1
          fi

      - name: Run the Jira DC harness smoke tests
        env:
          # This tier is inert unless opted in (tests/external/conftest.py's
          # _require_external_opt_in guard) — see AGENTS.md's leak-guard note.
          REBAR_RUN_EXTERNAL: "1"
        # -rA (not the usual -ra) so the summary includes PASSED tests WITH their captured
        # stdout. This suite's job is to produce EVIDENCE about a real Jira Data Center, and
        # several cells record a measurement rather than assert a value — what a stale key
        # returns after a re-key (7c26), the observed server page size. Under plain -q pytest
        # swallows the stdout of a passing test, so those measurements were written to a log
        # nobody could read and the run reported green having recorded nothing. The
        # `[941b-field-readiness]` line the project fixture prints (elapsed seconds, poll
        # count, resolved Epic field ids) reaches this log by that same mechanism.
        #
        # OPERATOR NOTE — "required Epic field(s) ... were still absent" (bug
        # 941b-f049-5f29-4410). GreenHopper registers `Epic Link`/`Epic Name` when the FIRST
        # Jira Software project is created, not when the plugin starts (run 30981084637:
        # 0.0512s after the create; 180s of quiet BEFORE the create changed nothing). So that
        # failure is never fixed by waiting longer. Read the field inventory the message
        # dumps: NO customfield_* entries at all means the check ran before any Software
        # project existed (a misplaced call site); other custom fields present but not these
        # means the image genuinely dropped them (re-run the capability map). The wait's
        # allowance is JIRA_DC_FIELD_READY_TIMEOUT (seconds, default 120) — see
        # tests/external/live_jira_dc/README.md § Readiness.
        # Per-test hang guard (ticket d835-1846-95d1-4d84); see the live-LLM lane above for the
        # rationale and why --timeout-method=thread is the load-bearing half.
        # 900s for this lane. The step ran 2384-2635s over 63 tests across recent green runs —
        # a ~41s mean per test — so 900s is ~22x that mean. It ALSO has to clear the
        # field-readiness wait documented above, which runs INSIDE a test and is therefore
        # charged to the per-test budget: JIRA_DC_FIELD_READY_TIMEOUT defaults to 120s and
        # README.md documents raising it to 300s, so 900s keeps a 3x margin over the
        # documented maximum. --durations=25 is added with it: no lane here has ever printed
        # per-test durations, so the tail behind that mean is unmeasured and a future
        # re-calibration would otherwise be guesswork.
        #
        # This directory glob is the ONLY wiring the rich-text live module
        # (test_dc_rich_text_live.py, story 3289) needs: it runs in THIS existing amd64 Docker
        # DC-harness job — rendered-HTML fidelity (?expand=renderedFields), state-based
        # echo-safety, and the both-sides settled-conflict alert — not a new job. Keep new
        # tests/external/live_jira_dc/ modules under this glob rather than enumerating modules.
        run: >-
          pytest -m external tests/external/live_jira_dc -q -rA --durations=25
          --timeout=900 --timeout-method=thread
          -p no:cacheprovider --basetemp="${{ runner.temp }}/rebar-basetemp"

      - name: Jira DC container logs on failure
        if: failure()
        run: cd tests/external/live_jira_dc && docker compose logs --tail=200

      - name: Tear down the Jira DC harness
        if: always()
        run: cd tests/external/live_jira_dc && docker compose down -v

  # ── the Jira Cloud + S3 rehearsal lane: read-only, real Cloud, S3 store backend ─────────
  #
  # Complements jira-dc-harness. DC is git/file-backed and low-volume, so it exercises
  # neither the S3 store backend nor real Cloud ticket volume/diversity; this job drives the
  # many-to-many bridge against the two REAL Cloud projects REB + DIG over an ISOLATED,
  # S3-backed store, READ-ONLY (structural guard + before/after Jira counts). See
  # tests/external/live_jira_cloud_s3/README.md.
  #
  # GATED on vars.AWS_S3_REHEARSAL_ROLE_ARN because it needs an S3-capable AWS identity, and
  # the Bedrock CI role (vars.AWS_BEDROCK_CI_ROLE_ARN) has NO S3 permissions. Until an
  # operator provisions a scoped S3 OIDC role and sets that variable, the job does not run
  # (a red "missing infra" job every week would be noise, and the jira_live all-skip canary
  # would fail it anyway). The AUTHORITATIVE acceptance evidence meanwhile is a clean LOCAL
  # live run — the story's AC does not require this job to be green, only a genuine green run.
  jira-cloud-s3-rehearsal:
    name: jira Cloud + S3 rehearsal (read-only, real Cloud + S3 store)
    if: ${{ vars.AWS_S3_REHEARSAL_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    # Whole-job ceiling: pytest's --timeout=1800 is PER-TEST only, so a hung
    # non-pytest step (acli auth, aws sts, git push to S3) would otherwise run to the
    # GitHub Actions 6-hour default. ~16m is the observed whole-suite time; 45m leaves
    # generous headroom for install + acli download + a slow Cloud fetch.
    timeout-minutes: 45
    permissions:
      contents: read
      # Required for OIDC AssumeRoleWithWebIdentity on the S3 rehearsal role.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # `[dev]` installs the reconciler + its deps; git-remote-s3 is the git transport helper
      # the S3 store backend rides on (it is NOT a rebar dependency — the store is
      # backend-agnostic — so it is installed explicitly here, mirroring the local runbook).
      - name: Install rebar + the S3 git-remote helper
        run: |
          uv sync --locked --extra dev
          uv pip install git-remote-s3==0.3.2
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main

      - name: Cache acli binary
        id: cache-acli
        uses: actions/cache@v6
        with:
          path: ~/.acli
          key: acli-${{ runner.os }}-${{ vars.ACLI_VERSION || 'unset' }}

      - name: Download + verify + install acli
        if: steps.cache-acli.outputs.cache-hit != 'true'
        env:
          ACLI_VERSION: ${{ vars.ACLI_VERSION }}
          ACLI_SHA256: ${{ vars.ACLI_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ACLI_VERSION:-}" ] || [ "$ACLI_VERSION" = "latest" ]; then
            echo "::error::ACLI_VERSION repo variable is unset or 'latest'. Pin a specific version (e.g. 1.3.14-stable) and set ACLI_SHA256 to its digest."
            exit 1
          fi
          mkdir -p ~/.acli
          curl -sSL "https://acli.atlassian.com/linux/${ACLI_VERSION}/acli_${ACLI_VERSION}_linux_amd64.tar.gz" -o ~/.acli/acli.tar.gz
          if [ -n "${ACLI_SHA256:-}" ]; then
            echo "${ACLI_SHA256}  $HOME/.acli/acli.tar.gz" | sha256sum -c --strict
          else
            echo "::warning::ACLI_SHA256 unset — proceeding without checksum verification. Set it to: $(sha256sum ~/.acli/acli.tar.gz | awk '{print $1}')"
          fi
          tar xzf ~/.acli/acli.tar.gz -C ~/.acli/ --strip-components=1
          chmod +x ~/.acli/acli
          rm -f ~/.acli/acli.tar.gz

      - name: Add acli to PATH and authenticate
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          sudo ln -sf "$HOME/.acli/acli" /usr/local/bin/acli
          echo "$JIRA_API_TOKEN" | acli jira auth login \
            --site "$JIRA_URL" \
            --email "$JIRA_USER" \
            --token

      # OIDC → the scoped S3 rehearsal role (s3:List/Get/Put/DeleteObject on the throwaway
      # rehearsal bucket ONLY; NO Jira access — the suite reaches Jira over acli above). The
      # region is where the rehearsal bucket lives (us-east-1 by default).
      - name: Configure AWS credentials (OIDC → the scoped S3 rehearsal role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_S3_REHEARSAL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_S3_REHEARSAL_REGION || 'us-east-1' }}

      - name: Run the read-only Cloud + S3 rehearsal
        env:
          # Live-Jira creds (repo variables + secret), mirroring the external job.
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # The bucket the throwaway per-run prefix is created under (overridable). Its
          # region is set on the AWS credentials step above.
          REBAR_REHEARSAL_S3_BUCKET: ${{ vars.REBAR_REHEARSAL_S3_BUCKET || 'rebar-rehearsal-368f-896586841071' }}
          AWS_REGION: ${{ vars.AWS_S3_REHEARSAL_REGION || 'us-east-1' }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_S3_REHEARSAL_REGION || 'us-east-1' }}
          # The external tier is inert unless opted in (tests/external/conftest.py's
          # _require_external_opt_in guard).
          REBAR_RUN_EXTERNAL: "1"
          # git-remote-s3 clones a bare mirror; allow git to treat it as safe.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.bareRepository
          GIT_CONFIG_VALUE_0: all
        # -rA surfaces the PASSED tests' captured stdout — several scenarios record real Cloud
        # volume / RECON no-write evidence rather than only asserting, so that output is the
        # acceptance record. Per-test hang guard (ticket d835-1846-95d1-4d84); a full-project
        # Cloud fetch over acli is legitimately slow, so 1800s (~30m) exceeds the ~16m local
        # whole-suite time with margin. --timeout-method=thread is load-bearing (the default
        # signal method cannot fire while blocked in a subprocess call).
        run: >-
          pytest -m external tests/external/live_jira_cloud_s3 -q -rA --durations=25
          --timeout=1800 --timeout-method=thread
          -p no:cacheprovider --basetemp="${{ runner.temp }}/rebar-basetemp"

      # Backstop for the fixture teardown: on cancel or a step-level failure/timeout the
      # pytest `finally` that deletes each per-run s3://…/cloud-s3-rehearsal/<prefix> may
      # not unwind, leaking throwaway objects. Only runs on failure/cancel — a successful
      # run's fixtures already deleted their own prefixes, so sweeping the whole key-space
      # on success would needlessly clobber a concurrently-running rehearsal. Best-effort.
      - name: Sweep any leaked throwaway S3 stores
        if: ${{ failure() || cancelled() }}
        env:
          REBAR_REHEARSAL_S3_BUCKET: ${{ vars.REBAR_REHEARSAL_S3_BUCKET || 'rebar-rehearsal-368f-896586841071' }}
          AWS_REGION: ${{ vars.AWS_S3_REHEARSAL_REGION || 'us-east-1' }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_S3_REHEARSAL_REGION || 'us-east-1' }}
        run: |
          aws s3 rm "s3://${REBAR_REHEARSAL_S3_BUCKET}/cloud-s3-rehearsal/" --recursive || true

  pandoc-corpus-replay:
    name: Pandoc corpus replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .github/python-version.txt
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install the pinned Pandoc test environment
        run: uv sync --locked --extra dev
      - name: Replay every Pandoc-bound corpus unit and settling pass
        run: >-
          uv run python scripts/generate_dc_wiki_legacy_outputs.py --check
