# rebar — Reconciler Heartbeat Canary
#
# Monitors reconcile-bridge.yml for staleness and alerts via a rebar bug ticket
# when no successful run has occurred within the alert window. Self-healing:
# closes the alert ticket when the reconciler recovers.
#
# Also runs the offline bridge audit: each cycle `rebar bridge fsck` checks the
# binding-drift parity oracle and forward/reverse binding-store integrity, then
# opens/updates/closes a `binding-drift-alert` bug for actionable findings.
#
# This is a TEMPLATE: client projects copy it verbatim (see docs/jira-sync-setup.md).
#
# Classification + alert-lifecycle LOGIC lives in scripts/canary_bridge.py
# (ticket e602 — shell-to-Python Tier 3); the steps here are thin invocations
# plus plumbing. Unit tests: tests/scripts/test_canary_bridge.py. The final
# "flush unpushed" step is a strict, synchronous process-boundary adapter;
# rebar._store.push owns its CAS recovery, and an executable workflow smoke
# test protects the formerly verbatim YAML contract.
#
# rebar divergences from DSO's canary:
#   * ticket ops use the `rebar` CLI (rebar list/create/comment/transition), which
#     AUTO-COMMITS and AUTO-PUSHES to origin/tickets — so a manual commit-back is
#     usually unnecessary. We still run a final "flush unpushed" guard because
#     auto-push is best-effort (a failed push leaves the commit local, lost when the
#     runner is torn down).
#   * bug-close requires `--reason` prefixed "Fixed:" or "Escalated to user:".
#
# Staleness window: default 4h (workflow_dispatch override `alert_window_hours`).
# The reconcile cadence is hourly, so the theoretical floor is 3h (3x cadence); the
# 4h window still clears it, tolerating a late/contended run without false alarms.

name: Reconciler Heartbeat Canary

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report staleness without creating/closing tickets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      alert_window_hours:
        description: 'Alert window in hours (default: 4)'
        required: false
        default: '4'
        type: string
      status_source:
        description: 'Heartbeat source (status; github-api is one-release rollback)'
        required: false
        default: 'status'
        type: choice
        options:
          - 'status'
          - 'github-api'

concurrency:
  group: reconcile-bridge-canary
  cancel-in-progress: false

permissions:
  contents: write   # push ticket changes to the tickets orphan branch
  actions: read     # read reconcile-bridge.yml run history

jobs:
  canary:
    name: Check reconciler heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ALERT_WINDOW_HOURS: ${{ inputs.alert_window_hours || '4' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      ALERT_TAG: heartbeat-alert
      REBAR_CANARY_HEARTBEAT_SOURCE: ${{ inputs.status_source || 'status' }}
      # NOTE: REBAR_IDENTITY_SIGNING_KEY is exported by the "Materialize the Rebar Bot signing
      # key" step (via $GITHUB_ENV) and is deliberately NOT set here. Job-level `env:` cannot
      # reference ${{ runner.temp }} — the `runner` context is unavailable outside steps, so a
      # job-level entry using it is a parse-time startup failure that produces ZERO jobs (the
      # canary never runs). Every rebar-write step runs after Materialize, so they all see
      # identity.signing_key without a job-level entry.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          filter: blob:none
          # Full history (NOT shallow): a shallow tickets graft defeats merge-base and
          # corrupts compaction reconciliation (bug f193). Reconcile with full history
          # + merge, never shallow + rebase.
          fetch-depth: 0
          ref: main

      - name: Mount tickets branch as a worktree
        run: |
          set -euo pipefail
          git fetch origin '+tickets:refs/remotes/origin/tickets'
          git fetch origin '+refs/reconciler/*:refs/reconciler/*'
          rm -rf .tickets-tracker
          git worktree add -B tickets .tickets-tracker origin/tickets

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install rebar
        # TEMPLATE NOTE: clients use `pip install nava-rebar==<pinned>`.
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Configure git identity
        env:
          BRIDGE_BOT_NAME: ${{ vars.BRIDGE_BOT_NAME || 'rebar-bridge[bot]' }}
          # Default to the Rebar Bot authorship identity's email (story 1787) so the
          # signing seam's git-email fallback resolves canary writes to identity
          # 594c-9dcf-5ad6-4e6d. Overridable via the BRIDGE_BOT_EMAIL repo variable.
          BRIDGE_BOT_EMAIL: ${{ vars.BRIDGE_BOT_EMAIL || 'joeoakhart+bot@navapbc.com' }}
        run: |
          set -euo pipefail
          git config --global user.name "${BRIDGE_BOT_NAME}"
          git config --global user.email "${BRIDGE_BOT_EMAIL}"

      - name: Materialize the Rebar Bot signing key
        # Story 1787: the canary writes NON-EXEMPT tickets via the rebar CLI, which signs
        # automatically through the seam once identity.signing_key + a resolvable identity
        # are present. A multi-line OpenSSH PEM key cannot live in an env var used as a
        # key_path, so materialize it to a 0600 file under $RUNNER_TEMP (discarded at job
        # end) and export its path. If the secret is unset the canary still runs, writing
        # unsigned (verify-identity is advisory).
        env:
          REBAR_BOT_SIGNING_KEY: ${{ secrets.REBAR_BOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REBAR_BOT_SIGNING_KEY:-}" ]; then
            echo "REBAR_BOT_SIGNING_KEY unset — canary writes will be unsigned (advisory)"
            exit 0
          fi
          echo "::add-mask::${REBAR_BOT_SIGNING_KEY}"
          KEYFILE="${RUNNER_TEMP}/rebar-bot-signing-key"
          install -m 600 /dev/null "${KEYFILE}"
          printf '%s\n' "${REBAR_BOT_SIGNING_KEY}" > "${KEYFILE}"
          echo "REBAR_IDENTITY_SIGNING_KEY=${KEYFILE}" >> "${GITHUB_ENV}"
          echo "Materialized bot signing key to ${KEYFILE} (0600)"

      - name: Initialize the ticket store (seed .env-id for CLI writes)
        # A bare `git worktree add` of the tickets branch does NOT create
        # `.tickets-tracker/.env-id` (it is git-ignored and never committed to the
        # branch), and the write seam refuses every rebar write without it. `rebar init`
        # is the documented headless-CI provisioning path (docs/architecture.md): it
        # attaches to the existing origin/tickets non-interactively and seeds `.env-id`.
        # Idempotent — prints "already initialized" on subsequent runs.
        run: |
          set -euo pipefail
          rebar init

      - name: Check last successful reconcile-bridge run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/canary_bridge.py check-heartbeat --source "${REBAR_CANARY_HEARTBEAT_SOURCE}"

      - name: Log canary result
        run: |
          echo "Stale:  ${{ steps.check.outputs.stale }}"
          echo "Status: ${{ steps.check.outputs.status_msg }}"
          echo "DryRun: ${DRY_RUN}"

      - name: Heartbeat alert lifecycle (find/open/comment/close)
        if: env.DRY_RUN == 'false'
        env:
          STALE: ${{ steps.check.outputs.stale }}
          LAST_RUN_AGO: ${{ steps.check.outputs.last_run_ago }}
          STATUS_MSG: ${{ steps.check.outputs.status_msg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Consecutive-red threshold: the filer queries this workflow's own run
          # history via gh api before opening a ticket (4527).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANARY_WORKFLOW_FILE: reconcile-bridge-canary.yml
        run: |
          set -euo pipefail
          python scripts/canary_bridge.py heartbeat-alert

      # ── Binding-drift parity oracle (epic 3006-e198, child 8de5) ─────────────
      # bridge fsck reads bindings.json + prev_snapshot.json READ-ONLY. It runs the
      # convergence classifier and validates both binding-index directions. Surface
      # actionable binding_drift or store_integrity findings as a bridge_alert bug;
      # an operational scan failure fails this step instead of looking clean.
      - name: Check bridge binding-drift
        id: drift
        run: |
          set -euo pipefail
          python scripts/canary_bridge.py check-binding-drift

      - name: Binding-drift alert lifecycle (find/open/comment/close)
        if: env.DRY_RUN == 'false'
        env:
          DRIFT_FOUND: ${{ steps.drift.outputs.drift_found }}
          DRIFT_TOTAL: ${{ steps.drift.outputs.drift_total }}
          DRIFT_SUMMARY: ${{ steps.drift.outputs.drift_summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/canary_bridge.py binding-drift-alert

      - name: Flush any unpushed ticket changes to origin/tickets
        # Core owns strict, synchronous delivery and CAS recovery; this adapter keeps
        # the canary's terminal-red behavior when local ticket changes cannot land.
        if: env.DRY_RUN == 'false'
        run: |
          set -euo pipefail
          cd .tickets-tracker
          REBAR_SYNC_PUSH=always python -m rebar._store.push push --tracker . --strict

      - name: Fail job on stale (surface as a red run in the Actions UI)
        if: steps.check.outputs.stale == 'true'
        run: |
          echo "::error::Reconciler is stale — ${{ steps.check.outputs.status_msg }}"
          exit 1
