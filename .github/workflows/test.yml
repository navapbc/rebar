name: Test Suite (mirror)

# This workflow is the branch-head CI entrypoint. `_build-and-test.yml` defines the shared lint,
# audit, default Python, and CI-safe integration lanes used here and by Gerrit's exact-patchset
# Verified workflow. This file adds clean-install, artifact-provenance, opt-in external, and
# scheduled breadth lanes. Triggers select the applicable lanes. Manual bridge probes validate
# Jira. External tests remain outside the default
# `not integration and not external` selection.

on:
  push:
    # Ordinary branch pushes run this workflow except replicated `feature/**`, `main`, and
    # `tickets`. Gerrit's dispatch provides the pre-merge Verified result. The schedule reports
    # periodic main health. Ticket events do not consume code-CI capacity. `**` matches every
    # nested feature depth.
    branches-ignore: ["feature/**", "main", "tickets"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      run_external:
        description: >-
          Also run the LIVE external-integration tier (billable). Leave false for a plain
          "is main healthy?" check — dispatch is now the routine on-demand health button.
        required: false
        default: false
        type: boolean
  schedule:
    # Every 6 hours — four "is main healthy" runs a day, a fixed cost independent of the
    # commit rate. Minute 41 (never 0) keeps this repo off the hour boundary that every
    # other project on the platform schedules onto.
    - cron: "41 */6 * * *"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared gate definition checks this branch head when no input is supplied. Gerrit supplies
  # its patchset ref.
  build-and-test:
    uses: ./.github/workflows/_build-and-test.yml

  # Mirror Gerrit's targeted mutation gate, except on schedules covered by the weekly sweep.
  mutation:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/_mutation.yml

  # Run pinned native-scanner contracts in a parallel reusable lane, off scheduled health.
  scanner-integration:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/_scanner-integration.yml

  # This lane sets `REBAR_RUN_EXTERNAL=1` so Jira mutations and billable model requests stay
  # outside secretless reusable tests. Its condition requires a workflow dispatch, an explicit
  # input, and an actor whose name equals the repository owner. Pull requests, schedules, and
  # ordinary health dispatches cannot select it. The workflow-wide per-ref concurrency policy
  # also applies. The weekly external workflow remains separate.
  external:
    name: external-integration (live Jira + LLM)
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.repository_owner == github.actor
          && github.event.inputs.run_external == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Install rebar from the committed lock (dev + agents extras)
        run: |
          uv sync --locked --extra dev --extra agents
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main
      - name: Run the external tier (live; opt-in + credential scoped)
        # The opt-in lifts the tier skip. Each test still skips when its required credentials or
        # extras are unavailable. A project copy can enable the commented credential mappings:
        #   JIRA_URL: ${{ secrets.JIRA_URL }}
        #   JIRA_USER: ${{ secrets.JIRA_USER }}
        #   JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Without these values, tests skip while confirming that only this lane reaches the tier.
        env:
          REBAR_RUN_EXTERNAL: "1"
          # JIRA_URL: ${{ secrets.JIRA_URL }}
          # JIRA_USER: ${{ secrets.JIRA_USER }}
          # JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Thread-mode timeout can interrupt C-level socket or subprocess waits. The 600-second
        # bound covers the selected external tests.
        run: >-
          pytest -m external -q -p no:cacheprovider
          --timeout=600 --timeout-method=thread
          --basetemp="${{ runner.temp }}/rebar-basetemp-ext"

  # Run the README and CLI probe against a clean wheel install, exposing package-data,
  # manifest, entry-point, and registration defects hidden by editable installs.
  golden-path:
    name: golden-path (clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq && jq --version
      - name: Install rebar from a built wheel (clean, non-editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main
      # If-present guard per ticket ee2a (_build-and-test.yml, raw-git-write gate); bug 1909-c1a7-9f20-440f,
      # mirrored from gerrit-verify.yaml into this lane as bug e818-564e-d3b6-4eaa.
      - name: README quickstart golden-path (against the installed rebar)
        run: |
          if [ ! -f scripts/check_readme_quickstart.py ]; then
            echo "scripts/check_readme_quickstart.py not in checked-out tree (change predates the gate) — skipping;" \
                 "the gate re-enforces on rebase and on every post-merge change"
            exit 0
          fi
          python scripts/check_readme_quickstart.py
      # If-present guard per ticket ee2a (_build-and-test.yml, raw-git-write gate); bug 1909-c1a7-9f20-440f,
      # mirrored from gerrit-verify.yaml into this lane as bug e818-564e-d3b6-4eaa.
      - name: End-to-end CLI probe (against the installed rebar)
        run: |
          if [ ! -f scripts/probe_rebar.py ]; then
            echo "scripts/probe_rebar.py not in checked-out tree (change predates the gate) — skipping;" \
                 "the gate re-enforces on rebase and on every post-merge change"
            exit 0
          fi
          python scripts/probe_rebar.py </dev/null

  # The shared artifact-provenance probe checks this branch head when no input is supplied.
  # Gerrit supplies its exact patchset ref so the two lanes cannot drift.
  artifact-probe:
    uses: ./.github/workflows/_artifact-probe.yml

  # Scheduled health does not identify a failing commit directly. Publish the verdict, the most
  # recent successful main SHA, and a copyable bisect recipe. Resolve the lower bound from this
  # workflow's successful Actions history without writes. An unavailable bound produces a report
  # and does not fail main.
  main-health-report:
    name: main health report (last known green + bisect recipe)
    # Branch-health lanes only. A PR has its own per-commit attribution and needs no bisect
    # window; a branch push is likewise attributable to one commit.
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [build-and-test, golden-path, artifact-probe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read    # list this workflow's own runs to find the last green one
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tested script owns API lookup and rendering so offline tests cover quoting, 403
      # responses, and fallbacks. Both `GH_TOKEN` and job-level `actions: read` are required.
      # Omitting either value makes every run use the missing-lower-bound report.
      - name: Publish the verdict, the last known-green SHA, and the bisect recipe
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: >-
            {"build-and-test": "${{ needs.build-and-test.result }}",
             "golden-path": "${{ needs.golden-path.result }}",
             "artifact-probe": "${{ needs.artifact-probe.result }}"}
        run: |
          set -euo pipefail
          # predates-gate-ok: this job runs only on `schedule`/`workflow_dispatch`, which
          # always check out the default branch — never an arbitrary patchset.
          python scripts/main_health_report.py \
            --ref-name "$GITHUB_REF_NAME" \
            --head-sha "$GITHUB_SHA" \
            --jobs "$JOB_RESULTS" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow-file test.yml >> "$GITHUB_STEP_SUMMARY"

  # Scheduled and manual breadth runs cover newer interpreters, Windows, full macOS, declared
  # dependency floors, and external links. They provide advisory results without casting Verified
  # or extending the push and pull-request hot path. The shared lane covers intermediate Python
  # versions for the same triggers.

  # Test stable Python 3.14 against the committed lock as a required interpreter-compatibility
  # signal. Python 3.15 and free-threaded 3.14 may lack locked wheels, so those jobs resolve
  # available dependencies and remain nonblocking. Their dependency changes do not affect branch
  # health.
  sweep-interpreters:
    name: sweep (py${{ matrix.python-version }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            experimental: false
            locked: true
          - python-version: "3.15"
            experimental: true
            locked: false
          - python-version: "3.14t"
            experimental: true
            locked: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main
      - name: Create the interpreter venv and install
        run: |
          if [ "${{ matrix.locked }}" = "true" ]; then
            # Locked deps = the gate's exact set; pure interpreter signal (must-pass).
            uv sync --locked --python "${{ matrix.python-version }}" \
              --extra dev --extra reviewbot --extra ui
          else
            # Pre-release interpreters predate the lock's wheels; re-resolve latest.
            uv venv --python "${{ matrix.python-version }}"
            uv pip install '.[dev,reviewbot,ui]'
          fi
      - name: Run the default suite
        run: >-
          uv run --no-sync pytest -m "not integration and not external"
          -n 4 --dist worksteal -q -p no:cacheprovider
          --timeout=600 --timeout-method=thread
          --basetemp="${{ runner.temp }}/rebar-basetemp-sweep-interp"

  # The advisory Windows job detects path, temporary-directory, Git, and file-lock regressions.
  # Windows is not a supported gate target, so failures remain visible without blocking merges.
  sweep-windows:
    name: sweep (windows)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main
      - name: Create venv and install
        run: |
          uv venv --python 3.13
          uv pip install ".[dev,reviewbot,ui]"
      # This step names the Windows evidence that the write lock excludes concurrent processes and
      # releases after the holder exits. The default suite covers the same module without named
      # output under `-q`. Running it first preserves the platform-specific verdicts in the log.
      # mechanism-ok: ci_gate .github/workflows/test.yml::Prove the Windows exclusive leg (named verdicts) — story 4cfc-2de2-747d-4388 AC4: windows-latest is the only place the real msvcrt.locking's cross-process exclusivity and release-on-process-death can be established, and under the default suite's `-q` a passing proof prints NOTHING, so the evidence was readable only as absence. This step gates nothing (the job is continue-on-error) and adds no new coverage — it re-runs one already-running module so its verdicts are named in the log.
      - name: Prove the Windows exclusive leg (named verdicts)
        # Skip trees predating the module. Use bash because Windows defaults to pwsh and the
        # parity test executes this guard in bash. Non-blocking failure names the proof without
        # suppressing the broader default-suite signal.
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f tests/unit/store/test_windows_exclusive_leg.py ]; then
            echo "tests/unit/store/test_windows_exclusive_leg.py not in checked-out tree" \
                 "(change predates the gate) — skipping;" \
                 "the gate re-enforces on rebase and on every post-merge change"
            exit 0
          fi
          uv run --no-sync pytest tests/unit/store/test_windows_exclusive_leg.py \
            -v -p no:cacheprovider --timeout=600 --timeout-method=thread
      - name: Run the default suite
        run: >-
          uv run --no-sync pytest -m "not integration and not external"
          -n 4 --dist worksteal -q -p no:cacheprovider
          --timeout=600 --timeout-method=thread

  # Scheduled full macOS default suite catches platform regressions outside Verified's reduced
  # `platform_compat` subset without extending the hot path.
  sweep-macos-full:
    name: sweep (macos, full suite)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main
      - name: Create venv and install
        run: |
          uv venv --python 3.13
          uv pip install '.[dev,reviewbot,ui]'
      - name: Run the FULL default suite (not integration/external)
        run: >-
          uv run --no-sync pytest -m "not integration and not external"
          -n 3 --dist worksteal -q -p no:cacheprovider
          --timeout=600 --timeout-method=thread
          --basetemp="${{ runner.temp }}/rebar-basetemp-macos-full"

  # Resolve core, dev, and agents dependencies at their declared minimums on supported Python 3.11.
  # Run unit tests to verify those floors independently of the lock. Web extras without declared
  # floors remain out of scope and skip their tests. Their dependency floors belong to separate
  # work.
  sweep-lower-bounds:
    name: sweep (declared lower-bound resolution)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main
      - name: Resolve + install the DECLARED floors (lowest-direct, oldest interpreter)
        run: |
          uv venv --python 3.11
          uv pip install --resolution lowest-direct '.[dev,agents]'
      - name: Run the unit tier against the floor resolution
        run: >-
          uv run --no-sync pytest tests/unit -m "not integration and not external"
          -n 4 --dist worksteal -q -p no:cacheprovider
          --timeout=600 --timeout-method=thread
          --basetemp="${{ runner.temp }}/rebar-basetemp-lb"

  # External documentation link checking (epic 5664 S5). Broken external links in
  # README/docs/ rot silently; this checks them on the schedule. Non-blocking: external
  # endpoints flake and rate-limit, so a link failure is a visible finding, never a
  # gate (`fail: false` plus `continue-on-error`). lychee is SHA-pinned — test.yml is
  # outside the zizmor audit set, but new third-party actions are pinned regardless
  # (epic 5664 S2 precedent).
  sweep-doc-links:
    name: sweep (external doc links)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check external links in README + docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 4
            README.md CONTRIBUTING.md 'docs/**/*.md'
          fail: false
