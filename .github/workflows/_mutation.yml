name: Mutation Testing (reusable)

on:
  workflow_call:
    inputs:
      gerrit-refspec:
        description: "Gerrit refspec. Empty means use the branch or PR checkout."
        required: false
        type: string
        default: ""
      gerrit-project:
        description: "Gerrit project, required when gerrit-refspec is set."
        required: false
        type: string
        default: ""
      gerrit-url:
        description: "Gerrit base URL, required when gerrit-refspec is set."
        required: false
        type: string
        default: ""
      all-shards:
        description: "Run every configured shard instead of selecting from the diff."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  selector:
    name: select mutation shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-shards: ${{ steps.select.outputs.has-shards }}
    steps:
      - name: Checkout branch or PR head
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout the Gerrit patchset attempt 1
        id: checkout-gerrit-attempt-1
        if: inputs.gerrit-refspec != ''
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_mutation.yml::Wait before retrying Gerrit patchset checkout — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before retrying Gerrit patchset checkout
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed; retrying after 15 seconds (transport faults are retried in-job)'
          sleep 15
      - name: Checkout the Gerrit patchset attempt 2
        id: checkout-gerrit-attempt-2
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_mutation.yml::Wait before final Gerrit patchset checkout retry — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before final Gerrit patchset checkout retry
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed twice; final retry after 45 seconds'
          sleep 45
      - name: Checkout the Gerrit patchset attempt 3
        id: checkout-gerrit-attempt-3
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv with dependency caching
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      # Install bubblewrap for Linux mutation subprocesses. Hosted Ubuntu denies
      # unprivileged CLONE_NEWUSER, so the functional probe finds no sandbox.
      # This Linux-only lane declares its unsandboxed exception below.
      - name: Install bubblewrap (Linux mutation sandbox)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Select mutation shards
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/mutation_gate.py ]]; then
            echo "scripts/mutation_gate.py not in checked-out tree (change predates the gate) — skipping;" \
                 "the gate re-enforces on rebase and on every post-merge change"
            echo 'matrix={"shard":[]}' >> "$GITHUB_OUTPUT"
            echo "has-shards=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selector_args=(select --base HEAD^ --head HEAD)
          if [[ "${{ inputs.all-shards }}" == "true" ]]; then
            selector_args+=(--all-shards)
          fi
          selection_json="$(uv run --locked python scripts/mutation_gate.py "${selector_args[@]}")"
          matrix="$(jq -c '{shard: .selected_shards}' <<<"$selection_json")"
          has_shards="$(jq -r '.empty_selection | not' <<<"$selection_json")"
          printf '%s\n' "$selection_json"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-shards=$has_shards" >> "$GITHUB_OUTPUT"

  mutation:
    name: bounded mutation gate
    needs: selector
    if: needs.selector.outputs.has-shards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selector.outputs.matrix) }}
    steps:
      - name: Checkout branch or PR head
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout the Gerrit patchset attempt 1
        id: checkout-gerrit-attempt-1
        if: inputs.gerrit-refspec != ''
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_mutation.yml::Wait before retrying Gerrit patchset checkout — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before retrying Gerrit patchset checkout
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed; retrying after 15 seconds (transport faults are retried in-job)'
          sleep 15
      - name: Checkout the Gerrit patchset attempt 2
        id: checkout-gerrit-attempt-2
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_mutation.yml::Wait before final Gerrit patchset checkout retry — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before final Gerrit patchset checkout retry
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed twice; final retry after 45 seconds'
          sleep 45
      - name: Checkout the Gerrit patchset attempt 3
        id: checkout-gerrit-attempt-3
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv with dependency caching
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      # Install bubblewrap for Linux mutation subprocesses. Hosted Ubuntu denies
      # unprivileged CLONE_NEWUSER, so the functional probe finds no sandbox.
      # This Linux-only lane declares its unsandboxed exception below.
      - name: Install bubblewrap (Linux mutation sandbox)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Install the pinned development environment
        run: uv sync --locked --extra dev
      # Hosted Ubuntu runs this shard without a working namespace sandbox.
      # Declare the exception here instead of inheriting ambient CI. The disposable
      # runner is discarded after the job. Workstations still require a sandbox.
      - name: Run mutation shard
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
          REBAR_MUTATION_ALLOW_UNSANDBOXED: "1"
        run: |
          # predates-gate-ok: transitively guarded — this job runs only when the selector set
          # has-shards=true, and the selector's own `-f scripts/mutation_gate.py` guard forces
          # has-shards=false on a tree that predates the script.
          uv run --locked python scripts/mutation_gate.py run --base HEAD^ --head HEAD --shard "$MATRIX_SHARD"
      - name: Publish mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-results-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutation-results/
          if-no-files-found: warn
          retention-days: 30
