name: Mutation Testing (reusable)

on:
  workflow_call:
    inputs:
      gerrit-refspec:
        description: "Gerrit refspec. Empty means use the branch or PR checkout."
        required: false
        type: string
        default: ""
      gerrit-project:
        description: "Gerrit project, required when gerrit-refspec is set."
        required: false
        type: string
        default: ""
      gerrit-url:
        description: "Gerrit base URL, required when gerrit-refspec is set."
        required: false
        type: string
        default: ""
      all-shards:
        description: "Run every configured shard instead of selecting from the diff."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  selector:
    name: select mutation shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-shards: ${{ steps.select.outputs.has-shards }}
    steps:
      - name: Checkout branch or PR head
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout the Gerrit patchset
        if: inputs.gerrit-refspec != ''
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv with dependency caching
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      # bubblewrap is the Linux sandbox the mutation gate wraps its test subprocesses
      # in (ticket e668-b496-e264-4283). It is installed here, but NOTE WHAT ACTUALLY
      # HAPPENS on this runner: GitHub's ubuntu images deny unprivileged CLONE_NEWUSER,
      # so bwrap cannot create a namespace, the functional probe reports no mechanism,
      # and the gate does NOT get a sandbox. macOS needs no install (sandbox-exec ships
      # with the OS), but this job is Linux-only.
      - name: Install bubblewrap (Linux mutation sandbox)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Select mutation shards
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/mutation_gate.py ]]; then
            echo "scripts/mutation_gate.py not in checked-out tree (change predates the gate) — skipping;" \
                 "the gate re-enforces on rebase and on every post-merge change"
            echo 'matrix={"shard":[]}' >> "$GITHUB_OUTPUT"
            echo "has-shards=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selector_args=(select --base HEAD^ --head HEAD)
          if [[ "${{ inputs.all-shards }}" == "true" ]]; then
            selector_args+=(--all-shards)
          fi
          selection_json="$(uv run --locked python scripts/mutation_gate.py "${selector_args[@]}")"
          matrix="$(jq -c '{shard: .selected_shards}' <<<"$selection_json")"
          has_shards="$(jq -r '.empty_selection | not' <<<"$selection_json")"
          printf '%s\n' "$selection_json"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-shards=$has_shards" >> "$GITHUB_OUTPUT"

  mutation:
    name: bounded mutation gate
    needs: selector
    if: needs.selector.outputs.has-shards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selector.outputs.matrix) }}
    steps:
      - name: Checkout branch or PR head
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout the Gerrit patchset
        if: inputs.gerrit-refspec != ''
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv with dependency caching
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      # bubblewrap is the Linux sandbox the mutation gate wraps its test subprocesses
      # in (ticket e668-b496-e264-4283). It is installed here, but NOTE WHAT ACTUALLY
      # HAPPENS on this runner: GitHub's ubuntu images deny unprivileged CLONE_NEWUSER,
      # so bwrap cannot create a namespace, the functional probe reports no mechanism,
      # and the gate does NOT get a sandbox. macOS needs no install (sandbox-exec ships
      # with the OS), but this job is Linux-only.
      - name: Install bubblewrap (Linux mutation sandbox)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: Install the pinned development environment
        run: uv sync --locked --extra dev
      # The gate therefore runs UNSANDBOXED on this lane, and now says so OUT LOUD.
      # Ambient `CI` used to waive the sandbox implicitly; it no longer does
      # (`f11d-f8fd`), because a workstation with `CI=1` exported got that same silent
      # waiver — the configuration the 2026-08-26 `rm -rf /*` landed in. The waiver is
      # declared here instead, in a reviewed file, so the exposure is visible rather
      # than inherited from the environment.
      #
      # It is accepted ONLY because this runner is ephemeral and destroyed after the
      # job. It would not be acceptable on a workstation, and the abort there is the
      # whole point. Giving this lane a real sandbox — as the enforcement lane has since
      # `0d22-f664` — is the better end state and removes the need for this line.
      - name: Run mutation shard
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
          REBAR_MUTATION_ALLOW_UNSANDBOXED: "1"
        run: |
          # predates-gate-ok: transitively guarded — this job runs only when the selector set
          # has-shards=true, and the selector's own `-f scripts/mutation_gate.py` guard forces
          # has-shards=false on a tree that predates the script.
          uv run --locked python scripts/mutation_gate.py run --base HEAD^ --head HEAD --shard "$MATRIX_SHARD"
      - name: Publish mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-results-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutation-results/
          if-no-files-found: warn
          retention-days: 30
