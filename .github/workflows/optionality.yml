name: Optional-Dependency Isolation (mirror)

# Branch and pull-request entrypoint for shared optionality checks.
# The reusable workflow verifies lean runtime and optional installs on branch
# HEAD. Gerrit calls the same checks on its exact patchset and alone casts
# Verified. This mirror lane stays read-only.

on:
  push:
    # Ignore main and replicated feature branches on push. Scheduled health
    # checks cover main, while Gerrit gates patchsets before merge. Ignore the
    # tickets event-log branch because ticket writes contain no code.
    branches-ignore: ["feature/**", "main", "tickets"]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    # Every 6 hours, minute 47 (off the hour, and staggered from the sibling health lanes).
    - cron: "47 */6 * * *"

permissions:
  contents: read

jobs:
  optionality:
    # No inputs → the reusable workflow does a branch-head actions/checkout.
    uses: ./.github/workflows/_optionality.yml
