name: Optional-Dependency Isolation (mirror)

# Enforce that rebar's runtime stays LEAN (epic a88f / WS-J3). Extras can only ADD
# dependencies, so without CI the base silently grows heavy. The checks themselves live
# in the reusable ._optionality.yml (workflow_call) so the SAME job definitions run here
# (push / pull_request) AND in the Verified gate (gerrit-verify.yaml, on the patchset) —
# no drift. This lane checks out the branch head (no gerrit-refspec) and casts no vote;
# gerrit-verify is the sole Verified source (see fern-belief-gap).

on:
  push:
    # every branch EXCEPT `main` and the S3-replicated feature/** (redundant mirror CI).
    # `main` branch-health moved to the shared 6-hourly schedule below so post-merge CI
    # reports "is main healthy NOW" instead of a per-commit verdict that cancellation
    # rendered as red X's (ticket 03ef-6fb5-158b-4abd). Pre-merge gating is unchanged: the
    # SAME reusable runs against the patchset in the Verified lane.
    branches-ignore: ["feature/**", "main"]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    # Every 6 hours, minute 47 (off the hour, and staggered from the sibling health lanes).
    - cron: "47 */6 * * *"

permissions:
  contents: read

jobs:
  optionality:
    # No inputs → the reusable workflow does a branch-head actions/checkout.
    uses: ./.github/workflows/_optionality.yml
