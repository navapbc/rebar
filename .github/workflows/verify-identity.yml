name: Verify Authorship Identity

# Verify each mutating event against the author's ancestry-scoped keyring. Project configuration
# selects report-only or fail-closed authenticated authorship. The `identity.enforce_since`
# boundary keeps preceding events advisory.

# The trigger audit classifies `push` as INCLUDED/NO_FILTER apart from branch exclusions. It
# classifies `pull_request` as INCLUDED/NO_FILTER, `workflow_dispatch` as INCLUDED, and `schedule`
# as INCLUDED/NO_FILTER. Push excludes `feature/**` and `main`. Gerrit verifies each patch set
# before merge. Scheduled and manual runs replace cancellable same-ref main pushes.
on:
  push:
    # `tickets` is rebar's event log: every ticket write auto-pushes it, so a trigger here
    # multiplies each comment into a CI run and starves the runner pool. It carries no code
    # — never CI it (ticket refractive-conceptual-sunbear).
    branches-ignore: ["feature/**", "main", "tickets"]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    # Every 6 hours, minute 53 (off the hour, and staggered from the sibling health lanes).
    - cron: "53 */6 * * *"

permissions:
  contents: read

jobs:
  verify-identity:
    name: verify-identity (authenticated-authorship gate)
    runs-on: ubuntu-latest
    env:
      # `REBAR_CHECKOUT_PACK_LIMIT_KIB` is temporarily 563200 for the ~481 MiB blobless tickets
      # pack. Safe compaction cannot reduce the pack below 100 MiB. Restore 102400 after the pack
      # measures below that limit as tracked by `0894-b9b8-6590-4904`.
      REBAR_CHECKOUT_PACK_LIMIT_KIB: 563200
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Fail closed if the blobless checkout pack exceeds its limit
        shell: bash
        run: |
          set -euo pipefail
          size_pack="$(git count-objects -v | awk '$1 == "size-pack:" { print $2; found=1 } END { if (!found) exit 1 }')"
          if ! [[ "$size_pack" =~ ^[0-9]+$ ]]; then
            echo "::error::git count-objects did not report a numeric size-pack" >&2
            exit 1
          fi
          if (( size_pack > REBAR_CHECKOUT_PACK_LIMIT_KIB )); then
            echo "::error::checkout pack is ${size_pack} KiB; limit is ${REBAR_CHECKOUT_PACK_LIMIT_KIB} KiB" >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install rebar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Mount tickets branch as a worktree
        # Materialize the orphan `tickets` store on its `tickets` branch in `.tickets-tracker`.
        # The code checkout does not contain this store. Fetch full history so merge-base and
        # ancestry-scoped key verification match reconcile-bridge.yml.
        run: |
          set -euo pipefail
          git fetch origin '+tickets:refs/remotes/origin/tickets'
          rm -rf .tickets-tracker
          git worktree add -B tickets .tickets-tracker origin/tickets
      - name: verify-identity (gating)
        # No --require-authenticated / --since flags: enforcement posture and the
        # grandfather boundary are read from rebar.toml (`identity.require_authenticated`,
        # `identity.enforce_since`). See the header comment.
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"
          trap 'rm -f "$before" "$after"' EXIT
          git count-objects -v > "$before"
          rebar verify-identity
          git count-objects -v > "$after"
          if ! cmp -s "$before" "$after"; then
            echo "::error::verify-identity changed the object database" >&2
            diff -u "$before" "$after" >&2 || true
            exit 1
          fi
      - name: verify-opcert (required-environment op-cert gate)
        # Same merged-log walk; posture + grandfather boundary from rebar.toml
        # (verify.require_environment, verify.opcert_enforce_since) — no CI variable.
        run: rebar verify-opcert
