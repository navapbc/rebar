name: Jira DC Exact-Patchset Parity

# Additive Jira Data Center evidence for an explicit Gerrit patchset.
# Fetch the supplied ref, verify its SHA against GERRIT_PATCHSET_REVISION, then
# run the isolated DC suite. A wrong ref or skipped suite fails. This manual
# lane does not cast Verified. The portable default gate remains authoritative.
# Native amd64 runs the pinned harness.
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:            { description: "Gerrit target branch", required: true, type: string }
      GERRIT_CHANGE_ID:         { description: "Gerrit Change-Id", required: true, type: string }
      GERRIT_CHANGE_NUMBER:     { description: "Gerrit change number", required: true, type: string }
      GERRIT_CHANGE_URL:        { description: "Gerrit change URL", required: true, type: string }
      GERRIT_EVENT_TYPE:        { description: "Gerrit event type", required: true, type: string }
      GERRIT_PATCHSET_NUMBER:   { description: "Gerrit patchset number", required: true, type: string }
      GERRIT_PATCHSET_REVISION: { description: "Gerrit patchset revision (commit SHA) — verified against the actual checkout", required: true, type: string }
      GERRIT_PROJECT:           { description: "Gerrit project", required: true, type: string }
      GERRIT_REFSPEC:           { description: "Gerrit refspec (refs/changes/NN/NNNN/P)", required: true, type: string }

permissions:
  contents: read

concurrency:
  # A newer patchset for the same change supersedes an in-flight run of THIS lane too.
  group: jira-dc-exact-patchset-${{ inputs.GERRIT_CHANGE_ID }}
  cancel-in-progress: true

jobs:
  jira-dc-exact-patchset:
    name: jira DC exact-patchset parity (real Jira Data Center, ephemeral)
    runs-on: ubuntu-latest
    steps:
      # Fetch the ref from the mirror or Gerrit, compare its commit with the
      # supplied revision, then check out that exact SHA. A mismatch fails before
      # Data Center setup. This prevents a refspec race from testing another tree.
      - name: Checkout the exact Gerrit patchset SHA
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
          GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
          GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}
          GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
          GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          GERRIT_URL: https://${{ vars.GERRIT_SERVER }}
          GITHUB_MIRROR_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          git init -q .
          git remote add origin "$GITHUB_MIRROR_URL"

          gerrit_project_url="${GERRIT_URL%/}/${GERRIT_PROJECT}"

          fetched=
          if git fetch --no-tags --depth=1 origin "$GERRIT_REFSPEC"; then
            fetched=1
          elif git fetch --no-tags --depth=1 "$gerrit_project_url" "$GERRIT_REFSPEC"; then
            fetched=1
          fi

          if [ -z "$fetched" ]; then
            echo "::error::failed to fetch GERRIT_REFSPEC ($GERRIT_REFSPEC) from either attempted source: $GITHUB_MIRROR_URL and $gerrit_project_url — refusing to run the DC lane."
            exit 1
          fi

          fetched_sha="$(git rev-parse "FETCH_HEAD^{commit}")"
          expected_sha="$GERRIT_PATCHSET_REVISION"

          if [ "$fetched_sha" != "$expected_sha" ]; then
            echo "::error::dispatch inputs disagree — GERRIT_REFSPEC ($GERRIT_REFSPEC) resolved to $fetched_sha but GERRIT_PATCHSET_REVISION claims $expected_sha — refusing to check out an ambiguous ref."
            exit 1
          fi

          git checkout --detach --force "$expected_sha"

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::checked-out HEAD ($actual_sha) does not match the requested Gerrit patchset revision ($expected_sha) — refusing to run the DC lane against the wrong ref."
            exit 1
          fi

          {
            echo "### Jira DC exact-patchset parity"
            echo ""
            echo "- Gerrit change: [$GERRIT_CHANGE_URL]($GERRIT_CHANGE_URL) (change $GERRIT_CHANGE_NUMBER, patchset $GERRIT_PATCHSET_NUMBER)"
            echo "- Verified patchset SHA: \`$actual_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "verified_sha=$actual_sha" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      # Install jira-datacenter so transport tests cannot skip for a missing
      # dependency while smoke tests pass.
      - name: Install rebar (test-only; this harness needs no LLM API key)
        run: |
          uv sync --locked --extra dev --extra jira-datacenter
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build and start the Jira DC harness
        working-directory: tests/external/live_jira_dc
        run: docker compose up -d --build

      - name: Wait for Jira DC to become ready
        run: |
          ok=
          for i in $(seq 1 240); do
            if curl -fsS http://localhost:2990/jira/rest/api/2/serverInfo >/dev/null 2>&1; then
              echo "Jira DC ready after ${i} tries"; ok=1; break
            fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Jira DC harness never became ready (see tests/external/live_jira_dc/README.md)"
            (cd tests/external/live_jira_dc && docker compose logs --tail=200)
            exit 1
          fi

      # Fixtures remove remotes from both repositories, disable sync push, and
      # target only the disposable harness. The external tier includes differential,
      # store-isolation, and multi-project tests. An all-skipped suite fails.
      - name: Run the exact-patchset Jira DC differential + convergence suite
        env:
          REBAR_RUN_EXTERNAL: "1"
          REBAR_SYNC_PUSH: "off"
        run: >-
          pytest -m external tests/external/live_jira_dc -q -rA --durations=25
          --timeout=900 --timeout-method=thread
          -p no:cacheprovider --basetemp="${{ runner.temp }}/rebar-basetemp"

      - name: Jira DC container logs on failure
        if: failure()
        run: cd tests/external/live_jira_dc && docker compose logs --tail=200

      - name: Tear down the Jira DC harness
        if: always()
        run: cd tests/external/live_jira_dc && docker compose down -v
