name: Jira DC Capability Map

# Manual authoring run against the pinned Jira Data Center harness.
# A bounded agent surveys issue types, workflows, priorities, links, and length
# limits. Upload candidate answers with raw REST evidence for human review.
# The workflow does not change repository data or configuration.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  map-jira-dc-capabilities:
    name: map Jira DC capabilities (live, ephemeral)
    runs-on: ubuntu-latest
    # Native amd64 is a hard requirement for this harness to finish booting at all — see
    # tests/external/live_jira_dc/README.md's measured arm64 findings. ubuntu-latest is
    # native x86_64, mirroring the jira-dc-harness job in external-integration.yml.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Require an LLM API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret to run the Jira DC capability map (an agentic Opus run)."
            exit 1
          fi

      # The dev extra supplies the agent runtime. This standalone raw-urllib script
      # does not use rebar's Jira transport, so it does not need jira-datacenter.
      - name: Install rebar + the agentic LLM runtime
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main

      # Build the same vendored, digest-pinned Data Center image as the integration suite.
      - name: Build and start the Jira DC harness
        working-directory: tests/external/live_jira_dc
        run: docker compose up -d --build

      - name: Wait for Jira DC to become ready
        run: |
          ok=
          for i in $(seq 1 240); do
            if curl -fsS http://localhost:2990/jira/rest/api/2/serverInfo >/dev/null 2>&1; then
              echo "Jira DC ready after ${i} tries"; ok=1; break
            fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Jira DC harness never became ready (see tests/external/live_jira_dc/README.md)"
            (cd tests/external/live_jira_dc && docker compose logs --tail=200)
            exit 1
          fi

      # Answer the complete checklist in one harness boot and bounded agent run.
      - name: Run the capability-mapping agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_DC_BASE_URL: http://localhost:2990/jira
          # A generous agentic step budget (~450 tool-call cycles at 2 steps/call): this run
          # makes MANY REST round trips across a five-part checklist in one boot, well above
          # the framework's 250-step (~125-cycle) default (docs/llm-framework.md).
          REBAR_LLM_MAX_STEPS: "900"
          # Hard, deterministic guarantee (not just a prompt instruction) that the agent's
          # rebar ticket tool is read-only: withholds `comment_ticket` regardless of gate
          # mode, so this run cannot write to rebar's own ticket store even if it tried.
          REBAR_MCP_READONLY: "1"
          JIRA_DC_MAP_OUTPUT_DIR: ${{ runner.temp }}/jira-dc-capability-map
        run: python scripts/jira_dc_capability_map.py

      - name: Jira DC container logs on failure
        if: failure()
        run: cd tests/external/live_jira_dc && docker compose logs --tail=200

      - name: Tear down the Jira DC harness
        if: always()
        run: cd tests/external/live_jira_dc && docker compose down -v

      - name: Upload capability-map artifact (answers + raw evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: jira-dc-capability-map
          path: ${{ runner.temp }}/jira-dc-capability-map
          if-no-files-found: error
