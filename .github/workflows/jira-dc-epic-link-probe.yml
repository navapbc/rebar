name: Jira DC Epic-Link Clear Probe

# Manual four-call Jira Data Center probe with no agent or LLM.
# The disposable pinned harness tests whether clearing Epic Link takes effect
# and whether the parent field appears in inventory. It uploads evidence and
# leaves the repository untouched.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe-epic-link-clear:
    name: probe the Epic Link clear (live, ephemeral)
    runs-on: ubuntu-latest
    # Native amd64 is a hard requirement for this harness to boot at all — see
    # tests/external/live_jira_dc/README.md's measured arm64 findings.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # NO LLM key and NO `uv sync` are needed: the probe imports only the standard library, so
      # the job stays cheap and cannot accidentally take a billable agentic path.

      - name: Build and start the Jira DC harness
        working-directory: tests/external/live_jira_dc
        run: docker compose up -d --build

      - name: Wait for Jira DC to become ready
        run: |
          ok=
          for i in $(seq 1 240); do
            if curl -fsS http://localhost:2990/jira/rest/api/2/serverInfo >/dev/null 2>&1; then
              echo "Jira DC ready after ${i} tries"; ok=1; break
            fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Jira DC harness never became ready (see tests/external/live_jira_dc/README.md)"
            (cd tests/external/live_jira_dc && docker compose logs --tail=200)
            exit 1
          fi

      - name: Run the Epic-Link clear probe
        env:
          JIRA_DC_BASE_URL: http://localhost:2990/jira
          JIRA_DC_PROBE_OUTPUT_DIR: ${{ runner.temp }}/jira-dc-epic-link-probe
        run: python scripts/jira_dc_epic_link_clear_probe.py

      - name: Jira DC container logs on failure
        if: failure()
        run: cd tests/external/live_jira_dc && docker compose logs --tail=200

      - name: Tear down the Jira DC harness
        if: always()
        run: cd tests/external/live_jira_dc && docker compose down -v

      - name: Upload probe verdicts + raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: jira-dc-epic-link-probe
          path: ${{ runner.temp }}/jira-dc-epic-link-probe
          if-no-files-found: error
