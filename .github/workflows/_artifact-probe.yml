name: Artifact Provenance Probe (reusable)

# Reusable (workflow_call) form of the artifact-provenance probe (story 6168) — the single
# source of truth for the job that BOTH CI lanes run:
#   * test.yml           — push / pull_request (branch-head checkout), post-merge branch CI.
#   * gerrit-verify.yaml — the Verified gate (checks out the EXACT Gerrit patchset), so a
#     packaging regression BLOCKS the Verified vote pre-merge instead of only reddening main
#     (jira-reb-1163 — artifact-probe previously ran on the mirror lane ONLY).
#
# Builds the wheel + sdist the way `python -m build` does (sdist first, then wheel FROM the
# extracted sdist — a tree with no .git), runs the same import/CLI/schema probes the release
# wheel-test/sdist-test jobs run, and asserts `_build_info.COMMIT` exactly matches the final
# checked-out HEAD. This catches missing or stale provenance in ordinary CI, not only in release.
#
# Checkout is parameterized by `gerrit-refspec`: empty => actions/checkout (branch head);
# set => checkout-gerrit-change-action (the patchset). Takes NO secrets (Gerrit inputs are
# non-secret; the Verified vote key stays confined to gerrit-verify.yaml).

on:
  workflow_call:
    inputs:
      gerrit-refspec:
        description: "Gerrit refspec (refs/changes/NN/NNNN/P). Empty => branch-head checkout."
        required: false
        type: string
        default: ""
      gerrit-project:
        description: "Gerrit project (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""
      gerrit-url:
        description: "Gerrit base URL (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  artifact-probe:
    name: artifact provenance (wheel/sdist probe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head (push/PR lane)
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback)
        if: inputs.gerrit-refspec != ''
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - name: Record the checked-out commit
        run: echo "REBAR_EXPECTED_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Build wheel + sdist (REBAR_BUILD_COMMIT baked)
        run: |
          python -m pip install --upgrade pip build
          REBAR_BUILD_COMMIT="$REBAR_EXPECTED_COMMIT" python -m build
      - name: Validate package metadata (twine check)
        # Catches malformed/unrenderable package metadata (long_description, classifiers,
        # missing fields) BEFORE it can reach a release — mainstream Python packaging hygiene.
        # --strict fails on warnings so a metadata regression reddens the gate, not just PyPI.
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*
      - name: Probe the built wheel (no source tree on the path)
        run: |
          python -m venv /tmp/wheel-probe
          # shellcheck disable=SC1091
          . /tmp/wheel-probe/bin/activate
          pip install dist/*.whl
          python -c "import rebar"
          rebar --help
          rebar-mcp --help
          python -c "import importlib.resources as r, json, rebar; fs=[f for f in r.files('rebar').rglob('*.json')]; assert fs; [json.loads(f.read_text()) for f in fs]"
          python -c "import os; from rebar import _build_info; assert _build_info.COMMIT == os.environ['REBAR_EXPECTED_COMMIT'], 'wheel baked the wrong COMMIT'"
          # Deterministic import walk (ticket 37b9): import EVERY rebar.* module from the
          # installed wheel + each top-level scripts/*.py standalone. Logic (and the
          # documented skip tables) live in the script, which is equally runnable locally.
          python scripts/check_import_walk.py
      - name: Probe install-from-sdist (REBAR_BUILD_COMMIT unset, preserve-existing)
        run: |
          python -m venv /tmp/sdist-probe
          # shellcheck disable=SC1091
          . /tmp/sdist-probe/bin/activate
          unset REBAR_BUILD_COMMIT
          pip install --upgrade pip
          pip install dist/*.tar.gz
          python -c "import rebar"
          rebar --help
          rebar-mcp --help
          python -c "import os; from rebar import _build_info; assert _build_info.COMMIT == os.environ['REBAR_EXPECTED_COMMIT'], 'sdist install baked the wrong COMMIT'"
