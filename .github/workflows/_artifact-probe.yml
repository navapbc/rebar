name: Artifact Provenance Probe (reusable)

# Shared artifact probe for branch CI and exact Gerrit patchsets.
# Build an sdist, then build the wheel from its extracted tree without .git.
# Check release import, CLI, and schema contracts and require the baked commit to
# equal checkout HEAD. The optional Gerrit refspec changes checkout only. This
# workflow accepts no secrets. The Verified vote key stays with its caller.

on:
  workflow_call:
    inputs:
      gerrit-refspec:
        description: "Gerrit refspec (refs/changes/NN/NNNN/P). Empty => branch-head checkout."
        required: false
        type: string
        default: ""
      gerrit-project:
        description: "Gerrit project (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""
      gerrit-url:
        description: "Gerrit base URL (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  artifact-probe:
    name: artifact provenance (wheel/sdist probe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head (push/PR lane)
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 1
        id: checkout-gerrit-attempt-1
        if: inputs.gerrit-refspec != ''
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_artifact-probe.yml::Wait before retrying Gerrit patchset checkout — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before retrying Gerrit patchset checkout
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed; retrying after 15 seconds (transport faults are retried in-job)'
          sleep 15
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 2
        id: checkout-gerrit-attempt-2
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_artifact-probe.yml::Wait before final Gerrit patchset checkout retry — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before final Gerrit patchset checkout retry
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed twice; final retry after 45 seconds'
          sleep 45
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 3
        id: checkout-gerrit-attempt-3
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - name: Record the checked-out commit
        run: echo "REBAR_EXPECTED_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Build wheel + sdist (REBAR_BUILD_COMMIT baked)
        run: |
          python -m pip install --upgrade pip build
          REBAR_BUILD_COMMIT="$REBAR_EXPECTED_COMMIT" python -m build
      - name: Validate package metadata (twine check)
        # Strict metadata validation rejects missing fields and warnings before release.
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*
      - name: Probe the built wheel (no source tree on the path)
        run: |
          python -m venv /tmp/wheel-probe
          # shellcheck disable=SC1091
          . /tmp/wheel-probe/bin/activate
          pip install dist/*.whl
          python -c "import rebar"
          rebar --help
          rebar-mcp --help
          python -c "import importlib.resources as r, json, rebar; fs=[f for f in r.files('rebar').rglob('*.json')]; assert fs; [json.loads(f.read_text()) for f in fs]"
          python -c "import os; from rebar import _build_info; assert _build_info.COMMIT == os.environ['REBAR_EXPECTED_COMMIT'], 'wheel baked the wrong COMMIT'"
          # Import every installed rebar module and each standalone script from the
          # built archive. The reusable script owns the documented skip list.
          python scripts/check_import_walk.py
      - name: Probe install-from-sdist (REBAR_BUILD_COMMIT unset, preserve-existing)
        run: |
          python -m venv /tmp/sdist-probe
          # shellcheck disable=SC1091
          . /tmp/sdist-probe/bin/activate
          unset REBAR_BUILD_COMMIT
          pip install --upgrade pip
          pip install dist/*.tar.gz
          python -c "import rebar"
          rebar --help
          rebar-mcp --help
          python -c "import os; from rebar import _build_info; assert _build_info.COMMIT == os.environ['REBAR_EXPECTED_COMMIT'], 'sdist install baked the wrong COMMIT'"
