name: Prompt-Eval Discipline (reusable)

# Reusable (workflow_call) form of the OFFLINE eval-discipline gate (epic a88f / WS-G) — the
# single source of truth for the job that BOTH CI lanes run:
#   * prompt-eval.yml    — push / pull_request (branch-head checkout), post-merge branch CI.
#   * gerrit-verify.yaml — the Verified gate (checks out the EXACT Gerrit patchset), so an
#     eval-discipline regression BLOCKS the Verified vote pre-merge instead of only reddening
#     main (jira-reb-1163 — eval-discipline previously ran on the mirror lane ONLY).
#
# Enforces the eval discipline with NO model/credentials: spec validity (strict per-spec
# validation), grader discipline, at_least(k) over epochs, coverage, kappa/JUnit, the scorer
# registry, and the eval solver aggregation — all via the unit tests. Costs nothing.
#
# Checkout is parameterized by `gerrit-refspec`: empty => actions/checkout (branch head);
# set => checkout-gerrit-change-action (the patchset). Takes NO secrets.

on:
  workflow_call:
    inputs:
      gerrit-refspec:
        description: "Gerrit refspec (refs/changes/NN/NNNN/P). Empty => branch-head checkout."
        required: false
        type: string
        default: ""
      gerrit-project:
        description: "Gerrit project (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""
      gerrit-url:
        description: "Gerrit base URL (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  eval-discipline:
    name: eval discipline (offline — no model)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head (push/PR lane)
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 1
        id: checkout-gerrit-attempt-1
        if: inputs.gerrit-refspec != ''
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_eval-discipline.yml::Wait before retrying Gerrit patchset checkout — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before retrying Gerrit patchset checkout
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed; retrying after 15 seconds (transport faults are retried in-job)'
          sleep 15
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 2
        id: checkout-gerrit-attempt-2
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_eval-discipline.yml::Wait before final Gerrit patchset checkout retry — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before final Gerrit patchset checkout retry
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed twice; final retry after 45 seconds'
          sleep 45
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 3
        id: checkout-gerrit-attempt-3
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Install rebar from the committed lock (dev extra)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Enforce eval discipline (offline)
        # The strict per-spec validation also lives in the default suite (via
        # _build-and-test.yml), so it already blocks Verified; this job runs the eval
        # test subset directly so the discipline is a named gate on BOTH lanes.
        # Per-test hang guard (ticket d835-1846-95d1-4d84). 300s: these are OFFLINE unit
        # tests, the same ones the shared suite runs under the identical 300s budget in
        # _build-and-test.yml, so this lane inherits that calibration rather than inventing a
        # second number for the same tests. --timeout-method=thread for the usual reason: the
        # default `signal` method cannot fire while blocked in a C-level flock/subprocess call.
        run: |
          python -m pytest -q --timeout=300 --timeout-method=thread \
            tests/unit/test_eval.py \
            tests/unit/test_eval_scorers.py \
            tests/unit/test_new_eval_specs.py \
            tests/unit/test_eval_solver.py
