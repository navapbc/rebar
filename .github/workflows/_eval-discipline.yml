name: Prompt-Eval Discipline (reusable)

# Shared offline evaluation gate for branch CI and exact Gerrit patchsets.
# Unit tests enforce spec and grader validity, epoch thresholds, coverage,
# kappa/JUnit, scorer registration, and solver aggregation without a model key.
# An optional Gerrit refspec changes checkout only. This workflow takes no secrets.

on:
  workflow_call:
    inputs:
      gerrit-refspec:
        description: "Gerrit refspec (refs/changes/NN/NNNN/P). Empty => branch-head checkout."
        required: false
        type: string
        default: ""
      gerrit-project:
        description: "Gerrit project (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""
      gerrit-url:
        description: "Gerrit base URL (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  eval-discipline:
    name: eval discipline (offline — no model)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head (push/PR lane)
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 1
        id: checkout-gerrit-attempt-1
        if: inputs.gerrit-refspec != ''
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_eval-discipline.yml::Wait before retrying Gerrit patchset checkout — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before retrying Gerrit patchset checkout
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed; retrying after 15 seconds (transport faults are retried in-job)'
          sleep 15
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 2
        id: checkout-gerrit-attempt-2
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' }}
        continue-on-error: true
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      # mechanism-ok: ci_gate .github/workflows/_eval-discipline.yml::Wait before final Gerrit patchset checkout retry — 1e24-bfc0 in-job retry keeps transient Gerrit transport faults from causing false Verified -1 votes.
      - name: Wait before final Gerrit patchset checkout retry
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Gerrit patchset checkout failed twice; final retry after 45 seconds'
          sleep 45
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback) attempt 3
        id: checkout-gerrit-attempt-3
        if: ${{ inputs.gerrit-refspec != '' && steps.checkout-gerrit-attempt-1.outcome == 'failure' && steps.checkout-gerrit-attempt-2.outcome == 'failure' }}
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Install rebar from the committed lock (dev extra)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Enforce eval discipline (offline)
        # The default suite also checks strict spec validity. This named offline gate
        # keeps the same checks visible in both lanes. Its 300-second thread timeout
        # matches the shared suite and catches blocked subprocess or flock calls.
        run: |
          python -m pytest -q --timeout=300 --timeout-method=thread \
            tests/unit/test_eval.py \
            tests/unit/test_eval_scorers.py \
            tests/unit/test_new_eval_specs.py \
            tests/unit/test_eval_solver.py
