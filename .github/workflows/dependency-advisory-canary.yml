# rebar — Dependency-Advisory Canary
#
# Bug 63e8. A committed `uv.lock` freezes every transitive dependency, so the moment an
# advisory is published against a pinned version the world has changed under `main` with
# nobody having pushed anything. The scheduled lane — not whoever happens to have a
# change in flight — is the right owner of that.
#
# This workflow is that owner. Daily it audits `main`'s committed closure and, when a
# CRITICAL/HIGH advisory is outstanding, files ONE rebar bug and keeps it updated;
# when the advisory clears, it closes it. A red run that nobody is paged for reproduces
# the original problem in a quieter form, which is why escalation is a ticket.
#
# DEDUP is the load-bearing property: a daily lane against an advisory that stays open
# for weeks must file ONE ticket, not thirty. It reuses the heartbeat canary's dedup —
# `scripts/alert_dedup.py`, extracted from `scripts/canary_bridge.py` for exactly this
# reason (the canary's copy hard-coded its own marker, so it was not reusable as-is):
# find-the-open-bug-by-tag before filing, and cap accumulation at one comment per 24h.
#
# What a red run here BLOCKS: releases only (release.yml's authorize job runs the same
# gate). It does not block merges and it does not block Gerrit submit — changes that
# leave the dependency map alone flow past advisories entirely (that split is the fix).
#
# Classification/lifecycle logic lives in scripts/dependency_audit.py, unit-tested by
# tests/scripts/test_dependency_audit.py. The steps here are thin invocations plus the
# same ticket-store plumbing reconcile-bridge-canary.yml uses.

name: Dependency Advisory Canary

on:
  schedule:
    # Daily at 03:19 UTC. Advisory publication is a slow signal — a daily sweep is the
    # cadence terraform-drift.yml already established for "the world changed" checks.
    # Minute 19 (never 0) keeps this repo off the hour boundary.
    - cron: '19 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report advisories without creating/updating/closing tickets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: dependency-advisory-canary
  cancel-in-progress: false

permissions:
  contents: write   # push ticket changes to the tickets orphan branch

jobs:
  advisory:
    name: Audit main's committed closure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      ADVISORY_TAG: dependency-advisory-alert

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          filter: blob:none
          # Full history (NOT shallow): a shallow tickets graft defeats merge-base and
          # corrupts compaction reconciliation (bug f193).
          fetch-depth: 0
          ref: main

      - name: Mount tickets branch as a worktree
        run: |
          set -euo pipefail
          git fetch origin '+tickets:refs/remotes/origin/tickets'
          rm -rf .tickets-tracker
          git worktree add -B tickets .tickets-tracker origin/tickets

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install rebar from the committed lock (dev extra) and pip-audit
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv pip install pip-audit
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        env:
          BRIDGE_BOT_NAME: ${{ vars.BRIDGE_BOT_NAME || 'rebar-bridge[bot]' }}
          BRIDGE_BOT_EMAIL: ${{ vars.BRIDGE_BOT_EMAIL || 'joeoakhart+bot@navapbc.com' }}
        run: |
          set -euo pipefail
          git config --global user.name "${BRIDGE_BOT_NAME}"
          git config --global user.email "${BRIDGE_BOT_EMAIL}"

      - name: Materialize the Rebar Bot signing key
        # Same seam as reconcile-bridge-canary.yml: a multi-line OpenSSH key cannot live
        # in an env var used as a key_path, so materialize it 0600 under $RUNNER_TEMP.
        # If the secret is unset the canary still runs, writing unsigned (advisory).
        env:
          REBAR_BOT_SIGNING_KEY: ${{ secrets.REBAR_BOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REBAR_BOT_SIGNING_KEY:-}" ]; then
            echo "REBAR_BOT_SIGNING_KEY unset — canary writes will be unsigned (advisory)"
            exit 0
          fi
          echo "::add-mask::${REBAR_BOT_SIGNING_KEY}"
          KEYFILE="${RUNNER_TEMP}/rebar-bot-signing-key"
          install -m 600 /dev/null "${KEYFILE}"
          printf '%s\n' "${REBAR_BOT_SIGNING_KEY}" > "${KEYFILE}"
          echo "REBAR_IDENTITY_SIGNING_KEY=${KEYFILE}" >> "${GITHUB_ENV}"
          echo "Materialized bot signing key to ${KEYFILE} (0600)"

      - name: Initialize the ticket store (seed .env-id for CLI writes)
        run: |
          set -euo pipefail
          rebar init

      - name: Audit the committed closure
        id: audit
        # `continue-on-error` so a blocking verdict does NOT skip the escalation step —
        # the ticket is the point of this lane. The run is still reddened by the final
        # step below.
        continue-on-error: true
        run: |
          set -uo pipefail
          python scripts/dependency_audit.py gate --lane branch

      - name: Advisory alert lifecycle (find/open/comment/close)
        if: env.DRY_RUN == 'false'
        env:
          BLOCKING: ${{ steps.audit.outputs.blocking }}
          ADVISORY_IDS: ${{ steps.audit.outputs.advisory_ids }}
          ADVISORY_SUMMARY: ${{ steps.audit.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/dependency_audit.py advisory-alert

      - name: Flush any unpushed ticket changes to origin/tickets
        # rebar CLI auto-pushes, but best-effort: this guard re-pushes if a prior
        # auto-push failed and left the local tickets branch ahead of origin.
        if: env.DRY_RUN == 'false'
        run: |
          set -euo pipefail
          cd .tickets-tracker
          # EXPLICIT refspec is load-bearing (see reconcile-bridge-canary.yml): a bare
          # fetch leaves origin/tickets stale under a narrow refspec.
          git fetch origin '+tickets:refs/remotes/origin/tickets' || true
          ahead=$(git rev-list --count origin/tickets..HEAD 2>/dev/null || echo 0)
          if [ "$ahead" -eq 0 ]; then
            echo "Nothing to flush — local tickets branch not ahead of origin."
            exit 0
          fi
          echo "Flushing $ahead unpushed commit(s)."
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:tickets 2>/tmp/push_err; then
              echo "Push succeeded (attempt $attempt)."; exit 0
            fi
            if grep -qiE 'non-fast-forward|rejected|fetch first' /tmp/push_err; then
              git fetch origin '+tickets:refs/remotes/origin/tickets' || true
              # MERGE, not rebase: rebase over a remote compaction resurrects the source
              # event files it deleted (SNAPSHOT_INCONSISTENT, bug f193).
              git merge --no-edit origin/tickets || { git merge --abort 2>/dev/null || true; echo "::error::merge conflict"; exit 1; }
              sleep $(( (1 << attempt) + RANDOM % 3 ))
            else
              echo "::error::non-retryable push failure: $(cat /tmp/push_err)"; exit 1
            fi
          done
          echo "::error::push failed after retries"; exit 1

      - name: Fail the run when an advisory is outstanding (visible red)
        if: steps.audit.outputs.blocking == 'true'
        run: |
          echo "::error::outstanding dependency advisory on main: ${{ steps.audit.outputs.advisory_ids }} — see docs/dependency-advisory-runbook.md. This blocks RELEASES, not merges."
          exit 1
