name: Review Scanner Integration (reusable)

# Hash-locked native scanner lane (ticket aa9e). The cold run is expected to cost
# approximately 1.5-3 runner-minutes; because this is a separate reusable job it runs in
# parallel with the existing full-route Verified jobs and should not extend the 22-23 minute
# critical path when runner capacity is available.

"on":
  workflow_call:
    inputs:
      gerrit-refspec:
        description: "Gerrit refspec (refs/changes/NN/NNNN/P). Empty => branch-head checkout."
        required: false
        type: string
        default: ""
      gerrit-project:
        description: "Gerrit project (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""
      gerrit-url:
        description: "Gerrit base URL (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scanner-integration:
    name: pinned Semgrep + Gitleaks contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head (push/PR lane)
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback)
        if: inputs.gerrit-refspec != ''
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      # mechanism-ok: ci_gate .github/workflows/_scanner-integration.yml::Install rebar from the committed lock (dev extra) — aa9e scanner lane needs repo dev dependencies before running pytest contracts.
      - name: Install rebar from the committed lock (dev extra)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # mechanism-ok: ci_gate .github/workflows/_scanner-integration.yml::Run hash-locked scanner integration contracts — aa9e Verified lane executes the pinned native scanner contract target.
      - name: Run hash-locked scanner integration contracts
        env:
          REBAR_SCANNER_PLATFORM: linux/amd64
        run: |
          python scripts/install_review_scanners.py validate-locks
          make scanner-integration
