name: CodeQL SAST

# Static analysis (SAST) on the GitHub mirror. CodeQL is free for public repos and
# runs fine on this read-only mirror: it only needs push/schedule triggers and writes
# results to the Security tab (it does not push to the tree). This complements the
# gitleaks secret scan + pip-audit on the Gerrit review path with an independent
# code-analysis layer. Actions are pinned by major version tag to match the repo
# convention (see test.yml / gerrit-verify.yaml), not by commit SHA.

# `main` CI on this mirror is SCHEDULED, not push-triggered (ticket 03ef-6fb5-158b-4abd):
# push-on-`main` runs cancelled each other and rendered a healthy `main` as red X's. CodeQL
# joins that policy by dropping its push trigger, but NOT the 6-hourly branch-health tick — a
# security scanner's cadence is a deliberate cost/coverage choice and 6-hourly would be a 28x
# increase nobody asked for. The weekly scan therefore becomes this workflow's primary pass
# rather than a between-pushes backstop; it still runs against the default branch, and the
# dispatch below scans on demand after a change worth scanning immediately.
on:
  schedule:
    # Weekly, Monday 04:23 UTC.
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

# Least privilege by default; the analyze job elevates only what CodeQL needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `javascript` already covers TypeScript (the workflow-editor assets);
        # `python` covers src/ and scripts/.
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Scope analyzed paths (excludes docs/); default query suite unchanged.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
