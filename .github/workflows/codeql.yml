name: CodeQL SAST

# Scheduled and manual static analysis on the read-only GitHub mirror.
# CodeQL writes Security findings without changing the tree. This complements
# the Gerrit secret and dependency scans. Actions use the repository's major tags.

# Scan main on the shared six-hour branch-health schedule. Push-triggered
# runs canceled each other, while manual dispatch remains available for an
# immediate scan.
on:
  schedule:
    # Stagger at minute 35 from sibling health workflows to reduce queueing.
    - cron: "35 */6 * * *"
  workflow_dispatch: {}

# Least privilege by default; the analyze job elevates only what CodeQL needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `javascript` covers the infra/terraform/auth Lambda sources;
        # `python` covers src/ and scripts/.
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Scope analyzed paths (excludes docs/); default query suite unchanged.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
