name: Optional-Dependency Isolation (reusable)

# Reusable (workflow_call) form of the optionality contract — the clean-core-wheel,
# per-extra, and union checks. (The lean-runtime/AST half — tests/unit/test_core_optionality.py
# and tests/unit/test_optional.py — had a dedicated `import-linter` job here; it was deleted as
# redundant because those unmarked tests already run in every `test` matrix cell off the same
# `.[dev]` install. `test_optionality_suite_still_runs_in_the_default_selection` in
# tests/unit/test_ci_workflow_parity.py guards that they stay in the default selection.)
# Invoked from TWO callers:
#   * optionality.yml       — push / pull_request (branch-head checkout).
#   * gerrit-verify.yaml     — the Verified gate (checks out the EXACT Gerrit patchset),
#     so a clean-wheel / packaging regression BLOCKS the Verified vote pre-merge instead
#     of only reddening main post-merge (the module-scope-import class that escaped once).
#
# Checkout is parameterized by `gerrit-refspec`: empty => actions/checkout (branch head);
# set => checkout-gerrit-change-action (the patchset). A LOCAL composite action cannot do
# this — a `./.github/actions/...` reference needs the repo already checked out — so the
# conditional checkout is inlined per job. This workflow takes NO secrets: the Gerrit
# values are non-secret inputs (checkout-gerrit-change-action is mirror-first), and the
# Verified vote key stays confined to gerrit-verify.yaml (never inherited here — the push
# caller's pull_request trigger includes fork PRs).

on:
  workflow_call:
    inputs:
      gerrit-refspec:
        description: "Gerrit refspec (refs/changes/NN/NNNN/P). Empty => branch-head checkout."
        required: false
        type: string
        default: ""
      gerrit-project:
        description: "Gerrit project (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""
      gerrit-url:
        description: "Gerrit base URL (required when gerrit-refspec is set)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  clean-core-wheel:
    name: clean core wheel (no extras → heavy deps absent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head (push/PR lane)
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@v7
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback)
        if: inputs.gerrit-refspec != ''
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the wheel with NO extras, in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
      - name: import rebar + a core command work; heavy deps are NOT importable
        run: |
          /tmp/clean/bin/python - <<'PY'
          import importlib.util as u
          import rebar  # core import works (only pyyaml is a runtime dep)
          # A lean-runtime workflow capability works with no extras: a valid
          # workflow PASSES validation (jsonschema absent -> structural check +
          # a non-blocking "install jsonschema" warning).
          from rebar.llm.workflow import lint
          wf = 'schema_version: "1"\nname: x\nsteps:\n  - id: a\n    uses: u\n'
          assert lint.lint_passes(lint.lint_workflow(wf)), "lean-core validate failed"
          # The heavy [agents]/[eval]/[tracing] stack must NOT be importable here.
          # `jira` (pycontribs/jira) is declared ONLY by the [jira-datacenter] extra.
          # Without it here, the epic's "installing rebar without the extra pulls in
          # no new dependency" guarantee had no CI teeth (story J7, epic e369).
          for mod in ("langchain", "langgraph", "anthropic", "inspect_ai", "opentelemetry", "jira"):
              assert u.find_spec(mod) is None, f"{mod} importable in a no-extras install!"
          print("clean-core-wheel OK")
          PY
      - name: a core CLI command runs on the clean wheel
        run: |
          /tmp/clean/bin/rebar --help >/dev/null
      # The LLM-optionality *degradation* tests (skipif the agents extra is
      # installed) verify every interface fails loudly+cleanly when the stack is
      # ABSENT. The main test.yml lane installs [dev] -> [agents], so they always
      # skip there; this no-extras clean venv is the one place they can run. Install
      # only the light test deps (pytest + jsonschema + mcp/FastMCP) — NOT the agents
      # stack — so agents_extra_installed() stays False and the skipif tests execute.
      # Story alive-ogre-tiger (epic clumsy-jab-yacht).
      - name: degradation-path tests run with NO agents extra
        run: |
          /tmp/clean/bin/pip install pytest jsonschema 'mcp>=1.28.1,<2'
          /tmp/clean/bin/python -c "from rebar.llm import agents_extra_installed; assert not agents_extra_installed(), 'agents extra must be ABSENT in the clean lane (else the degradation tests skip)'"
          # F2: drive the completion close-gate fail-closed path with the [agents] extra
          # genuinely ABSENT (not just a monkeypatched error) — the lean lane is the one
          # place it runs for real. The test monkeypatches the verifier, so it needs no
          # extra; running it HERE proves the fail-closed close survives a real lean install.
          /tmp/clean/bin/python -m pytest \
            tests/interfaces/store/test_llm_optionality.py \
            tests/interfaces/lifecycle/test_completion_gate.py::test_gate_missing_llm_fails_closed \
            -m "not external" -rs

  optional-extras:
    # ONE job replaces what used to be a 5-cell `per-extra` matrix PLUS a separate `union`
    # job (6 concurrent slots -> 1). The org-wide 20-concurrent-job ceiling is what queued
    # Verified runs behind each other; each of those cells did <1m of real work while
    # holding a slot for a full checkout + setup-python. The isolation guarantee that made
    # the matrix worth having is preserved by giving every iteration its OWN fresh venv —
    # a sequential `pip install .[a]` then `.[b]` into ONE interpreter would contaminate the
    # env, so a missing dependency declaration in a later extra would PASS silently, which
    # is the exact bug class this workflow exists to catch.
    name: optional extras isolate (per-extra venvs + union)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head (push/PR lane)
        if: inputs.gerrit-refspec == ''
        uses: actions/checkout@v7
      - name: Checkout the Gerrit patchset (Verified lane; mirror first, Gerrit fallback)
        if: inputs.gerrit-refspec != ''
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.gerrit-refspec }}
          gerrit-project: ${{ inputs.gerrit-project }}
          gerrit-url: ${{ inputs.gerrit-url }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Each extra installs into its OWN fresh venv, plus a joint union venv
        run: |
          rc=0
          # The per-iteration probe, written once and run by each venv's OWN interpreter.
          cat > "$RUNNER_TEMP/check_extra.py" <<'PY'
          import sys

          import rebar  # installing the extra must not break the core import
          from rebar import _optional

          label = sys.argv[1]
          if label in _optional.EXTRAS:
              assert _optional.extra_installed(label), f"{label}: installed but _optional did not detect it"
              print(label, "installed + detected")
          else:
              # `mcp` has no _optional detection probe (it is the server transport, not a
              # lean-runtime feature gate); the `import rebar` above plus the boot check
              # below are its validation. The union venv likewise has no single probe.
              print(label, "installed (no _optional probe)")
          PY
          # "<label>:<pip extras>". The isolation set is every key of `_optional.EXTRAS` —
          # so a newly declared extra cannot ship with ZERO CI (`metrics` had none under the
          # old hand-maintained matrix list) — plus `mcp`, which is not in EXTRAS but still
          # needs an install lane. The final UNION entry is NOT redundant with the isolation
          # runs: joint resolution is the only thing that can surface a `ResolutionImpossible`
          # that no single-extra install reaches.
          specs=(
            "agents:agents"
            "eval:eval"
            "tracing:tracing"
            "grounding:grounding"
            "metrics:metrics"
            "mcp:mcp"
            "union:agents,eval,tracing"
          )
          for spec in "${specs[@]}"; do
            label="${spec%%:*}"
            target="${spec#*:}"
            v="$RUNNER_TEMP/venv-$label"
            echo "::group::$label -> pip install .[$target]"
            # Two rules, each guarding a SILENT pass:
            #  * NEVER `source "$v"/bin/...` an env script — those STACK across iterations,
            #    so PATH would decide which interpreter runs and every later iteration could
            #    re-test the FIRST extra while reporting its own name.
            #  * ALWAYS invoke by absolute "$v/bin/..." path — a bare `python`/`rebar-mcp`
            #    runs the AMBIENT interpreter and can pass while testing nothing.
            # `python -m venv` from the setup-python interpreter is already clean (user
            # site-packages disabled, include-system-site-packages=false, no PYTHONPATH/PIP_*
            # set here), so no --copies/--without-pip games; ensurepip ships an old pip, hence
            # the per-venv upgrade.
            # Error isolation: Actions runs `run:` under `bash -e`, but errexit is SUPPRESSED
            # for a command tested by `if` — so the iteration is explicitly &&-chained to
            # short-circuit, and its failure is aggregated into `rc` + `continue` instead of
            # aborting the loop. That is what `fail-fast: false` bought on the old matrix;
            # `exit $rc` at the end is what stops it being a no-op that can never fail.
            if ! {
              python -m venv "$v" &&
                "$v/bin/python" -m pip install --upgrade pip &&
                "$v/bin/python" -m pip install ".[$target]" &&
                "$v/bin/python" "$RUNNER_TEMP/check_extra.py" "$label" &&
                if [ "$label" = mcp ]; then "$v/bin/rebar-mcp" --help >/dev/null; fi
            }; then
              rc=1
              echo "::error::optional extra '$label' failed"
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"
          done
          exit $rc
