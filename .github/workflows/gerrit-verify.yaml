name: Gerrit Verified Gate

# CI second gate vote (`Verified`) for Gerrit changes — epic 1fa8 (ADR-0020).
#
# Dispatched by gerrit-to-platform (the Gerrit `hooks` plugin, running IN the Gerrit
# container — story S3) on `patchset-created` and on a `recheck` comment, with the
# nine GERRIT_* inputs below. It runs the SAME checks as test.yml against the EXACT
# patchset, then casts the Gerrit `Verified` label on the change over SSH.
#
# 3-job production shape (ONAP/O-RAN-SC pattern): clear-vote -> build-and-test -> vote.
#   - clear-vote  resets Verified->0 at run start (GerriScary-safe; CVE-2025-1568).
#   - build-and-test checks out the change (checkout-gerrit-change-action) + runs the
#     gates/suite (same commands as test.yml).
#   - vote  aggregates the run conclusion and casts Verified +1/-1, run URL in message.
#
# OPERATOR SETUP (story S4) — required for this workflow to vote:
#   repo variables: GERRIT_SERVER, GERRIT_SSH_USER, GERRIT_KNOWN_HOSTS, GERRIT_URL
#   repo secret:    GERRIT_SSH_PRIVKEY  (the CI service account's private key)
# Until they are set the vote steps fail (fail-closed: no +1 -> no submit).
#
# All third-party actions are SHA-pinned (tag in trailing comment).

on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:            { description: "Gerrit target branch", required: true, type: string }
      GERRIT_CHANGE_ID:         { description: "Gerrit Change-Id", required: true, type: string }
      GERRIT_CHANGE_NUMBER:     { description: "Gerrit change number", required: true, type: string }
      GERRIT_CHANGE_URL:        { description: "Gerrit change URL", required: true, type: string }
      GERRIT_EVENT_TYPE:        { description: "Gerrit event type", required: true, type: string }
      GERRIT_PATCHSET_NUMBER:   { description: "Gerrit patchset number", required: true, type: string }
      GERRIT_PATCHSET_REVISION: { description: "Gerrit patchset revision (commit SHA)", required: true, type: string }
      GERRIT_PROJECT:           { description: "Gerrit project", required: true, type: string }
      GERRIT_REFSPEC:           { description: "Gerrit refspec (refs/changes/NN/NNNN/P)", required: true, type: string }

permissions:
  contents: read
  actions: read   # workflow-conclusion queries this run's jobs
  checks: read    # read job annotations to tell a TIMEOUT from a plain cancellation

concurrency:
  # A newer patchset for the same change cancels the in-flight run (stale-run guard).
  group: gerrit-verify-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

jobs:
  clear-vote:
    name: clear Verified (reset to 0)
    runs-on: ubuntu-latest
    steps:
      - name: Reset Verified->0 at run start (GerriScary-safe)
        uses: lfreleng-actions/gerrit-review-action@a1c036a59b94c8ab89de26d378f6a28cc7378b13  # v1.1.2
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear

  require-ticket:
    # Fail-fast gate: every commit to main must reference a rebar ticket that RESOLVES in
    # the store (verify.require_ticket_for_commit). Runs before the matrix; its failure
    # aggregates into the run conclusion → Verified-1. See docs/commit-ticket-trailer.md.
    name: require resolvable rebar ticket
    needs: clear-vote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Gerrit change (mirror first, Gerrit fallback)
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
          gerrit-project: ${{ inputs.GERRIT_PROJECT }}
          gerrit-url: https://${{ vars.GERRIT_SERVER }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install rebar (core)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
      - name: Require a resolvable rebar ticket in the commit message
        shell: bash
        run: |
          set -euo pipefail
          # The tickets store's source of truth is the `tickets` branch on GitHub (this repo).
          # Mount it as a real worktree so the standard resolver reads it. Idempotent
          # (prune+rm — runners are ephemeral, but this also survives a `recheck` re-run) and
          # retried, so a transient GitHub blip is never mistaken for a missing ticket.
          git worktree prune || true
          rm -rf .tickets-tracker
          ok=0
          for attempt in 1 2 3; do
            if timeout 60 git fetch --filter=blob:none --depth=1 \
                 "https://github.com/${{ github.repository }}" \
                 '+tickets:refs/remotes/gh-tickets'; then ok=1; break; fi
            echo "tickets-branch fetch attempt $attempt failed; retrying..." >&2
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::could not fetch the tickets branch from GitHub after 3 attempts —" \
                 "INFRASTRUCTURE issue, not a commit problem. Comment 'recheck' to retry." >&2
            exit 1
          fi
          git worktree add --detach .tickets-tracker refs/remotes/gh-tickets
          export REBAR_TRACKER_DIR="$PWD/.tickets-tracker"
          rebar verify-commit-ticket --rev HEAD

  classify:
    # Security boundary: the exact patchset is checked out only as diff data. The
    # executable classifier and its complete allowlist are sparse-checked out from
    # trusted main with credentials disabled, so a patchset cannot classify itself.
    name: classify Verify route from trusted main
    needs: [clear-vote, require-ticket]
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - name: Checkout the Gerrit change (mirror first, Gerrit fallback)
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
          gerrit-project: ${{ inputs.GERRIT_PROJECT }}
          gerrit-url: https://${{ vars.GERRIT_SERVER }}
      - name: Deepen until the exact patchset parent is diffable
        shell: bash
        run: |
          set -uo pipefail
          for depth in 1 8 32; do
            git rev-parse --verify -q 'HEAD^' >/dev/null 2>&1 && break
            git fetch --deepen="$depth" || true
          done
      - name: Fetch the trusted route classifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          path: .trusted-verify-router
          persist-credentials: false
          sparse-checkout: scripts/classify_gerrit_verify_change.py
          sparse-checkout-cone-mode: false
      - name: Classify the exact HEAD^..HEAD path set
        id: route
        shell: bash
        run: |
          set -euo pipefail
          route="$(python3 .trusted-verify-router/scripts/classify_gerrit_verify_change.py \
            --repository "$GITHUB_WORKSPACE")"
          case "$route" in
            docs-only|full) ;;
            *) echo "::error::trusted classifier emitted invalid route '$route'"; exit 1 ;;
          esac
          echo "route=$route" >> "$GITHUB_OUTPUT"

  docs-only:
    # One Ubuntu lane retains every documentation gate while avoiding the full matrix
    # and unrelated packaging/mutation/integration jobs for a proven prose-only diff.
    name: documentation gates (docs-only route)
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.route == 'docs-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Gerrit change (mirror first, Gerrit fallback)
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
          gerrit-project: ${{ inputs.GERRIT_PROJECT }}
          gerrit-url: https://${{ vars.GERRIT_SERVER }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Install documentation-gate dependencies from the committed lock
        shell: bash
        run: |
          uv sync --locked --extra dev --extra reviewbot --extra ui --python '3.12'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main
      - name: Restore documentation action for a patchset that predates it
        shell: bash
        run: |
          if [ -f .github/actions/docs-gates/action.yml ]; then
            exit 0
          fi
          if ! git fetch --depth=1 "https://github.com/${{ github.repository }}" \
               '+refs/heads/main:refs/remotes/gh-main-docs-action'; then
            echo "::error::could not fetch trusted main documentation action"
            exit 1
          fi
          mkdir -p .github/actions/docs-gates
          git show refs/remotes/gh-main-docs-action:.github/actions/docs-gates/action.yml \
            > .github/actions/docs-gates/action.yml
      - name: Run the shared documentation gates
        uses: ./.github/actions/docs-gates
        with:
          run-contract-tests: "true"

  build-and-test:
    # The gate+suite (lint + pip-audit + the os×py test matrix) now lives in the reusable
    # _build-and-test.yml, shared verbatim with test.yml (post-merge branch CI) so the two
    # lanes cannot drift (the pattern _optionality.yml already uses). Passing the Gerrit
    # coordinates makes the reusable check out the EXACT patchset (checkout-gerrit-change-action);
    # it inherits NO secrets — the Verified vote key stays in this file. Gated behind
    # clear-vote + require-ticket as before; `vote` still lists build-and-test in `needs`, and
    # im-open/workflow-conclusion folds the reusable's job conclusions into the Verified vote
    # (the same mechanism already used for `optionality`). Splitting the former inline
    # lint/mypy/config-check/pre-commit out of the 4× matrix means they now run once, not per cell.
    name: build-and-test (gate + suite on the patchset)
    needs: [clear-vote, require-ticket, classify]
    if: ${{ !cancelled() && needs.clear-vote.result == 'success' && needs.require-ticket.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.route == 'full') }}
    uses: ./.github/workflows/_build-and-test.yml
    with:
      gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit-project: ${{ inputs.GERRIT_PROJECT }}
      gerrit-url: https://${{ vars.GERRIT_SERVER }}

  mutation:
    # Targeted mutation evidence is part of Verified. Waiting for the ticket check avoids
    # spending the bounded runner on a patchset that cannot land.
    name: mutation (changed behavioral shards on the patchset)
    needs: [clear-vote, require-ticket, classify]
    if: ${{ !cancelled() && needs.clear-vote.result == 'success' && needs.require-ticket.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.route == 'full') }}
    uses: ./.github/workflows/_mutation.yml
    with:
      gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit-project: ${{ inputs.GERRIT_PROJECT }}
      gerrit-url: https://${{ vars.GERRIT_SERVER }}

  scanner-integration:
    # Pinned native scanner contracts ON THE PATCHSET (ticket aa9e): install Semgrep and
    # Gitleaks from the checked-in hash locks, then run the nine real scanner integration
    # contracts. This is full-route only; docs-only explicitly skips it in the vote
    # aggregation below.
    name: scanner-integration (pinned Semgrep + Gitleaks on the patchset)
    needs: [clear-vote, require-ticket, classify]
    if: ${{ !cancelled() && needs.clear-vote.result == 'success' && needs.require-ticket.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.route == 'full') }}
    uses: ./.github/workflows/_scanner-integration.yml
    with:
      gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit-project: ${{ inputs.GERRIT_PROJECT }}
      gerrit-url: https://${{ vars.GERRIT_SERVER }}

  optionality:
    # Run the clean-core-wheel + optional-extras (per-extra venvs + union) contract ON THE PATCHSET,
    # so a no-extras import leak or packaging regression BLOCKS Verified pre-merge (build-and-test
    # installs .[dev], so the heavy stack is present there and never exercises the clean wheel).
    # Reuses the SAME jobs the push/PR lane runs (no drift). Passes the Gerrit coordinates as
    # non-secret inputs → the reusable workflow checks out the exact patchset via
    # checkout-gerrit-change-action; it inherits NO secrets (the vote key stays in this file).
    # On a full route it runs in parallel with the other full jobs after classification.
    name: optionality (lean-runtime + packaging on the patchset)
    needs: [clear-vote, require-ticket, classify]
    if: ${{ !cancelled() && needs.clear-vote.result == 'success' && needs.require-ticket.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.route == 'full') }}
    uses: ./.github/workflows/_optionality.yml
    with:
      gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit-project: ${{ inputs.GERRIT_PROJECT }}
      gerrit-url: https://${{ vars.GERRIT_SERVER }}

  artifact-probe:
    # Artifact-provenance probe (story 6168) ON THE PATCHSET: build wheel+sdist and assert a
    # non-null baked _build_info.COMMIT + a clean import/CLI/schema probe, so a packaging
    # regression BLOCKS Verified pre-merge. Reuses the SAME job the push/PR lane runs (no
    # drift) — the reusable checks out the exact patchset via the Gerrit coordinates below and
    # inherits NO secrets. Its conclusion reaches the vote because `vote` needs it
    # (jira-reb-1163: this job gated main but was absent from vote.needs → green-verify/red-main).
    name: artifact-probe (wheel/sdist provenance on the patchset)
    needs: [clear-vote, require-ticket, classify]
    if: ${{ !cancelled() && needs.clear-vote.result == 'success' && needs.require-ticket.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.route == 'full') }}
    uses: ./.github/workflows/_artifact-probe.yml
    with:
      gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit-project: ${{ inputs.GERRIT_PROJECT }}
      gerrit-url: https://${{ vars.GERRIT_SERVER }}

  eval-discipline:
    # Offline eval-discipline gate ON THE PATCHSET: enforce eval spec/grader discipline with
    # no model/credentials, so an eval regression BLOCKS Verified pre-merge. Reuses the SAME
    # job the push/PR lane runs (no drift). Its conclusion reaches the vote because `vote`
    # needs it (jira-reb-1163: this job gated main but was absent from vote.needs).
    name: eval-discipline (offline eval gate on the patchset)
    needs: [clear-vote, require-ticket, classify]
    if: ${{ !cancelled() && needs.clear-vote.result == 'success' && needs.require-ticket.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.route == 'full') }}
    uses: ./.github/workflows/_eval-discipline.yml
    with:
      gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit-project: ${{ inputs.GERRIT_PROJECT }}
      gerrit-url: https://${{ vars.GERRIT_SERVER }}

  # Golden-path on a CLEAN (non-editable) install ON THE PATCHSET (ticket 0435): the README
  # quickstart (scripts/check_readme_quickstart.py) runs against a WHEEL-installed rebar
  # (`pip install .`), so packaging/entry-point regressions the editable install in
  # build-and-test cannot catch BLOCK Verified pre-merge.
  golden-path:
    name: golden-path (clean install)
    needs: [clear-vote, require-ticket, classify]
    if: ${{ !cancelled() && needs.clear-vote.result == 'success' && needs.require-ticket.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.route == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Gerrit change (mirror first, Gerrit fallback)
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
          gerrit-project: ${{ inputs.GERRIT_PROJECT }}
          gerrit-url: https://${{ vars.GERRIT_SERVER }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Ensure jq is installed
        run: type jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq) && jq --version
      - name: Install rebar from a built wheel (clean, non-editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
          git config --global init.defaultBranch main
      # If-present guard per ticket ee2a (_build-and-test.yml, raw-git-write gate); bug 1909-c1a7-9f20-440f.
      - name: README quickstart golden-path (against the installed rebar)
        run: |
          if [ ! -f scripts/check_readme_quickstart.py ]; then
            echo "scripts/check_readme_quickstart.py not in checked-out tree (change predates the gate) — skipping;" \
                 "the gate re-enforces on rebase and on every post-merge change"
            exit 0
          fi
          python scripts/check_readme_quickstart.py
      # If-present guard per ticket ee2a (_build-and-test.yml, raw-git-write gate); bug 1909-c1a7-9f20-440f.
      - name: End-to-end CLI probe (against the installed rebar)
        run: |
          if [ ! -f scripts/probe_rebar.py ]; then
            echo "scripts/probe_rebar.py not in checked-out tree (change predates the gate) — skipping;" \
                 "the gate re-enforces on rebase and on every post-merge change"
            exit 0
          fi
          python scripts/probe_rebar.py </dev/null

  verify-identity:
    # PRE-MERGE whole-store authenticated-authorship gate. Mitigates the gap that let the
    # require_authenticated flip (change 759) merge green and only fail post-merge: the
    # standalone verify-identity.yaml runs on GitHub push/pull_request, i.e. only AFTER a
    # Gerrit change lands on the mirror — it never gated the Gerrit change itself. Running it
    # here folds it into the Verified vote, so the whole-store enforcement check runs BEFORE
    # merge. Enforcement posture is CONFIG-driven (identity.require_authenticated in THIS
    # change's rebar.toml): advisory (exit 0, report-only) while off, blocking once flipped on
    # — so a future re-flip's own Verified vote is the proof that the whole store verifies.
    name: verify-identity (whole-store authorship gate)
    needs: [clear-vote, require-ticket, classify]
    if: ${{ !cancelled() && needs.clear-vote.result == 'success' && needs.require-ticket.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.route == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Gerrit change (mirror first, Gerrit fallback)
        uses: lfreleng-actions/checkout-gerrit-change-action@f87b90a3370e62dad310797fedc7fd3700c75832  # v1.0.2
        with:
          gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
          gerrit-project: ${{ inputs.GERRIT_PROJECT }}
          gerrit-url: https://${{ vars.GERRIT_SERVER }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install rebar (core)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "rebar CI"
      - name: Mount the tickets store (FULL history for commit-ancestry era scoping)
        shell: bash
        run: |
          set -euo pipefail
          # A plain code checkout has no store, so verify-identity would exit 2 ("store not
          # found"). Mount the `tickets` branch on a real worktree — on the ACTUAL branch (not
          # detached) so tracker.branch matches, and with a FULL fetch (no --depth) so
          # merge-base / commit-ancestry scoping against identity.enforce_since works over the
          # whole history. Retried so a transient GitHub blip is not read as a store problem.
          git worktree prune || true
          rm -rf .tickets-tracker
          ok=0
          for attempt in 1 2 3; do
            if git fetch --filter=blob:none \
                 "https://github.com/${{ github.repository }}" \
                 '+tickets:refs/remotes/gh-tickets'; then ok=1; break; fi
            echo "tickets-branch fetch attempt $attempt failed; retrying..." >&2
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::could not fetch the tickets branch after 3 attempts — INFRASTRUCTURE" \
                 "issue, not an authorship problem. Comment 'recheck' to retry." >&2
            exit 1
          fi
          git worktree add -B tickets .tickets-tracker refs/remotes/gh-tickets
      # NOTE: there is deliberately NO pack-size gate here. A hard cap on the tickets
      # pack (formerly `REBAR_TICKETS_PACK_LIMIT_KIB`, "Fail closed if the filtered tickets
      # pack exceeds its limit") was removed on purpose: the `tickets` branch is an
      # APPEND-ONLY event log whose full history is mounted here on purpose (commit-ancestry
      # era scoping, ADR 0051), so its pack only ever grows — a fixed KiB ceiling is
      # guaranteed to be crossed eventually and, once crossed, casts Verified -1 on EVERY
      # Gerrit change repo-wide until someone bumps the number. Since the feature landed it
      # has repeatedly blocked the normal review workflow for reasons unrelated to the change
      # under review, so the gate cost far more than it protected. Tracked by a092
      # (bardic-continuous-asianlion). If tickets-pack growth ever needs bounding, do it with
      # a real mechanism (server-side gc / history compaction), not a fail-closed CI ceiling.
      - name: verify-identity (config-driven posture; reads rebar.toml from this change)
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"
          trap 'rm -f "$before" "$after"' EXIT
          export REBAR_TRACKER_DIR="$PWD/.tickets-tracker"
          git count-objects -v > "$before"
          rebar verify-identity
          git count-objects -v > "$after"
          if ! cmp -s "$before" "$after"; then
            echo "::error::verify-identity changed the object database" >&2
            diff -u "$before" "$after" >&2 || true
            exit 1
          fi

  vote:
    name: cast Verified
    if: ${{ always() }}
    # optionality/golden-path are in `needs` so their jobs are TERMINAL before workflow-conclusion
    # snapshots this run's jobs — that snapshot (im-open/workflow-conclusion, a REST list-jobs read
    # enabled by `permissions: actions: read`) folds the reusable workflow's job conclusions into
    # WORKFLOW_CONCLUSION, so a clean-wheel/packaging failure casts Verified-1.
    needs: [clear-vote, require-ticket, classify, docs-only, build-and-test, mutation, scanner-integration, optionality, artifact-probe, eval-discipline, golden-path, verify-identity]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the run conclusion
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526  # v3.0.0

      # Check out ONLY the normalization script, from the TRUSTED default branch (not the
      # patchset). `workflow_dispatch` runs this workflow's definition from main, so main is
      # also where the trusted script lives — the vote decision must never run patchset-
      # controlled code (the vote SSH key is scoped to the cast step's `with:`; keeping the
      # decision logic trusted also stops a change from voting itself Verified). persist-
      # credentials:false: nothing here pushes.
      - name: Fetch the trusted conclusion-normalization script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cast_gerrit_verified_vote.py
            scripts/normalize_ci_conclusion.py
            scripts/summarize_ci_failures.py
          sparse-checkout-cone-mode: false

      # im-open/workflow-conclusion can set WORKFLOW_CONCLUSION to `skipped` (its fallback
      # when none of success/failure/cancelled is observed) or leave it empty — neither is in
      # gerrit-review-action's vote-type domain {clear,success,failure,cancelled}. Piping it
      # verbatim made the action hit `::error::Unknown vote-type ...; exit 1` BEFORE posting
      # any label, so a green-CI change got NO Verified vote and was un-landable. Normalize
      # into the domain, using the trusted needs.*.result as the fail-closed failure signal.
      - name: Normalize the conclusion into the vote-type domain
        id: normalize
        shell: bash
        env:
          # A skipped job is neutral only when it belongs to the route that did not run.
          # Require exactly one complete route before trusting the aggregate conclusion;
          # missing jobs, classifier failure, or mixed routes are forced to failure.
          CONCLUSION: >-
            ${{ (
              needs.classify.result == 'success' &&
              (
                (
                  needs.classify.outputs.route == 'docs-only' &&
                  needs.docs-only.result == 'success' &&
                  needs.build-and-test.result == 'skipped' &&
                  needs.mutation.result == 'skipped' &&
                  needs.scanner-integration.result == 'skipped' &&
                  needs.optionality.result == 'skipped' &&
                  needs.artifact-probe.result == 'skipped' &&
                  needs.eval-discipline.result == 'skipped' &&
                  needs.golden-path.result == 'skipped' &&
                  needs.verify-identity.result == 'skipped'
                ) ||
                (
                  needs.classify.outputs.route == 'full' &&
                  needs.docs-only.result == 'skipped' &&
                  needs.build-and-test.result == 'success' &&
                  needs.mutation.result == 'success' &&
                  needs.scanner-integration.result == 'success' &&
                  needs.optionality.result == 'success' &&
                  needs.artifact-probe.result == 'success' &&
                  needs.eval-discipline.result == 'success' &&
                  needs.golden-path.result == 'success' &&
                  needs.verify-identity.result == 'success'
                )
              )
            ) && env.WORKFLOW_CONCLUSION || 'failure' }}
          FAILURE_OBSERVED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          # predates-gate-ok: the preceding step checks out the DEFAULT branch (not the
          # patchset) precisely to fetch this trusted script, so the patchset's base age
          # cannot make it absent.
          vote="$(python3 scripts/normalize_ci_conclusion.py)"
          echo "WORKFLOW_CONCLUSION='${CONCLUSION}' failure_observed='${FAILURE_OBSERVED}' -> vote-type='${vote}'"
          echo "vote-type=${vote}" >> "$GITHUB_OUTPUT"

      # mechanism-ok: ci_gate .github/workflows/gerrit-verify.yaml::Cast Verified from the CI conclusion — ticket adab closed-race guard.
      - name: Cast Verified from the CI conclusion
        shell: bash
        env:
          GERRIT_SSH_PRIVKEY: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          GERRIT_KNOWN_HOSTS: ${{ vars.GERRIT_KNOWN_HOSTS }}
          GERRIT_SERVER: ${{ vars.GERRIT_SERVER }}
          GERRIT_SSH_USER: ${{ vars.GERRIT_SSH_USER }}
          CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          # success -> Verified+1, failure|cancelled -> Verified-1 (fail-closed).
          # Fed the NORMALIZED conclusion (see the normalize step): `skipped`/empty is coerced
          # into the action's vote-type domain so it can never crash the cast pre-vote.
          VOTE_TYPE: ${{ steps.normalize.outputs.vote-type }}
          # The helper preserves gerrit-review-action's vote message shape:
          # `review --message "<STATUS>: <server>/<repo>/actions/runs/<run_id>"`, so the
          # Gerrit vote always links back to this run's log surface. Unlike the action,
          # it can classify Gerrit's `fatal: change is closed` race as a benign no-op
          # while preserving fail-closed behavior for every other vote failure.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # predates-gate-ok: the preceding step checks out the DEFAULT branch (not the
          # patchset) precisely to fetch this trusted script, so the patchset's base age
          # cannot make it absent.
          python3 scripts/cast_gerrit_verified_vote.py

      # ---- Observability only (ticket be9d-2f2d-47ca-45d2) ----------------------------
      # A `Verified -1` reads exactly `CANCELLED: <run URL>` whatever went wrong, so a job
      # that blew its `timeout-minutes` and a job that failed on stale-base version skew look
      # identical — though only the second needs a rebase. These two steps add a comment
      # naming the jobs and saying which of those it was.
      #
      # They run AFTER the cast so the vote is already on the change before any of this
      # executes, and both are `continue-on-error` so a hiccup here can never change the gate
      # outcome. Nothing below casts a label.
      - name: Summarize the jobs that did not succeed
        id: summary
        if: ${{ steps.normalize.outputs.vote-type != 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This run's jobs. `actions: read` already grants this (workflow-conclusion uses it).
          jobs_json="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            -q '.jobs[]' | jq -s -c '{jobs: .}')"

          # GitHub reports a TIMED-OUT job as `conclusion: cancelled` and explains itself only
          # in the check-run annotation ("exceeded the maximum execution time"), so fetch those
          # for the non-successful jobs only. A job id IS its check-run id. Best-effort: a
          # failed annotation read degrades the wording, it must not fail the step.
          annotations='{}'
          for job_id in $(jq -r '.jobs[]
                | select(.conclusion == "failure" or .conclusion == "cancelled"
                         or .conclusion == "timed_out")
                | .id' <<<"$jobs_json"); do
            job_annotations="$(gh api \
              "repos/${GITHUB_REPOSITORY}/check-runs/${job_id}/annotations" 2>/dev/null \
              || echo '[]')"
            annotations="$(jq -c --arg id "$job_id" --argjson a "$job_annotations" \
              '. + {($id): $a}' <<<"$annotations")"
          done

          # predates-gate-ok: same trusted default-branch checkout as the normalize step
          # above; the patchset's base age cannot make this script absent.
          text="$(JOBS_JSON="$jobs_json" ANNOTATIONS_JSON="$annotations" \
            python3 scripts/summarize_ci_failures.py)"
          printf '%s\n' "$text"
          {
            echo "text<<SUMMARY_EOF"
            printf '%s\n' "$text"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post the triage detail to Gerrit (comment only, no vote)
        if: ${{ steps.normalize.outputs.vote-type != 'success' && steps.summary.outputs.text != '' }}
        continue-on-error: true
        shell: bash
        env:
          GERRIT_SSH_PRIVKEY: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          GERRIT_KNOWN_HOSTS: ${{ vars.GERRIT_KNOWN_HOSTS }}
          GERRIT_SERVER: ${{ vars.GERRIT_SERVER }}
          GERRIT_SSH_USER: ${{ vars.GERRIT_SSH_USER }}
          CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          SUMMARY: ${{ steps.summary.outputs.text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Reject any change/patchset that is not a positive integer before it reaches the
          # remote command, mirroring gerrit-review-action's own guard.
          if [[ ! "${CHANGE_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::refusing to comment: bad change number '${CHANGE_NUMBER}'"
            exit 0
          fi
          if [[ ! "${PATCHSET_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::refusing to comment: bad patchset number '${PATCHSET_NUMBER}'"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${GERRIT_SSH_PRIVKEY}" > ~/.ssh/gerrit_comment_key
          chmod 600 ~/.ssh/gerrit_comment_key
          printf '%s\n' "${GERRIT_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # summarize_ci_failures.py strips ' and \ and any control character other than
          # newline, so the summary cannot terminate the single-quoted argument below.
          message="${SUMMARY}"$'\n\n'"Full log: ${RUN_URL}"
          ssh -i ~/.ssh/gerrit_comment_key -p 29418 -o StrictHostKeyChecking=yes \
            -- "${GERRIT_SSH_USER}@${GERRIT_SERVER}" \
            gerrit review "${CHANGE_NUMBER},${PATCHSET_NUMBER}" \
            --message "'${message}'" --tag autogenerated:github

      - name: Remove the Gerrit comment key
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: rm -f ~/.ssh/gerrit_comment_key
