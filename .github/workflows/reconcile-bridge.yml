# rebar — Jira <-> rebar Reconcile Bridge
#
# Runs the drift-healing reconciler once an hour to keep the Jira
# project (JIRA_PROJECT) and the local rebar `tickets` store in sync.
#
# This is a TEMPLATE: client projects copy this file verbatim and set the repo
# variables/secrets listed in docs/jira-sync-setup.md. The runner is part of the
# installed nava-rebar package, so no repository-local helper script is needed.
# The only project-specific inputs are GitHub repo Variables/Secrets — nothing
# in this file changes.
#
# Single-flight concurrency (cancel-in-progress: false) ensures a running pass
# completes before the next scheduled invocation starts; the reconciler's own
# pass-lock (refs/reconciler/lock, the self-healing ref-lock; ADR 0031) is a second
# guard (a concurrent pass is a canonical benign exit 0).
#
# Continuous loop (OPT-IN, default OFF): set repo Variable RECONCILE_CONTINUOUS=true
# to have each run re-dispatch the next via workflow_dispatch (the documented
# exception where the default GITHUB_TOKEN *does* create a new run), giving
# a cadence of two pass durations instead of the hourly floor — without shrinking pass
# scope. The chain is PACED: the re-dispatch step below sleeps for the pass's own
# elapsed duration before queueing the successor, so the chain's period is 2x a pass
# rather than 1x (ticket f59a-2d16-68c5-450c). The hourly schedule stays as a backstop
# that re-seeds the chain if it ever stops. Leave the Variable unset (the TEMPLATE
# default) and the bridge behaves exactly as before: a plain hourly schedule. Enable it
# ONLY on a public repo or a self-hosted runner — hosted runners bill wall-clock for the
# chain, and the pacing sleep is billed too.
#
# THIS REPO runs with RECONCILE_CONTINUOUS=false (flipped 2026-08-13 to free the runner,
# ticket 4557-1f33-7a3f-47c7), so the chain is inert here and the hourly schedule is the
# only thing that fires the bridge.
#
# rebar divergences from DSO's reconcile-bridge (see docs/jira-sync-setup.md
# "Necessary & sufficient"):
#   * primary invocation uses `rebar bridge preview` / `rebar bridge sync`; the
#     reconcile-check profile spelling is retained for compatibility and maps to preview
#   * canonical bridge commands use 0 benign/success, 1 operational, 2 invocation/config
#   * the reconciler may leave inbound events uncommitted or create its own binding
#     commit; the final strict core adapter commits when needed and synchronously
#     pushes either case, keeping the workflow red if delivery cannot converge.

name: Reconcile Bridge

on:
  # Hourly, deliberately off the top of the hour: GitHub's scheduler is best-effort and
  # most heavily contended at :00, so an on-:00 entry is the likeliest to be delayed or
  # dropped. Worst-case Jira<->rebar sync latency is therefore 1 hour.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Bridge operation profile'
        required: false
        default: 'live'
        type: choice
        options:
          - reconcile-check   # compatibility profile for canonical preview
          - dry-run           # compute mutations, apply none
          - bootstrap-strict
          - bootstrap-throttle
          - live

concurrency:
  group: reconcile-bridge
  cancel-in-progress: false

permissions:
  contents: write   # push reconciler events back to the tickets orphan branch
  actions: write    # re-dispatch this workflow to sustain the continuous loop (opt-in; see RECONCILE_CONTINUOUS)

jobs:
  reconcile:
    name: Run rebar reconciler
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one wholesale, so the two entries declared
    # above must be restated here alongside id-token. Dropping either silently breaks the
    # reconciler's commit-back / re-dispatch rather than the metric.
    permissions:
      contents: write   # push reconciler events back to the tickets orphan branch
      actions: write    # re-dispatch this workflow to sustain the continuous loop
      # Required for OIDC AssumeRoleWithWebIdentity by the CloudWatch metric steps below.
      # Job-level for the same reason structured-output-baseline.yml puts it there.
      id-token: write
    # A one-time initial sync creates one Jira issue per local ticket serially via
    # acli (~4s each), so a first-time bulk cutover of a few hundred tickets needs
    # well over the steady-state budget. 60 is a ceiling, not a duration: incremental
    # passes finish in a few minutes; commit-back only persists on a COMPLETED pass,
    # so the budget must cover a full bulk pass or progress never converges.
    timeout-minutes: 60

    env:
      MODE: ${{ github.event.inputs.mode || 'live' }}
      # NOTE: REBAR_IDENTITY_SIGNING_KEY is exported by the "Materialize the Rebar Bot signing
      # key" step (via $GITHUB_ENV) and is deliberately NOT set here. Job-level `env:` cannot
      # reference ${{ runner.temp }} — the `runner` context is unavailable outside steps, so a
      # job-level entry using it is a parse-time startup failure that produces ZERO jobs (the
      # reconciler never runs). Both rebar-write steps (Run reconciler, Commit reconciler events
      # back) run after Materialize, so they see identity.signing_key without a job-level entry.

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: true   # the mounted worktree reuses these creds to push
          filter: blob:none
          # Full history (NOT shallow). A shallow graft defeats git's merge-base
          # computation, so reconciling a compaction (which deletes source event
          # files) against the remote resurrects those files — SNAPSHOT_INCONSISTENT
          # corruption (bug saggy-pupil-plant / f193). The tickets store MUST be
          # reconciled with full history + merge, never shallow + rebase.
          fetch-depth: 0

      - name: Record the pass start time (chain pacing)
        # Read by the paced re-dispatch step at the end of the job to compute how long
        # this pass took. Exported via $GITHUB_ENV because a job-level `env:` cannot be
        # computed. Kept first-ish so it measures the whole pass, install included.
        run: |
          set -euo pipefail
          echo "PASS_STARTED_EPOCH=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Validate Jira configuration
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${JIRA_URL:-}" ] && missing="$missing JIRA_URL(var)"
          [ -z "${JIRA_USER:-}" ] && missing="$missing JIRA_USER(var)"
          [ -z "${JIRA_API_TOKEN:-}" ] && missing="$missing JIRA_API_TOKEN(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required Jira config:$missing — see docs/jira-sync-setup.md"
            exit 1
          fi

      - name: Mount tickets branch as a worktree
        # The store lives on the `tickets` orphan branch at the repo root. Mount it
        # as .tickets-tracker on the ACTUAL `tickets` branch (not detached) so
        # tracker.branch matches and `rebar fsck` does not WARN on a mismatch.
        run: |
          set -euo pipefail
          # Full fetch (no --depth): a shallow tickets history defeats merge-base and
          # corrupts compaction reconciliation (bug f193). See fetch-depth note above.
          git fetch origin '+tickets:refs/remotes/origin/tickets'
          rm -rf .tickets-tracker
          git worktree add -B tickets .tickets-tracker origin/tickets

      - name: Configure tickets merge driver
        # .bridge_state/* uses merge=ours; define that custom driver before the
        # push-retry loop can merge origin/tickets into the mounted worktree.
        run: |
          set -euo pipefail
          git config merge.ours.driver true

      - name: Sync reconciler lock refs (ref-lock backend)
        # The self-healing pass-lock/phase-gate live on refs/reconciler/* (epic
        # dust-troth-naval, ADR 0031), NOT in the tickets tree. Sync them before the
        # pass so acquire sees the authoritative remote state. Best-effort: absent
        # refs (first run / file backend) simply fetch nothing. The reconciler's own
        # acquire/renew/release also force-sync + --force-with-lease on each op.
        run: |
          set -euo pipefail
          git fetch origin '+refs/reconciler/*:refs/reconciler/*' || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install rebar
        # TEMPLATE NOTE: client projects use `pip install nava-rebar==<pinned>`.
        # This repo IS rebar, so it installs the checked-out source to reconcile
        # against the code on `main`. Reconcile does NOT need the [agents] extra.
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Cache acli binary
        id: cache-acli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.acli
          key: acli-${{ runner.os }}-${{ vars.ACLI_VERSION || 'unset' }}

      - name: Download + verify + install acli
        if: steps.cache-acli.outputs.cache-hit != 'true'
        env:
          ACLI_VERSION: ${{ vars.ACLI_VERSION }}
          ACLI_SHA256: ${{ vars.ACLI_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ACLI_VERSION:-}" ] || [ "$ACLI_VERSION" = "latest" ]; then
            echo "::error::ACLI_VERSION repo variable is unset or 'latest'. Pin a specific version (e.g. 1.3.14-stable) and set ACLI_SHA256 to its digest."
            exit 1
          fi
          mkdir -p ~/.acli
          curl -sSL "https://acli.atlassian.com/linux/${ACLI_VERSION}/acli_${ACLI_VERSION}_linux_amd64.tar.gz" -o ~/.acli/acli.tar.gz
          if [ -n "${ACLI_SHA256:-}" ]; then
            echo "${ACLI_SHA256}  $HOME/.acli/acli.tar.gz" | sha256sum -c --strict
          else
            echo "::warning::ACLI_SHA256 unset — proceeding without checksum verification. Set it to: $(sha256sum ~/.acli/acli.tar.gz | awk '{print $1}')"
          fi
          tar xzf ~/.acli/acli.tar.gz -C ~/.acli/ --strip-components=1
          chmod +x ~/.acli/acli
          rm -f ~/.acli/acli.tar.gz
          if [ ! -s "$HOME/.acli/acli" ] || [ ! -x "$HOME/.acli/acli" ]; then
            echo "::error::Extracted acli binary missing, empty, or not executable"
            ls -la ~/.acli/ || true
            exit 1
          fi
          if ! "$HOME/.acli/acli" --version >/dev/null 2>&1; then
            echo "::error::Extracted acli binary failed --version smoke check"
            exit 1
          fi

      - name: Add acli to PATH and authenticate
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          sudo ln -sf "$HOME/.acli/acli" /usr/local/bin/acli
          echo "$JIRA_API_TOKEN" | acli jira auth login \
            --site "$JIRA_URL" \
            --email "$JIRA_USER" \
            --token

      - name: Configure git identity for the bridge bot
        # --global so every worktree (the checkout, the mounted .tickets-tracker,
        # and any temp worktrees the reconciler's advisory lock creates) inherits
        # it. Without an identity, `git commit` fails exit 128 ("empty ident name")
        # on CI runners.
        env:
          BRIDGE_BOT_NAME: ${{ vars.BRIDGE_BOT_NAME || 'rebar-bridge[bot]' }}
          # Default to the Rebar Bot authorship identity's email (story 9e76) so the inline
          # signing seam's git-email fallback resolves reconciler-authored events to identity
          # 594c-9dcf-5ad6-4e6d. Overridable via the BRIDGE_BOT_EMAIL repo variable.
          BRIDGE_BOT_EMAIL: ${{ vars.BRIDGE_BOT_EMAIL || 'joeoakhart+bot@navapbc.com' }}
        run: |
          set -euo pipefail
          git config --global user.name "${BRIDGE_BOT_NAME}"
          git config --global user.email "${BRIDGE_BOT_EMAIL}"

      - name: Materialize the Rebar Bot signing key
        # Story 9e76: the reconciler's inbound writer now stamps + signs events inline; it
        # signs only when identity.signing_key resolves. Materialize the key to a 0600 file
        # under $RUNNER_TEMP (discarded at job end) and export its path. Unset ⇒ events are
        # written unsigned (verify-identity is advisory until require_authenticated flips on).
        env:
          REBAR_BOT_SIGNING_KEY: ${{ secrets.REBAR_BOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REBAR_BOT_SIGNING_KEY:-}" ]; then
            echo "REBAR_BOT_SIGNING_KEY unset — reconciler writes will be unsigned (advisory)"
            exit 0
          fi
          echo "::add-mask::${REBAR_BOT_SIGNING_KEY}"
          KEYFILE="${RUNNER_TEMP}/rebar-bot-signing-key"
          install -m 600 /dev/null "${KEYFILE}"
          printf '%s\n' "${REBAR_BOT_SIGNING_KEY}" > "${KEYFILE}"
          echo "REBAR_IDENTITY_SIGNING_KEY=${KEYFILE}" >> "${GITHUB_ENV}"
          echo "Materialized bot signing key to ${KEYFILE} (0600)"

      - name: Run reconciler
        id: reconcile
        # The runner-neutral adapter owns mode routing, pause recognition, canonical
        # provider exits, timeout enforcement, and strict tickets-store delivery.
        env:
          BRIDGE_RUN_ID: ${{ github.run_id }}
          BRIDGE_BOT_NAME: ${{ vars.BRIDGE_BOT_NAME || 'rebar-bridge[bot]' }}
          BRIDGE_BOT_EMAIL: ${{ vars.BRIDGE_BOT_EMAIL || 'joeoakhart+bot@navapbc.com' }}
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
          REBAR_ENV_ID: ${{ vars.REBAR_ENV_ID || 'reconciler' }}
          # Observability (48c8-5375-f883-462d): fail-loud on silent sub-op no-ops +
          # swallowed comment failures. Activated AFTER the Jira comment cleanup (bd80)
          # brought the 13 cap-inflated tickets back below the 5000-comment cap — before
          # that, capped tickets produced comment_errors every pass and this flag would
          # have failed the job continuously. The machinery landed default-off in
          # df0ac80be (change 785); this flip turns it on for the live reconciler.
          REBAR_RECONCILER_FAIL_SILENT_NOOP: "1"
        run: rebar bridge run

      - name: Notify on bridge failure
        if: failure()
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## :rotating_light: Reconcile Bridge run FAILED"
            echo ""
            echo "- **Workflow:** \`$WORKFLOW_NAME\`"
            echo "- **Run:** $GH_RUN_URL"
            echo "- **Mode:** \`${MODE}\`"
            echo "- **Triggered by:** \`$EVENT_NAME\`"
            echo ""
            echo "The Reconciler Heartbeat Canary will open a bug ticket if this stays stale."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Reconcile Bridge failed::See run summary — $GH_RUN_URL"

      - name: Re-dispatch to sustain the continuous loop (opt-in)
        # Self-rescheduling chain: queue the next run via workflow_dispatch, which
        # is the documented exception where the default GITHUB_TOKEN *does* create a
        # new run (GitHub changelog 2022-09-08). Needs `actions: write` (declared
        # above). The concurrency group + the reconciler pass-lock keep at most one
        # pass running and one queued, so a long full pass is never interrupted and
        # the chain cannot fan out.
        #
        # Gated on RECONCILE_CONTINUOUS so the template default (Variable unset) keeps
        # the plain hourly schedule — clients on private repos are unaffected.
        #
        # PACING (ticket f59a-2d16-68c5-450c): re-dispatching immediately made the chain's
        # inter-invocation period exactly ONE pass duration (~7 min in this repo). Sleeping
        # for the pass's own elapsed time first makes it TWO — the doubling the operator
        # asked for, self-tuning at any pass duration so a client copying this TEMPLATE gets
        # it without a repo-specific literal. Bounded three ways, all plain literals:
        #   * PASS_STARTED_EPOCH unset or non-numeric -> pacing skipped entirely. The step
        #     runs under `set -euo pipefail` and the workflow-lint harness executes this body
        #     with only PATH+MODE in the environment, so arithmetic must never see an empty
        #     string.
        #   * the sleep is capped at 900 s (15 min);
        #   * pacing is skipped once elapsed >= 1800 s (30 min) — a pass that slow already
        #     paces itself, and the rest of the `timeout-minutes: 60` budget must stay free.
        #
        # if: !cancelled() — a FAILED pass still re-seeds the chain (resilience),
        # while CANCELLING a run is a clean kill switch. Flipping the Variable off
        # also stops the chain after the next run completes.
        if: ${{ !cancelled() && vars.RECONCILE_CONTINUOUS == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "RECONCILE_CONTINUOUS=true — re-dispatching to sustain the loop (mode=${MODE})."
          started="${PASS_STARTED_EPOCH:-}"
          if ! printf '%s' "${started}" | grep -Eq '^[0-9]+$'; then
            echo "PASS_STARTED_EPOCH unset or non-numeric — chain pacing skipped for this run."
          else
            elapsed=$(( $(date +%s) - started ))
            [ "${elapsed}" -lt 0 ] && elapsed=0
            if [ "${elapsed}" -ge 1800 ]; then
              echo "Pass took ${elapsed}s (>= 1800s) — already self-pacing, no pacing sleep."
            else
              pause="${elapsed}"
              [ "${pause}" -gt 900 ] && pause=900
              echo "Pacing the chain: pass took ${elapsed}s, sleeping ${pause}s so the chain's period is two pass durations."
              sleep "${pause}"
            fi
          fi
          # Bug 8aed: a bare `gh workflow run` here let a transient re-dispatch failure fail
          # an ALREADY-CONVERGED pass. When the workflow is disabled, gh exits non-zero with
          # `HTTP 422: Cannot trigger a 'workflow_dispatch' on a disabled workflow`, and
          # `set -e` turned that into a red run whose reconcile had fully succeeded (runs
          # 31129551929 / 31129431096) — tripping the heartbeat/alerting path for a non-problem.
          # Re-seeding is already self-healing: the hourly schedule above is the documented
          # backstop that restarts the chain. So the disabled-workflow 422 is a benign no-op.
          # The downgrade is deliberately NARROW — it requires BOTH the 422 status and the
          # disabled-workflow phrase, so an unrelated 422 (and every auth/404/network/rate-limit
          # failure) still fails the step loudly.
          dispatch_rc=0
          dispatch_out="$(gh workflow run reconcile-bridge.yml --ref "${REF_NAME}" --field mode="${MODE}" 2>&1)" || dispatch_rc=$?
          printf '%s\n' "${dispatch_out}"
          if [ "${dispatch_rc}" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "${dispatch_out}" | grep -q 'HTTP 422' \
            && printf '%s' "${dispatch_out}" | grep -qi 'disabled workflow'; then
            echo "::warning::Re-dispatch skipped: this workflow is disabled (HTTP 422). The reconcile pass itself converged; the hourly schedule backstop re-seeds the continuous loop once the workflow is re-enabled."
            exit 0
          fi
          echo "::error::Re-dispatch failed (exit ${dispatch_rc}) — see the captured gh output above"
          exit "${dispatch_rc}"

      # --- CloudWatch visibility for bridge failures -----------------------------------------
      # The 2026-08-12 JIRA_API_TOKEN expiry took the bridge down for hours and produced ZERO
      # CloudWatch signal: every rebar/host metric is published by the host probe
      # (infra/scripts/observability.sh) running on the Gerrit box, and the bridge does not run
      # there — it runs here. So the host probe structurally cannot see it, and the failure
      # surfaced only as an ::error annotation nobody was looking at.
      #
      # These steps run LAST on purpose: placed here, failure() also covers a failed re-dispatch,
      # so the metric answers "did this bridge run fail" rather than "did the reconcile step
      # fail". They are continue-on-error so a metrics outage can never turn an otherwise
      # converged reconcile pass red — telemetry must not become a new failure mode.
      - name: Configure AWS credentials (OIDC → the scoped bridge-metrics role)
        id: bridge_metrics_auth
        # always(): the credentials are needed on BOTH the success and failure paths.
        # Canonical repo only — a fork has no role to assume and must not fail trying.
        if: ${{ always() && github.repository == 'navapbc/rebar' && vars.AWS_BRIDGE_METRICS_ROLE_ARN != '' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_BRIDGE_METRICS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_BRIDGE_METRICS_REGION }}

      # 1 on failure, 0 on success — the metric is published on EVERY run, not only on failure.
      # Publishing the 0 is deliberate: with treat_missing_data = "notBreaching" a failure-only
      # metric would still alarm correctly, but it would be ABSENT whenever the bridge is healthy,
      # which is indistinguishable from "the publisher is broken / its role lost PutMetricData",
      # and would leave the alarm sitting in INSUFFICIENT_DATA instead of OK. The steady 0 makes
      # the publisher itself observable. This matches the host probe, which publishes
      # gerrit_healthy / reviewbot_healthy as 0-or-1 every tick rather than only on failure.
      #
      # DIMENSIONLESS on both sides — CloudWatch keys a metric by namespace+name+dimensions, so a
      # dimension present on only one side silently unmatches and the alarm goes permanently
      # INSUFFICIENT_DATA (the monitoring_s4b.tf rationale).
      - name: Publish bridge run failure to CloudWatch
        if: ${{ failure() && steps.bridge_metrics_auth.outcome == 'success' }}
        continue-on-error: true
        env:
          AWS_REGION: ${{ vars.AWS_BRIDGE_METRICS_REGION }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace rebar/host \
            --metric-name bridge_run_failures \
            --unit Count \
            --value 1
          echo "Published rebar/host:bridge_run_failures=1"

      - name: Publish bridge run success to CloudWatch
        if: ${{ success() && steps.bridge_metrics_auth.outcome == 'success' }}
        continue-on-error: true
        env:
          AWS_REGION: ${{ vars.AWS_BRIDGE_METRICS_REGION }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace rebar/host \
            --metric-name bridge_run_failures \
            --unit Count \
            --value 0
          echo "Published rebar/host:bridge_run_failures=0"
