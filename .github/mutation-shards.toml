version = 1
global_support = [
    ".github/mutation-shards.toml",
    ".github/workflows/_mutation.yml",
    ".github/workflows/mutation.yml",
    ".github/workflows/gerrit-verify.yaml",
    ".github/workflows/test.yml",
    "pyproject.toml",
    "scripts/mutation_gate.py",
    "tests/conftest.py",
    "uv.lock",
]

[[shards]]
name = "signing"
mode = "advisory"
source = "src/rebar/signing.py"
tests = ["tests/unit/test_signing.py", "tests/interfaces/lifecycle/test_signature.py"]
support = ["tests/unit/conftest.py", "tests/interfaces/conftest.py"]
timeout_constant = 1.0
timeout_multiplier = 15.0
survivors_max = 3
no_tests_max = 110
timeouts_max = 0
score_floor = 99.2
equivalent_fingerprints = []

