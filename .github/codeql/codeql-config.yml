# Advanced CodeQL setup for `.github/workflows/codeql.yml`.
# Exclude `docs/**`, which contains prose and hand-run experiments. The wheel contains
# `src/rebar`. The sdist also contains `tests` and `README.md`. Neither contains `docs/**`.
# This avoids experiment-only alerts and covers future additions. The default query suite
# remains unchanged.
name: "rebar CodeQL config"

paths-ignore:
  - "docs/**"
