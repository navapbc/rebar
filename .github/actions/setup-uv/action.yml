name: Setup uv
description: Install the repository-pinned uv release without fetching the setup-uv manifest.
inputs:
  enable-cache:
    description: Restore and save uv's cache directory.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install repository-pinned uv
      shell: pwsh
      env:
        UV_SHA256_AARCH64_APPLE_DARWIN: 60fbd5c8a1ed681845eea28d9d622fcde03c51e91a43465b64a1e17db1ed3472
        UV_SHA256_AARCH64_PC_WINDOWS_MSVC: c2426c0c8e28b53d8c440e47a18d96ad4db51e159866c0e81435b196d7f0081c
        UV_SHA256_AARCH64_UNKNOWN_LINUX_GNU: 229e194255c7958d86d56e8790d969a6f74736592133f0dfd0076f754c642c1d
        UV_SHA256_X86_64_APPLE_DARWIN: 63ba17fdda55ad1a230d4b37fc6017ffa10c23688c83818bd3bfdf914c652a02
        UV_SHA256_X86_64_PC_WINDOWS_MSVC: a2a8820d5eea32f08ef467ef3b7f66883a9b076d5737a2fc2fbb5f458d1bb50f
        UV_SHA256_X86_64_UNKNOWN_LINUX_GNU: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
      run: |
        $ErrorActionPreference = 'Stop'

        $pyproject = Join-Path $env:GITHUB_WORKSPACE 'pyproject.toml'
        $version = $null
        $inToolUv = $false
        foreach ($line in Get-Content -LiteralPath $pyproject) {
          $trimmed = $line.Trim()
          if ($trimmed -match '^\[(.+)\]\s*$') {
            $inToolUv = $Matches[1] -eq 'tool.uv'
            continue
          }
          if ($inToolUv -and $trimmed -match '^required-version\s*=\s*"==([0-9]+(?:\.[0-9]+)+)"\s*(?:#.*)?$') {
            $version = $Matches[1]
            break
          }
        }
        if (-not $version) {
          throw 'pyproject.toml must define [tool.uv] required-version as "==X.Y.Z"'
        }

        switch ($env:RUNNER_OS) {
          'Linux' { $osTarget = 'unknown-linux-gnu'; $extension = 'tar.gz' }
          'macOS' { $osTarget = 'apple-darwin'; $extension = 'tar.gz' }
          'Windows' { $osTarget = 'pc-windows-msvc'; $extension = 'zip' }
          default { throw "Unsupported runner OS '$env:RUNNER_OS'" }
        }
        switch ($env:RUNNER_ARCH) {
          'X64' { $archTarget = 'x86_64' }
          'ARM64' { $archTarget = 'aarch64' }
          default { throw "Unsupported runner architecture '$env:RUNNER_ARCH'" }
        }

        $target = "$archTarget-$osTarget"
        $asset = "uv-$target.$extension"
        $checksumName = "UV_SHA256_$($target.ToUpperInvariant().Replace('-', '_'))"
        $expectedHash = [Environment]::GetEnvironmentVariable($checksumName)
        if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
          throw "Missing checksum for $asset ($checksumName)"
        }

        $workRoot = Join-Path $env:RUNNER_TEMP "setup-uv-$version-$target"
        $extractDir = Join-Path $workRoot 'extract'
        New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
        $archive = Join-Path $workRoot $asset
        $url = "https://github.com/astral-sh/uv/releases/download/$version/$asset"
        Invoke-WebRequest -Uri $url -OutFile $archive

        $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash) {
          throw "Checksum mismatch for ${asset}: expected $expectedHash, got $actualHash"
        }

        if ($extension -eq 'zip') {
          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $uvExecutable = 'uv.exe'
        } else {
          tar -xzf $archive -C $extractDir
          $uvExecutable = 'uv'
        }

        $uv = Get-ChildItem -LiteralPath $extractDir -Recurse -File -Filter $uvExecutable |
          Where-Object { $_.FullName -like "*$target*" } |
          Select-Object -First 1
        if (-not $uv) {
          throw "Could not find $uvExecutable in $asset"
        }

        $toolRoot = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { $env:RUNNER_TEMP }
        $installDir = Join-Path (Join-Path $toolRoot 'uv') "$version-$target"
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        $installedUv = Join-Path $installDir $uvExecutable
        Copy-Item -LiteralPath $uv.FullName -Destination $installedUv -Force
        if ($env:RUNNER_OS -ne 'Windows') {
          chmod +x $installedUv
        }
        & $installedUv --version
        Add-Content -LiteralPath $env:GITHUB_PATH -Value $installDir
        Write-Host "Successfully installed uv $version from $asset"

    - name: Resolve uv cache directory
      id: uv-cache-dir
      if: inputs.enable-cache == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $cacheDir = uv cache dir
        "dir=$cacheDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Cache uv downloads and wheels
      if: inputs.enable-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.uv-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-uv-
